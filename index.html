ix, so we must act early. At home we save electricity and use less plastic. It is small, but if many families do it, it helps.","v":"Vấn đề toàn cầu tôi lo nhất là biến đổi khí hậu. Thứ nhất, nó ảnh hưởng mọi người, kể cả các con tôi. Ở đây trời nóng hơn và mưa lớn gây ngập nhiều hơn. Một số khách của tôi phải dời hàng ra khỏi kho trong một đợt ngập. Thứ hai, nó khó sửa nên ta phải làm sớm. Ở nhà chúng tôi tiết kiệm điện và dùng ít nhựa. Nhỏ thôi nhưng nếu nhiều gia đình làm thì có ích."},{"a":"The problem that worries me most is poverty and inequality. When there is a big gap between rich and poor, children cannot go to school and people cannot get medical care. For example, some families in rural areas have to choose between food and medicine. I think education is the best long-term answer, so I support learning programs for children.","v":"Vấn đề làm tôi lo nhất là nghèo đói và bất bình đẳng. Khi có khoảng cách lớn giữa giàu và nghèo, trẻ em không đi học được và người ta không được chăm sóc y tế. Ví dụ, một số gia đình ở nông thôn phải chọn giữa thức ăn và thuốc. Tôi nghĩ giáo dục là câu trả lời dài hạn tốt nhất, nên tôi ủng hộ các chương trình học cho trẻ."},{"a":"I worry about plastic pollution in the oceans. Plastic bags and bottles are used for a few minutes but stay for hundreds of years. Fish eat them, and then they enter our food. In my city, I often see rubbish in the canals. I try to reduce plastic at home, and I teach my children not to litter.","v":"Tôi lo về ô nhiễm nhựa ở đại dương. Túi và chai nhựa được dùng vài phút nhưng tồn tại hàng trăm năm. Cá ăn chúng và rồi chúng vào thức ăn của ta. Ở thành phố tôi, tôi thường thấy rác trong kênh. Tôi cố giảm nhựa ở nhà và dạy các con không vứt rác."},{"a":"For me, the most worrying problem is the lack of clean water. Many places suffer from drought, and other places have polluted rivers. Without clean water, people become sick, and farming fails. In my work, I see how water costs affect businesses. I believe each person should save water and support clean water projects.","v":"Với tôi, vấn đề đáng lo nhất là thiếu nước sạch. Nhiều nơi bị hạn hán và nơi khác có sông ô nhiễm. Không có nước sạch, người ta bệnh và nông nghiệp thất bại. Trong công việc, tôi thấy chi phí nước ảnh hưởng doanh nghiệp thế nào. Tôi tin mỗi người nên tiết kiệm nước và ủng hộ các dự án nước sạch."},{"a":"I am worried about misinformation. False news spreads quickly and can affect health decisions, elections and relationships. For instance, during the pandemic, many people believed wrong advice. This is a global problem because the internet has no borders. We need schools and families to teach young people to check information.","v":"Tôi lo về thông tin sai lệch. Tin giả lan nhanh và có thể ảnh hưởng quyết định sức khỏe, bầu cử và các mối quan hệ. Ví dụ, trong đại dịch, nhiều người tin lời khuyên sai. Đây là vấn đề toàn cầu vì internet không có biên giới. Ta cần trường học và gia đình dạy người trẻ kiểm tra thông tin."}],"q":"What global problem worries you the most?","vi":"Vấn đề toàn cầu nào khiến bạn lo nhất?"},{"type":"Chọn một bên (choice)","out":"Chọn: công viên (hoặc cân bằng). Lý do 1: sức khỏe, không khí, trẻ em. Lý do 2: đường nhiều thu hút thêm xe. Mặt trái: đường cần cho kinh tế. Kết.","words":"park, green space, road, traffic jam, health, air quality, balance","vers":[{"a":"I think cities should spend more on parks, but roads are also needed. First, parks are good for health. People can exercise and children can play safely. Second, more roads often bring more cars, so traffic jams do not go away. But good roads help business, because trucks need to deliver on time. So I would keep the main roads good and use extra money for parks and buses.","v":"Tôi nghĩ thành phố nên chi nhiều hơn cho công viên nhưng đường sá cũng cần. Thứ nhất, công viên tốt cho sức khỏe. Người ta tập thể dục và trẻ chơi an toàn. Thứ hai, thêm đường thường kéo thêm xe nên kẹt xe không hết. Nhưng đường tốt giúp kinh doanh vì xe tải cần giao đúng giờ. Nên tôi giữ đường chính tốt và dùng tiền thêm cho công viên và xe buýt."},{"a":"I would choose parks, especially for children. In a crowded city, kids have no safe place to play, so they stay at home with phones. A park with trees gives them exercise and friends. For example, on weekends, parents in my neighborhood take children to a small park, and it becomes a community center. This is a great benefit for the budget.","v":"Tôi chọn công viên, nhất là cho trẻ em. Trong thành phố đông đúc, trẻ không có chỗ chơi an toàn nên ở nhà với điện thoại. Một công viên có cây cho các em vận động và bạn bè. Ví dụ, cuối tuần phụ huynh khu tôi dẫn con ra một công viên nhỏ và nó thành trung tâm cộng đồng. Đây là lợi ích lớn cho ngân sách."},{"a":"I think roads are still necessary in a developing city. Without good roads, goods are delayed and costs increase, and businesses suffer. For example, trucks stuck in traffic for hours waste fuel. So I would invest in roads first, then parks later when the economy is stronger. But the roads should include trees and pavements.","v":"Tôi nghĩ đường sá vẫn cần thiết ở thành phố đang phát triển. Không có đường tốt, hàng hóa bị chậm và chi phí tăng, doanh nghiệp chịu thiệt. Ví dụ, xe tải kẹt hàng giờ lãng phí nhiên liệu. Nên tôi đầu tư vào đường trước, rồi công viên sau khi kinh tế mạnh hơn. Nhưng đường nên có cây và vỉa hè."},{"a":"It is not either-or. Parks can reduce flooding and heat, which protects roads, and good roads help people reach parks. A smart city plans both. If I had to choose, I would support parks because green areas make a city more livable. Roads can be solved with public transport.","v":"Không phải chọn một. Công viên có thể giảm ngập và nóng, bảo vệ đường, và đường tốt giúp người ta đến công viên. Một thành phố thông minh quy hoạch cả hai. Nếu phải chọn, tôi ủng hộ công viên vì khu xanh làm thành phố đáng sống. Đường có thể giải quyết bằng giao thông công cộng."},{"a":"I think cities should invest in parks, because they improve mental health. After a stressful day, a quiet walk under trees helps people relax. Studies show that people near green spaces feel happier. On the other hand, poorly planned roads can increase pollution. So I choose parks as the better long-term investment.","v":"Tôi nghĩ thành phố nên đầu tư vào công viên vì chúng cải thiện sức khỏe tinh thần. Sau ngày căng thẳng, một cuộc đi bộ yên tĩnh dưới cây giúp người ta thư giãn. Các nghiên cứu cho thấy người ở gần không gian xanh vui hơn. Mặt khác, đường quy hoạch kém có thể tăng ô nhiễm. Nên tôi chọn công viên là khoản đầu tư dài hạn tốt hơn."}],"q":"Should cities invest more in parks or in roads?","vi":"Các thành phố nên đầu tư nhiều hơn vào công viên hay vào đường sá?"},{"type":"Hai lý do (two reasons)","out":"Lý do 1: thay đổi lối sống, ít người còn thấy ý nghĩa. Lý do 2: truyền thống tồn tại khi gắn với gia đình, niềm vui, ẩm thực. Ví dụ Tết. Kết.","words":"tradition, disappear, survive, meaningful, lifestyle, generation, celebrate","vers":[{"a":"I think traditions disappear when they do not fit our life. For example, many families do not have time for long ceremonies, so they stop. Young people may think some rules have no meaning. But some traditions survive because they bring families together and make people happy. Tet is a good example. Everyone goes home, eats special food and gives lucky money. So traditions stay when they are fun and meaningful.","v":"Tôi nghĩ truyền thống biến mất khi không hợp với cuộc sống. Ví dụ, nhiều gia đình không có thời gian cho nghi lễ dài nên bỏ. Người trẻ có thể nghĩ một số quy tắc không có ý nghĩa. Nhưng một số truyền thống tồn tại vì đưa gia đình lại gần và làm mọi người vui. Tết là ví dụ tốt. Mọi người về nhà, ăn món đặc biệt và lì xì. Nên truyền thống ở lại khi vui và có ý nghĩa."},{"a":"I think traditions disappear when they are expensive or very complicated. For example, a big wedding with many ceremonies can cost a lot, so many couples choose a simple one. On the other hand, traditions that are easy to adapt survive. Families still prepare special food on festivals, but they buy some dishes instead of cooking them all.","v":"Tôi nghĩ truyền thống biến mất khi đắt hoặc quá phức tạp. Ví dụ, đám cưới lớn với nhiều nghi lễ tốn nhiều tiền nên nhiều cặp chọn đám cưới đơn giản. Mặt khác, truyền thống dễ điều chỉnh tồn tại. Các gia đình vẫn chuẩn bị món đặc biệt vào lễ hội, nhưng mua một số món thay vì nấu hết."},{"a":"Migration is also a reason. When young people move to the city, they leave the village customs behind. Grandparents are the only ones who remember them. However, when the community organizes events, such as a village festival, the tradition continues. So community support is important.","v":"Di cư cũng là một lý do. Khi người trẻ chuyển lên thành phố, họ bỏ lại phong tục làng. Chỉ ông bà còn nhớ. Tuy nhiên khi cộng đồng tổ chức sự kiện, như lễ hội làng, truyền thống tiếp tục. Nên sự hỗ trợ của cộng đồng quan trọng."},{"a":"Technology changes traditions. For example, people send greetings by phone instead of visiting. Some customs are easy to replace. But traditions with emotional meaning, such as giving thanks to ancestors, survive because they connect people to their roots. It is the meaning that keeps a tradition alive.","v":"Công nghệ thay đổi truyền thống. Ví dụ, người ta chúc mừng qua điện thoại thay vì đến thăm. Một số phong tục dễ thay thế. Nhưng truyền thống có ý nghĩa cảm xúc như tri ân tổ tiên tồn tại vì nối con người với cội nguồn. Ý nghĩa là thứ giữ truyền thống sống."},{"a":"Education and media can also help traditions survive. When schools teach children about traditional songs, food and festivals, young people feel proud of them. Social media can show them to the world. If children are proud, they will continue the tradition. If nobody teaches it, it disappears.","v":"Giáo dục và truyền thông cũng giúp truyền thống tồn tại. Khi trường dạy trẻ về bài hát, món ăn và lễ hội truyền thống, người trẻ cảm thấy tự hào. Mạng xã hội có thể giới thiệu chúng ra thế giới. Nếu trẻ tự hào, chúng sẽ tiếp tục truyền thống. Nếu không ai dạy, nó biến mất."}],"q":"Why do some traditions disappear while others survive?","vi":"Vì sao một số truyền thống biến mất trong khi số khác tồn tại?"},{"type":"Hai lý do (two reasons)","out":"Mặt tốt: nhiều nắng. Mặt hạn chế: mùa mưa, ban đêm, cần pin lưu trữ. Kết luận: khá đáng tin nhưng chưa 100%.","words":"reliable, sunlight hours, storage, battery, weather, rainy season, renewable energy","vers":[{"a":"I’d say solar power is fairly reliable, but not completely. One reason is that Vietnam is near the equator, so we have strong sunshine for many months, especially in the south. However, we cannot count on sunlight all year. In the rainy season, and of course at night, production drops. So the country needs batteries or other energy sources that can work as a backup. In the long run, solar power is a good choice if we combine it with storage.","v":"Tôi cho rằng điện mặt trời khá đáng tin cậy, nhưng chưa hoàn toàn. Một lý do là Việt Nam gần đường xích đạo, nên nhiều tháng có nắng mạnh, nhất là ở miền Nam. Tuy nhiên, chúng ta không thể trông cậy vào ánh nắng quanh năm. Vào mùa mưa, và dĩ nhiên cả ban đêm, sản lượng giảm. Vì vậy đất nước cần pin lưu trữ hoặc các nguồn năng lượng khác có thể làm dự phòng. Về lâu dài, điện mặt trời là một lựa chọn tốt nếu kết hợp với lưu trữ."},{"a":"I’d say it is reliable in many places but needs good planning. First, solar technology is now cheaper and stronger, so panels can last twenty years or more. For example, many farms in the south use solar pumps to water crops without fuel. Second, solar power is most productive at noon, exactly when factories and air conditioners need the most electricity. However, clouds, storms and dust can reduce production, so the country must keep other power sources for bad days. Overall, solar power is a strong partner, not a complete solution.","v":"Tôi cho rằng điện mặt trời đáng tin cậy ở nhiều nơi nhưng cần lên kế hoạch tốt. Thứ nhất, công nghệ điện mặt trời giờ rẻ hơn và bền hơn, nên các tấm pin có thể dùng hai mươi năm hoặc hơn. Ví dụ, nhiều trang trại ở miền Nam dùng máy bơm năng lượng mặt trời để tưới cây mà không cần nhiên liệu. Thứ hai, điện mặt trời hiệu quả nhất vào buổi trưa, đúng lúc nhà máy và máy lạnh cần nhiều điện nhất. Tuy nhiên, mây, bão và bụi có thể làm giảm sản lượng, nên đất nước phải giữ các nguồn điện khác cho những ngày xấu. Nhìn chung, điện mặt trời là một người bạn đồng hành mạnh, chứ không phải giải pháp trọn vẹn."},{"a":"To be honest, it depends on how we use it. If a family installs panels on the roof and connects to the grid, the system is quite reliable, because they can use the grid at night. For instance, my neighbour’s bill dropped by almost half after he installed panels. On the other hand, a system without batteries stops working when it rains for several days. Also, panels need regular cleaning and repair. In the long run, solar power is reliable if people maintain it and combine it with other sources.","v":"Nói thật thì còn tùy cách mình dùng. Nếu một gia đình lắp pin trên mái nhà và nối vào lưới điện, hệ thống khá đáng tin cậy, vì ban đêm họ có thể dùng điện lưới. Ví dụ, hóa đơn của hàng xóm tôi giảm gần một nửa sau khi lắp pin. Mặt khác, hệ thống không có ắc quy sẽ ngừng hoạt động khi mưa nhiều ngày liền. Ngoài ra, tấm pin cần được lau chùi và sửa chữa thường xuyên. Về lâu dài, điện mặt trời đáng tin cậy nếu người dùng bảo dưỡng và kết hợp với các nguồn khác."},{"a":"I believe solar power is quite reliable in Vietnam for daytime use. Many factories now install rooftop solar panels, which reduces their electricity bills. For instance, in the south, the sun shines for almost the whole year. The problem is storage for the night. Therefore, solar power is reliable as a partner for other sources, not as the only source.","v":"Tôi tin điện mặt trời khá đáng tin ở Việt Nam cho dùng ban ngày. Nhiều nhà máy giờ lắp pin mặt trời trên mái, giảm hóa đơn điện. Ví dụ, ở miền Nam nắng gần như quanh năm. Vấn đề là lưu trữ cho ban đêm. Vì vậy điện mặt trời đáng tin khi là đối tác của nguồn khác, không phải nguồn duy nhất."},{"a":"From my experience with electricity costs, solar power is reliable but depends on good installation and maintenance. Dust, bad weather or poor equipment can reduce output. Also, the grid must be able to receive the extra power. If these conditions are met, solar can save a lot of money for households and small businesses.","v":"Từ kinh nghiệm về chi phí điện, điện mặt trời đáng tin nhưng phụ thuộc lắp đặt và bảo trì tốt. Bụi, thời tiết xấu hay thiết bị kém có thể giảm sản lượng. Lưới điện cũng phải nhận được điện thừa. Nếu các điều kiện này đạt, điện mặt trời có thể tiết kiệm nhiều tiền cho hộ gia đình và doanh nghiệp nhỏ."}],"q":"How reliable is solar power for a country like Vietnam?","vi":"Điện mặt trời đáng tin cậy đến mức nào đối với một nước như Việt Nam?"}],"p2":[{"type":"Một dịp (an occasion)","out":"Mở: bối cảnh mua/tránh sản phẩm. Thân: vì sao (xuất xứ, cách làm), điều tra, quyết định. Bài học. Kết: giờ chị luôn đọc nhãn.","words":"origin, label, quality, ethical, brand, factory conditions, decision","vers":[{"a":"I want to talk about a time when I did not buy a product because of how it was made. Last year, I wanted to buy cheap cooking oil for my workers’ meals. But the label had no place of origin and no factory address. I searched online and found many complaints about this brand. I decided not to buy it for three reasons. First, I could not check the quality, and food safety is important. Second, if something goes wrong, nobody takes responsibility. Third, the price was too low, so I felt worried. I bought a better oil from a local producer. I learned that the cheapest choice is not always the best. Now I always read the label.","v":"Tôi muốn kể về một lần tôi không mua sản phẩm vì cách nó được làm. Năm ngoái, tôi muốn mua dầu ăn rẻ cho bữa ăn của công nhân. Nhưng nhãn không có xuất xứ và địa chỉ nhà máy. Tôi tìm trên mạng và thấy nhiều khiếu nại về nhãn này. Tôi quyết định không mua vì ba lý do. Thứ nhất, tôi không kiểm tra được chất lượng mà an toàn thực phẩm quan trọng. Thứ hai, nếu có chuyện, không ai chịu trách nhiệm. Thứ ba, giá quá thấp nên tôi lo. Tôi mua dầu tốt hơn của nhà sản xuất địa phương. Tôi học được rằng lựa chọn rẻ nhất không phải lúc nào cũng tốt nhất. Giờ tôi luôn đọc nhãn."},{"a":"I’d like to talk about an occasion when I decided to buy a product because of how it was made. Last year, I bought handmade baskets from a village near my hometown. At the market, there were cheaper plastic baskets, but I was told that these were made by local women, using natural materials. There were three reasons for my choice. First, I wanted to support the community. Second, the baskets were more durable, and they look beautiful. Third, they are better for the environment than plastic. I paid a bit more, but I feel good every time I use them. To sum up, knowing the story behind a product can change my decision. That’s why I like to buy local and handmade goods.","v":"Tôi muốn kể về một dịp tôi quyết định mua sản phẩm vì cách nó được làm. Năm ngoái tôi mua giỏ đan tay từ một làng gần quê. Ở chợ có giỏ nhựa rẻ hơn, nhưng tôi được biết những chiếc giỏ này do phụ nữ địa phương làm từ nguyên liệu tự nhiên. Có ba lý do cho lựa chọn của tôi. Thứ nhất, tôi muốn ủng hộ cộng đồng. Thứ hai, giỏ bền hơn và đẹp. Thứ ba, chúng tốt cho môi trường hơn nhựa. Tôi trả đắt hơn chút nhưng thấy vui mỗi lần dùng. Tóm lại, biết câu chuyện sau sản phẩm có thể đổi quyết định của tôi. Vì vậy tôi thích mua hàng địa phương và thủ công."},{"a":"I’d like to talk about an occasion when I avoided a product because of how it was made. A few years ago, I read news about a factory that used child labor to produce cheap clothes. I had planned to buy a shirt from that brand for my son. I felt uncomfortable, so I decided not to. There were three reasons. First, I did not want my money to support unfair work. Second, I wanted to teach my children values. Third, I realized that cheap clothes often hide costs. I bought a shirt from another brand, which was more expensive, but I felt better. To sum up, how a product is made matters to me. That’s why I try to be an informed buyer.","v":"Tôi muốn kể về một dịp tôi tránh một sản phẩm vì cách nó được làm. Vài năm trước, tôi đọc tin về một nhà máy dùng lao động trẻ em sản xuất quần áo rẻ. Tôi đã định mua một chiếc áo của nhãn hiệu đó cho con trai. Tôi thấy không thoải mái nên quyết định không mua. Có ba lý do. Thứ nhất, tôi không muốn tiền của mình ủng hộ lao động không công bằng. Thứ hai, tôi muốn dạy con giá trị. Thứ ba, tôi nhận ra quần áo rẻ thường giấu chi phí. Tôi mua áo của hãng khác, đắt hơn nhưng tôi thấy yên tâm hơn. Tóm lại, cách sản phẩm được làm quan trọng với tôi. Vì vậy tôi cố làm người mua có hiểu biết."},{"a":"I’d like to talk about the time I chose a product because of where it was made. When I needed a new machine for the workshop, I compared a very cheap imported one with a slightly more expensive one made by a local factory. I chose the local one for three reasons. First, repairs and spare parts were easy to get. Second, the company offered service at our location. Third, I wanted to support Vietnamese industry. After two years, the machine still works well, and the service has been very helpful. To sum up, origin affects quality and support. That’s why I believe a low price is not the only factor in a purchase.","v":"Tôi muốn kể về lần tôi chọn một sản phẩm vì nơi nó được làm. Khi cần máy mới cho xưởng, tôi so sánh một chiếc nhập khẩu rất rẻ với một chiếc đắt hơn chút do nhà máy trong nước làm. Tôi chọn máy trong nước vì ba lý do. Thứ nhất, sửa chữa và phụ tùng dễ kiếm. Thứ hai, công ty phục vụ tại chỗ. Thứ ba, tôi muốn ủng hộ công nghiệp Việt Nam. Sau hai năm, máy vẫn chạy tốt và dịch vụ rất hữu ích. Tóm lại, xuất xứ ảnh hưởng chất lượng và hỗ trợ. Vì vậy tôi tin giá thấp không phải yếu tố duy nhất khi mua."},{"a":"I’d like to talk about an occasion when I decided to avoid a product because of its packaging and production. Last summer, I saw a drink in bright plastic with many chemicals listed on the label. I learned that its factory had been fined for polluting a river. I felt that I did not want to support this. There were three reasons. First, health, since my children drink what I buy. Second, the environment, because pollution affects us all. Third, responsibility, since consumers have power. I chose natural juice in a glass bottle. To sum up, I learned that every purchase is a vote. That’s why I now read labels and news before shopping.","v":"Tôi muốn kể về một dịp tôi quyết định tránh một sản phẩm vì bao bì và cách sản xuất. Mùa hè năm ngoái, tôi thấy một loại nước uống trong chai nhựa sặc sỡ với nhiều hóa chất ghi trên nhãn. Tôi biết nhà máy của nó từng bị phạt vì làm ô nhiễm sông. Tôi thấy mình không muốn ủng hộ điều này. Có ba lý do. Thứ nhất, sức khỏe, vì các con tôi uống thứ tôi mua. Thứ hai, môi trường, vì ô nhiễm ảnh hưởng tất cả. Thứ ba, trách nhiệm, vì người tiêu dùng có quyền lực. Tôi chọn nước ép tự nhiên trong chai thủy tinh. Tóm lại, tôi học được mỗi lần mua là một lá phiếu. Vì vậy giờ tôi đọc nhãn và tin tức trước khi mua sắm."}],"q":"An occasion when you decided to buy or avoid a product because of where or how it was made.","vi":"Một dịp bạn quyết định mua hoặc tránh một sản phẩm vì nó được làm ở đâu hoặc làm như thế nào."},{"type":"Điều quan trọng (what is important)","out":"Mở: có 3 điều. 1) Chào đón, giới thiệu người, quy trình. 2) Giải thích văn hóa, cách giao tiếp, giờ giấc. 3) Kiên nhẫn, cho phản hồi, một người kèm. Kết.","words":"colleague, onboarding, workplace culture, mentor, feedback, welcome, adapt","vers":[{"a":"I want to talk about what is important when we help a new colleague. I think there are three things. First, a warm welcome. On the first day, introduce the person to everyone and show where things are. In my workshop, I walk new workers around and explain who does what. Then they feel they belong. Second, explain the unwritten rules, like when we start work and how we speak to customers. A new person cannot guess these. Third, give support. Give them a helper who answers questions kindly, and say what they do well. A good start saves time and trouble later.","v":"Tôi muốn nói về điều quan trọng khi giúp đồng nghiệp mới. Tôi nghĩ có ba điều. Thứ nhất, chào đón nồng hậu. Ngày đầu, giới thiệu người đó với mọi người và chỉ chỗ đồ. Ở xưởng, tôi dẫn công nhân mới đi một vòng và giải thích ai làm gì. Rồi họ thấy mình thuộc về nơi đó. Thứ hai, giải thích quy tắc bất thành văn như giờ bắt đầu và cách nói với khách. Người mới không đoán được. Thứ ba, hỗ trợ. Cho họ một người giúp trả lời câu hỏi tử tế và nói điều họ làm tốt. Khởi đầu tốt tiết kiệm thời gian và rắc rối sau này."},{"a":"I’d like to talk about what is important when helping a new colleague adapt to the culture of a workplace. In my view, there are three key points. The first is to share the story and values of the company. People work better when they know why the company exists. The second is to include the person in social activities, such as lunch or a team trip, so they can build friendships. The third is to be patient with mistakes. A new person is learning, and harsh criticism may make them leave. For example, in my workshop, we organize a small lunch for each new worker. To sum up, values, friendship and patience help a newcomer. That’s why I believe culture is learned through relationships.","v":"Tôi muốn nói về điều quan trọng khi giúp đồng nghiệp mới thích nghi với văn hóa nơi làm việc. Theo tôi có ba điểm chính. Điểm thứ nhất là chia sẻ câu chuyện và giá trị của công ty. Người ta làm tốt hơn khi biết vì sao công ty tồn tại. Điểm thứ hai là cho người đó tham gia hoạt động xã hội như bữa trưa hay chuyến đi nhóm để xây dựng tình bạn. Điểm thứ ba là kiên nhẫn với lỗi. Người mới đang học và phê bình gay gắt có thể khiến họ bỏ đi. Ví dụ, ở xưởng tôi, chúng tôi tổ chức bữa trưa nhỏ cho mỗi công nhân mới. Tóm lại, giá trị, tình bạn và sự kiên nhẫn giúp người mới. Vì vậy tôi tin văn hóa được học qua các mối quan hệ."},{"a":"I’d like to talk about helping a new colleague adapt to workplace culture. I believe three things matter. First, clear expectations. The newcomer should know the working hours, the rules and the standard of quality from the beginning. Second, a buddy system. One experienced colleague can answer small questions every day. Third, regular feedback. After one week and one month, the manager should talk with the new person about what goes well and what needs improvement. For example, a short weekly meeting with new staff can solve problems early. To sum up, expectations, a buddy and feedback create a smooth start. That’s why I believe a good system helps people succeed.","v":"Tôi muốn nói về việc giúp đồng nghiệp mới thích nghi với văn hóa nơi làm việc. Tôi tin ba điều quan trọng. Thứ nhất, kỳ vọng rõ ràng. Người mới nên biết giờ làm, quy tắc và tiêu chuẩn chất lượng từ đầu. Thứ hai, hệ thống người kèm. Một đồng nghiệp có kinh nghiệm có thể trả lời câu hỏi nhỏ mỗi ngày. Thứ ba, phản hồi đều đặn. Sau một tuần và một tháng, quản lý nên nói chuyện với người mới về điều gì tốt và cần cải thiện. Ví dụ, một cuộc họp ngắn hằng tuần với nhân viên mới có thể giải quyết vấn đề sớm. Tóm lại, kỳ vọng, người kèm và phản hồi tạo khởi đầu suôn sẻ. Vì vậy tôi tin một hệ thống tốt giúp người ta thành công."},{"a":"I’d like to talk about what is important when we help a new colleague fit into a workplace. In my opinion, there are three key points. The first is respect for differences. The newcomer may come from another region or country, with different habits, and we should not laugh at them. The second is communication style. We should explain jokes and informal words, because they can be confusing. The third is a sense of belonging. Give the person a real responsibility soon, so they feel useful. For example, when a new employee manages a small task successfully, their confidence grows. To sum up, respect, clear communication and responsibility help a newcomer to belong. That’s why I believe a welcoming culture benefits everyone.","v":"Tôi muốn nói về điều quan trọng khi giúp đồng nghiệp mới hòa vào nơi làm việc. Theo tôi có ba điểm chính. Điểm thứ nhất là tôn trọng sự khác biệt. Người mới có thể đến từ vùng hay nước khác với thói quen khác và ta không nên cười họ. Điểm thứ hai là cách giao tiếp. Ta nên giải thích câu đùa và từ thân mật vì chúng có thể gây bối rối. Điểm thứ ba là cảm giác thuộc về. Hãy giao cho họ một trách nhiệm thật sớm để họ thấy mình hữu ích. Ví dụ, khi nhân viên mới hoàn thành tốt một việc nhỏ, sự tự tin tăng. Tóm lại, tôn trọng, giao tiếp rõ và trách nhiệm giúp người mới thuộc về. Vì vậy tôi tin văn hóa chào đón có lợi cho mọi người."},{"a":"I’d like to talk about helping a new colleague adapt to a workplace culture. I think there are three important points. First, observation. A good manager notices how the newcomer feels and offers help before the person asks. Second, training. Short, practical training on safety, tools and customer service prevents mistakes. Third, showing the example. If leaders themselves are punctual, polite and honest, the newcomer copies them. For example, when I always greet my workers in the morning, new workers quickly do the same. To sum up, observation, training and example are effective ways. That’s why I believe culture is shown more than it is explained.","v":"Tôi muốn nói về việc giúp đồng nghiệp mới thích nghi với văn hóa nơi làm việc. Tôi nghĩ có ba điểm quan trọng. Thứ nhất, quan sát. Một quản lý tốt nhận ra cảm giác của người mới và giúp trước khi họ hỏi. Thứ hai, đào tạo. Đào tạo ngắn, thực tế về an toàn, dụng cụ và dịch vụ khách hàng ngăn sai sót. Thứ ba, làm gương. Nếu lãnh đạo đúng giờ, lịch sự và trung thực, người mới bắt chước. Ví dụ, khi tôi luôn chào công nhân mỗi sáng, công nhân mới nhanh chóng làm theo. Tóm lại, quan sát, đào tạo và làm gương là cách hiệu quả. Vì vậy tôi tin văn hóa được thể hiện nhiều hơn giải thích."}],"q":"What is important when helping a new colleague adapt to the culture of a workplace.","vi":"Điều gì quan trọng khi giúp một đồng nghiệp mới thích nghi với văn hóa nơi làm việc."},{"type":"So sánh (comparison)","out":"Mở: chọn bên (làm nhóm vui hơn). Thân: nhóm có người trò chuyện, chia việc, động viên; một mình tự do, tập trung nhưng cô đơn; còn tùy việc và tính cách. Kết.","words":"teamwork, motivation, independent, share the workload, concentrate, social, enjoyable","vers":[{"a":"I want to talk about working in a team and working alone. I think a team is usually more fun. First, a team gives you company. When people chat and joke, even a boring job feels easy. For example, when my workers and I count goods at the end of the month, we play music and time goes fast. Second, a team shares the work, so nobody feels too much pressure. Third, working alone is good when I need to focus, like making financial reports. I enjoy quiet time too. So I choose a team for fun and working alone for focus. The best way is to choose the style that fits the job.","v":"Tôi muốn nói về làm nhóm và làm một mình. Tôi nghĩ làm nhóm thường vui hơn. Thứ nhất, nhóm cho bạn bầu bạn. Khi mọi người trò chuyện và đùa, việc chán cũng thấy dễ. Ví dụ, khi tôi và công nhân đếm hàng cuối tháng, chúng tôi bật nhạc và thời gian trôi nhanh. Thứ hai, nhóm chia việc nên không ai bị áp lực quá. Thứ ba, làm một mình tốt khi cần tập trung như làm báo cáo tài chính. Tôi cũng thích giờ yên tĩnh. Nên tôi chọn nhóm cho vui và làm một mình để tập trung. Cách tốt nhất là chọn kiểu hợp với công việc."},{"a":"I’d like to talk about working in a team and working alone, and which makes a task feel more like fun. In my view, working alone can be more fun for some tasks. First, you control the pace. You can listen to music and take a break when you want. Second, there are no arguments about methods. Third, you feel pride when you finish by yourself. For example, I enjoy organizing my files alone, because I like to do it in my own order. However, for big tasks, a team is more enjoyable. To sum up, working alone is fun for small, creative tasks. That’s why I believe fun depends on the type of work.","v":"Tôi muốn nói về làm việc nhóm và làm một mình, cách nào khiến công việc giống niềm vui hơn. Theo tôi, làm một mình có thể vui hơn với một số việc. Thứ nhất, bạn kiểm soát nhịp độ. Bạn nghe nhạc và nghỉ khi muốn. Thứ hai, không có tranh cãi về phương pháp. Thứ ba, bạn tự hào khi tự mình hoàn thành. Ví dụ, tôi thích sắp xếp hồ sơ một mình vì thích làm theo thứ tự của mình. Tuy nhiên với việc lớn, làm nhóm vui hơn. Tóm lại, làm một mình vui với việc nhỏ, sáng tạo. Vì vậy tôi tin niềm vui phụ thuộc loại công việc."},{"a":"I’d like to talk about which feels more like fun: working in a team or alone. I believe team work is more fun because of three reasons. First, humor. In a team, people laugh and share stories. Second, shared success. When a team finishes a project, everyone celebrates, which is more exciting than celebrating alone. Third, learning. You can learn tricks from others. For example, at the end of a busy month, my team and I order lunch together, and the stress turns into good memories. To sum up, a team gives laughter, celebration and learning. That’s why I believe fun grows when it is shared.","v":"Tôi muốn nói về việc làm nhóm hay một mình giống niềm vui hơn. Tôi tin làm nhóm vui hơn vì ba lý do. Thứ nhất, sự hài hước. Trong nhóm, mọi người cười và chia sẻ chuyện. Thứ hai, thành công chung. Khi nhóm xong dự án, mọi người ăn mừng, hào hứng hơn ăn mừng một mình. Thứ ba, học hỏi. Bạn học được mẹo từ người khác. Ví dụ, cuối tháng bận rộn, tôi và nhóm đặt cơm trưa cùng nhau, và căng thẳng thành kỷ niệm đẹp. Tóm lại, nhóm cho tiếng cười, sự ăn mừng và học hỏi. Vì vậy tôi tin niềm vui lớn lên khi được chia sẻ."},{"a":"I’d like to talk about working in a team versus working alone. I think the answer depends on personality. First, extroverts get energy from other people, so teamwork feels like fun. Second, introverts need quiet, so working alone is more enjoyable for them. Third, a good manager should know each person’s style. For example, in my family business, my brother loves talking with customers, while I prefer preparing the documents alone. This arrangement makes both of us happy. To sum up, the fun depends on who you are. That’s why I believe teams work best when members can choose their roles.","v":"Tôi muốn nói về làm nhóm so với làm một mình. Tôi nghĩ câu trả lời phụ thuộc tính cách. Thứ nhất, người hướng ngoại lấy năng lượng từ người khác nên làm nhóm giống niềm vui. Thứ hai, người hướng nội cần yên tĩnh nên làm một mình vui hơn. Thứ ba, một quản lý tốt nên biết phong cách mỗi người. Ví dụ, trong doanh nghiệp gia đình tôi, anh trai tôi thích nói chuyện với khách, còn tôi thích chuẩn bị tài liệu một mình. Cách sắp xếp này làm cả hai vui. Tóm lại, niềm vui phụ thuộc bạn là ai. Vì vậy tôi tin nhóm làm tốt nhất khi thành viên chọn được vai trò."},{"a":"I’d like to talk about whether teamwork or solo work makes a task more fun. In my opinion, a mix is the most fun. First, planning together is exciting, because many ideas appear. Second, doing the main work alone gives focus. Third, meeting again to share results gives a feeling of success. For example, when I prepare a school event, I discuss it with other parents, then prepare my part at home, then report back. To sum up, the combination keeps work lively. That’s why I believe flexible cooperation is the most enjoyable.","v":"Tôi muốn nói về việc làm nhóm hay làm riêng khiến việc vui hơn. Theo tôi, kết hợp là vui nhất. Thứ nhất, lập kế hoạch cùng nhau hào hứng vì nhiều ý tưởng xuất hiện. Thứ hai, làm phần chính một mình cho sự tập trung. Thứ ba, gặp lại để chia sẻ kết quả cho cảm giác thành công. Ví dụ, khi tôi chuẩn bị sự kiện ở trường, tôi bàn với các phụ huynh khác, rồi chuẩn bị phần mình ở nhà, rồi báo cáo lại. Tóm lại, sự kết hợp giữ công việc sinh động. Vì vậy tôi tin hợp tác linh hoạt là thú vị nhất."}],"q":"Working in a team and working alone: which makes a task feel more like fun?","vi":"Làm việc nhóm và làm việc một mình: cách nào khiến công việc giống như niềm vui hơn?"},{"type":"Cách làm (how to / procedure)","out":"Mở: có 3 cách. Thân: chậm lại và quan sát, luyện bằng trò chơi (puzzle) và ghi chú, học từ chuyên gia. Kết: luyện đều sẽ thành thói quen.","words":"observe, slow down, puzzle, take notes, take photos, concentrate, experts","vers":[{"a":"I’d like to talk about how people can train themselves to notice details that others miss. In my view, there are three key ways. The first way is to slow down. We often look at things quickly and miss important points, so we should stop for a moment and observe carefully. For example, before I sign a contract, I read it line by line instead of only looking at the price. Many serious problems are hidden in small sentences. The second way is to practice with games and simple tools. Puzzles and spot-the-difference games improve our concentration, and taking notes or photos helps us remember what we see and compare it later. In my work, I take photos of a delivery when it arrives, so if there is a problem I have clear evidence. The third way is to learn from experts. A good teacher or an experienced professional, who knows the common mistakes, can show us what to look for, and we can copy their method. For instance, a good accountant checks small numbers that other people ignore, and that is why she finds mistakes before they become expensive. With regular practice, noticing details slowly becomes a habit. Even five minutes of careful checking at the end of the day can show us mistakes we missed earlier. To sum up, slowing down, practicing and learning from experts are three practical steps. That’s why I believe anyone can improve if they practice every day.","v":"Tôi muốn nói về cách con người có thể rèn luyện để nhận ra những chi tiết mà người khác bỏ sót. Theo tôi, có ba cách chính. Cách thứ nhất là chậm lại. Chúng ta thường nhìn mọi thứ rất nhanh và bỏ lỡ những điểm quan trọng, nên cần dừng lại một chút và quan sát cẩn thận. Ví dụ, trước khi ký hợp đồng, tôi đọc từng dòng thay vì chỉ nhìn vào giá. Nhiều vấn đề nghiêm trọng nằm ẩn trong những câu nhỏ. Cách thứ hai là luyện tập bằng trò chơi và những công cụ đơn giản. Câu đố và trò tìm điểm khác biệt giúp tăng sự tập trung, còn ghi chú hoặc chụp ảnh giúp ta nhớ những gì đã thấy và so sánh sau này. Trong công việc, tôi chụp ảnh lô hàng khi hàng đến, nên nếu có vấn đề thì tôi có bằng chứng rõ ràng. Cách thứ ba là học từ người giỏi. Một giáo viên tốt hay một người có kinh nghiệm, người biết những lỗi thường gặp, có thể chỉ cho ta cần nhìn vào đâu, và ta có thể làm theo phương pháp của họ. Ví dụ, một kế toán giỏi soát những con số nhỏ mà người khác bỏ qua, và đó là lý do cô ấy tìm ra sai sót trước khi chúng trở nên tốn kém. Luyện tập đều đặn, việc nhận ra chi tiết dần trở thành thói quen. Chỉ cần năm phút kiểm tra kỹ vào cuối ngày cũng có thể giúp ta thấy những lỗi đã bỏ sót trước đó. Tóm lại, chậm lại, luyện tập và học từ người giỏi là ba bước thiết thực. Vì vậy tôi tin ai cũng có thể tiến bộ nếu luyện tập mỗi ngày."},{"a":"There are three useful methods. The first is to ask questions. When we look at something, we can ask: what is different, what is missing, what is unusual? For example, a good teacher asks students to find three details in a picture, and with practice they find more every time. The second method is to reduce distractions. If we constantly check our phones, we cannot notice anything around us, so we should put the phone away and focus for ten minutes. The third method is to write or draw what we see. Keeping a small notebook makes us pay attention, and later we can compare our notes. A good example is an accountant who reviews each number twice and marks anything strange. In conclusion, curiosity, focus and note-taking help us see what other people miss.","v":"Có ba phương pháp hữu ích. Thứ nhất là đặt câu hỏi. Khi nhìn một thứ gì đó, ta có thể hỏi: cái gì khác, cái gì thiếu, cái gì bất thường? Ví dụ, một thầy giáo giỏi yêu cầu học sinh tìm ba chi tiết trong một bức tranh, và nhờ luyện tập các em tìm được nhiều hơn mỗi lần. Phương pháp thứ hai là giảm bớt sự xao nhãng. Nếu ta liên tục xem điện thoại, ta không thể để ý bất cứ thứ gì xung quanh, nên hãy cất điện thoại đi và tập trung mười phút. Phương pháp thứ ba là viết hoặc vẽ lại những gì ta thấy. Giữ một cuốn sổ nhỏ khiến ta chú ý hơn, và sau đó ta có thể so sánh các ghi chép. Một ví dụ hay là người kế toán xem lại từng con số hai lần và đánh dấu mọi thứ lạ. Tóm lại, sự tò mò, tập trung và ghi chép giúp ta thấy những gì người khác bỏ sót."},{"a":"Let me suggest three simple habits. First, use all your senses. Don’t only look; listen and smell too. A mechanic, for instance, can hear a small problem in an engine long before a normal driver notices it. Second, compare and contrast. When you visit a place a second time, try to find what has changed. This trains your memory and your eyes. Third, learn the basics of a field. A person who understands the rules of cooking, driving or accounting can see mistakes that beginners ignore. In my work with small business accounts, a wrong date or a repeated invoice stands out because I have seen so many. Of course, it takes patience, and nobody is perfect. In conclusion, if we practise these habits every day, we will notice more details naturally.","v":"Tôi xin gợi ý ba thói quen đơn giản. Thứ nhất, dùng mọi giác quan. Đừng chỉ nhìn, hãy nghe và ngửi nữa. Ví dụ, một thợ máy có thể nghe ra một trục trặc nhỏ trong động cơ từ lâu trước khi một tài xế bình thường nhận ra. Thứ hai, so sánh và đối chiếu. Khi đến một nơi lần thứ hai, hãy thử tìm xem có gì đã thay đổi. Điều này rèn trí nhớ và đôi mắt. Thứ ba, học nền tảng của một lĩnh vực. Người hiểu các quy tắc của nấu ăn, lái xe hay kế toán có thể thấy những lỗi mà người mới bỏ qua. Trong công việc làm sổ sách cho doanh nghiệp nhỏ của tôi, một ngày ghi sai hay một hóa đơn bị lặp nổi bật lên vì tôi đã thấy rất nhiều. Tất nhiên điều này cần kiên nhẫn, và không ai hoàn hảo. Tóm lại, nếu luyện những thói quen này mỗi ngày, ta sẽ tự nhiên để ý nhiều chi tiết hơn."},{"a":"I’d like to talk about how people can train themselves to notice details others miss. I think there are three useful ways. The first is to ask questions. Before I accept a delivery, I ask: what is the size, the color, the number? Questions make the brain look carefully. The second is to describe. If you describe a scene out loud or in a notebook, you notice more than if you only look. The third is to review mistakes. After each error, I look for the small sign that I missed. For example, a different number in an invoice often tells me about a bigger problem. To sum up, questions, description and review sharpen attention. That’s why I believe noticing details is a skill we can train.","v":"Tôi muốn nói về cách người ta tự rèn luyện để nhận ra chi tiết người khác bỏ sót. Tôi nghĩ có ba cách hữu ích. Cách thứ nhất là đặt câu hỏi. Trước khi nhận hàng, tôi hỏi: kích thước, màu, số lượng là gì? Câu hỏi khiến não nhìn kỹ. Cách thứ hai là mô tả. Nếu bạn mô tả một cảnh thành lời hoặc viết vào sổ, bạn nhận ra nhiều hơn so với chỉ nhìn. Cách thứ ba là xem lại sai sót. Sau mỗi lỗi, tôi tìm dấu hiệu nhỏ mình đã bỏ sót. Ví dụ, một con số khác trong hóa đơn thường cho tôi biết về vấn đề lớn hơn. Tóm lại, câu hỏi, mô tả và xem lại làm sắc bén sự chú ý. Vì vậy tôi tin nhận ra chi tiết là kỹ năng có thể rèn."},{"a":"I’d like to talk about training ourselves to notice details. I believe there are three ways. First, reduce distractions. If you put your phone away and work in a quiet place, you see much more. Second, use checklists. A list of items to check, like in an airplane, prevents us from forgetting small steps. Third, rest. A tired brain misses details, so enough sleep and short breaks help. For example, when I check accounts after a break, I find errors faster. To sum up, focus, lists and rest improve observation. That’s why I believe good habits matter more than talent.","v":"Tôi muốn nói về việc rèn mình nhận ra chi tiết. Tôi tin có ba cách. Thứ nhất, giảm xao nhãng. Nếu bạn để điện thoại đi và làm ở nơi yên tĩnh, bạn thấy nhiều hơn. Thứ hai, dùng danh sách kiểm tra. Một danh sách các mục cần kiểm, như trên máy bay, ngăn ta quên bước nhỏ. Thứ ba, nghỉ ngơi. Một bộ não mệt bỏ sót chi tiết, nên ngủ đủ và nghỉ ngắn giúp ích. Ví dụ, khi kiểm tra sổ sau giờ nghỉ, tôi tìm lỗi nhanh hơn. Tóm lại, tập trung, danh sách và nghỉ ngơi cải thiện quan sát. Vì vậy tôi tin thói quen tốt quan trọng hơn tài năng."}],"q":"How people can train themselves to notice details that others miss.","vi":"Làm sao người ta có thể tự rèn luyện để nhận ra những chi tiết mà người khác bỏ sót."},{"type":"Tại sao (why)","out":"Mở: có 3 lý do. 1) Ngành mới (solar, gió) tạo việc làm mới. 2) Ngành cũ (than, dầu) thu hẹp, người mất việc. 3) Kỹ năng khác nhau, vùng khác nhau, cần đào tạo lại. Kết.","words":"clean energy, job loss, retrain, coal, transition, skills, workforce","vers":[{"a":"I want to talk about why clean energy can make new jobs but also make some people lose their jobs. I have three reasons. First, new work appears. Solar panels and wind farms need technicians and installers. In Vietnam, many people now install solar panels on roofs. Second, old work gets smaller. If a country uses less coal, the mines need fewer workers. Third, new jobs need different skills or are in other places. A miner cannot become a solar engineer next month. So the government and companies should give training and help. A change to clean energy is good, but we must take care of the workers too.","v":"Tôi muốn nói về việc vì sao năng lượng sạch tạo việc mới nhưng cũng làm một số người mất việc. Tôi có ba lý do. Thứ nhất, việc mới xuất hiện. Pin mặt trời và trang trại gió cần kỹ thuật viên và thợ lắp. Ở Việt Nam, nhiều người giờ lắp pin mặt trời trên mái. Thứ hai, việc cũ nhỏ lại. Nếu một nước dùng ít than, mỏ cần ít công nhân hơn. Thứ ba, việc mới cần kỹ năng khác hoặc ở nơi khác. Một thợ mỏ không thể thành kỹ sư điện mặt trời vào tháng sau. Nên chính phủ và công ty nên đào tạo và giúp đỡ. Chuyển sang năng lượng sạch là tốt nhưng ta cũng phải chăm sóc người lao động."},{"a":"I’d like to talk about why switching to cleaner energy creates new jobs and also job losses. I think there are three reasons. The first is technology change. Solar and wind need different skills from coal and oil, so some workers’ skills become less useful. The second is location. Coal mines are in certain regions, while solar farms may be built elsewhere, so a worker may have to move. The third is timing. New jobs appear slowly, while old jobs can disappear quickly. For example, a closed power plant may leave a town without income for years. To sum up, skills, location and timing explain the problem. That’s why I believe a fair transition needs training and support.","v":"Tôi muốn nói về việc vì sao chuyển sang năng lượng sạch tạo việc mới nhưng cũng mất việc. Tôi nghĩ có ba lý do. Thứ nhất là thay đổi công nghệ. Điện mặt trời và gió cần kỹ năng khác than và dầu nên kỹ năng của một số công nhân kém hữu ích. Thứ hai là địa điểm. Mỏ than ở vùng nhất định còn trang trại mặt trời có thể xây nơi khác nên công nhân có thể phải chuyển đi. Thứ ba là thời điểm. Việc mới xuất hiện chậm trong khi việc cũ có thể mất nhanh. Ví dụ, một nhà máy điện đóng cửa có thể khiến một thị trấn không thu nhập nhiều năm. Tóm lại, kỹ năng, địa điểm và thời điểm giải thích vấn đề. Vì vậy tôi tin chuyển đổi công bằng cần đào tạo và hỗ trợ."},{"a":"I’d like to talk about the jobs created and lost by clean energy. In my view, there are three reasons. First, clean energy needs installation and maintenance, so it creates many local jobs, such as technicians for rooftop panels. Second, automation. Large solar farms need few workers once they are built, so fewer long-term jobs exist than in coal mines. Third, the supply chain. Panels and batteries are often made abroad, so factory jobs may be in other countries. For example, a country that imports all its panels gets fewer manufacturing jobs. To sum up, installation creates jobs, but automation and imports reduce them. That’s why I believe a country should also build its own clean-energy industry.","v":"Tôi muốn nói về việc làm được tạo ra và mất đi do năng lượng sạch. Theo tôi có ba lý do. Thứ nhất, năng lượng sạch cần lắp đặt và bảo trì nên tạo nhiều việc địa phương, như kỹ thuật viên cho pin mái nhà. Thứ hai, tự động hóa. Các trang trại mặt trời lớn cần ít công nhân khi đã xây xong, nên ít việc dài hạn hơn mỏ than. Thứ ba, chuỗi cung ứng. Tấm pin và pin lưu trữ thường làm ở nước ngoài nên việc nhà máy có thể ở nước khác. Ví dụ, một nước nhập toàn bộ tấm pin có ít việc sản xuất hơn. Tóm lại, lắp đặt tạo việc nhưng tự động hóa và nhập khẩu giảm việc. Vì vậy tôi tin một nước cũng nên xây dựng ngành năng lượng sạch của mình."},{"a":"I’d like to talk about why cleaner energy can both create and destroy jobs. I believe there are three main reasons. The first is that governments invest in new industries, such as wind farms and electric vehicles, which need engineers and drivers. The second is that older industries lose customers. Gas stations and coal traders may have fewer clients. The third is that workers’ ages differ. Younger people can learn new skills, but older workers may find it hard to retrain. For example, a mechanic who repairs only petrol engines must learn about batteries. To sum up, new investment brings jobs, while old industries decline and some workers struggle. That’s why I believe support for retraining is essential.","v":"Tôi muốn nói về việc vì sao năng lượng sạch vừa có thể tạo vừa phá hủy việc làm. Tôi tin có ba lý do chính. Thứ nhất, chính phủ đầu tư vào ngành mới như trang trại gió và xe điện cần kỹ sư và tài xế. Thứ hai, các ngành cũ mất khách. Trạm xăng và thương nhân than có thể ít khách hơn. Thứ ba, độ tuổi của người lao động khác nhau. Người trẻ học kỹ năng mới được, nhưng người lớn tuổi khó đào tạo lại. Ví dụ, một thợ sửa chỉ xe xăng phải học về pin. Tóm lại, đầu tư mới mang việc làm trong khi ngành cũ suy giảm và một số công nhân khó khăn. Vì vậy tôi tin hỗ trợ đào tạo lại là thiết yếu."},{"a":"I’d like to talk about the jobs created and lost by switching to cleaner energy. I think there are three reasons. First, new sectors appear: recycling, energy-saving advice, and electric vehicle services. Second, some businesses cannot afford to change, so they close and people lose jobs. Third, energy prices may change during the transition, which affects factories like mine. For example, if cheaper clean electricity becomes available, we can produce at lower cost, but if the price goes up temporarily, we may reduce staff. To sum up, the change opens new fields but creates uncertainty. That’s why I believe a clear national plan helps both workers and businesses.","v":"Tôi muốn nói về việc làm được tạo ra và mất đi khi chuyển sang năng lượng sạch. Tôi nghĩ có ba lý do. Thứ nhất, các lĩnh vực mới xuất hiện: tái chế, tư vấn tiết kiệm năng lượng và dịch vụ xe điện. Thứ hai, một số doanh nghiệp không đủ khả năng thay đổi nên đóng cửa và người ta mất việc. Thứ ba, giá năng lượng có thể thay đổi trong quá trình chuyển đổi, ảnh hưởng nhà máy như của tôi. Ví dụ, nếu điện sạch rẻ hơn, chúng tôi sản xuất chi phí thấp hơn, nhưng nếu giá tạm thời tăng, chúng tôi có thể giảm nhân viên. Tóm lại, thay đổi mở lĩnh vực mới nhưng tạo bất định. Vì vậy tôi tin một kế hoạch quốc gia rõ giúp cả người lao động và doanh nghiệp."}],"q":"Why switching to cleaner energy can create new jobs but also cause some people to lose theirs.","vi":"Vì sao chuyển sang năng lượng sạch có thể tạo việc làm mới nhưng cũng khiến một số người mất việc."}]},{"code":"09","p1":[{"type":"So sánh (compare)","out":"Có, khác. Nhắn tin: ngắn, viết tắt, emoji, thoải mái. Nói trực tiếp: đầy đủ, có giọng điệu, nét mặt. Ví dụ Zalo với khách. Kết.","words":"abbreviation, emoji, informal, face to face, tone, body language, misunderstand","vers":[{"a":"Yes, I do. When I text, my messages are short and simple. I use emojis and short words, especially with friends and family. When I speak face to face, I use full sentences, and my voice and face show my feelings. So there is less misunderstanding. With customers, I am careful in writing too, because a message can be proof later. I change my words for each person.","v":"Có. Khi nhắn tin, tin của tôi ngắn và đơn giản. Tôi dùng biểu tượng và từ ngắn, nhất là với bạn bè và gia đình. Khi nói trực tiếp, tôi dùng câu đầy đủ và giọng nói, nét mặt cho thấy cảm xúc. Nên ít hiểu nhầm hơn. Với khách, tôi cũng cẩn thận khi viết vì tin nhắn có thể là bằng chứng sau này. Tôi đổi cách nói cho từng người."},{"a":"Yes, I do. When I text, I use short words like “ok” or “thanks”. I also use emojis. When I talk face to face, I use full sentences. For example, I text my friends in a funny way, but I talk to my teacher in a polite way. So I change my words for each person.","v":"Có. Khi nhắn tin, tôi dùng từ ngắn như “ok” hay “cảm ơn”, và dùng biểu tượng cảm xúc. Khi nói trực tiếp, tôi dùng câu đầy đủ. Ví dụ, tôi nhắn tin với bạn bè kiểu vui vẻ, nhưng nói với thầy cô thì lịch sự. Nên tôi đổi cách nói cho từng người."},{"a":"I think texting is faster, so I write less. I do not worry about grammar. But when I speak, I need to explain more because the other person cannot read my mind. For example, in a text I write “busy now”, but in person I say, “Sorry, I am busy now. Can we talk later?”","v":"Tôi nghĩ nhắn tin nhanh hơn nên tôi viết ít hơn. Tôi không lo ngữ pháp. Nhưng khi nói, tôi cần giải thích nhiều hơn vì người kia không đoán được ý tôi. Ví dụ, trong tin nhắn tôi viết “đang bận”, còn khi gặp tôi nói “Xin lỗi, giờ tôi bận. Mình nói sau được không?”"},{"a":"Yes, because in a text people cannot see my face. So I add emojis to show my feelings. When I speak, my voice and my face show them. Sometimes a text can sound rude by mistake. That is why I am careful with my words when I text a customer.","v":"Có, vì trong tin nhắn người ta không thấy mặt tôi. Nên tôi thêm biểu tượng để thể hiện cảm xúc. Khi nói, giọng và nét mặt cho thấy điều đó. Đôi khi tin nhắn nghe thô lỗ do nhầm. Vì vậy tôi cẩn thận với lời lẽ khi nhắn cho khách."},{"a":"A little. I use the same words with my close friends in both ways. But with older people, I use more polite words when I speak. I think the situation is more important than the way I talk. I try to be natural and clear.","v":"Một chút. Với bạn thân, tôi dùng cùng từ ở cả hai cách. Nhưng với người lớn tuổi, tôi dùng từ lịch sự hơn khi nói. Tôi nghĩ tình huống quan trọng hơn cách nói. Tôi cố nói tự nhiên và rõ ràng."}],"q":"Do you use different words when you text and when you speak face to face?","vi":"Bạn có dùng từ khác nhau khi nhắn tin và khi nói chuyện trực tiếp không?"},{"type":"Hai ý (two things)","out":"Ý 1: được ghi nhận. Ý 2: luân phiên công việc hoặc thấy ý nghĩa công việc. Có ví dụ thực tế.","words":"recognition, incentives, job rotation, burnout, sense of purpose, repetitive, meaningful","vers":[{"a":"I think the biggest factor is recognition. If a manager notices good work, even a boring task feels meaningful. For example, a worker who checks the same parts every day works harder when the boss thanks him in front of the team. Another thing that helps is variety. If people rotate between different jobs, they get less bored and learn new skills. Overall, I’d say recognition and job rotation give people a sense of purpose.","v":"Tôi nghĩ yếu tố lớn nhất là sự ghi nhận. Nếu quản lý để ý đến việc làm tốt, ngay cả một công việc nhàm chán cũng trở nên có ý nghĩa. Ví dụ, một công nhân ngày nào cũng kiểm tra cùng một loại chi tiết sẽ làm hăng hơn khi ông chủ cảm ơn anh ấy trước cả tổ. Một điều khác cũng giúp ích là sự đa dạng. Nếu mọi người được luân phiên giữa các việc khác nhau, họ bớt chán và học thêm kỹ năng mới. Nhìn chung, tôi cho rằng sự ghi nhận và việc luân phiên công việc cho mọi người cảm giác có mục đích."},{"a":"In my view, the most effective thing is a fair reward system. If employees know that steady effort leads to a bonus or a promotion, they have a clear goal to work toward. For example, in my cousin’s factory, workers who reach their monthly target receive extra pay, and almost everyone tries to meet it. Another helpful factor is a friendly team. When colleagues joke and help each other, even a repetitive shift feels shorter. On the other hand, a bonus without respect can feel empty. Overall, I’d say a fair reward and a good team spirit keep people motivated.","v":"Theo tôi, điều hiệu quả nhất là một hệ thống thưởng công bằng. Nếu nhân viên biết rằng cố gắng đều đặn sẽ được thưởng hoặc thăng chức, họ có mục tiêu rõ ràng để hướng tới. Ví dụ, ở xưởng của anh họ tôi, công nhân đạt chỉ tiêu tháng được trả thêm tiền, và hầu như ai cũng cố đạt. Một yếu tố khác là một tập thể thân thiện. Khi đồng nghiệp đùa vui và giúp nhau, một ca làm lặp đi lặp lại cũng thấy ngắn hơn. Mặt khác, tiền thưởng mà thiếu sự tôn trọng thì có thể thấy trống rỗng. Nhìn chung, tôi cho rằng phần thưởng công bằng và tinh thần tập thể tốt giúp mọi người giữ được động lực."},{"a":"I’d like to mention two things: learning and flexibility. First, if people can learn new skills while doing a repetitive job, they feel they are growing instead of standing still. For instance, a cashier who is trained to manage the shop will pay more attention to every detail. Second, flexible schedules help. Parents, for example, work better when they can pick up their children on time. Admittedly, not every company can offer this. But to conclude, a chance to grow and some flexibility give routine work a purpose and reduce burnout.","v":"Tôi muốn nói hai điều: học hỏi và sự linh hoạt. Thứ nhất, nếu người ta học được kỹ năng mới trong lúc làm một việc lặp lại, họ cảm thấy mình đang tiến lên chứ không đứng yên. Ví dụ, một thu ngân được đào tạo để quản lý cửa hàng sẽ chú ý đến từng chi tiết hơn. Thứ hai, giờ giấc linh hoạt cũng giúp ích. Chẳng hạn, các bậc cha mẹ làm việc tốt hơn khi được đón con đúng giờ. Phải thừa nhận rằng không phải công ty nào cũng làm được. Nhưng tóm lại, cơ hội phát triển và một chút linh hoạt cho công việc thường ngày một mục đích và giảm kiệt sức."},{"a":"I think a good thing is a clear job and a kind boss. If workers know why their job is important, they feel better. For example, my worker checks small parts all day. When I tell him that these parts keep the machine safe, he works with more care. A simple thank you also helps a lot.","v":"Tôi nghĩ điều tốt là công việc rõ ràng và ông chủ tử tế. Nếu công nhân biết vì sao việc của mình quan trọng, họ thấy tốt hơn. Ví dụ, công nhân của tôi kiểm tra chi tiết nhỏ cả ngày. Khi tôi nói những chi tiết này giữ máy an toàn, anh làm cẩn thận hơn. Một lời cảm ơn đơn giản cũng giúp nhiều."},{"a":"Small breaks and music can help. When the work is the same every day, people get tired and bored. A short break with tea gives energy. Also, a small goal, like “finish 50 pieces by noon”, makes the work feel like a game. I do this in my workshop.","v":"Nghỉ ngắn và nhạc có thể giúp. Khi công việc giống nhau mỗi ngày, người ta mệt và chán. Một giờ nghỉ ngắn với trà cho thêm năng lượng. Ngoài ra, một mục tiêu nhỏ như “xong 50 sản phẩm trước trưa” làm công việc giống trò chơi. Tôi làm vậy ở xưởng."}],"q":"What helps employees stay motivated when the work is repetitive?","vi":"Điều gì giúp nhân viên giữ động lực khi công việc lặp đi lặp lại?"},{"type":"Hai lý do (two reasons)","out":"Lý do 1: não tập trung vào chỗ này, bỏ sót chỗ khác (đánh lạc hướng). Lý do 2: ta tin điều mắt thấy, đoán trước. Ví dụ. Kết: biết thế vẫn thích xem.","words":"misdirection, attention, magician, trick, expect, assume, fooled","vers":[{"a":"I think there are two reasons. First, attention. A magician makes us look at one hand, and the other hand does the secret work. Our brain cannot watch everything. Second, we trust what we expect. We think a coin cannot disappear, so when it does, we are surprised and we miss the small move. Also, people like to be surprised, so they do not try too hard to find the trick.","v":"Tôi nghĩ có hai lý do. Thứ nhất, sự chú ý. Ảo thuật gia khiến ta nhìn một tay còn tay kia làm việc bí mật. Não ta không theo dõi được mọi thứ. Thứ hai, ta tin điều mình mong đợi. Ta nghĩ đồng xu không thể biến mất nên khi nó biến, ta ngạc nhiên và bỏ sót cử động nhỏ. Ngoài ra, người ta thích bất ngờ nên không cố tìm mánh."},{"a":"I think it is because we look at the wrong place. The magician says something funny or moves one hand. We look there, and we do not see the other hand. Our brain cannot watch everything. So we are easily fooled.","v":"Tôi nghĩ vì ta nhìn sai chỗ. Ảo thuật gia nói điều gì vui hoặc di chuyển một tay. Ta nhìn vào đó và không thấy tay kia. Não ta không theo dõi được mọi thứ. Nên ta dễ bị lừa."},{"a":"Because we trust our eyes. We think “a coin cannot disappear”, so when it does, we are very surprised. We do not think about the secret way. Also, we want to enjoy the show, so we do not try too hard to find the trick.","v":"Vì ta tin mắt mình. Ta nghĩ “đồng xu không thể biến mất”, nên khi nó biến, ta rất ngạc nhiên. Ta không nghĩ đến cách bí mật. Ngoài ra, ta muốn thưởng thức màn trình diễn nên không cố tìm mánh."},{"a":"Magicians practice for many years. Their hands are very fast, and they know how people think. They also use music and funny words to make us relax. For example, I saw a magician at a party, and I could not find the trick even when I watched carefully.","v":"Ảo thuật gia luyện tập nhiều năm. Tay họ rất nhanh và họ biết người ta nghĩ thế nào. Họ cũng dùng nhạc và lời hài hước để ta thư giãn. Ví dụ, tôi xem một ảo thuật gia ở bữa tiệc và không tìm ra mánh dù nhìn kỹ."},{"a":"I think people like to be fooled in a fun way. When we watch magic, we want to believe. So we turn off the part of our brain that checks facts. It is a game between the magician and us, and the magician always knows the secret.","v":"Tôi nghĩ người ta thích bị lừa theo cách vui. Khi xem ảo thuật, ta muốn tin. Nên ta tắt phần não kiểm tra sự thật. Đó là trò chơi giữa ảo thuật gia và ta, và ảo thuật gia luôn biết bí mật."}],"q":"Why are people so easily fooled by magic tricks?","vi":"Vì sao người ta dễ bị đánh lừa bởi các trò ảo thuật?"},{"type":"Câu chuyện ngắn (habit)","out":"Trả lời: thường là có. Lý do 1: chất lượng, an toàn, đặc biệt thực phẩm. Lý do 2: ủng hộ hàng Việt. Ví dụ. Nhưng đôi khi chỉ nhìn giá. Kết.","words":"label, made in, origin, quality, safety, local product, support","vers":[{"a":"Yes, I usually do, especially for food and things for my children. I read the label because I want to be safe. If I know a product comes from a good place, I feel better. For example, I always read the label on milk. But when I buy small things like pens, I only look at the price. So I check the origin for important things, not for everything.","v":"Có, tôi thường kiểm tra, nhất là thực phẩm và đồ cho các con. Tôi đọc nhãn vì muốn an toàn. Nếu biết sản phẩm đến từ nơi tốt, tôi thấy yên tâm hơn. Ví dụ, tôi luôn đọc nhãn sữa. Nhưng khi mua đồ nhỏ như bút, tôi chỉ nhìn giá. Nên tôi kiểm tra xuất xứ với đồ quan trọng, không phải mọi thứ."},{"a":"Yes, I often do, but not for everything. I check food and things for my children. I look at the label and the date. If I do not know the brand, I do not buy it. For cheap things like a pen, I do not check.","v":"Có, tôi thường kiểm tra nhưng không phải mọi thứ. Tôi kiểm tra thực phẩm và đồ cho các con. Tôi xem nhãn và hạn dùng. Nếu không biết nhãn hiệu, tôi không mua. Với đồ rẻ như cây bút, tôi không kiểm tra."},{"a":"Not always. When I am in a hurry, I just buy what I need. But for big things, like a machine or a phone, I read reviews and ask where it comes from. I want a good warranty. I do not want to waste money.","v":"Không phải lúc nào. Khi vội, tôi chỉ mua thứ cần. Nhưng với đồ lớn như máy móc hay điện thoại, tôi đọc đánh giá và hỏi xuất xứ. Tôi muốn bảo hành tốt. Tôi không muốn lãng phí tiền."},{"a":"I like to buy Vietnamese products, so I look for “Made in Vietnam”. I think they are fresh and cheap. For example, I buy fruit and vegetables from local farmers. It helps them, and the quality is good.","v":"Tôi thích mua hàng Việt Nam nên tìm chữ “Sản xuất tại Việt Nam”. Tôi nghĩ chúng tươi và rẻ. Ví dụ, tôi mua trái cây và rau từ nông dân địa phương. Điều này giúp họ và chất lượng tốt."},{"a":"Sometimes I do, when I have time. I read the label because I care about health and the environment. I also look at the price. If a product is very cheap and has no information, I feel worried. I would rather pay more for a clear product.","v":"Đôi khi, khi tôi có thời gian. Tôi đọc nhãn vì quan tâm sức khỏe và môi trường. Tôi cũng xem giá. Nếu sản phẩm rất rẻ và không có thông tin, tôi thấy lo. Tôi thà trả nhiều hơn cho sản phẩm rõ ràng."}],"q":"Do you check where a product was made before you buy it?","vi":"Bạn có kiểm tra sản phẩm được làm ở đâu trước khi mua không?"},{"type":"Chọn một bên (choice)","out":"Chọn: cả hai, nhưng người tiêu dùng hưởng lợi rõ nhất. Lý do 1: giá rẻ, nhiều lựa chọn. Lý do 2: nhà sản xuất có thị trường lớn. Mặt trái: một số ngành nội địa bị cạnh tranh. Kết.","words":"international trade, producer, consumer, variety, export, competition, benefit","vers":[{"a":"I think both benefit, but consumers benefit more. First, we get cheaper things and more choice. We can buy fruit, phones and clothes from many countries. Second, producers also gain because they can sell to more people. For example, Vietnamese coffee farmers sell all over the world. But some small local companies cannot compete with cheap goods from other countries. Overall, I think consumers benefit most.","v":"Tôi nghĩ cả hai đều có lợi nhưng người tiêu dùng lợi hơn. Thứ nhất, ta có đồ rẻ hơn và nhiều lựa chọn hơn. Ta mua được trái cây, điện thoại và quần áo từ nhiều nước. Thứ hai, nhà sản xuất cũng được lợi vì bán được cho nhiều người hơn. Ví dụ, nông dân cà phê Việt Nam bán khắp thế giới. Nhưng một số công ty nhỏ trong nước không cạnh tranh được với hàng rẻ nước ngoài. Nhìn chung, tôi nghĩ người tiêu dùng lợi nhất."},{"a":"I think consumers benefit most. We can buy many things from many countries, and the prices are lower. For example, I can buy fruit, phones and clothes from other countries. Producers also gain, but they have to compete. Some small companies find it hard.","v":"Tôi nghĩ người tiêu dùng hưởng lợi nhiều nhất. Ta mua được nhiều thứ từ nhiều nước và giá thấp hơn. Ví dụ, tôi mua trái cây, điện thoại và quần áo từ nước khác. Nhà sản xuất cũng được lợi nhưng họ phải cạnh tranh. Một số công ty nhỏ thấy khó."},{"a":"I think producers benefit more, because they can sell to the whole world. A farmer in Vietnam can sell coffee to many countries. This gives them more money and more jobs. Consumers only save a little money. So I choose producers, especially big and strong ones.","v":"Tôi nghĩ nhà sản xuất hưởng lợi hơn vì họ bán được cho cả thế giới. Một nông dân Việt Nam có thể bán cà phê cho nhiều nước. Điều này cho họ nhiều tiền và việc làm hơn. Người tiêu dùng chỉ tiết kiệm ít tiền. Nên tôi chọn nhà sản xuất, nhất là loại lớn và mạnh."},{"a":"It depends. Rich consumers benefit because they have more choices. Poor producers may not benefit if they only sell cheap raw materials. The big companies in the middle often get most of the money. So, I think we need fair trade rules.","v":"Còn tùy. Người tiêu dùng giàu hưởng lợi vì có nhiều lựa chọn. Nhà sản xuất nghèo có thể không được lợi nếu chỉ bán nguyên liệu rẻ. Các công ty lớn ở giữa thường lấy phần lớn tiền. Nên tôi nghĩ ta cần luật thương mại công bằng."},{"a":"Both sides benefit, but in different ways. Consumers get cheap and good products. Producers get new customers. For my work, I buy machines from other countries, and my customers get better products. So trade is good for everyone if it is fair.","v":"Cả hai bên đều được lợi nhưng theo cách khác nhau. Người tiêu dùng có sản phẩm rẻ và tốt. Nhà sản xuất có khách mới. Với công việc của tôi, tôi mua máy từ nước khác và khách của tôi có sản phẩm tốt hơn. Nên thương mại tốt cho mọi người nếu công bằng."}],"q":"Who benefits most from international trade: producers or consumers?","vi":"Ai hưởng lợi nhiều nhất từ thương mại quốc tế: nhà sản xuất hay người tiêu dùng?"},{"type":"Ý tưởng (idea)","out":"Nêu 1 sản phẩm: ứng dụng/thiết bị giúp kiểm kho tự động. Giải quyết vấn đề gì. Ai dùng. Vì sao khả thi. Kết.","words":"invent, device, inventory, problem, user-friendly, affordable, automatic","vers":[{"a":"I would like to invent a simple app or device that checks the stock in a warehouse. Many small businesses, including mine, spend hours every week counting goods, and mistakes happen. My product would scan the items, compare them with the records and tell the owner if something is missing. It should be easy to use and not expensive. I think it would save time and reduce losses. I would test it first in my own warehouse.","v":"Tôi muốn phát minh một ứng dụng hoặc thiết bị đơn giản kiểm tra hàng trong kho. Nhiều doanh nghiệp nhỏ, kể cả của tôi, mất hàng giờ mỗi tuần đếm hàng và có sai sót. Sản phẩm của tôi sẽ quét hàng, so với sổ sách và báo chủ nếu thiếu gì. Nó phải dễ dùng và không đắt. Tôi nghĩ nó tiết kiệm thời gian và giảm thất thoát. Tôi sẽ thử trước ở kho của mình."},{"a":"I want to invent a smart bag for children. It has a small light and a bell. It tells parents where the child is. It also tells the child to bring books. I think it is useful because many parents worry about their children when they go to school.","v":"Tôi muốn phát minh một chiếc cặp thông minh cho trẻ em. Nó có đèn nhỏ và chuông. Nó cho cha mẹ biết con ở đâu. Nó cũng nhắc trẻ mang sách. Tôi nghĩ nó hữu ích vì nhiều phụ huynh lo cho con khi đi học."},{"a":"I would like to invent a cheap machine that cleans the air at home. Many cities have dirty air. The machine can be small and use little electricity. Families could put it in the kitchen or bedroom. It would help people stay healthy.","v":"Tôi muốn phát minh một chiếc máy rẻ để làm sạch không khí trong nhà. Nhiều thành phố có không khí bẩn. Máy có thể nhỏ và dùng ít điện. Các gia đình có thể đặt trong bếp hoặc phòng ngủ. Nó giúp mọi người khỏe mạnh."},{"a":"I want to invent an app for students. It helps them make a study plan and reminds them to take breaks. It also finds free lessons online. Many students, including me, forget deadlines. This app would save time and reduce stress.","v":"Tôi muốn phát minh một ứng dụng cho sinh viên. Nó giúp lập kế hoạch học và nhắc nghỉ. Nó cũng tìm bài học miễn phí trên mạng. Nhiều sinh viên, kể cả tôi, quên hạn nộp. Ứng dụng này tiết kiệm thời gian và giảm căng thẳng."},{"a":"I would like to invent a small solar charger for phones. People could use it outside, for example at the beach or the market. It would be cheap and light. In Vietnam we have a lot of sun, so it is a good idea. It also helps the environment.","v":"Tôi muốn phát minh một bộ sạc mặt trời nhỏ cho điện thoại. Người ta có thể dùng ngoài trời, ví dụ ở bãi biển hay chợ. Nó rẻ và nhẹ. Ở Việt Nam có nhiều nắng nên đây là ý hay. Nó cũng giúp môi trường."}],"q":"What kind of product would you like to invent?","vi":"Bạn muốn phát minh ra loại sản phẩm nào?"},{"type":"So sánh (compare)","out":"Chọn: văn hóa mới khó hơn. Lý do 1: ngôn ngữ, thói quen, giá trị. Lý do 2: công việc mới có đào tạo, đồng nghiệp hướng dẫn. Ví dụ. Kết.","words":"adapt, culture shock, customs, language barrier, training, colleagues, adjust","vers":[{"a":"I think a new culture is harder. First, culture is in everything: language, food, manners and values. You cannot rest from it. A new job is only one part of life, and it usually has training and colleagues who help. Second, even if you learn the rules, you may still feel lonely. For example, someone who studies abroad may understand the language but still miss home. A new job can be stressful too, but I think a new culture is the bigger challenge.","v":"Tôi nghĩ văn hóa mới khó hơn. Thứ nhất, văn hóa có trong mọi thứ: ngôn ngữ, đồ ăn, cách cư xử và giá trị. Bạn không nghỉ được. Một công việc mới chỉ là một phần cuộc sống và thường có đào tạo và đồng nghiệp giúp. Thứ hai, dù đã học quy tắc, bạn vẫn có thể thấy cô đơn. Ví dụ, người đi du học có thể hiểu ngôn ngữ nhưng vẫn nhớ nhà. Công việc mới cũng có thể căng thẳng nhưng tôi nghĩ văn hóa mới là thử thách lớn hơn."},{"a":"I think a new job is harder, because I have to learn many things quickly. I must know new people, new rules and new tools. If I make a mistake, my boss can be unhappy. In a new culture, people are usually kind to a newcomer. So the job feels more stressful to me.","v":"Tôi nghĩ công việc mới khó hơn vì tôi phải học nhiều thứ nhanh. Tôi phải biết người mới, quy tắc mới và dụng cụ mới. Nếu tôi sai, sếp có thể không vui. Ở văn hóa mới, người ta thường tử tế với người mới đến. Nên công việc có vẻ căng thẳng hơn."},{"a":"Both are hard, but in different ways. A new culture is hard because of language and food. You may feel lonely. A new job is hard because of pressure. I think a new culture takes more time, but a new job is more stressful. If I must choose, I choose culture as the harder one.","v":"Cả hai đều khó nhưng theo cách khác nhau. Văn hóa mới khó vì ngôn ngữ và đồ ăn. Bạn có thể thấy cô đơn. Công việc mới khó vì áp lực. Tôi nghĩ văn hóa mới cần nhiều thời gian hơn, còn công việc mới căng thẳng hơn. Nếu phải chọn, tôi chọn văn hóa là cái khó hơn."},{"a":"A new culture is harder for me. I traveled to another city for a course, and I missed my family and my food. The way people talk was different. It took me one month to feel comfortable. At a new job, I can ask my colleagues for help.","v":"Văn hóa mới khó hơn với tôi. Tôi đi thành phố khác học một khóa và nhớ gia đình, nhớ đồ ăn. Cách người ta nói chuyện khác. Tôi mất một tháng mới thấy thoải mái. Ở công việc mới, tôi có thể nhờ đồng nghiệp giúp."},{"a":"I think it depends on the person. Some people love changes and enjoy a new culture. Other people feel safe at work, so a new job is hard for them. For me, I am careful, so both are difficult. But I learn fast if people are friendly.","v":"Tôi nghĩ còn tùy người. Một số người yêu thay đổi và thích văn hóa mới. Người khác thấy an toàn ở công việc nên công việc mới khó với họ. Với tôi, tôi cẩn thận nên cả hai đều khó. Nhưng tôi học nhanh nếu mọi người thân thiện."}],"q":"Is it harder to adapt to a new culture or a new job?","vi":"Thích nghi với một nền văn hóa mới hay một công việc mới thì khó hơn?"},{"type":"Ý kiến (opinion)","out":"Chọn một phía, 2 lý do. Có thể nêu một mặt trái rồi kết luận.","words":"incentive, reduce, energy consumption, bill, budget, awareness, effective","vers":[{"a":"I believe the government should do it, but only in a limited way. One reason is that people respond quickly to money. If they get a discount on their electricity bill, they will turn off unused lights. Another reason is that using less electricity protects the environment, which benefits everyone. On the other hand, this policy costs a lot, so the government needs a clear budget. Overall, I’d say a small reward is an effective incentive.","v":"Tôi tin chính phủ nên làm vậy, nhưng chỉ ở mức hạn chế. Một lý do là con người phản ứng rất nhanh với tiền. Nếu được giảm tiền điện, họ sẽ tắt những bóng đèn không dùng. Một lý do khác là dùng ít điện hơn bảo vệ môi trường, điều có lợi cho tất cả mọi người. Mặt khác, chính sách này tốn nhiều tiền, nên chính phủ cần một ngân sách rõ ràng. Nhìn chung, tôi cho rằng một khoản thưởng nhỏ là động lực hiệu quả."},{"a":"I don’t fully agree, because paying people may be too expensive. A better idea is to charge higher prices for heavy users and give cheaper rates to families who save electricity. For example, a household that uses less than a certain amount could pay a lower price per unit. This rewards good habits without a big budget. Another reason is fairness: people who already save energy should not be forgotten. However, the government should still run campaigns to teach people simple ways to save electricity. Overall, I’d say a smart price system works better than direct payments.","v":"Tôi không hoàn toàn đồng ý, vì trả tiền cho người dân có thể quá tốn kém. Một ý hay hơn là tính giá cao cho người dùng nhiều và giá rẻ hơn cho các gia đình tiết kiệm điện. Ví dụ, hộ dùng dưới một mức nhất định có thể trả giá mỗi số điện thấp hơn. Cách này thưởng cho thói quen tốt mà không cần ngân sách lớn. Một lý do khác là sự công bằng: những người vốn đã tiết kiệm điện không nên bị bỏ quên. Tuy nhiên, chính phủ vẫn nên làm các chiến dịch dạy người dân những cách tiết kiệm điện đơn giản. Nhìn chung, tôi cho rằng một hệ thống giá thông minh hiệu quả hơn việc trả tiền trực tiếp."},{"a":"Yes, in my opinion the government should, mainly for businesses. Factories and large buildings use a huge amount of power, so a small payment can encourage them to buy modern machines. For example, a company that changes to LED lights can cut its bill by half, and the government can support the cost of the change. Another reason is that using less electricity avoids blackouts in summer. On the other hand, the rewards must be checked carefully so that nobody cheats. To conclude, support for big users brings the biggest effect.","v":"Có, theo tôi chính phủ nên làm, chủ yếu với các doanh nghiệp. Nhà máy và tòa nhà lớn dùng một lượng điện rất nhiều, nên một khoản hỗ trợ nhỏ có thể khuyến khích họ mua máy móc hiện đại. Ví dụ, một công ty đổi sang đèn LED có thể cắt giảm một nửa hóa đơn, và chính phủ có thể hỗ trợ chi phí thay đổi đó. Một lý do khác là dùng ít điện hơn giúp tránh cúp điện vào mùa hè. Mặt khác, các khoản thưởng phải được kiểm tra kỹ để không ai gian lận. Tóm lại, hỗ trợ cho những người dùng lớn mang lại hiệu quả lớn nhất."},{"a":"I do not think the government should pay people. It costs a lot of money. A better way is to teach people to save electricity and give a lower price when people use less. For example, my family saves electricity because we want a low bill. We do not need extra money.","v":"Tôi không nghĩ chính phủ nên trả tiền cho người dân. Việc đó tốn rất nhiều tiền. Cách tốt hơn là dạy người dân tiết kiệm điện và giảm giá khi dùng ít. Ví dụ, gia đình tôi tiết kiệm điện vì muốn hóa đơn thấp. Chúng tôi không cần tiền thêm."},{"a":"Yes, I think it is a good idea for big users, like factories. Factories use a lot of electricity, so a small change can save a lot. If the government gives them a reward, they will find ways to save energy. For families, a simple reminder may be enough.","v":"Có, tôi nghĩ là ý hay với người dùng lớn như nhà máy. Nhà máy dùng rất nhiều điện nên một thay đổi nhỏ tiết kiệm được nhiều. Nếu chính phủ thưởng, họ sẽ tìm cách tiết kiệm năng lượng. Với gia đình, một lời nhắc đơn giản có thể đủ."}],"q":"Should governments pay people to use less electricity?","vi":"Chính phủ có nên trả tiền cho người dân để họ dùng ít điện hơn không?"}],"p2":[{"type":"Một lần (a time)","out":"Mở: nêu việc lúc đầu tưởng thích (hoặc tưởng khổ). Thân: điều gì xảy ra, vì sao căng thẳng/vui, mình xử lý. Bài học. Kết.","words":"expect, enjoy, stressful, deadline, unexpected, manage, turn out","vers":[{"a":"I want to talk about a time when a task was more stressful than I expected. Two years ago, I helped to organize a class party for my child’s school. I thought it would be fun. But it became stressful for three reasons. First, there were too many opinions. Every parent wanted something different. Second, the money was small, and I worried about every cost. Third, I had my own work at the same time, so I was tired. In the end, the party was good and the children were happy. I learned that I should ask for help and make a clear plan before I say yes. Now I always share the work first.","v":"Tôi muốn kể về một lần công việc căng thẳng hơn tôi nghĩ. Hai năm trước, tôi giúp tổ chức tiệc lớp cho trường của con. Tôi nghĩ sẽ vui. Nhưng nó trở nên căng thẳng vì ba lý do. Thứ nhất, có quá nhiều ý kiến. Mỗi phụ huynh muốn một kiểu. Thứ hai, tiền ít và tôi lo từng khoản chi. Thứ ba, tôi còn công việc riêng cùng lúc nên mệt. Cuối cùng buổi tiệc tốt và các con vui. Tôi học được rằng nên nhờ giúp và lập kế hoạch rõ trước khi nhận lời. Giờ tôi luôn chia việc trước."},{"a":"I want to talk about a time when a task was more stressful than I expected. Last year, I helped to plan a trip for my class. I thought it would be fun. But there were many problems. First, many people changed their mind. Second, the bus was late. Third, I had to take care of the money. I was very tired and worried. In the end, the trip was good and everyone was happy. I learned that I should ask for help and make a plan early. Next time, I will share the work. So a fun task can be stressful, but we can learn from it.","v":"Tôi muốn kể về một lần công việc căng thẳng hơn tôi nghĩ. Năm ngoái, tôi giúp lên kế hoạch chuyến đi cho lớp. Tôi nghĩ sẽ vui. Nhưng có nhiều vấn đề. Thứ nhất, nhiều người đổi ý. Thứ hai, xe buýt đến trễ. Thứ ba, tôi phải lo tiền. Tôi rất mệt và lo. Cuối cùng chuyến đi tốt và mọi người vui. Tôi học được rằng nên nhờ giúp đỡ và lập kế hoạch sớm. Lần sau tôi sẽ chia việc. Nên một việc vui có thể căng thẳng nhưng ta học được từ nó."},{"a":"I want to talk about a time when a task was more stressful than I expected. Two years ago, I cooked for my family party. I like cooking, so I
