// Nội dung ôn thi Nghe Nói 4 - bám theo video bài giảng và buổi ôn cuối kỳ của cô
const UNITS=[
{n:1,title:"Language and identity",vi:"Ngôn ngữ và bản sắc",q:"How does language affect who we are?",
 skills:[
  ["Ghi chú theo mốc thời gian (note-taking)","Bài nói theo thứ tự thời gian thì vẽ một đường thời gian: một bên ghi từ chỉ thời gian, bên kia ghi sự kiện chính. Từ hay gặp: in the beginning, later, before, during that time, soon, after that, in a specific year, at last, on (a day)."],
  ["Kỹ năng nghe: suy luận (making inferences)","Người nói thường không nói thẳng. Mình rút ra kết luận hợp lý từ điều họ nói, nhưng không suy luận quá đà. Muốn chắc thì hỏi lại: Do you mean that...? Are you saying that...?"],
  ["Ngữ pháp: câu bị động (passive voice)","Dạng: be + quá khứ phân từ (was damaged, has been studied, will be given, may be reviewed). Dùng khi muốn nhấn vào đối tượng, hoặc không biết/không cần nói ai làm. Động từ không có tân ngữ như happen thì không dùng bị động. Nói chuyện hằng ngày đừng lạm dụng bị động, nghe sẽ cứng."],
  ["Kỹ năng nói: so sánh ví von (simile) và ẩn dụ (metaphor)","Simile dùng like hoặc as: as busy as a bee, swim like a fish, sleep like a log, as light as a feather, run like the wind, cry like a baby, cut me like a knife, as quiet as a mouse. Metaphor nói một thứ là thứ khác, không dùng like hay as: His words were knives. My computer is a dinosaur. Her sunny face lit up the room."],
  ["Bài nói cuối Unit (assignment)","Kể một trải nghiệm cá nhân về khó khăn hoặc thành công với ngôn ngữ. Dùng đường thời gian để sắp xếp sự kiện và cảm xúc, có lời tả sinh động. Mẫu trong sách: Maxine Hong Kingston kể nỗi sợ khi phải đọc bài bằng tiếng Anh trước lớp."]
 ],
 key:[
  ["Listening 1: Jill Bolte Taylor, My Stroke of Insight","Bà là nhà giải phẫu thần kinh, bị đột quỵ năm 1996. Não phải nhìn bức tranh lớn, làm mờ ranh giới giữa các thứ, cho cảm nhận tổng thể, sống ở hiện tại. Não trái nhặt chi tiết, gắn nhãn bằng ngôn ngữ, so với điều đã học trong quá khứ và hình dung về tương lai."],
  ["Listening 2: Helen Keller, The Story of My Life","Mất thị giác và thính giác lúc 19 tháng tuổi. Tháng đầu sau bệnh: dùng dấu hiệu (pull là đến, push là đi). Trước khi cô giáo đến: biết mình khác mọi người, bực bội, giận dữ, như con tàu trong sương dày. 3/3/1887 cô giáo đến. Sáng hôm sau học chữ doll nhưng chưa hiểu nghĩa. Mùa hè 1887: hiểu mọi vật đều có tên (water)."],
  ["Phát triển ngôn ngữ ở trẻ nhỏ (bài ghi chú theo thời gian)","Năm đầu: trẻ học từ bằng cách nghe cha mẹ lặp lại. 15 đến 24 tháng: học ngôn ngữ nhanh nhất. 18 tháng: biết khoảng 50 từ. 24 tháng: dùng 250 đến 300 từ. Sáu tháng sau: số từ gần gấp đôi."]
 ],

  ["external","/ɪkˈstɜːrnl/","adj","bên ngoài","Culture is an external factor in language learning."],
  ["fascinating","/ˈfæsɪneɪtɪŋ/","adj","hấp dẫn, rất thú vị","The way the brain handles language is fascinating."],
  ["function","/ˈfʌŋkʃn/","n","chức năng","What is the function of each part of the brain?"],

  ["overall","/ˌoʊvərˈɔːl/","adj","tổng thể, nhìn chung","The overall result was good."],
  ["perception","/pərˈsepʃn/","n","nhận thức, cách nhìn","Our perception of colors differs from an animal’s."],

  ["adequate","/ˈædɪkwət/","adj","đầy đủ, đủ dùng","The teacher gave an adequate explanation."],
  ["gesture","/ˈdʒestʃər/","n, v","cử chỉ, ra hiệu","He used a gesture to get their attention."],
  ["incident","/ˈɪnsɪdənt/","n","sự việc","The incident was reported to the police."],

  ["invariably","/ɪnˈveriəbli/","adv","luôn luôn, lần nào cũng vậy","She invariably arrives early."],
  ["outburst","/ˈaʊtbɜːrst/","n","cơn bộc phát","His angry outburst surprised everyone."],

{n:2,title:"Behavioral science: work and fun",vi:"Khoa học hành vi: công việc và vui chơi",q:"What is the tipping point between work and fun?",
 skills:[
  ["Ghi chú bằng biểu đồ Venn (note-taking)","Tìm mối quan hệ giữa các mục là kỹ năng tư duy phản biện quan trọng khi ghi chú. Biểu đồ Venn có hai vòng tròn chồng lên nhau: phần chung ở giữa là điểm giống, hai phần ngoài là điểm khác. Hợp khi bài giảng cần so sánh hai thứ (ví dụ nấu ăn làm sở thích và nấu ăn làm nghề)."],
  ["Kỹ năng nghe: nghe ví dụ (listening for examples)","Cụm báo hiệu ví dụ: for example, for instance, take… as an example, let me give you an example, including, such as. Khi người nói liệt kê ví dụ, họ lên giọng ở từng mục trừ mục cuối: lên giọng nghĩa là chưa nói xong. Cách ghi: ý chính bên trái, ví dụ bên phải."],
  ["Phát âm: ngữ điệu khi nêu lựa chọn","Câu nêu lựa chọn: lên giọng ở âm nhấn của mỗi lựa chọn, hạ giọng ở or, câu kết thúc xuống giọng. Câu hỏi lựa chọn: lên giọng ở mỗi lựa chọn, hạ giọng ở or, rồi lên giọng ở mục cuối, hoặc lên rồi xuống nếu mục cuối kết thúc bằng âm nhấn."],
  ["Ngữ pháp: so sánh (comparisons)","Danh từ: more perks than, fewer perks than, less time than, many more/many fewer perks than, much less time than, as many perks as, as much time as. Động từ: gains more than, gains less than, gains much more than, gains as much as. Tính từ: clearer than, much clearer than, less aware than, as productive as. So sánh phải cùng loại: the office in China had more employees than the office in India (không so với đất nước India)."],
  ["Kỹ năng nói: sở thích và lựa chọn (preferences)","Sở thích trong quá khứ: prefer + danh từ, choose + to-V, first/second choice was + to-V, had hoped + to-V. Sở thích hiện tại: my preference is to + V, I’d rather (not) + V, If it were up to me, I like A more than B, I’d like to + V."],
  ["Bài nói cuối Unit (assignment)","Làm việc nhóm, thảo luận một hoạt động hoặc công việc vừa có phần vui vừa có phần vất vả (ví dụ kỳ nghỉ kết hợp làm tình nguyện), rồi trình bày."]
 ],
 key:[
  ["Listening 1: Google và Bloomberg","Hai video: ở Google, bộ phận people operations dùng dữ liệu (data mining) để cải thiện nơi làm việc. Ở Bloomberg, một quản lý sản phẩm hỏi đồng nghiệp về môi trường làm việc. Câu hỏi chung: đâu là điểm chuyển giữa làm việc và vui chơi."],
  ["Du học và thực tập (cố vấn đại học)","Chương trình du học vẫn đóng học phí ở trường mình. Thực tập thì không đóng học phí, thường còn có lương nhỏ. Cả hai đều vui, có trải nghiệm mới, nhưng cũng vất vả: du học phải học và giao tiếp bằng ngoại ngữ, thực tập có sếp và việc có thể khó hơn."],
  ["Ví dụ trong bài nghe","Thực tập có lợi: biết công ty, môi trường văn phòng, phúc lợi (perks) như đồ ăn miễn phí hay chỗ làm riêng. Kỳ nghỉ làm tình nguyện: giúp người khác, đi nhiều nơi, học kỹ năng mới như xây trường."]
 ],

{n:3,title:"Ecology: visual deception",vi:"Sinh thái: đánh lừa thị giác",q:"How can the eyes deceive the mind?",
 skills:[
  ["Ghi chú: dùng kiến thức nền để chuẩn bị (note-taking)","Trước khi nghe, nghĩ về điều mình đã biết để dự đoán người nói sẽ nói gì. Khi nghe, so sánh: khớp thì củng cố, khác thì đặt câu hỏi và học thêm. Cách chuẩn bị: đọc tài liệu cô giao, xem lại ghi chú các buổi trước, trao đổi với bạn, nghĩ về tiêu đề, ghi vài từ khóa vào sơ đồ, viết vài câu hỏi và chừa chỗ ghi câu trả lời. Bước đầu tiên trong bài: đọc tài liệu được giao trước buổi giảng."],
  ["Kỹ năng nghe: nhận ra đồng vị ngữ (appositives)","Đồng vị ngữ là cụm giải thích thêm cho danh từ đứng trước nó. Bỏ đi câu vẫn đủ nghĩa. Khi viết, đồng vị ngữ được đánh dấu bằng dấu phẩy (đề trong video chọn đáp án: dấu gạch ngang, hãy hỏi lại cô cho chắc). Khi nói, nó nằm giữa hai quãng nghỉ ngắn. Ví dụ: The chameleon, a type of lizard, changes its skin color."],
  ["Ngữ pháp: mệnh đề quan hệ (relative clauses)","Mệnh đề quan hệ làm câu phong phú, nối hai câu ngắn thành một. Bắt đầu bằng who, whom, that, which, when, where. Là mệnh đề phụ thuộc, không đứng một mình. Có thể làm chủ ngữ hoặc tân ngữ. Ví dụ: The conductor who was wearing a blue cap walked onto the platform."],
  ["Phát âm: trọng âm khi thêm hậu tố","Nhấn vào chính hậu tố: -ee, -eer, -ese, -ier, -ique (employee, Chinese, cashier). Giữ trọng âm của từ gốc: -al, -ment, -ness, -ous, -or, -y, -ism, -ly (profession, professional, equipment). Nhấn âm tiết ngay trước hậu tố: -ial, -ian, -ion, -ics, -ical, -ient, -ious, -ify, -itive, -ity, -graphy, -logy, -ual. Không chắc thì tra từ điển."],
  ["Kỹ năng nói: nhắc lại và hỏi làm rõ","Nhắc lại ý người nói để xác nhận mình hiểu đúng. Hỏi làm rõ: Do you mean that…? Could you clarify that last concept? Could you give an example?"]
 ],
 key:[
  ["Listening 1: Sherlock Holmes và đánh lừa thị giác","Thám tử Holmes dùng các thủ thuật: cải trang (disguise), giấu quần áo, đánh lạc hướng (misdirection), bằng chứng giả, theo dõi (surveillance), mồi nhử (decoy). Bài ghi chú gồm ba cột: cải trang gì, làm thế nào, kết quả."],
  ["Listening 2: phóng sự National Geographic về động vật sống sót","Động vật thích nghi và ngụy trang để sống sót. Chim ptarmigan có lông nâu khó thấy, mùa đông mọc lông trắng ở chân như giày tuyết, vừa ngụy trang vừa giữ ấm. Cuộc chiến sinh tồn làm cán cân giữa thú săn mồi và con mồi luôn thay đổi. Cũng có sâu bướm, bọ ngựa, rắn, cá bơn."]
 ],

{n:4,title:"International relations: global citizens",vi:"Quan hệ quốc tế: công dân toàn cầu",q:"What does it mean to be a global citizen?",
 skills:[
  ["Ghi chú bằng biểu đồ chữ T (note-taking)","Dùng khi bài nói về vấn đề và giải pháp: cột trái là vấn đề, cột phải là giải pháp. Nếu nghe lệch thứ tự thì ghi đúng cột rồi sắp lại sau. Nghe sót chi tiết thì gạch một dòng nhắc để hỏi bạn sau. Chuẩn bị trước sơ đồ cũng là cách tốt. Cụm báo vấn đề: One problem is, The trouble is that, Another obstacle we face is. Cụm báo giải pháp: People should/must, One suggestion is to, We can solve this by, They need to."],
  ["Kỹ năng nghe: số liệu và sự kiện","Bài dựa trên số liệu thì ghi ý tổng thể, xu hướng quan trọng và số liệu cụ thể người nói nhấn mạnh, kèm từ khóa. Không chắc thì thêm dấu hỏi để tìm lại sau. Cụm hay gặp: in the early 1990s, in recent years, an increase in, a decrease in, it is estimated that, roughly, more than, fewer than, research shows that, the percent of."],
  ["Ngữ pháp: câu tường thuật (reported speech)","Nói về điều đã nói trong quá khứ thì lùi một thì: hiện tại đơn thành quá khứ đơn, hiện tại tiếp diễn thành quá khứ tiếp diễn, quá khứ đơn và hiện tại hoàn thành thành quá khứ hoàn thành, will thành would, can thành could, may thành might. Sự thật hiện hành thì giữ nguyên thì (he said climate change is a reality). Câu hỏi khi tường thuật dùng trật tự câu trần thuật (asked what the agenda was). Động từ tường thuật: say, tell, ask, add, state, remark, respond, warn. Có thể phải đổi đại từ. Câu hỏi Yes/No dùng if hoặc whether."],
  ["Phát âm: nối âm cuối","Đừng bỏ phụ âm cuối. Nối phụ âm cuối với nguyên âm đầu của từ sau (salt items, miles away). Khi phụ âm cuối giống phụ âm đầu từ sau thì giữ lâu hơn, không chèn nguyên âm vào giữa (one tap, take control). Chèn nguyên âm sẽ thêm âm tiết và làm người nghe khó hiểu."],
  ["Kỹ năng nói: trích dẫn nguồn (citing sources)","Khi thuyết trình học thuật cần nói thông tin lấy từ đâu. Ba cách: giới thiệu người viết hoặc nói, nói nơi và thời điểm công bố, dùng câu tường thuật. Cụm hay dùng: According to X, As X explains, As X reports, Data from X support that, In a survey published in X, X results show that, At a conference on [date], X explained how."]
 ],
 key:[
  ["Listening 1: The campaign to humanize the coffee trade","Phóng sự của đài American RadioWorks về cà phê thương mại công bằng (fair trade). Nông dân Guatemala vất vả, nhà cửa nghèo, giá cà phê thế giới lên xuống. Các nhà hoạt động khuyên người tiêu dùng tìm nhãn fair trade để thay đổi đời sống nông dân."],
  ["Bài nghe số liệu về cà phê","90% cà phê được trồng ở các nước đang phát triển. Người ta uống khoảng hơn 400 tỷ tách mỗi năm. 20 triệu gia đình làm nghề trồng cà phê. Gần một phần ba cà phê thế giới trồng ở Brazil, hơn 3 tỷ cây."],
  ["Ví dụ biểu đồ chữ T về nạn đói","Vấn đề: đất xấu, thiếu nước, thiếu giáo dục. Giải pháp: cung cấp phân bón, giúp làm hệ thống tưới, cấp dụng cụ, dạy nông dân."]
 ],
 vocab:[
  ["activist","/ˈæktɪvɪst/","n","nhà hoạt động xã hội","Activists want fair prices for farmers."],
  ["afford","/əˈfɔːrd/","v","đủ khả năng chi trả","Many farmers cannot afford a horse."],
  ["co-op","/ˈkoʊɑːp/","n","hợp tác xã","The farmers formed a co-op."],
  ["commodity","/kəˈmɑːdəti/","n","hàng hóa","Coffee is a global commodity."],
  ["devise","/dɪˈvaɪz/","v","nghĩ ra, vạch ra","They devised a new plan to help farmers."],
  ["guarantee","/ˌɡerənˈtiː/","v, n","bảo đảm","Fair trade guarantees a minimum price."],
  ["intermediary","/ˌɪntərˈmiːdieri/","n","người trung gian","The intermediary takes a share of the money."],
  ["massive","/ˈmæsɪv/","adj","khổng lồ","The company makes massive profits."],
  ["processor","/ˈprɑːsesər/","n","nhà chế biến","The processor cleans and packs the beans."],
  ["roughly","/ˈrʌfli/","adv","khoảng, xấp xỉ","Roughly 20 million families grow coffee."],
  ["speculation","/ˌspekjuˈleɪʃn/","n","đầu cơ, sự suy đoán","Speculation makes prices go up and down."],
  ["transform","/trænsˈfɔːrm/","v","biến đổi hoàn toàn","Fair trade can transform farmers’ lives."]
 ]}
];

 p1:[
  {q:"What helps employees stay motivated when the work is repetitive?",type:"Hai ý (two things)",

   words:"recognition, incentives, job rotation, burnout, sense of purpose, repetitive, meaningful",
   a:"I think the biggest factor is recognition. If a manager notices good work, even a boring task feels meaningful. For example, a worker who checks the same parts every day works harder when the boss thanks him in front of the team. Another thing that helps is variety. If people rotate between different jobs, they get less bored and learn new skills. Overall, I’d say recognition and job rotation give people a sense of purpose."},
  {q:"What can one person do about global problems like poverty?",type:"Hai việc (two things)",
   out:"Việc 1: quyên góp hoặc làm tình nguyện. Việc 2: chọn hàng công bằng, ủng hộ doanh nghiệp tử tế, lên tiếng.",
   words:"donate, volunteer, raise awareness, fair trade, make a difference, small steps, poverty",
   a:"There are two things one person can do. First, we can donate money or time. Even a small amount helps, and volunteering at a local charity shows us how poverty really feels. Second, we can make careful choices as consumers. For instance, buying fair trade coffee guarantees a better price for farmers. One person cannot solve poverty alone, but if many people take small steps, a whole community can change."},

  {q:"Does using slang make speakers sound friendly and professional?",type:"Ý kiến (opinion)",

  {q:"Why do some innovations take years to become popular?",type:"Hai lý do (two reasons)",

  {q:"Can advertisers deceive customers without actually lying?",type:"Ý kiến, ví dụ (opinion)",
   out:"Trả lời có. Hai ví dụ: hình ảnh quảng cáo đẹp hơn thực tế, chữ nhỏ hoặc nói một nửa sự thật. Gắn với bài học đánh lừa thị giác (visual tricks).",

 p2:[
  {q:"What is important when a community decides whether to build a new power plant nearby?",type:"Điều quan trọng (what is important)",
   out:"Mở: có 3 yếu tố chính. Thân: an toàn và môi trường, lợi ích cho người dân, tác động lâu dài. Kết: cần cân bằng.",
   words:"safety, environment, benefits, local residents, long-term effect, pollution, jobs",
   a:"I’d like to talk about what is important when a community decides whether to build a new power plant nearby. In my view, there are three key points. The first point is safety and the environment. People must be sure that the plant will not pollute the air or the water, and that there is a clear plan for accidents. For example, a coal plant can cause breathing problems for children who live nearby, and polluted water can destroy farmland. If the community cannot trust the safety plan, the project should not go ahead. The second point is the benefit for local people. A new plant can create jobs, bring investment and support small businesses around it. The community should also ask whether residents get cheaper electricity or better roads in return. If only a big company takes the profit, local people will feel it is unfair. The third point is the long-term effect. We should think about what will happen in twenty or thirty years. Who will pay for cleaning the area when the plant is old? Can it switch to cleaner energy, such as solar or wind? Also, the community should have a real voice, for example through public meetings. To sum up, safety, local benefits and the long-term future are the three things a community must balance. That’s why I believe the decision should never be made in a hurry."},
  {q:"Describe an occasion when something you saw turned out to be very different from what it really was.",type:"Một dịp, một câu chuyện (an occasion)",
   out:"Mở: bối cảnh. Thân: lúc đầu thấy gì, thực tế thế nào, mình học được gì. Kết: đừng đánh giá qua vẻ ngoài.",
   words:"appearance, first impression, turned out, misleading, judge, realize, lesson",
   a:"I’d like to talk about a time when a first impression was completely wrong. It happened about four years ago, when I was looking for a place to have dinner with my family after a long week. First, let me describe the situation. We walked past a new restaurant with bright lights, a modern sign and a very beautiful entrance. I was sure the food would be excellent, so we decided to go in. However, as soon as we sat down, things changed. The service was slow, the food was cold, and the prices were much higher than I expected. My children were hungry and tired, and I felt disappointed and a little embarrassed because it was my choice. Later that month, my friend, who knows the area well, took me to a small, old shop near my house. It looked simple, and honestly a bit dirty from the outside. But the owner was friendly, the food was fresh, and the price was reasonable. We went back many times. If I had checked the reviews first, I would have saved a lot of money. That experience taught me an important lesson. Appearances can be misleading, so I should not judge a place, or a person, only by the outside. I use the same idea in my work. When I choose a new supplier, I don’t only look at a beautiful brochure; I check samples and ask other customers. To sum up, the best way is to look deeper before deciding. That’s why I always say: don’t judge a book by its cover."},
  {q:"Why do some people fight hard to separate work time from leisure time?",type:"Tại sao (why)",
   out:"Mở: nêu hai hoặc ba lý do. Thân: sức khỏe tinh thần và burnout, thời gian cho gia đình, công nghệ làm mờ ranh giới. Kết: cần ranh giới rõ ràng.",
   words:"work-life balance, boundary, burnout, leisure, remote work, productive, mental health",
   a:"I’d like to talk about why some people fight hard to separate work time from leisure time. In my view, there are three key reasons. The first reason is mental health. If people work all day and all night, they feel stressed and can reach burnout. Rest time lets the brain recover, so they are more productive and more creative later. For example, a colleague of mine, who works in sales, used to answer messages until midnight, and she became sick and tired. Now she switches off her work phone at six every day, and she feels much better. The second reason is family and personal life. Many people want to spend their evenings with their children or friends, and they don’t want work calls to interrupt them. This is very true for me, because I run a family business and also look after my children. If I don’t set a boundary, work can fill every hour of the day. The third reason is technology. Smartphones, email and working from home make the line between work and leisure very weak, so people must try harder to keep it. Because of that, some people even turn off notifications after a certain time. Small habits help too, like having dinner without any screens. To sum up, a clear boundary protects our health, our family time and our focus. That’s why I believe it also improves our work in the long run."},
  {q:"Which are better at producing new ideas: big companies or small startups?",type:"So sánh (comparison)",
   out:"Mở: nêu quan điểm. Thân: ưu điểm startup (linh hoạt, dám mạo hiểm), ưu điểm công ty lớn (vốn, nhân lực), rồi chọn bên mạnh hơn. Kết: kết luận.",
   words:"startup, flexible, resources, risk, bureaucracy, funding, innovative",
   a:"I’d like to talk about which are better at producing new ideas: big companies or small start-ups. In my view, there are three key points, and my answer is that start-ups are usually better, although big companies have their own strengths. First, start-ups are flexible. They have few levels of management, so a good idea can become a product quickly, without long meetings or many signatures. They also dare to take risks, because if the idea fails, they lose very little. Second, big companies have resources. They have money, equipment and experts, which are very important for developing and testing new ideas. For instance, a large technology company can spend millions on research, and a start-up often cannot. Third, big companies are often slow and afraid of failure. Many great ideas are rejected because they look too risky or too different from the current business. Compared with big companies, start-ups are more creative, but they often need support to grow. In my own small business, I notice the same thing: when I have a new idea for a product, I can try it the next day, while a large factory needs months of approval. Some big companies now create small teams that work like start-ups, which shows that they also want to be flexible. To sum up, start-ups create the ideas and big companies help them grow. That’s why I believe the best results come when the two work together."},
  {q:"How can people train themselves to notice details that others miss?",type:"Cách làm (how to / procedure)",
   out:"Mở: có 3 cách. Thân: chậm lại và quan sát, luyện bằng trò chơi (puzzle) và ghi chú, học từ chuyên gia. Kết: luyện đều sẽ thành thói quen.",
   words:"observe, slow down, puzzle, take notes, take photos, concentrate, experts",
   a:"I’d like to talk about how people can train themselves to notice details that others miss. In my view, there are three key ways. The first way is to slow down. We often look at things quickly and miss important points, so we should stop for a moment and observe carefully. For example, before I sign a contract, I read it line by line instead of only looking at the price. Many serious problems are hidden in small sentences. The second way is to practice with games and simple tools. Puzzles and spot-the-difference games improve our concentration, and taking notes or photos helps us remember what we see and compare it later. In my work, I take photos of a delivery when it arrives, so if there is a problem I have clear evidence. The third way is to learn from experts. A good teacher or an experienced professional, who knows the common mistakes, can show us what to look for, and we can copy their method. For instance, a good accountant checks small numbers that other people ignore, and that is why she finds mistakes before they become expensive. With regular practice, noticing details slowly becomes a habit. Even five minutes of careful checking at the end of the day can show us mistakes we missed earlier. To sum up, slowing down, practicing and learning from experts are three practical steps. That’s why I believe anyone can improve if they practice every day."}
 ]

   a:"Một người có thể làm hai việc. Trước hết, chúng ta có thể quyên góp tiền hoặc thời gian. Dù chỉ một khoản nhỏ cũng giúp ích, và đi tình nguyện ở một tổ chức từ thiện địa phương cho ta thấy đói nghèo thật sự là thế nào. Thứ hai, chúng ta có thể lựa chọn cẩn thận khi là người tiêu dùng. Ví dụ, mua cà phê thương mại công bằng bảo đảm nông dân có giá tốt hơn. Một người không thể tự giải quyết đói nghèo, nhưng nếu nhiều người cùng làm những bước nhỏ, cả một cộng đồng có thể thay đổi."},
  {q:"Chính phủ có nên trả tiền cho người dân để họ dùng ít điện hơn không?",
   a:"Tôi tin chính phủ nên làm vậy, nhưng chỉ ở mức hạn chế. Một lý do là con người phản ứng rất nhanh với tiền. Nếu được giảm tiền điện, họ sẽ tắt những bóng đèn không dùng. Một lý do khác là dùng ít điện hơn bảo vệ môi trường, điều có lợi cho tất cả mọi người. Mặt khác, chính sách này tốn nhiều tiền, nên chính phủ cần một ngân sách rõ ràng. Nhìn chung, tôi cho rằng một khoản thưởng nhỏ là động lực hiệu quả."},
  {q:"Điện mặt trời đáng tin cậy đến mức nào đối với một nước như Việt Nam?",
   a:"Tôi cho rằng điện mặt trời khá đáng tin cậy, nhưng chưa hoàn toàn. Một lý do là Việt Nam gần đường xích đạo, nên nhiều tháng có nắng mạnh, nhất là ở miền Nam. Tuy nhiên, chúng ta không thể trông cậy vào ánh nắng quanh năm. Vào mùa mưa, và dĩ nhiên cả ban đêm, sản lượng giảm. Vì vậy đất nước cần pin lưu trữ hoặc các nguồn năng lượng khác có thể làm dự phòng. Về lâu dài, điện mặt trời là một lựa chọn tốt nếu kết hợp với lưu trữ."},
  {q:"Dùng tiếng lóng có làm người nói nghe thân thiện và chuyên nghiệp không?",
   a:"Thật lòng mà nói, còn tùy. Tiếng lóng có thể khiến người nói nghe thân thiện và thoải mái. Ví dụ, khi tôi nói chuyện với bạn bè hoặc khách hàng trẻ, những người cũng hay dùng tiếng lóng, nó giúp chúng tôi gần nhau nhanh hơn. Tuy nhiên, tôi không nghĩ nó nghe chuyên nghiệp. Trong một cuộc họp hay buổi thuyết trình, mọi người mong đợi ngôn ngữ rõ ràng và lịch sự. Nếu tôi dùng quá nhiều tiếng lóng ở nơi làm việc, người ta có thể nghi ngờ tôi. Nên tôi sẽ nói: thân thiện thì có, còn chuyên nghiệp thì chưa hẳn. Lựa chọn tốt nhất là biết rõ người nghe của mình."},
  {q:"Vì sao một số phát minh phải mất nhiều năm mới được ưa chuộng?",
   a:"Có hai lý do chính. Lý do thứ nhất là chi phí và sự tiện dụng. Sản phẩm mới lúc đầu thường đắt hoặc khó dùng, nên chỉ một ít người dùng sớm, những người thích thử cái mới, mua chúng. Lý do thứ hai là thói quen. Con người tin vào những gì họ đã quen, và đổi một thói quen cần thời gian. Ví dụ, xe điện tốt hơn cho môi trường, nhưng nhiều người vẫn lo về trạm sạc và giá cả. Nếu giá giảm và trạm sạc xuất hiện nhiều hơn, sẽ có nhiều người chấp nhận hơn."},
  {q:"Nhà quảng cáo có thể đánh lừa khách hàng mà không thực sự nói dối không?",
   a:"Vâng, tôi nghĩ họ có thể. Một cách là mẹo hình ảnh. Một tấm ảnh món ăn có thể trông rất ngon nhờ ánh sáng đặc biệt, nhưng bữa ăn thật nhỏ hơn nhiều. Không ai nói dối, nhưng khách hàng, người mong đợi đúng bữa ăn đó, vẫn cảm thấy bị đánh lừa. Một cách khác là sự thật một nửa. Ví dụ, quảng cáo nói một loại đồ uống không thêm đường, nhưng không nói rằng nó đã chứa nhiều đường tự nhiên. Từng chữ đều đúng, nhưng thông điệp thì gây hiểu lầm. Nếu khách hàng đọc phần chữ nhỏ, họ có thể tránh được nhiều cái bẫy."},
  {q:"Thương mại công bằng có đáng với mức giá cao hơn đối với người tiêu dùng bình thường không?",
   a:"Tôi nghĩ là đáng, miễn là mọi người đủ khả năng chi trả. Một lý do là thương mại công bằng bảo đảm nông dân có mức giá tối thiểu, nên họ có thể cho con đi học. Một lý do khác là nó khiến ta trở thành công dân toàn cầu. Nếu trả thêm một chút, chúng ta cùng chia sẻ trách nhiệm với những người sống ở nơi xa. Mặt khác, với những gia đình thu nhập thấp, giá cao hơn có thể là gánh nặng. Vì vậy còn tùy ngân sách của từng người. Nhìn chung, tôi sẽ chọn mỗi tuần một sản phẩm thương mại công bằng."}
 ],
 p2:[
  {q:"Điều gì quan trọng khi một cộng đồng quyết định có xây nhà máy điện mới gần đó hay không?",
   a:"Tôi muốn nói về điều quan trọng khi một cộng đồng quyết định có xây nhà máy điện mới gần nơi mình sống hay không. Theo tôi, có ba điểm chính. Điểm thứ nhất là an toàn và môi trường. Người dân phải chắc chắn rằng nhà máy sẽ không làm ô nhiễm không khí hay nguồn nước, và có kế hoạch rõ ràng cho sự cố. Ví dụ, một nhà máy nhiệt điện than có thể gây bệnh về hô hấp cho trẻ em sống gần đó, và nguồn nước bị ô nhiễm có thể hủy hoại đất canh tác. Nếu cộng đồng không tin vào kế hoạch an toàn, dự án không nên tiến hành. Điểm thứ hai là lợi ích cho người dân địa phương. Một nhà máy mới có thể tạo việc làm, thu hút đầu tư và hỗ trợ các cơ sở kinh doanh nhỏ xung quanh. Cộng đồng cũng nên hỏi xem người dân có được điện rẻ hơn hay đường xá tốt hơn để đổi lại không. Nếu chỉ một công ty lớn hưởng lợi nhuận, người dân địa phương sẽ thấy điều đó không công bằng. Điểm thứ ba là tác động lâu dài. Chúng ta nên nghĩ xem hai ba chục năm sau sẽ ra sao. Ai sẽ trả tiền dọn dẹp khu vực khi nhà máy đã cũ? Nhà máy có thể chuyển sang năng lượng sạch hơn như mặt trời hoặc gió không? Ngoài ra, cộng đồng cần có tiếng nói thực sự, ví dụ qua các buổi họp lấy ý kiến dân. Tóm lại, an toàn, lợi ích địa phương và tương lai lâu dài là ba điều mà một cộng đồng phải cân bằng. Vì vậy tôi tin rằng quyết định này không bao giờ nên được đưa ra vội vàng."},
  {q:"Hãy kể về một dịp khi điều bạn thấy hóa ra rất khác với thực tế.",
   a:"Tôi muốn kể về một lần ấn tượng ban đầu hoàn toàn sai. Chuyện xảy ra khoảng bốn năm trước, khi tôi đang tìm một chỗ ăn tối cùng gia đình sau một tuần dài. Trước hết, để tôi tả lại tình huống. Chúng tôi đi ngang một nhà hàng mới với đèn sáng rực, biển hiệu hiện đại và lối vào rất đẹp. Tôi chắc chắn đồ ăn sẽ rất ngon, nên chúng tôi quyết định vào. Tuy nhiên, vừa ngồi xuống thì mọi chuyện đổi khác. Phục vụ chậm, đồ ăn nguội, và giá cao hơn nhiều so với tôi nghĩ. Các con tôi vừa đói vừa mệt, còn tôi thấy thất vọng và hơi ngượng vì đó là lựa chọn của mình. Cuối tháng đó, một người bạn, người rành khu vực này, dẫn tôi đến một quán nhỏ cũ gần nhà. Nhìn từ ngoài thì đơn sơ, nói thật là hơi bẩn. Nhưng chủ quán thân thiện, đồ ăn tươi, và giá hợp lý. Chúng tôi quay lại nhiều lần. Nếu tôi xem đánh giá trước, tôi đã tiết kiệm được rất nhiều tiền. Trải nghiệm đó cho tôi một bài học quan trọng. Vẻ bề ngoài có thể gây hiểu lầm, nên tôi không nên đánh giá một nơi, hay một con người, chỉ qua bên ngoài. Tôi áp dụng đúng ý này trong công việc. Khi chọn nhà cung cấp mới, tôi không chỉ nhìn vào tờ giới thiệu đẹp mà còn kiểm tra hàng mẫu và hỏi những khách hàng khác. Tóm lại, cách tốt nhất là nhìn sâu hơn trước khi quyết định. Vì vậy tôi luôn nói: đừng đánh giá quyển sách qua bìa của nó."},
  {q:"Vì sao một số người nỗ lực hết sức để tách thời gian làm việc khỏi thời gian thư giãn?",
   a:"Tôi muốn nói về lý do vì sao một số người cố gắng hết sức để tách giờ làm việc khỏi giờ nghỉ ngơi. Theo tôi, có ba lý do chính. Lý do thứ nhất là sức khỏe tinh thần. Nếu người ta làm cả ngày lẫn đêm, họ căng thẳng và có thể kiệt sức. Thời gian nghỉ giúp não hồi phục, nên sau đó họ làm việc hiệu quả và sáng tạo hơn. Ví dụ, một đồng nghiệp của tôi, người làm kinh doanh, từng trả lời tin nhắn đến nửa đêm và bị ốm, mệt mỏi. Giờ cô ấy tắt điện thoại công việc lúc sáu giờ mỗi ngày và thấy khỏe hơn nhiều. Lý do thứ hai là gia đình và đời sống riêng. Nhiều người muốn dành buổi tối cho con cái hoặc bạn bè, và không muốn cuộc gọi công việc làm gián đoạn. Điều này rất đúng với tôi, vì tôi vừa điều hành việc kinh doanh gia đình vừa chăm con. Nếu tôi không đặt ra ranh giới, công việc có thể chiếm hết mọi giờ trong ngày. Lý do thứ ba là công nghệ. Điện thoại thông minh, email và làm việc tại nhà khiến ranh giới giữa làm việc và nghỉ ngơi rất mờ, nên người ta phải cố hơn để giữ nó. Vì thế, một số người còn tắt thông báo sau một giờ nhất định. Những thói quen nhỏ cũng giúp ích, như ăn tối mà không có màn hình nào. Tóm lại, một ranh giới rõ ràng bảo vệ sức khỏe, thời gian bên gia đình và sự tập trung của chúng ta. Vì vậy tôi tin rằng về lâu dài nó cũng cải thiện công việc của chúng ta."},
  {q:"Công ty lớn hay startup nhỏ giỏi hơn trong việc tạo ra ý tưởng mới?",
   a:"Tôi muốn nói về việc bên nào giỏi tạo ra ý tưởng mới hơn: công ty lớn hay các công ty khởi nghiệp nhỏ. Theo tôi, có ba điểm chính, và câu trả lời của tôi là công ty khởi nghiệp thường giỏi hơn, dù công ty lớn cũng có thế mạnh riêng. Thứ nhất, công ty khởi nghiệp linh hoạt. Họ có ít tầng quản lý, nên một ý hay có thể thành sản phẩm nhanh chóng, không cần họp dài hay nhiều chữ ký. Họ cũng dám mạo hiểm, vì nếu ý tưởng thất bại, họ mất rất ít. Thứ hai, công ty lớn có nguồn lực. Họ có tiền, thiết bị và chuyên gia, những thứ rất quan trọng để phát triển và thử nghiệm ý tưởng mới. Ví dụ, một công ty công nghệ lớn có thể chi hàng triệu cho nghiên cứu, còn một công ty khởi nghiệp thường không thể. Thứ ba, công ty lớn thường chậm và sợ thất bại. Nhiều ý tưởng hay bị gạt bỏ vì trông quá rủi ro hoặc quá khác với hoạt động hiện tại. So với công ty lớn, công ty khởi nghiệp sáng tạo hơn, nhưng họ thường cần được hỗ trợ để lớn lên. Trong việc kinh doanh nhỏ của tôi, tôi cũng thấy như vậy: khi có ý tưởng sản phẩm mới, tôi có thể thử ngay hôm sau, còn một nhà máy lớn cần nhiều tháng để duyệt. Một số công ty lớn hiện nay lập các nhóm nhỏ làm việc như công ty khởi nghiệp, điều cho thấy họ cũng muốn linh hoạt. Tóm lại, công ty khởi nghiệp tạo ra ý tưởng và công ty lớn giúp ý tưởng lớn mạnh. Vì vậy tôi tin rằng kết quả tốt nhất đến khi hai bên làm việc cùng nhau."},
  {q:"Làm thế nào con người có thể tự rèn mình để nhận ra những chi tiết mà người khác bỏ sót?",
   a:"Tôi muốn nói về cách con người có thể rèn luyện để nhận ra những chi tiết mà người khác bỏ sót. Theo tôi, có ba cách chính. Cách thứ nhất là chậm lại. Chúng ta thường nhìn mọi thứ rất nhanh và bỏ lỡ những điểm quan trọng, nên cần dừng lại một chút và quan sát cẩn thận. Ví dụ, trước khi ký hợp đồng, tôi đọc từng dòng thay vì chỉ nhìn vào giá. Nhiều vấn đề nghiêm trọng nằm ẩn trong những câu nhỏ. Cách thứ hai là luyện tập bằng trò chơi và những công cụ đơn giản. Câu đố và trò tìm điểm khác biệt giúp tăng sự tập trung, còn ghi chú hoặc chụp ảnh giúp ta nhớ những gì đã thấy và so sánh sau này. Trong công việc, tôi chụp ảnh lô hàng khi hàng đến, nên nếu có vấn đề thì tôi có bằng chứng rõ ràng. Cách thứ ba là học từ người giỏi. Một giáo viên tốt hay một người có kinh nghiệm, người biết những lỗi thường gặp, có thể chỉ cho ta cần nhìn vào đâu, và ta có thể làm theo phương pháp của họ. Ví dụ, một kế toán giỏi soát những con số nhỏ mà người khác bỏ qua, và đó là lý do cô ấy tìm ra sai sót trước khi chúng trở nên tốn kém. Luyện tập đều đặn, việc nhận ra chi tiết dần trở thành thói quen. Chỉ cần năm phút kiểm tra kỹ vào cuối ngày cũng có thể giúp ta thấy những lỗi đã bỏ sót trước đó. Tóm lại, chậm lại, luyện tập và học từ người giỏi là ba bước thiết thực. Vì vậy tôi tin ai cũng có thể tiến bộ nếu luyện tập mỗi ngày."}
 ]
};

const ALT={
 p1:[
  [{a:"In my view, the most effective thing is a fair reward system. If employees know that steady effort leads to a bonus or a promotion, they have a clear goal to work toward. For example, in my cousin’s factory, workers who reach their monthly target receive extra pay, and almost everyone tries to meet it. Another helpful factor is a friendly team. When colleagues joke and help each other, even a repetitive shift feels shorter. On the other hand, a bonus without respect can feel empty. Overall, I’d say a fair reward and a good team spirit keep people motivated.",
    v:"Theo tôi, điều hiệu quả nhất là một hệ thống thưởng công bằng. Nếu nhân viên biết rằng cố gắng đều đặn sẽ được thưởng hoặc thăng chức, họ có mục tiêu rõ ràng để hướng tới. Ví dụ, ở xưởng của anh họ tôi, công nhân đạt chỉ tiêu tháng được trả thêm tiền, và hầu như ai cũng cố đạt. Một yếu tố khác là một tập thể thân thiện. Khi đồng nghiệp đùa vui và giúp nhau, một ca làm lặp đi lặp lại cũng thấy ngắn hơn. Mặt khác, tiền thưởng mà thiếu sự tôn trọng thì có thể thấy trống rỗng. Nhìn chung, tôi cho rằng phần thưởng công bằng và tinh thần tập thể tốt giúp mọi người giữ được động lực."},
   {a:"I’d like to mention two things: learning and flexibility. First, if people can learn new skills while doing a repetitive job, they feel they are growing instead of standing still. For instance, a cashier who is trained to manage the shop will pay more attention to every detail. Second, flexible schedules help. Parents, for example, work better when they can pick up their children on time. Admittedly, not every company can offer this. But to conclude, a chance to grow and some flexibility give routine work a purpose and reduce burnout.",
    v:"Tôi muốn nói hai điều: học hỏi và sự linh hoạt. Thứ nhất, nếu người ta học được kỹ năng mới trong lúc làm một việc lặp lại, họ cảm thấy mình đang tiến lên chứ không đứng yên. Ví dụ, một thu ngân được đào tạo để quản lý cửa hàng sẽ chú ý đến từng chi tiết hơn. Thứ hai, giờ giấc linh hoạt cũng giúp ích. Chẳng hạn, các bậc cha mẹ làm việc tốt hơn khi được đón con đúng giờ. Phải thừa nhận rằng không phải công ty nào cũng làm được. Nhưng tóm lại, cơ hội phát triển và một chút linh hoạt cho công việc thường ngày một mục đích và giảm kiệt sức."}],
  [{a:"One person can start with their own daily habits. For example, I can reduce waste, save water and avoid buying things I don’t need, and the money I save can go to people in need. Another way is to use my own skills. If I’m an accountant, I can help a small charity manage its books for free, which lets more money reach families. Of course, one person cannot end poverty. However, small and steady actions inspire others to join. Overall, I believe change starts with ordinary people who are willing to act.",
    v:"Một người có thể bắt đầu từ thói quen hằng ngày của mình. Ví dụ, tôi có thể giảm rác thải, tiết kiệm nước và không mua những thứ không cần, rồi dùng số tiền tiết kiệm giúp người khó khăn. Một cách khác là dùng chính kỹ năng của mình. Nếu tôi là kế toán, tôi có thể giúp một tổ chức từ thiện nhỏ làm sổ sách miễn phí, để nhiều tiền hơn đến tay các gia đình. Tất nhiên, một người không thể chấm dứt đói nghèo. Tuy nhiên, những việc nhỏ và đều đặn truyền cảm hứng cho người khác cùng tham gia. Nhìn chung, tôi tin thay đổi bắt đầu từ những người bình thường sẵn sàng hành động."},
   {a:"I think education is the key, so one person can help by teaching or sponsoring a child’s studies. Poverty often continues because children cannot go to school. For instance, many people in my town pay school fees for a poor student, and that child can later support the whole family. We can also speak up and vote for leaders who care about fairness. On the other hand, charity alone is not enough, so we must also support fair jobs and fair prices. In the long run, educated people can solve problems by themselves.",
    v:"Tôi nghĩ giáo dục là chìa khóa, nên một người có thể giúp bằng cách dạy học hoặc đỡ đầu việc học của một em nhỏ. Nghèo đói thường kéo dài vì trẻ em không được đến trường. Ví dụ, nhiều người ở thị trấn tôi đóng học phí cho một học sinh nghèo, và em đó sau này có thể nuôi cả gia đình. Chúng ta cũng có thể lên tiếng và bầu cho những người lãnh đạo quan tâm đến sự công bằng. Mặt khác, chỉ làm từ thiện thì chưa đủ, nên ta cũng cần ủng hộ việc làm công bằng và giá cả công bằng. Về lâu dài, những người được học hành sẽ tự giải quyết được vấn đề."}],
  [{a:"I don’t fully agree, because paying people may be too expensive. A better idea is to charge higher prices for heavy users and give cheaper rates to families who save electricity. For example, a household that uses less than a certain amount could pay a lower price per unit. This rewards good habits without a big budget. Another reason is fairness: people who already save energy should not be forgotten. However, the government should still run campaigns to teach people simple ways to save electricity. Overall, I’d say a smart price system works better than direct payments.",
    v:"Tôi không hoàn toàn đồng ý, vì trả tiền cho người dân có thể quá tốn kém. Một ý hay hơn là tính giá cao cho người dùng nhiều và giá rẻ hơn cho các gia đình tiết kiệm điện. Ví dụ, hộ dùng dưới một mức nhất định có thể trả giá mỗi số điện thấp hơn. Cách này thưởng cho thói quen tốt mà không cần ngân sách lớn. Một lý do khác là sự công bằng: những người vốn đã tiết kiệm điện không nên bị bỏ quên. Tuy nhiên, chính phủ vẫn nên làm các chiến dịch dạy người dân những cách tiết kiệm điện đơn giản. Nhìn chung, tôi cho rằng một hệ thống giá thông minh hiệu quả hơn việc trả tiền trực tiếp."},
   {a:"Yes, in my opinion the government should, mainly for businesses. Factories and large buildings use a huge amount of power, so a small payment can encourage them to buy modern machines. For example, a company that changes to LED lights can cut its bill by half, and the government can support the cost of the change. Another reason is that using less electricity avoids blackouts in summer. On the other hand, the rewards must be checked carefully so that nobody cheats. To conclude, support for big users brings the biggest effect.",
    v:"Có, theo tôi chính phủ nên làm, chủ yếu với các doanh nghiệp. Nhà máy và tòa nhà lớn dùng một lượng điện rất nhiều, nên một khoản hỗ trợ nhỏ có thể khuyến khích họ mua máy móc hiện đại. Ví dụ, một công ty đổi sang đèn LED có thể cắt giảm một nửa hóa đơn, và chính phủ có thể hỗ trợ chi phí thay đổi đó. Một lý do khác là dùng ít điện hơn giúp tránh cúp điện vào mùa hè. Mặt khác, các khoản thưởng phải được kiểm tra kỹ để không ai gian lận. Tóm lại, hỗ trợ cho những người dùng lớn mang lại hiệu quả lớn nhất."}],
  [{a:"I’d say it is reliable in many places but needs good planning. First, solar technology is now cheaper and stronger, so panels can last twenty years or more. For example, many farms in the south use solar pumps to water crops without fuel. Second, solar power is most productive at noon, exactly when factories and air conditioners need the most electricity. However, clouds, storms and dust can reduce production, so the country must keep other power sources for bad days. Overall, solar power is a strong partner, not a complete solution.",
    v:"Tôi cho rằng điện mặt trời đáng tin cậy ở nhiều nơi nhưng cần lên kế hoạch tốt. Thứ nhất, công nghệ điện mặt trời giờ rẻ hơn và bền hơn, nên các tấm pin có thể dùng hai mươi năm hoặc hơn. Ví dụ, nhiều trang trại ở miền Nam dùng máy bơm năng lượng mặt trời để tưới cây mà không cần nhiên liệu. Thứ hai, điện mặt trời hiệu quả nhất vào buổi trưa, đúng lúc nhà máy và máy lạnh cần nhiều điện nhất. Tuy nhiên, mây, bão và bụi có thể làm giảm sản lượng, nên đất nước phải giữ các nguồn điện khác cho những ngày xấu. Nhìn chung, điện mặt trời là một người bạn đồng hành mạnh, chứ không phải giải pháp trọn vẹn."},
   {a:"To be honest, it depends on how we use it. If a family installs panels on the roof and connects to the grid, the system is quite reliable, because they can use the grid at night. For instance, my neighbour’s bill dropped by almost half after he installed panels. On the other hand, a system without batteries stops working when it rains for several days. Also, panels need regular cleaning and repair. In the long run, solar power is reliable if people maintain it and combine it with other sources.",
    v:"Nói thật thì còn tùy cách mình dùng. Nếu một gia đình lắp pin trên mái nhà và nối vào lưới điện, hệ thống khá đáng tin cậy, vì ban đêm họ có thể dùng điện lưới. Ví dụ, hóa đơn của hàng xóm tôi giảm gần một nửa sau khi lắp pin. Mặt khác, hệ thống không có ắc quy sẽ ngừng hoạt động khi mưa nhiều ngày liền. Ngoài ra, tấm pin cần được lau chùi và sửa chữa thường xuyên. Về lâu dài, điện mặt trời đáng tin cậy nếu người dùng bảo dưỡng và kết hợp với các nguồn khác."}],
  [{a:"In my opinion, slang makes people sound friendly, but it is risky at work. For example, young people use slang with friends to show they belong to the same group, and that creates warmth. However, in a job interview or a report, slang may suggest that the speaker is careless. Another problem is that older customers or foreigners may not understand it. So I think we should keep slang for casual situations. Overall, clear and polite language is safer when we want to look professional.",
    v:"Theo tôi, tiếng lóng làm người nói nghe thân thiện, nhưng có rủi ro ở chỗ làm. Ví dụ, người trẻ dùng tiếng lóng với bạn bè để cho thấy họ cùng một nhóm, và điều đó tạo sự ấm áp. Tuy nhiên, trong buổi phỏng vấn xin việc hoặc một bản báo cáo, tiếng lóng có thể khiến người ta nghĩ người nói cẩu thả. Một vấn đề khác là khách hàng lớn tuổi hoặc người nước ngoài có thể không hiểu. Vì vậy tôi nghĩ nên để tiếng lóng cho những lúc thoải mái. Nhìn chung, ngôn ngữ rõ ràng và lịch sự an toàn hơn khi ta muốn trông chuyên nghiệp."},
   {a:"I’d say it depends on the situation and the audience. When I talk to my younger cousins, a little slang helps me sound relaxed and close to them. But when I speak to a client about money or contracts, I choose careful words, because trust is very important. Some modern companies even allow a casual style, so a few friendly expressions can be fine there. On the other hand, too much slang can cause misunderstanding. To conclude, a friendly tone can be professional, but only if the language stays clear and respectful.",
    v:"Tôi cho rằng còn tùy tình huống và người nghe. Khi nói chuyện với các em họ nhỏ tuổi, một chút tiếng lóng giúp tôi nghe thoải mái và gần gũi. Nhưng khi nói với khách hàng về tiền bạc hay hợp đồng, tôi chọn từ ngữ cẩn thận, vì sự tin tưởng rất quan trọng. Một số công ty hiện đại còn cho phép phong cách thoải mái, nên vài câu thân mật ở đó cũng ổn. Mặt khác, dùng quá nhiều tiếng lóng có thể gây hiểu lầm. Tóm lại, giọng điệu thân thiện vẫn có thể chuyên nghiệp, nhưng chỉ khi ngôn ngữ vẫn rõ ràng và tôn trọng."}],
  [{a:"There are two main reasons. First, many innovations need new rules and new skills. For example, online banking was invented years ago, but people had to learn how to use it and the government had to make rules to protect their money. Second, people are afraid of risk. When a product is new, nobody is sure that it is safe or that it will last, so they wait for others to try it first. Over time, good reviews and clear examples make people feel safe. Overall, trust and learning take time, and that’s why change is slow.",
    v:"Có hai lý do chính. Thứ nhất, nhiều phát minh cần quy định mới và kỹ năng mới. Ví dụ, ngân hàng trực tuyến được phát minh từ nhiều năm trước, nhưng người dân phải học cách dùng và chính phủ phải đặt ra quy định để bảo vệ tiền của họ. Thứ hai, con người sợ rủi ro. Khi một sản phẩm còn mới, không ai chắc nó an toàn hay bền, nên họ chờ người khác dùng thử trước. Theo thời gian, đánh giá tốt và các ví dụ rõ ràng khiến mọi người thấy yên tâm. Nhìn chung, niềm tin và việc học cần thời gian, và đó là lý do thay đổi diễn ra chậm."},
   {a:"I think the biggest reasons are price and marketing. A new invention is usually expensive because few units are made, so ordinary families cannot buy it. Also, if people don’t hear about it or don’t see its benefits, they won’t try it. For instance, solar water heaters took many years to become common in Vietnam, because early models were costly and few people knew how well they worked. As the price falls and neighbours share their experience, more people join. In the long run, a useful and affordable idea always spreads.",
    v:"Tôi nghĩ lý do lớn nhất là giá cả và quảng bá. Một phát minh mới thường đắt vì được làm ra ít, nên các gia đình bình thường không mua nổi. Ngoài ra, nếu người ta không nghe nói đến hoặc không thấy lợi ích, họ sẽ không dùng thử. Ví dụ, máy nước nóng năng lượng mặt trời mất nhiều năm mới phổ biến ở Việt Nam, vì các mẫu đầu tiên đắt và ít người biết nó hoạt động tốt thế nào. Khi giá giảm và hàng xóm chia sẻ trải nghiệm, nhiều người tham gia hơn. Về lâu dài, một ý tưởng hữu ích và giá phải chăng luôn lan rộng."}],
  [{a:"Yes, definitely. One common trick is to use special words. A label that says “natural” or “made with real fruit” sounds healthy, but the product may contain only a tiny amount of fruit. Nothing is false, yet customers imagine something different. Another trick is comparison. An advertisement says “up to 50 percent off” but only one item has that discount. For example, I once bought a “big sale” item and found that the normal price was already raised. So customers should check details and compare prices. Overall, careful shoppers are the best protection.",
    v:"Có, chắc chắn rồi. Một mẹo phổ biến là dùng những từ ngữ đặc biệt. Nhãn ghi “tự nhiên” hoặc “làm từ trái cây thật” nghe có vẻ lành mạnh, nhưng sản phẩm có thể chỉ chứa một lượng trái cây rất nhỏ. Không có gì sai, vậy mà khách hàng lại hình dung một điều khác. Một mẹo khác là so sánh. Quảng cáo ghi “giảm đến 50 phần trăm” nhưng chỉ một món có mức giảm đó. Ví dụ, tôi từng mua một món “đại hạ giá” rồi phát hiện giá thường đã bị tăng lên trước đó. Vì vậy khách hàng nên kiểm tra chi tiết và so sánh giá. Nhìn chung, người mua thận trọng là sự bảo vệ tốt nhất."},
   {a:"I believe they can, mostly by choosing what to show. For example, an advertisement for a phone shows only the best photos taken in perfect light and says nothing about the weak battery. Every sentence is true, but the picture is incomplete. Another way is to use famous people. When a celebrity says they love a cream, customers trust it, even if the celebrity is paid. On the other hand, some countries have rules that punish misleading ads. In the long run, I’d say honest brands win more loyal customers.",
    v:"Tôi tin là họ làm được, chủ yếu bằng cách chọn cái để cho xem. Ví dụ, quảng cáo điện thoại chỉ cho thấy những bức ảnh đẹp nhất chụp trong ánh sáng hoàn hảo và không nói gì về pin yếu. Câu nào cũng đúng, nhưng bức tranh không đầy đủ. Một cách khác là dùng người nổi tiếng. Khi một người nổi tiếng nói họ thích một loại kem, khách hàng tin, dù người đó được trả tiền. Mặt khác, một số nước có quy định phạt quảng cáo gây hiểu lầm. Về lâu dài, tôi cho rằng các thương hiệu trung thực sẽ có được nhiều khách hàng trung thành hơn."}],
  [{a:"In my opinion, it’s worth paying more for fair trade, if the product is good. One reason is that the extra money often goes to farmers’ communities, for example for clean water or a school. Another reason is that fair trade products usually have better quality, because farmers can afford to take better care of their crops. However, I understand that some families have a tight budget. In that case, they can choose just one or two products, such as coffee or chocolate. Overall, a small extra cost is a way to support fairness.",
    v:"Theo tôi, trả thêm tiền cho hàng thương mại công bằng là đáng, nếu sản phẩm tốt. Một lý do là số tiền thêm thường đến với cộng đồng nông dân, chẳng hạn để có nước sạch hoặc xây trường. Một lý do khác là sản phẩm thương mại công bằng thường chất lượng hơn, vì nông dân có điều kiện chăm sóc cây trồng tốt hơn. Tuy nhiên, tôi hiểu một số gia đình có ngân sách eo hẹp. Khi đó, họ có thể chỉ chọn một hai sản phẩm, như cà phê hay sô cô la. Nhìn chung, một khoản chi thêm nhỏ là cách để ủng hộ sự công bằng."},
   {a:"It depends on who is buying. For a family with a stable income, paying a bit more for fair trade coffee is a reasonable choice, because they help farmers live with dignity. For example, a farmer who earns a fair price can invest in better tools and stop depending on middlemen. On the other hand, for a student or a worker with a low salary, every dollar counts, so the higher price might be too heavy. Still, I believe the label should be clearer so buyers can trust it. Overall, fair trade is worth it when people can afford it.",
    v:"Còn tùy người mua là ai. Với một gia đình có thu nhập ổn định, trả thêm một chút cho cà phê thương mại công bằng là lựa chọn hợp lý, vì họ giúp nông dân sống có phẩm giá. Ví dụ, một nông dân nhận được giá công bằng có thể đầu tư công cụ tốt hơn và không còn phụ thuộc vào người trung gian. Mặt khác, với một sinh viên hay người lương thấp, đồng nào cũng quan trọng, nên mức giá cao hơn có thể quá nặng. Dù vậy, tôi tin nhãn mác nên rõ ràng hơn để người mua có thể tin tưởng. Nhìn chung, thương mại công bằng đáng giá khi người ta đủ khả năng chi trả."}]
 ],
 p2:[
  [{a:"Let me talk about three things a community should think about. First, the opinion of local residents. Before building anything, the authorities must listen to the people who will live next to the plant, explain the risks clearly and answer their questions. For example, a village that was informed early accepted a solar farm, while another village protested against a surprise coal plant. Second, the type of energy. A gas or coal plant produces pollution, while solar and wind are cleaner, although they need more land. Third, the cost and the benefit. The community should ask who pays, how many jobs are created and whether electricity bills will drop. In conclusion, a good decision needs honest information, a clean choice and a fair share of benefits.",
    v:"Tôi xin nói về ba điều mà một cộng đồng nên suy nghĩ. Thứ nhất, ý kiến của người dân địa phương. Trước khi xây bất cứ thứ gì, chính quyền phải lắng nghe những người sẽ sống cạnh nhà máy, giải thích rõ các rủi ro và trả lời câu hỏi của họ. Ví dụ, một ngôi làng được báo trước đã chấp nhận một trang trại điện mặt trời, trong khi một làng khác phản đối một nhà máy nhiệt điện than xuất hiện bất ngờ. Thứ hai, loại năng lượng. Nhà máy khí hoặc than gây ô nhiễm, còn điện mặt trời và điện gió sạch hơn, dù cần nhiều đất hơn. Thứ ba, chi phí và lợi ích. Cộng đồng nên hỏi ai trả tiền, tạo được bao nhiêu việc làm và hóa đơn điện có giảm không. Tóm lại, một quyết định tốt cần thông tin trung thực, một lựa chọn sạch và phần lợi ích chia công bằng."},
   {a:"I’d like to explain this with a simple comparison: a plant is like a new neighbour, so we must check whether it is safe, helpful and responsible. The first point is responsibility. The company should promise to clean up, pay for damage and follow strict rules, for instance by installing filters. The second point is the effect on daily life: noise, traffic and the view. A plant near a school or a farm may cause serious problems. The third point is the alternative. Maybe the community can save energy, build smaller local plants, or buy power from another area. On the other hand, refusing every project may cause blackouts. To conclude, communities should compare all options carefully and choose the one that protects people and still provides power.",
    v:"Tôi xin giải thích bằng một so sánh đơn giản: nhà máy giống như một người hàng xóm mới, nên ta phải xem họ có an toàn, có ích và có trách nhiệm không. Điểm thứ nhất là trách nhiệm. Công ty nên cam kết dọn dẹp, bồi thường thiệt hại và tuân thủ quy định nghiêm ngặt, chẳng hạn lắp bộ lọc. Điểm thứ hai là ảnh hưởng đến đời sống hằng ngày: tiếng ồn, giao thông và cảnh quan. Một nhà máy gần trường học hay nông trại có thể gây vấn đề nghiêm trọng. Điểm thứ ba là phương án thay thế. Có thể cộng đồng tiết kiệm năng lượng, xây các nhà máy nhỏ tại chỗ, hoặc mua điện từ khu vực khác. Mặt khác, từ chối mọi dự án có thể dẫn đến cúp điện. Tóm lại, các cộng đồng nên so sánh kỹ mọi lựa chọn và chọn phương án bảo vệ con người mà vẫn có điện."}],
  [{a:"I’d like to tell you about a job offer that looked perfect but wasn’t. Two years ago, I saw an advertisement for a position with a very high salary and a beautiful office. I was excited and went to the interview immediately. At first, everyone was friendly and the manager promised many benefits. However, when I asked about the contract, he avoided my questions. Later I discovered, from former employees, that people there worked overtime without pay and many left after a few months. In the end, I refused the offer, and a week later I accepted a smaller company with a lower salary but a respectful boss. I learned that a good first impression is not enough, so I should always ask questions and check the facts. Since then, I read reviews before every decision.",
    v:"Tôi muốn kể về một lời mời làm việc trông hoàn hảo nhưng thực ra không phải. Hai năm trước, tôi thấy quảng cáo tuyển một vị trí lương rất cao và văn phòng đẹp. Tôi hào hứng và đi phỏng vấn ngay. Lúc đầu mọi người đều thân thiện và quản lý hứa nhiều quyền lợi. Tuy nhiên, khi tôi hỏi về hợp đồng, ông ấy né tránh câu hỏi. Sau đó tôi biết từ các nhân viên cũ rằng ở đó người ta làm thêm giờ không được trả tiền và nhiều người nghỉ sau vài tháng. Cuối cùng tôi từ chối, và một tuần sau tôi nhận lời một công ty nhỏ hơn, lương thấp hơn nhưng sếp tôn trọng nhân viên. Tôi học được rằng ấn tượng đầu tốt chưa đủ, nên luôn phải đặt câu hỏi và kiểm tra thông tin. Từ đó, tôi đọc đánh giá trước mỗi quyết định."},
   {a:"Let me share a story about a person. When I first met my neighbour, he looked serious and unfriendly. He never smiled and he walked quickly past us, so I thought he was proud and cold. One rainy night, however, my motorbike broke down in front of his house. He came out without a word, lent me tools, and stayed for an hour to help me. Afterward he invited me for tea, and I learned that he is just shy and had worked abroad for many years. I realized how wrong my first impression was. What I learned is to be patient and to give people a chance before I judge them. Now he is one of my closest friends, and we help each other often.",
    v:"Tôi xin kể một câu chuyện về một con người. Lần đầu gặp người hàng xóm, ông ấy trông nghiêm nghị và khó gần. Ông không bao giờ cười và đi nhanh qua chúng tôi, nên tôi nghĩ ông kiêu và lạnh lùng. Nhưng một đêm mưa, xe máy của tôi hỏng ngay trước nhà ông. Ông bước ra không nói một lời, cho tôi mượn đồ nghề và ở lại giúp tôi cả tiếng đồng hồ. Sau đó ông mời tôi uống trà, và tôi biết ông chỉ là người hay ngại và từng làm việc ở nước ngoài nhiều năm. Tôi nhận ra ấn tượng ban đầu của mình sai đến mức nào. Điều tôi học được là phải kiên nhẫn và cho người ta cơ hội trước khi phán xét. Giờ ông là một trong những người bạn thân nhất của tôi, và chúng tôi thường giúp nhau."}],
  [{a:"There are two or three reasons why people try to protect their free time. The first is health. Long working hours cause tired eyes, back pain and poor sleep, so resting properly is a medical need. For example, some doctors say that people who answer emails at midnight have more stress. The second reason is relationships. If parents are always on the phone for work, their children feel ignored, and couples have less time to talk. The third reason is creativity. When we rest, we do hobbies like cooking, sports or reading, and new ideas often come when we are relaxed. On the other hand, in some jobs it is hard to disconnect completely. Still, in conclusion, a clear line between work and leisure is good for the body, for the family and for the quality of work.",
    v:"Có hai hoặc ba lý do khiến người ta cố bảo vệ thời gian rảnh. Lý do thứ nhất là sức khỏe. Làm việc nhiều giờ gây mỏi mắt, đau lưng và ngủ kém, nên nghỉ ngơi đúng cách là nhu cầu y tế. Ví dụ, một số bác sĩ nói người trả lời email lúc nửa đêm bị căng thẳng nhiều hơn. Lý do thứ hai là các mối quan hệ. Nếu cha mẹ luôn cầm điện thoại vì công việc, con cái cảm thấy bị bỏ rơi, và vợ chồng ít thời gian trò chuyện hơn. Lý do thứ ba là sự sáng tạo. Khi nghỉ ngơi, ta làm những sở thích như nấu ăn, thể thao hay đọc sách, và ý tưởng mới thường đến lúc ta thư giãn. Mặt khác, ở một số công việc rất khó ngắt hẳn. Dù vậy, tóm lại, một ranh giới rõ ràng giữa công việc và thư giãn tốt cho cơ thể, cho gia đình và cho chất lượng công việc."},
   {a:"I think people fight for it because modern work never really stops. Smartphones, messaging groups and remote work mean that a manager can contact us any time. First, people want control over their own time, and saying no to late messages is a way to protect it. Second, they have learned from experience: many of us know someone who suffered burnout after years of overwork. For example, a friend of mine left a high-paying job because he could not sleep. Third, younger employees value freedom and often prefer a company with flexible hours to one with a higher salary. However, some people enjoy their work so much that they don’t mind blending the two. Overall, I’d say everyone needs their own balance, and a clear boundary helps most people find it.",
    v:"Tôi nghĩ người ta phải đấu tranh vì công việc hiện đại thực sự không bao giờ dừng. Điện thoại thông minh, nhóm nhắn tin và làm việc từ xa nghĩa là sếp có thể liên lạc với ta bất cứ lúc nào. Thứ nhất, mọi người muốn tự chủ thời gian của mình, và từ chối tin nhắn muộn là một cách để bảo vệ nó. Thứ hai, họ đã học được từ kinh nghiệm: nhiều người trong chúng ta biết ai đó bị kiệt sức sau nhiều năm làm việc quá sức. Ví dụ, một người bạn của tôi bỏ một công việc lương cao vì không ngủ được. Thứ ba, nhân viên trẻ coi trọng sự tự do và thường thích công ty giờ giấc linh hoạt hơn công ty lương cao hơn. Tuy nhiên, có người thích công việc đến mức không ngại trộn lẫn hai thứ. Nhìn chung, tôi cho rằng mỗi người cần một sự cân bằng riêng, và một ranh giới rõ ràng giúp đa số tìm được nó."}],
  [{a:"In my opinion, it depends on the kind of idea. For small, quick ideas, startups are better. They can test a product in a few weeks, listen to customers directly, and change plan if it fails. For example, many popular mobile apps were created by teams of only five or six people. On the other hand, big companies are better at ideas that need a lot of money and a long time, such as new medicines or electric cars. They have laboratories, experienced engineers and the budget to survive failures. Another difference is risk: a startup can lose everything, while a big company can try many projects at the same time. Compared with startups, large companies are slower but stronger. To conclude, startups bring fresh ideas, and big companies make big ideas real.",
    v:"Theo tôi, còn tùy loại ý tưởng. Với những ý tưởng nhỏ và nhanh, startup tốt hơn. Họ có thể thử sản phẩm trong vài tuần, lắng nghe khách hàng trực tiếp và đổi kế hoạch nếu thất bại. Ví dụ, nhiều ứng dụng di động nổi tiếng được tạo ra bởi những nhóm chỉ năm sáu người. Mặt khác, công ty lớn giỏi hơn với những ý tưởng cần nhiều tiền và thời gian dài, như thuốc mới hay xe điện. Họ có phòng thí nghiệm, kỹ sư giàu kinh nghiệm và ngân sách để chịu được thất bại. Một khác biệt nữa là rủi ro: startup có thể mất tất cả, còn công ty lớn có thể thử nhiều dự án cùng lúc. So với startup, công ty lớn chậm hơn nhưng mạnh hơn. Tóm lại, startup mang đến ý tưởng mới mẻ, còn công ty lớn biến những ý tưởng lớn thành hiện thực."},
   {a:"I’d choose startups, mainly for three reasons. First, the people in startups are usually passionate. They own a part of the company, so they work harder and think more creatively. Second, they listen to customers closely. A small shop owner who talks with every client quickly learns what people want. Third, they have nothing to protect. A big company may refuse a new idea because it could damage an existing product, while a startup has no old product to worry about. Admittedly, startups often lack money and experience, and many of them fail. For instance, a small food-delivery company I know closed after one year because it ran out of funds. However, the successful ones can change an industry. In conclusion, startups create more new ideas, and partnerships with big firms can help them last.",
    v:"Tôi chọn startup, chủ yếu vì ba lý do. Thứ nhất, người làm ở startup thường đam mê. Họ sở hữu một phần công ty, nên làm việc chăm hơn và nghĩ sáng tạo hơn. Thứ hai, họ lắng nghe khách hàng sát sao. Một chủ tiệm nhỏ trò chuyện với từng khách sẽ nhanh biết mọi người muốn gì. Thứ ba, họ không có gì phải bảo vệ. Một công ty lớn có thể từ chối ý tưởng mới vì nó có thể làm hại sản phẩm hiện có, còn startup không có sản phẩm cũ nào để lo. Phải thừa nhận startup thường thiếu tiền và kinh nghiệm, và nhiều công ty thất bại. Ví dụ, một công ty giao đồ ăn nhỏ mà tôi biết đóng cửa sau một năm vì hết vốn. Tuy nhiên, những công ty thành công có thể thay đổi cả một ngành. Tóm lại, startup tạo ra nhiều ý tưởng mới hơn, và hợp tác với công ty lớn có thể giúp họ trụ vững."}],
  [{a:"There are three useful methods. The first is to ask questions. When we look at something, we can ask: what is different, what is missing, what is unusual? For example, a good teacher asks students to find three details in a picture, and with practice they find more every time. The second method is to reduce distractions. If we constantly check our phones, we cannot notice anything around us, so we should put the phone away and focus for ten minutes. The third method is to write or draw what we see. Keeping a small notebook makes us pay attention, and later we can compare our notes. A good example is an accountant who reviews each number twice and marks anything strange. In conclusion, curiosity, focus and note-taking help us see what other people miss.",
    v:"Có ba phương pháp hữu ích. Thứ nhất là đặt câu hỏi. Khi nhìn một thứ gì đó, ta có thể hỏi: cái gì khác, cái gì thiếu, cái gì bất thường? Ví dụ, một thầy giáo giỏi yêu cầu học sinh tìm ba chi tiết trong một bức tranh, và nhờ luyện tập các em tìm được nhiều hơn mỗi lần. Phương pháp thứ hai là giảm bớt sự xao nhãng. Nếu ta liên tục xem điện thoại, ta không thể để ý bất cứ thứ gì xung quanh, nên hãy cất điện thoại đi và tập trung mười phút. Phương pháp thứ ba là viết hoặc vẽ lại những gì ta thấy. Giữ một cuốn sổ nhỏ khiến ta chú ý hơn, và sau đó ta có thể so sánh các ghi chép. Một ví dụ hay là người kế toán xem lại từng con số hai lần và đánh dấu mọi thứ lạ. Tóm lại, sự tò mò, tập trung và ghi chép giúp ta thấy những gì người khác bỏ sót."},
   {a:"Let me suggest three simple habits. First, use all your senses. Don’t only look; listen and smell too. A mechanic, for instance, can hear a small problem in an engine long before a normal driver notices it. Second, compare and contrast. When you visit a place a second time, try to find what has changed. This trains your memory and your eyes. Third, learn the basics of a field. A person who understands the rules of cooking, driving or accounting can see mistakes that beginners ignore. In my work with small business accounts, a wrong date or a repeated invoice stands out because I have seen so many. Of course, it takes patience, and nobody is perfect. In conclusion, if we practise these habits every day, we will notice more details naturally.",
    v:"Tôi xin gợi ý ba thói quen đơn giản. Thứ nhất, dùng mọi giác quan. Đừng chỉ nhìn, hãy nghe và ngửi nữa. Ví dụ, một thợ máy có thể nghe ra một trục trặc nhỏ trong động cơ từ lâu trước khi một tài xế bình thường nhận ra. Thứ hai, so sánh và đối chiếu. Khi đến một nơi lần thứ hai, hãy thử tìm xem có gì đã thay đổi. Điều này rèn trí nhớ và đôi mắt. Thứ ba, học nền tảng của một lĩnh vực. Người hiểu các quy tắc của nấu ăn, lái xe hay kế toán có thể thấy những lỗi mà người mới bỏ qua. Trong công việc làm sổ sách cho doanh nghiệp nhỏ của tôi, một ngày ghi sai hay một hóa đơn bị lặp nổi bật lên vì tôi đã thấy rất nhiều. Tất nhiên điều này cần kiên nhẫn, và không ai hoàn hảo. Tóm lại, nếu luyện những thói quen này mỗi ngày, ta sẽ tự nhiên để ý nhiều chi tiết hơn."}]
 ]
};

const PASSAGES=[
 {id:"A1-1",title:"Đánh giá 1, phần 1: bốn người nói về thử thách trong công việc (câu 1 đến 5)",
  text:"I wanted to make a good impression and also show him respect. I greeted him with a handshake and addressed him by his surname. When I put my hand out, I realized he had been moving in to give me a hug, so we did an awkward mixture of the two. Also, when I greeted him by his surname, he responded politely, though he used my first name. It was all a little uncomfortable. I had never worked with a virtual team on an international project before. It was quite exciting, though also challenging, to work with people from different countries. For example, there were different time zones, different IT systems, and even different local regulations. To help us all get on the same page, we defined the communication norms and the rules the team would follow, as well as the meeting dates and deadlines. We laid this all out in a document called a team charter. I went through a bit of a rough patch last year at work. I was already committed to too much, and then we lost a team member through restructuring, and I quickly became overloaded. My boss introduced me to the SMART approach to goal setting. It helped me to prioritize some tasks, do some later, and drop some completely. I now feel much more in control of my time and workload. As soon as they made the announcement about the cancellation, I knew I had to think quickly. I hurried back through the airport and was one of the first to make it to the desk. That turned out to be a good idea, as there were only nine seats available on the flight the next morning."},
 {id:"A1-3",title:"Đánh giá 1, phần 3: Nikki van Schyndel, Becoming Wild (câu 6 đến 15)",
  text:"I lived off the land in a rundown shack for a year and a half, and believe me, there were countless times I should have run myself home. But I wanted to stay, and it forced my mind to look and find joy in such little things, like a comfy rock to lean against, or a dry spot under a tree in the middle of a rainstorm. Now I live in the coastal community of Echo Bay. Population eight, and falling. I am blessed to live in a beautiful log cabin on an island in the wilderness. A row of solar panels lines the front porch. A black hose carries water from a distant creek. I grew up as a fashionable, privileged city girl, living the American dream life. I ventured out into the wilderness twelve years ago to survive off the land with primitive tools and technology. I survived and thrived for eighteen months. My whole being was transformed by the experience. I returned to the city for a while, but then I followed a new dream to build a log cabin. My estimated six-month plan took three and a half years."},
 {id:"A2-1",title:"Đánh giá 2: phỏng vấn về kinh doanh sân khấu (theatre business)",
  text:"The business side of the theatre, something which has to produce a product that people want and which people are prepared to pay for, is exactly the same as any other business. It must be planned, it must be budgeted, it must be marketed, and it must be successful in order to survive. However, the theatre is also an art form, and you cannot apply straight business standards to art. The theatre has to have the right to fail and the right to be unpopular. Most theatre managers spend most of their time trying to second guess what an audience will like. And more often than not, the things that are huge runaway successes, both artistically and commercially, you couldn’t have predicted in a million years. If you were performing a brand new play with a good but not necessarily bankable cast, you would limit the number of performances. It would seem wise to do maybe twenty or twenty-four performances of a new play and not try to run it forever, and be very careful about the size of the cast, because an awful lot of the budget goes on actors’ wages."},
 {id:"A2-2",title:"Đánh giá 2: buổi giới thiệu sản phẩm khử mùi giày (họp kinh doanh)",
  text:"It uses tiny particles of silver, which have antibacterial properties once ionized, and they essentially kill the microbes that cause the odors. Unit costs are between thirty-five and forty-five euros, and we would be looking for you to retail at between one hundred and one hundred and twenty euros. We are looking at a deal to outsource production, which could bring significant savings. We have estimated something in the region of ten thousand units in the first year, followed by thirty thousand in year two. There is already a range of products that can solve this problem. This is far more effective than the sprays currently on the market. Our initial market is not actually homes, but health clubs and gyms. We have patented a couple of the manufacturing processes that we think will give us an edge over any competitors."}
];

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const MALEV=/david|mark|guy|ryan|george|james|richard|alex|daniel|fred|thomas|brian|christopher|eric|roger|steffan|male/i;
const FEMV=/zira|aria|jenny|samantha|hazel|susan|libby|sonia|emma|michelle|ana|karen|moira|tessa|victoria|serena|catherine|linda|female/i;
const setVoice=u=>{const g=store.get('voice','f');let vs=[];try{vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}
  const want=g==='m'?MALEV:FEMV;
  let v=vs.find(x=>want.test(x.name)&&/en[-_]US/i.test(x.lang))||vs.find(x=>want.test(x.name));
  if(!v&&g==='f')v=vs.find(x=>!MALEV.test(x.name)&&/en[-_]US/i.test(x.lang));
  if(v){u.voice=v;u.lang=v.lang}else if(g==='m')u.pitch=.6};

const AP={box:null,i:0,id:0,on:false};
const splitS=t=>String(t).split(/(?<=[.?!])\s+/).filter(Boolean);
const apSents=b=>[...b.querySelectorAll('.snt')];
const apMark=()=>{document.querySelectorAll('.snt.cur').forEach(e=>e.classList.remove('cur'));
  document.querySelectorAll('.ap [data-ap=toggle]').forEach(b=>b.textContent='▶ Nghe');
  document.querySelectorAll('.apinfo').forEach(e=>e.textContent='');
  if(!AP.box)return;const ss=apSents(AP.box),c=ss[AP.i];
  if(c){c.classList.add('cur');if(c.offsetParent)c.scrollIntoView({block:'nearest'})}
  if(AP.box.dataset.mirror){const el=document.getElementById(AP.box.dataset.mirror);
    if(el){if(!el.querySelector('.snt.m')&&!el.children.length)el.innerHTML=splitS(el.textContent).map(x=>`<span class="snt m" title="Bấm để nghe từ câu này">${esc(x)} </span>`).join('');
      const m=el.querySelectorAll('.snt.m')[AP.i];if(m){m.classList.add('cur');m.scrollIntoView({block:'nearest'})}}}
  const inf=AP.box.querySelector('.apinfo');if(inf)inf.textContent='Câu '+(AP.i+1)+'/'+ss.length;
  const tg=AP.box.querySelector('[data-ap=toggle]');if(tg&&AP.on)tg.textContent='⏸ Tạm dừng'};
const apPlay=(box,i)=>{try{speechSynthesis.cancel()}catch(e){}
  const ss=apSents(box);if(!ss.length)return;i=Math.max(0,Math.min(ss.length-1,i));
  AP.box=box;AP.i=i;AP.on=true;const my=++AP.id;speakId++;
  const r=box.querySelector('[data-ap=rate]');
  try{const u=new SpeechSynthesisUtterance(ss[i].textContent.trim());u.lang='en-US';u.rate=r?+r.value:.92;setVoice(u);
    u.onend=()=>{if(my!==AP.id)return;if(i+1<ss.length)apPlay(box,i+1);else{AP.on=false;AP.i=0;apMark()}};
    speechSynthesis.speak(u)}catch(e){}
  apMark()};
const apPause=()=>{AP.id++;try{speechSynthesis.cancel()}catch(e){}AP.on=false;apMark()};
const apStop=()=>{AP.id++;try{speechSynthesis.cancel()}catch(e){}AP.on=false;AP.i=0;apMark()};
const apHTML=(t,hide,mirror)=>`<div class="ap"${mirror?` data-mirror="${mirror}"`:''}><div class="apbar"><button class="btn ghost" type="button" data-ap="prev">⏮ Câu trước</button><button class="btn" type="button" data-ap="toggle">▶ Nghe</button><button class="btn ghost" type="button" data-ap="next">Câu sau ⏭</button><button class="btn ghost" type="button" data-ap="again">↻ Nghe lại câu này</button><button class="btn ghost" type="button" data-ap="stop">⏹ Dừng</button><label class="aprate">Tốc độ <select data-ap="rate"><option value=".7">Chậm</option><option value=".92" selected>Vừa</option><option value="1.1">Nhanh</option></select></label><label class="aprate">Giọng <select data-ap="voice"><option value="f"${store.get('voice','f')==='f'?' selected':''}>Nữ</option><option value="m"${store.get('voice','f')==='m'?' selected':''}>Nam</option></select></label><span class="apinfo note"></span></div><p class="en aptext${hide?' hide':''}">${splitS(t).map(x=>`<span class="snt" title="Bấm để nghe từ câu này">${esc(x)} </span>`).join('')}</p>${hide?'':'<p class="note">Bấm vào một câu để nghe từ câu đó.</p>'}</div>`;
document.addEventListener('click',e=>{const sn=e.target.closest('.snt'),bt=e.target.closest('button[data-ap]');
  if(sn&&sn.classList.contains('m')){const bx=document.querySelector('.ap[data-mirror]');if(bx)apPlay(bx,[...sn.parentNode.querySelectorAll('.snt.m')].indexOf(sn));return}
  const box=(sn||bt)&&(sn||bt).closest('.ap');if(!box)return;const same=AP.box===box,cur=same?AP.i:0;
  if(sn){apPlay(box,apSents(box).indexOf(sn));return}
  const a=bt.dataset.ap;
  if(a==='toggle'){if(same&&AP.on)apPause();else apPlay(box,cur)}
  else if(a==='prev')apPlay(box,cur-1);
  else if(a==='next')apPlay(box,cur+1);
  else if(a==='again')apPlay(box,cur);
  else if(a==='stop')apStop()});
document.addEventListener('change',e=>{const vv=e.target.closest('select[data-ap=voice]');if(vv){store.set('voice',vv.value);document.querySelectorAll('select[data-ap=voice]').forEach(x=>x.value=vv.value);const bx=vv.closest('.ap');if(AP.box===bx&&AP.on)apPlay(bx,AP.i);return}const r=e.target.closest('select[data-ap=rate]');if(!r)return;const box=r.closest('.ap');if(AP.box===box&&AP.on)apPlay(box,AP.i)});

const speak=t=>{try{AP.id++;AP.on=false;apMark();speechSynthesis.cancel();const my=++speakId;const parts=String(t).split(/(?<=[.?!])\s+/).filter(Boolean);
  const run=i=>{if(i>=parts.length||my!==speakId)return;const u=new SpeechSynthesisUtterance(parts[i]);u.lang='en-US';u.rate=.92;setVoice(u);u.onend=()=>run(i+1);speechSynthesis.speak(u)};run(0)}catch(e){}};

  const out=[];for(let w of (s.match(/[a-z0-9']+/g)||[])){w=w.replace(/^'+|'+$/g,'');if(!w)continue;if(CONTR[w]){out.push(...CONTR[w].split(' '));continue}w=w.replace(/'s$/,'');

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){const k=rel(R[i-1],H[j-1]),dg=D[i-1][j-1]+[0,.4,1.2][k],up=D[i-1][j]+1,lf=D[i][j-1]+1;
    if(dg<=up&&dg<=lf){D[i][j]=dg;T[i][j]=1}else if(up<=lf){D[i][j]=up;T[i][j]=2}else{D[i][j]=lf;T[i][j]=3}}

function analyseLevels(lv){if(lv.length<10)return null;const so=[...lv].sort((a,b)=>a-b),fl=so[Math.floor(so.length*.05)],thr=Math.min(.04,Math.max(.012,fl*3)),sp=lv.map(v=>v>thr);

const ADV=new Set([...ALLW.map(x=>x.w.toLowerCase()),...['recognition','incentive','incentives','rotation','burnout','purpose','repetitive','meaningful','donate','volunteer','awareness','guarantee','reliable','storage','renewable','credibility','innovation','adopt','infrastructure','affordable','ethical','deceive','misleading','exaggerate','boundary','productive','flexible','bureaucracy','funding','observe','concentrate','pollution','investment','long-term','appearance','impression','consumers','responsibility','effective','convenient','advantage','disadvantage','significant','essential','particularly','generally','therefore','however','although','whereas','compared','balance','environment','community','policy','potential']]);
const LINK={opinion:/\b(i think|i believe|in my opinion|i would say|i'd say|i agree|i disagree|to be honest|i feel)\b/,reason:/\b(one reason|another reason|first of all|firstly|secondly|second|third|the first|because|since|there are (two|three)|the main reason)\b/,example:/\b(for example|for instance|such as|take my|what i mean)\b/,contrast:/\b(on the other hand|however|although|while|whereas|compared with|but)\b/,conclusion:/\b(overall|in conclusion|to conclude|in the long run|finally|in short|to sum up|that's all)\b/};
