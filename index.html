 skills:[
  ["Ghi chú theo mốc thời gian (note-taking)","Bài nói theo thứ tự thời gian thì vẽ một đường thời gian: một bên ghi từ chỉ thời gian, bên kia ghi sự kiện chính. Từ hay gặp: in the beginning, later, before, during that time, soon, after that, in a specific year, at last, on (a day)."],

  ["Bài nói cuối Unit (assignment)","Kể một trải nghiệm cá nhân về khó khăn hoặc thành công với ngôn ngữ. Dùng đường thời gian để sắp xếp sự kiện và cảm xúc, có lời tả sinh động. Mẫu trong sách: Maxine Hong Kingston kể nỗi sợ khi phải đọc bài bằng tiếng Anh trước lớp."]

  ["Listening 2: Helen Keller, The Story of My Life","Mất thị giác và thính giác lúc 19 tháng tuổi. Tháng đầu sau bệnh: dùng dấu hiệu (pull là đến, push là đi). Trước khi cô giáo đến: biết mình khác mọi người, bực bội, giận dữ, như con tàu trong sương dày. 3/3/1887 cô giáo đến. Sáng hôm sau học chữ doll nhưng chưa hiểu nghĩa. Mùa hè 1887: hiểu mọi vật đều có tên (water)."],

{n:2,title:"Behavioral science: work and fun",vi:"Khoa học hành vi: công việc và vui chơi",q:"What is the tipping point between work and fun?",
 skills:[
  ["Ghi chú bằng biểu đồ Venn (note-taking)","Tìm mối quan hệ giữa các mục là kỹ năng tư duy phản biện quan trọng khi ghi chú. Biểu đồ Venn có hai vòng tròn chồng lên nhau: phần chung ở giữa là điểm giống, hai phần ngoài là điểm khác. Hợp khi bài giảng cần so sánh hai thứ (ví dụ nấu ăn làm sở thích và nấu ăn làm nghề)."],
  ["Kỹ năng nghe: nghe ví dụ (listening for examples)","Cụm báo hiệu ví dụ: for example, for instance, take… as an example, let me give you an example, including, such as. Khi người nói liệt kê ví dụ, họ lên giọng ở từng mục trừ mục cuối: lên giọng nghĩa là chưa nói xong. Cách ghi: ý chính bên trái, ví dụ bên phải."],
  ["Phát âm: ngữ điệu khi nêu lựa chọn","Câu nêu lựa chọn: lên giọng ở âm nhấn của mỗi lựa chọn, hạ giọng ở or, câu kết thúc xuống giọng. Câu hỏi lựa chọn: lên giọng ở mỗi lựa chọn, hạ giọng ở or, rồi lên giọng ở mục cuối, hoặc lên rồi xuống nếu mục cuối kết thúc bằng âm nhấn."],
  ["Ngữ pháp: so sánh (comparisons)","Danh từ: more perks than, fewer perks than, less time than, many more/many fewer perks than, much less time than, as many perks as, as much time as. Động từ: gains more than, gains less than, gains much more than, gains as much as. Tính từ: clearer than, much clearer than, less aware than, as productive as. So sánh phải cùng loại: the office in China had more employees than the office in India (không so với đất nước India)."],
  ["Kỹ năng nói: sở thích và lựa chọn (preferences)","Sở thích trong quá khứ: prefer + danh từ, choose + to-V, first/second choice was + to-V, had hoped + to-V. Sở thích hiện tại: my preference is to + V, I’d rather (not) + V, If it were up to me, I like A more than B, I’d like to + V."],
  ["Bài nói cuối Unit (assignment)","Làm việc nhóm, thảo luận một hoạt động hoặc công việc vừa có phần vui vừa có phần vất vả (ví dụ kỳ nghỉ kết hợp làm tình nguyện), rồi trình bày."]
 ],
 key:[
  ["Listening 1: Google và Bloomberg","Hai video: ở Google, bộ phận people operations dùng dữ liệu (data mining) để cải thiện nơi làm việc. Ở Bloomberg, một quản lý sản phẩm hỏi đồng nghiệp về môi trường làm việc. Câu hỏi chung: đâu là điểm chuyển giữa làm việc và vui chơi."],
  ["Du học và thực tập (cố vấn đại học)","Chương trình du học vẫn đóng học phí ở trường mình. Thực tập thì không đóng học phí, thường còn có lương nhỏ. Cả hai đều vui, có trải nghiệm mới, nhưng cũng vất vả: du học phải học và giao tiếp bằng ngoại ngữ, thực tập có sếp và việc có thể khó hơn."],
  ["Ví dụ trong bài nghe","Thực tập có lợi: biết công ty, môi trường văn phòng, phúc lợi (perks) như đồ ăn miễn phí hay chỗ làm riêng. Kỳ nghỉ làm tình nguyện: giúp người khác, đi nhiều nơi, học kỹ năng mới như xây trường."]
 ],

{n:3,title:"Ecology: visual deception",vi:"Sinh thái: đánh lừa thị giác",q:"How can the eyes deceive the mind?",
 skills:[
  ["Ghi chú: dùng kiến thức nền để chuẩn bị (note-taking)","Trước khi nghe, nghĩ về điều mình đã biết để dự đoán người nói sẽ nói gì. Khi nghe, so sánh: khớp thì củng cố, khác thì đặt câu hỏi và học thêm. Cách chuẩn bị: đọc tài liệu cô giao, xem lại ghi chú các buổi trước, trao đổi với bạn, nghĩ về tiêu đề, ghi vài từ khóa vào sơ đồ, viết vài câu hỏi và chừa chỗ ghi câu trả lời. Bước đầu tiên trong bài: đọc tài liệu được giao trước buổi giảng."],
  ["Kỹ năng nghe: nhận ra đồng vị ngữ (appositives)","Đồng vị ngữ là cụm giải thích thêm cho danh từ đứng trước nó. Bỏ đi câu vẫn đủ nghĩa. Khi viết, đồng vị ngữ được đánh dấu bằng dấu phẩy (đề trong video chọn đáp án: dấu gạch ngang, hãy hỏi lại cô cho chắc). Khi nói, nó nằm giữa hai quãng nghỉ ngắn. Ví dụ: The chameleon, a type of lizard, changes its skin color."],
  ["Ngữ pháp: mệnh đề quan hệ (relative clauses)","Mệnh đề quan hệ làm câu phong phú, nối hai câu ngắn thành một. Bắt đầu bằng who, whom, that, which, when, where. Là mệnh đề phụ thuộc, không đứng một mình. Có thể làm chủ ngữ hoặc tân ngữ. Ví dụ: The conductor who was wearing a blue cap walked onto the platform."],
  ["Phát âm: trọng âm khi thêm hậu tố","Nhấn vào chính hậu tố: -ee, -eer, -ese, -ier, -ique (employee, Chinese, cashier). Giữ trọng âm của từ gốc: -al, -ment, -ness, -ous, -or, -y, -ism, -ly (profession, professional, equipment). Nhấn âm tiết ngay trước hậu tố: -ial, -ian, -ion, -ics, -ical, -ient, -ious, -ify, -itive, -ity, -graphy, -logy, -ual. Không chắc thì tra từ điển."],
  ["Kỹ năng nói: nhắc lại và hỏi làm rõ","Nhắc lại ý người nói để xác nhận mình hiểu đúng. Hỏi làm rõ: Do you mean that…? Could you clarify that last concept? Could you give an example?"]
 ],
 key:[
  ["Listening 1: Sherlock Holmes và đánh lừa thị giác","Thám tử Holmes dùng các thủ thuật: cải trang (disguise), giấu quần áo, đánh lạc hướng (misdirection), bằng chứng giả, theo dõi (surveillance), mồi nhử (decoy). Bài ghi chú gồm ba cột: cải trang gì, làm thế nào, kết quả."],
  ["Listening 2: phóng sự National Geographic về động vật sống sót","Động vật thích nghi và ngụy trang để sống sót. Chim ptarmigan có lông nâu khó thấy, mùa đông mọc lông trắng ở chân như giày tuyết, vừa ngụy trang vừa giữ ấm. Cuộc chiến sinh tồn làm cán cân giữa thú săn mồi và con mồi luôn thay đổi. Cũng có sâu bướm, bọ ngựa, rắn, cá bơn."]
 ],
 vocab:[
  ["adapt","/əˈdæpt/","v","thích nghi","Animals adapt to cold weather."],
  ["mature","/məˈtʃʊr/","v, adj","trưởng thành","The birds mature in about a year."],
  ["prey","/preɪ/","n","con mồi","Mice are prey for owls."],
  ["camouflage","/ˈkæməflɑːʒ/","n, v","ngụy trang","The brown feathers give good camouflage."],
  ["mimic","/ˈmɪmɪk/","v","bắt chước","Some insects mimic leaves."],
  ["resemble","/rɪˈzembl/","v","trông giống","The moth resembles a dry leaf."],
  ["elaborate","/ɪˈlæbərət/","adj","công phu, phức tạp","The detective used an elaborate disguise."],
  ["obvious","/ˈɑːbviəs/","adj","rõ ràng","The answer was obvious."],
  ["shift","/ʃɪft/","v, n","chuyển đổi","The balance of power keeps shifting."],
  ["infinite","/ˈɪnfɪnət/","adj","vô tận","Nature has infinite forms of survival."],
  ["predator","/ˈpredətər/","n","thú săn mồi","A predator hunts other animals."],
  ["virtually","/ˈvɜːrtʃuəli/","adv","gần như","The bird is virtually invisible in the snow."],
  ["disguise","/dɪsˈɡaɪz/","n, v","sự cải trang","He used a disguise to avoid being recognized."],

{n:4,title:"International relations: global citizens",vi:"Quan hệ quốc tế: công dân toàn cầu",q:"What does it mean to be a global citizen?",
 skills:[
  ["Ghi chú bằng biểu đồ chữ T (note-taking)","Dùng khi bài nói về vấn đề và giải pháp: cột trái là vấn đề, cột phải là giải pháp. Nếu nghe lệch thứ tự thì ghi đúng cột rồi sắp lại sau. Nghe sót chi tiết thì gạch một dòng nhắc để hỏi bạn sau. Chuẩn bị trước sơ đồ cũng là cách tốt. Cụm báo vấn đề: One problem is, The trouble is that, Another obstacle we face is. Cụm báo giải pháp: People should/must, One suggestion is to, We can solve this by, They need to."],
  ["Kỹ năng nghe: số liệu và sự kiện","Bài dựa trên số liệu thì ghi ý tổng thể, xu hướng quan trọng và số liệu cụ thể người nói nhấn mạnh, kèm từ khóa. Không chắc thì thêm dấu hỏi để tìm lại sau. Cụm hay gặp: in the early 1990s, in recent years, an increase in, a decrease in, it is estimated that, roughly, more than, fewer than, research shows that, the percent of."],
  ["Ngữ pháp: câu tường thuật (reported speech)","Nói về điều đã nói trong quá khứ thì lùi một thì: hiện tại đơn thành quá khứ đơn, hiện tại tiếp diễn thành quá khứ tiếp diễn, quá khứ đơn và hiện tại hoàn thành thành quá khứ hoàn thành, will thành would, can thành could, may thành might. Sự thật hiện hành thì giữ nguyên thì (he said climate change is a reality). Câu hỏi khi tường thuật dùng trật tự câu trần thuật (asked what the agenda was). Động từ tường thuật: say, tell, ask, add, state, remark, respond, warn. Có thể phải đổi đại từ. Câu hỏi Yes/No dùng if hoặc whether."],
  ["Phát âm: nối âm cuối","Đừng bỏ phụ âm cuối. Nối phụ âm cuối với nguyên âm đầu của từ sau (salt items, miles away). Khi phụ âm cuối giống phụ âm đầu từ sau thì giữ lâu hơn, không chèn nguyên âm vào giữa (one tap, take control). Chèn nguyên âm sẽ thêm âm tiết và làm người nghe khó hiểu."],
  ["Kỹ năng nói: trích dẫn nguồn (citing sources)","Khi thuyết trình học thuật cần nói thông tin lấy từ đâu. Ba cách: giới thiệu người viết hoặc nói, nói nơi và thời điểm công bố, dùng câu tường thuật. Cụm hay dùng: According to X, As X explains, As X reports, Data from X support that, In a survey published in X, X results show that, At a conference on [date], X explained how."]
 ],
 key:[
  ["Listening 1: The campaign to humanize the coffee trade","Phóng sự của đài American RadioWorks về cà phê thương mại công bằng (fair trade). Nông dân Guatemala vất vả, nhà cửa nghèo, giá cà phê thế giới lên xuống. Các nhà hoạt động khuyên người tiêu dùng tìm nhãn fair trade để thay đổi đời sống nông dân."],
  ["Bài nghe số liệu về cà phê","90% cà phê được trồng ở các nước đang phát triển. Người ta uống khoảng hơn 400 tỷ tách mỗi năm. 20 triệu gia đình làm nghề trồng cà phê. Gần một phần ba cà phê thế giới trồng ở Brazil, hơn 3 tỷ cây."],
  ["Ví dụ biểu đồ chữ T về nạn đói","Vấn đề: đất xấu, thiếu nước, thiếu giáo dục. Giải pháp: cung cấp phân bón, giúp làm hệ thống tưới, cấp dụng cụ, dạy nông dân."]
 ],
 vocab:[
  ["activist","/ˈæktɪvɪst/","n","nhà hoạt động xã hội","Activists want fair prices for farmers."],
  ["afford","/əˈfɔːrd/","v","đủ khả năng chi trả","Many farmers cannot afford a horse."],
  ["co-op","/ˈkoʊɑːp/","n","hợp tác xã","The farmers formed a co-op."],
  ["commodity","/kəˈmɑːdəti/","n","hàng hóa","Coffee is a global commodity."],

  ["guarantee","/ˌɡerənˈtiː/","v, n","bảo đảm","Fair trade guarantees a minimum price."],
  ["intermediary","/ˌɪntərˈmiːdieri/","n","người trung gian","The intermediary takes a share of the money."],
  ["massive","/ˈmæsɪv/","adj","khổng lồ","The company makes massive profits."],
  ["processor","/ˈprɑːsesər/","n","nhà chế biến","The processor cleans and packs the beans."],
  ["roughly","/ˈrʌfli/","adv","khoảng, xấp xỉ","Roughly 20 million families grow coffee."],
  ["speculation","/ˌspekjuˈleɪʃn/","n","đầu cơ, sự suy đoán","Speculation makes prices go up and down."],
  ["transform","/trænsˈfɔːrm/","v","biến đổi hoàn toàn","Fair trade can transform farmers’ lives."]
 ]}
];

 p1:[
  {q:"What helps employees stay motivated when the work is repetitive?",type:"Hai ý (two things)",
   out:"Ý 1: được ghi nhận. Ý 2: luân phiên công việc hoặc thấy ý nghĩa công việc. Có ví dụ thực tế.",
   words:"recognition, incentives, job rotation, burnout, sense of purpose, repetitive, meaningful",
   a:"I think the biggest factor is recognition. When a manager notices good work, even a boring task feels meaningful. For example, in a small workshop I know, a worker who checks the same parts every day works harder when the boss thanks him in front of the team. Another thing that helps is variety. If people can rotate between different jobs, they get less bored and learn new skills. On the other hand, money alone does not last long, because the work stays dull. Overall, I’d say recognition and job rotation give people a sense of purpose and help them avoid burnout."},
  {q:"What can one person do about global problems like poverty?",type:"Hai việc (two things)",
   out:"Việc 1: quyên góp hoặc làm tình nguyện. Việc 2: chọn hàng công bằng, ủng hộ doanh nghiệp tử tế, lên tiếng.",
   words:"donate, volunteer, raise awareness, fair trade, make a difference, small steps, poverty",
   a:"There are two things one person can do. First of all, we can donate money or time. Even a small amount helps, and volunteering at a local charity gives us real experience of how poverty feels. Second, we can make careful choices as consumers. For instance, buying fair trade coffee guarantees a better price for farmers. We can also raise awareness by sharing reliable information with friends and family. One person cannot solve poverty alone, but small steps add up. In the long run, many people making a difference can change a whole community."},
  {q:"Should the government pay people to use less electricity?",type:"Ý kiến (opinion)",

   words:"incentive, reduce, energy consumption, bill, budget, awareness, effective",
   a:"I believe the government should do it, but only in a limited way. One reason is that people respond quickly to money. If they get a discount on their electricity bill, they will turn off unused lights and buy efficient appliances. Another reason is that using less electricity protects the environment and reduces pressure on power plants. On the other hand, this policy costs a lot of money, so the government must have a clear budget. It could also teach people about saving energy instead of only paying them. Overall, I’d say a small reward is an effective incentive."},
  {q:"How reliable is solar power for a country like Vietnam?",type:"Hai lý do (two reasons)",
   out:"Mặt tốt: nhiều nắng. Mặt hạn chế: mùa mưa, ban đêm, cần pin lưu trữ. Kết luận: khá đáng tin nhưng chưa 100%.",
   words:"reliable, sunlight hours, storage, battery, weather, rainy season, renewable energy",

  {q:"Does using slang make speakers sound friendly and professional?",type:"Ý kiến (opinion)",
   out:"Đề gốc có thể hơi khác chữ. Thân thiện: có. Chuyên nghiệp: không trong môi trường trang trọng. Kết luận: tùy hoàn cảnh.",
   words:"slang, informal, formal, workplace, audience, relaxed, credibility",
   a:"To be honest, it depends. Slang can make a speaker sound friendly and relaxed. For example, when I talk with friends or young customers, slang helps us connect quickly. However, I don’t think slang sounds professional. In a meeting or a presentation, people expect clear and polite language, and too much slang can reduce the speaker’s credibility. So I’d say friendly, yes, but professional, not really. The best choice is to know your audience: use light, informal language in a casual talk, and formal language at work or in a presentation."},
  {q:"Why do some innovations take years to become popular?",type:"Hai lý do (two reasons)",
   out:"Lý do 1: giá cao hoặc khó dùng. Lý do 2: thói quen và niềm tin của người dùng, thiếu hạ tầng.",
   words:"innovation, adopt, habit, affordable, infrastructure, trust, early adopters",
   a:"There are two main reasons. The first one is cost and convenience. New products are often expensive or difficult to use at the beginning, so only a few early adopters buy them. The second reason is habit. People trust what they already know, and changing a habit takes time. For instance, electric cars are better for the environment, but many people still worry about charging stations and price. Over time, when the price falls and the infrastructure improves, more people accept the idea. Overall, I’d say popularity grows slowly because people need time to trust something new."},
  {q:"Can advertisers deceive customers without actually lying?",type:"Ý kiến, ví dụ (opinion)",
   out:"Trả lời có. Hai ví dụ: hình ảnh quảng cáo đẹp hơn thực tế, chữ nhỏ hoặc nói một nửa sự thật. Gắn với bài học đánh lừa thị giác (visual tricks).",
   words:"deceive, misleading, exaggerate, small print, visual tricks, half-truth, customers",
   a:"Yes, I think they can. One way is visual tricks. A food photo can look delicious because of special lighting, but the real meal is much smaller. Nobody lied, but the customer feels deceived. Another way is a half-truth. For example, an advertisement says that a drink has no added sugar, but it does not say that the drink already contains a lot of natural sugar. The words are true, but the message is misleading. So customers should read the small print and compare products before they buy. In the long run, honest advertising earns more trust."},
  {q:"Is fair trade worth the higher price for ordinary consumers?",type:"Ý kiến (opinion)",

   words:"fair trade, farmers, guarantee, minimum price, afford, global citizen, ethical",
   a:"I think it is worth it, as long as people can afford it. One reason is that fair trade guarantees farmers a minimum price, so they can send their children to school and improve their lives. Another reason is that it makes us global citizens. When we pay a little more, we share responsibility for people far away. On the other hand, for families with a low income, the higher price can be a real burden. So it depends on each person’s budget. Overall, I’d say that if we can choose one fair trade product a week, it is a small price for a big difference."}

 p2:[
  {q:"What is important when a community decides whether to build a new power plant nearby?",type:"Điều quan trọng (what is important)",
   out:"Mở: có 3 yếu tố chính. Thân: an toàn và môi trường, lợi ích cho người dân, tác động lâu dài. Kết: cần cân bằng.",
   words:"safety, environment, benefits, local residents, long-term effect, pollution, jobs",
   a:"There are three key factors a community should think about before building a new power plant nearby. The first one is safety and the environment. People must be sure that the plant will not pollute the air or the water, and that there is a plan for accidents. For example, a coal plant can cause health problems for children. The second factor is the benefits for local people. A new plant can create jobs and bring investment, and the community should check whether residents get cheaper electricity or better roads. The third factor is the long-term effect. We should ask what will happen in twenty or thirty years: who will pay for the cleaning, and can the plant use clean energy? In conclusion, a community should balance safety, benefits, and the long-term future before deciding."},
  {q:"Describe an occasion when something you saw turned out to be very different from what it really was.",type:"Một dịp, một câu chuyện (an occasion)",
   out:"Mở: bối cảnh. Thân: lúc đầu thấy gì, thực tế thế nào, mình học được gì. Kết: đừng đánh giá qua vẻ ngoài.",
   words:"appearance, first impression, turned out, misleading, judge, realize, lesson",
   a:"I’d like to talk about a time when a first impression was completely wrong. A few years ago, I visited a restaurant because the outside looked beautiful, with bright lights and a modern sign. I expected delicious food. However, when we sat down, the service was slow, the food was cold, and the prices were very high. Later, my friend took me to a small, old shop near my house. It looked dirty and simple, but the owner was friendly and the food was fantastic. That day I realized that appearances can be misleading. What I learned is that I should not judge a place by its outside. As the saying goes, don’t judge a book by its cover. Since then, I always try to check reviews and give simple places a chance."},
  {q:"Why do some people fight hard to separate work time from leisure time?",type:"Tại sao (why)",
   out:"Mở: nêu hai hoặc ba lý do. Thân: sức khỏe tinh thần và burnout, thời gian cho gia đình, công nghệ làm mờ ranh giới. Kết: cần ranh giới rõ ràng.",
   words:"work-life balance, boundary, burnout, leisure, remote work, productive, mental health",
   a:"I think there are three main reasons. The first one is mental health. If people work all day and all night, they feel stressed and can reach burnout. Rest time lets the brain recover, so they are more productive later. The second reason is family and personal life. Many people want to spend evenings with their children or friends, and they don’t want work messages to interrupt them. The third reason is technology. Smartphones and working from home make the boundary between work and leisure very weak, so people must fight harder to keep it. For example, a colleague of mine turns off her work phone at six every day. In conclusion, a clear boundary helps people stay healthy and happy, and in the long run, it also improves their work."},
  {q:"Which are better at producing new ideas: big companies or small startups?",type:"So sánh (comparison)",
   out:"Mở: nêu quan điểm. Thân: ưu điểm startup (linh hoạt, dám mạo hiểm), ưu điểm công ty lớn (vốn, nhân lực), rồi chọn bên mạnh hơn. Kết: kết luận.",
   words:"startup, flexible, resources, risk, bureaucracy, funding, innovative",
   a:"In my opinion, small startups are usually better at producing new ideas, although big companies have their own strengths. First, startups are flexible. They have few levels of management, so a good idea can become a product quickly, without long meetings. They also take more risks, because they have little to lose. On the other hand, big companies have money, equipment, and experts, which are very important for developing and testing new ideas. For instance, a large technology company can spend millions on research. However, big companies are often slow and afraid of failure, so many great ideas are rejected. Compared with big companies, startups are more creative, but they often need support. To conclude, I’d say the best result comes when startups create ideas and big companies help them grow."},
  {q:"How can people train themselves to notice details that others miss?",type:"Cách làm (how to / procedure)",
   out:"Mở: có 3 cách. Thân: chậm lại và quan sát, luyện bằng trò chơi (puzzle) và ghi chú, học từ chuyên gia. Kết: luyện đều sẽ thành thói quen.",
   words:"observe, slow down, puzzle, take notes, take photos, concentrate, experts",
   a:"There are three ways people can train themselves to notice more details. The first way is to slow down. We often look at things quickly and miss important points, so we should stop for a moment and observe carefully, for example when we walk in a park or read a contract. The second way is to practice with games and tools. Puzzles and spot-the-difference games improve concentration, and taking notes or photos helps us remember what we see. The third way is to learn from experts. A good teacher or an experienced detective can show us what to look for, and we can copy their method. For instance, a good accountant checks small numbers that other people ignore. In conclusion, with regular practice, noticing details becomes a habit."}

   a:"Tôi tin là chính phủ nên làm, nhưng chỉ ở mức hạn chế. Một lý do là mọi người phản ứng rất nhanh với tiền. Nếu được giảm hóa đơn tiền điện, họ sẽ tắt đèn không dùng và mua thiết bị tiết kiệm điện. Một lý do khác là dùng ít điện hơn giúp bảo vệ môi trường và giảm áp lực cho các nhà máy điện. Mặt khác, chính sách này tốn rất nhiều tiền, nên chính phủ phải có ngân sách rõ ràng. Chính phủ cũng có thể dạy người dân cách tiết kiệm điện thay vì chỉ trả tiền. Nhìn chung, tôi cho rằng một phần thưởng nhỏ là một sự khuyến khích hiệu quả."},
  {q:"Điện mặt trời đáng tin cậy đến mức nào đối với một nước như Việt Nam?",
   a:"Tôi cho rằng điện mặt trời khá đáng tin cậy, nhưng chưa hoàn toàn. Một lý do là Việt Nam nằm gần đường xích đạo nên có nắng mạnh trong nhiều tháng. Vì vậy các tấm pin mặt trời có thể tạo ra nhiều điện, nhất là ở miền Nam và miền Trung. Tuy nhiên, ta không thể chắc chắn 100 phần trăm là có nắng quanh năm. Vào mùa mưa, và dĩ nhiên cả ban đêm, sản lượng giảm. Vì thế đất nước cần pin lưu trữ hoặc các nguồn năng lượng khác để dự phòng. Về lâu dài, điện mặt trời là một lựa chọn tốt nếu kết hợp với lưu trữ."},
  {q:"Dùng tiếng lóng có làm người nói nghe thân thiện và chuyên nghiệp không?",
   a:"Nói thật thì còn tùy. Tiếng lóng có thể làm người nói nghe thân thiện và thoải mái. Ví dụ, khi tôi trò chuyện với bạn bè hoặc khách hàng trẻ, tiếng lóng giúp chúng tôi gần nhau nhanh hơn. Tuy nhiên, tôi không nghĩ tiếng lóng nghe chuyên nghiệp. Trong một cuộc họp hay buổi thuyết trình, người ta mong đợi ngôn ngữ rõ ràng và lịch sự, và dùng quá nhiều tiếng lóng có thể làm giảm uy tín của người nói. Vì vậy tôi nói là thân thiện thì có, còn chuyên nghiệp thì không hẳn. Lựa chọn tốt nhất là hiểu người nghe của mình: dùng ngôn ngữ nhẹ nhàng, thân mật khi nói chuyện thoải mái, và ngôn ngữ trang trọng khi ở chỗ làm hoặc khi thuyết trình."},
  {q:"Vì sao một số phát minh phải mất nhiều năm mới được ưa chuộng?",
   a:"Có hai lý do chính. Lý do thứ nhất là chi phí và sự tiện lợi. Sản phẩm mới lúc đầu thường đắt hoặc khó dùng, nên chỉ một số ít người dùng thử sớm mua chúng. Lý do thứ hai là thói quen. Con người tin vào những gì mình đã quen, và đổi thói quen cần thời gian. Ví dụ, xe điện tốt hơn cho môi trường, nhưng nhiều người vẫn lo về trạm sạc và giá. Theo thời gian, khi giá giảm và hạ tầng tốt hơn, nhiều người chấp nhận ý tưởng này hơn. Nhìn chung, tôi cho rằng sự phổ biến tăng chậm vì con người cần thời gian để tin vào cái mới."},
  {q:"Nhà quảng cáo có thể đánh lừa khách hàng mà không thực sự nói dối không?",
   a:"Có, tôi nghĩ họ làm được. Một cách là các mẹo hình ảnh. Một tấm ảnh món ăn có thể trông rất ngon nhờ ánh sáng đặc biệt, nhưng bữa ăn thật nhỏ hơn nhiều. Không ai nói dối, nhưng khách hàng vẫn thấy bị lừa. Một cách khác là nói nửa sự thật. Ví dụ, quảng cáo nói thức uống không thêm đường, nhưng không nói rằng thức uống đó vốn đã chứa nhiều đường tự nhiên. Từ ngữ thì đúng, nhưng thông điệp lại gây hiểu lầm. Vì vậy khách hàng nên đọc chữ nhỏ và so sánh sản phẩm trước khi mua. Về lâu dài, quảng cáo trung thực sẽ có được nhiều niềm tin hơn."},
  {q:"Thương mại công bằng có đáng với mức giá cao hơn đối với người tiêu dùng bình thường không?",
   a:"Tôi nghĩ là đáng, miễn là mọi người đủ khả năng chi trả. Một lý do là thương mại công bằng bảo đảm cho nông dân một mức giá tối thiểu, nên họ có thể cho con đi học và cải thiện cuộc sống. Một lý do khác là nó biến chúng ta thành công dân toàn cầu. Khi trả thêm một chút, chúng ta cùng chia sẻ trách nhiệm với những người ở xa. Mặt khác, với các gia đình thu nhập thấp, giá cao hơn có thể là gánh nặng thật sự. Vì vậy còn tùy vào ngân sách của từng người. Nhìn chung, tôi cho rằng nếu mỗi tuần ta chọn được một sản phẩm thương mại công bằng, thì đó là cái giá nhỏ cho một thay đổi lớn."}
 ],
 p2:[
  {q:"Điều gì quan trọng khi một cộng đồng quyết định có xây nhà máy điện mới gần đó hay không?",
   a:"Có ba yếu tố then chốt mà một cộng đồng nên cân nhắc trước khi xây nhà máy điện mới ở gần. Yếu tố thứ nhất là an toàn và môi trường. Mọi người phải chắc chắn rằng nhà máy sẽ không làm ô nhiễm không khí hay nguồn nước, và có kế hoạch cho các sự cố. Ví dụ, một nhà máy nhiệt điện than có thể gây các vấn đề sức khỏe cho trẻ em. Yếu tố thứ hai là lợi ích cho người dân địa phương. Một nhà máy mới có thể tạo việc làm và thu hút đầu tư, và cộng đồng nên xem cư dân có được điện rẻ hơn hoặc đường tốt hơn không. Yếu tố thứ ba là tác động lâu dài. Chúng ta nên hỏi 20 hay 30 năm nữa sẽ ra sao: ai sẽ trả tiền dọn dẹp, và nhà máy có dùng được năng lượng sạch không? Tóm lại, cộng đồng nên cân bằng giữa an toàn, lợi ích và tương lai lâu dài trước khi quyết định."},
  {q:"Hãy kể về một dịp khi điều bạn thấy hóa ra rất khác với thực tế.",
   a:"Tôi muốn kể về một lần ấn tượng đầu tiên hoàn toàn sai. Vài năm trước, tôi đến một nhà hàng vì bên ngoài trông rất đẹp, với đèn sáng và biển hiệu hiện đại. Tôi mong đợi món ăn ngon. Tuy nhiên, khi chúng tôi ngồi xuống, phục vụ chậm, đồ ăn nguội, và giá rất cao. Sau đó, bạn tôi đưa tôi đến một quán nhỏ cũ gần nhà. Trông nó bẩn và đơn sơ, nhưng chủ quán thân thiện và đồ ăn tuyệt vời. Hôm đó tôi nhận ra vẻ bề ngoài có thể gây hiểu lầm. Điều tôi học được là không nên đánh giá một nơi qua bề ngoài. Như người ta nói, đừng đánh giá cuốn sách qua bìa của nó. Từ đó, tôi luôn cố xem đánh giá và cho những quán đơn giản một cơ hội."},
  {q:"Vì sao một số người nỗ lực hết sức để tách thời gian làm việc khỏi thời gian thư giãn?",
   a:"Tôi nghĩ có ba lý do chính. Lý do thứ nhất là sức khỏe tinh thần. Nếu làm việc cả ngày lẫn đêm, con người căng thẳng và có thể kiệt sức. Thời gian nghỉ giúp não hồi phục, nên sau đó họ làm việc hiệu quả hơn. Lý do thứ hai là gia đình và đời sống riêng. Nhiều người muốn dành buổi tối cho con cái hoặc bạn bè, và không muốn tin nhắn công việc làm gián đoạn. Lý do thứ ba là công nghệ. Điện thoại thông minh và làm việc tại nhà khiến ranh giới giữa công việc và thư giãn rất mỏng, nên người ta phải cố hơn để giữ nó. Ví dụ, một đồng nghiệp của tôi tắt điện thoại công việc lúc sáu giờ mỗi ngày. Tóm lại, một ranh giới rõ ràng giúp con người khỏe mạnh và hạnh phúc, và về lâu dài còn cải thiện công việc của họ."},
  {q:"Công ty lớn hay startup nhỏ giỏi hơn trong việc tạo ra ý tưởng mới?",
   a:"Theo tôi, các startup nhỏ thường giỏi tạo ra ý tưởng mới hơn, dù công ty lớn cũng có thế mạnh riêng. Thứ nhất, startup linh hoạt. Họ có ít tầng quản lý nên một ý tưởng hay có thể thành sản phẩm nhanh chóng, không cần những cuộc họp dài. Họ cũng dám mạo hiểm hơn vì ít có gì để mất. Mặt khác, công ty lớn có tiền, thiết bị và chuyên gia, rất quan trọng để phát triển và thử nghiệm ý tưởng mới. Ví dụ, một công ty công nghệ lớn có thể chi hàng triệu cho nghiên cứu. Tuy nhiên, công ty lớn thường chậm và sợ thất bại, nên nhiều ý tưởng hay bị từ chối. So với công ty lớn, startup sáng tạo hơn, nhưng họ thường cần được hỗ trợ. Tóm lại, tôi cho rằng kết quả tốt nhất đến khi startup tạo ra ý tưởng và công ty lớn giúp chúng lớn lên."},
  {q:"Làm thế nào con người có thể tự rèn mình để nhận ra những chi tiết mà người khác bỏ sót?",
   a:"Có ba cách để con người tự rèn luyện nhận ra nhiều chi tiết hơn. Cách thứ nhất là chậm lại. Chúng ta thường nhìn mọi thứ rất nhanh và bỏ sót điểm quan trọng, nên cần dừng lại một chút và quan sát cẩn thận, ví dụ khi đi dạo công viên hoặc đọc một bản hợp đồng. Cách thứ hai là luyện tập bằng trò chơi và công cụ. Câu đố và trò tìm điểm khác biệt giúp cải thiện sự tập trung, còn ghi chép hay chụp ảnh giúp ta nhớ những gì đã thấy. Cách thứ ba là học từ chuyên gia. Một người thầy giỏi hoặc một thám tử nhiều kinh nghiệm có thể chỉ cho ta cần tìm gì, và ta có thể bắt chước phương pháp của họ. Ví dụ, một kế toán giỏi kiểm tra những con số nhỏ mà người khác bỏ qua. Tóm lại, nhờ luyện tập đều đặn, việc để ý chi tiết sẽ thành thói quen."}
 ]

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const HOMO={too:'to',two:'to',their:'there',four:'for',hear:'here'};
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function numWords(n){if(n<20)return ONES[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+ONES[n%10]:'');if(n<1000)return ONES[Math.floor(n/100)]+' hundred'+(n%100?' '+numWords(n%100):'');if(n<1e6)return numWords(Math.floor(n/1000))+' thousand'+(n%1000?' '+numWords(n%1000):'');return String(n)}
function toks(s){s=String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/%/g,' percent ').replace(/(\d),(\d)/g,'$1$2').replace(/-/g,' ');
  const out=[];for(let w of (s.match(/[a-z0-9']+/g)||[])){w=w.replace(/^'+|'+$/g,'');if(!w)continue;if(CONTR[w]){out.push(...CONTR[w].split(' '));continue}w=w.replace(/'s$/,'');

function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

  for(let i=1;i<=n;i++){D[i][0]=i;T[i][0]=2}for(let j=1;j<=m;j++){D[0][j]=j;T[0][j]=3}
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++){const k=rel(R[i-1],H[j-1]),dg=D[i-1][j-1]+[0,.4,1.2][k],up=D[i-1][j]+1,lf=D[i][j-1]+1;
    if(dg<=up&&dg<=lf){D[i][j]=dg;T[i][j]=1}else if(up<=lf){D[i][j]=up;T[i][j]=2}else{D[i][j]=lf;T[i][j]=3}}

  return ops.reverse()}

/* Phân tích âm thanh: tìm chỗ ngập ngừng (im lặng từ 1,2 giây trở lên giữa bài) */

function analyseLevels(lv){if(lv.length<10)return null;const so=[...lv].sort((a,b)=>a-b),fl=so[Math.floor(so.length*.05)],thr=Math.min(.04,Math.max(.012,fl*3)),sp=lv.map(v=>v>thr);

/* Lỗi ngữ pháp người Việt hay gặp (chỉ bắt được các lỗi phổ biến, máy chép lời hay tự sửa câu) */

 [/\ban (?:uni|use|usu|eur|one)[a-z]*\b/,'Trước các từ như university, one, useful dùng a, không dùng an.'],

];
const ADV=new Set([...ALLW.map(x=>x.w.toLowerCase()),...['recognition','incentive','incentives','rotation','burnout','purpose','repetitive','meaningful','donate','volunteer','awareness','guarantee','reliable','storage','renewable','credibility','innovation','adopt','infrastructure','affordable','ethical','deceive','misleading','exaggerate','boundary','productive','flexible','bureaucracy','funding','observe','concentrate','pollution','investment','long-term','appearance','impression','consumers','responsibility','effective','convenient','advantage','disadvantage','significant','essential','particularly','generally','therefore','however','although','whereas','compared','balance','environment','community','policy','potential']]);
const LINK={opinion:/\b(i think|i believe|in my opinion|i would say|i'd say|i agree|i disagree|to be honest|i feel)\b/,reason:/\b(one reason|another reason|first of all|firstly|secondly|second|third|the first|because|since|there are (two|three)|the main reason)\b/,example:/\b(for example|for instance|such as|take my|what i mean)\b/,contrast:/\b(on the other hand|however|although|while|whereas|compared with|but)\b/,conclusion:/\b(overall|in conclusion|to conclude|in the long run|finally|in short|to sum up|that's all)\b/};
const clamp=(v,a=1,b=10)=>Math.max(a,Math.min(b,v)),r1=v=>Math.round(v*10)/10;

/* Chấm khi nói tự do: ước lượng 4 tiêu chí của cô, mỗi tiêu chí 25% */
function scoreFree(o){const heard=o.heard.trim(),T=toks(heard),n=T.length,secs=Math.max(1,o.secs),au=o.au,x=o.x,goal=o.goal;
  const out={fix:[],crit:[],n,wpm:Math.round(n*60/secs)};const pauses=au&&au.pauses?au.pauses:[];out.pauses=pauses;
  /* Trôi chảy */
  let fl=10,fn=[];if(pauses.length>2){fl-=Math.min(5,.8*(pauses.length-2));fn.push(`${pauses.length} chỗ ngập ngừng từ 1,2 giây (cô cho 9 đến 10 điểm nếu chỉ 1 đến 2 lần)`)}else fn.push(`chỉ ${pauses.length} chỗ ngập ngừng`);
  if(n){if(out.wpm<80){fl-=Math.min(3,(80-out.wpm)/15);fn.push(`nói hơi chậm (${out.wpm} từ/phút)`)}else if(out.wpm>180){fl-=Math.min(2,(out.wpm-180)/25);fn.push(`nói hơi nhanh (${out.wpm} từ/phút)`)}else fn.push(`tốc độ ${out.wpm} từ/phút`)}
  if(secs<goal[0]){fl-=Math.min(3.5,(goal[0]-secs)/goal[0]*5);fn.push(`mới nói ${secs} giây, mục tiêu ${goal[0]} đến ${goal[1]} giây`)}

  out.crit.push({k:'Pronunciation (phát âm)',s:pr==null?null:r1(clamp(pr)),note:pn});
  if(uset.length)out.fix.push({t:`Từ máy nghe chưa chắc: ${uset.slice(0,12).join(', ')}`,words:uset.slice(0,12),tip:'Bấm loa nghe cách đọc đúng, đọc lại từng từ rồi nói cả câu.'});

  const hit=kws.filter(k=>k.split(/[\s-]+/).every(p=>tset.includes(stemOf(p)))),miss=kws.filter(k=>!hit.includes(k));
  const low=' '+heard.toLowerCase().replace(/[’‘]/g,"'")+' ';const used=Object.keys(LINK).filter(k=>LINK[k].test(low)),lack=Object.keys(LINK).filter(k=>!used.includes(k));
  const stop=new Set('the a an and or of to in on at is are was were be it this that for with as by from have has had not but we you they he she i my your our their so if can will would should could do does did there then than also very more most one two three about into when what which who how why'.split(' '));
  const sm=new Set(toks(x.a).filter(w=>!stop.has(w)&&w.length>3)),sp=new Set(T.filter(w=>!stop.has(w)&&w.length>3)),ov=sm.size?[...sp].filter(w=>sm.has(w)).length/sm.size:0;
  const mid=(goal[0]+goal[1])/2,wantW=mid*120/60,lenR=Math.min(1,n/wantW);
  const ct=clamp(1+9*(.28*(hit.length/kws.length)+.22*Math.min(1,ov/.3)+.25*(used.length/5)+.25*lenR));

  if(miss.length)out.fix.push({t:`Chưa dùng từ khóa gợi ý: ${miss.join(', ')}`,tip:'Thêm 1 đến 2 từ này vào ý chính hoặc ví dụ để nội dung chắc hơn.'});

  errs.forEach(e=>out.fix.push({t:`Ngữ pháp: “${e.m}”`,tip:e.msg}));
  if(copied)out.fix.push({t:'Lặp lại gần nguyên câu hỏi',tip:'Cô dặn đừng lặp lại câu hỏi. Diễn đạt lại bằng từ khác rồi trả lời thẳng.'});

/* Chấm khi đọc theo bài mẫu: so từng từ máy nghe được với bài mẫu */
function scoreRead(o){const ref=o.ref,refDisp=ref.split(/\s+/).filter(Boolean),U=[];refDisp.forEach((d,di)=>toks(d).forEach(w=>U.push({w,d:di})));
  const H=toks(o.heard),ops=align(U.map(u=>u.w),H),st=U.map(()=>({k:'d'}));let ok=0,cl=0,bad=0,miss=0,extra=0;
  ops.forEach(p=>{if(p.k==='i'){extra++;return}if(p.k==='d'){miss++;st[p.r]={k:'d'};return}if(p.k===0){ok++;st[p.r]={k:'m'}}else if(p.k===1){cl++;st[p.r]={k:'c',h:H[p.h]}}else{bad++;st[p.r]={k:'s',h:H[p.h]}}});
  let tail=0;for(let i=U.length-1;i>=0&&st[i].k==='d';i--)tail++;
  const N=U.length,acc=N?(ok+.5*cl)/N:0,seen=N-tail,accSeen=seen?(ok+.5*cl)/seen:0;
  const rank={m:0,c:1,d:2,s:3},dispS=refDisp.map(()=>({k:'m'}));
  U.forEach((u,i)=>{if(rank[st[i].k]>rank[dispS[u.d].k])dispS[u.d]=st[i]});
  return{refDisp,dispS,ok,cl,bad,miss,extra,N,acc,accSeen,tail,H}}

      if(t.dataset.chk!=null){let ok=0;const bl=$$('.blank',box);bl.forEach(b=>{const g=b.value.trim().toLowerCase()===b.dataset.a.toLowerCase();b.classList.remove('ok','no');b.classList.add(g?'ok':'no');if(g)ok++});$('.res',box).textContent=`Đúng ${ok}/${bl.length}. Chỗ sai thì xem lần 3 rồi thử lại.`}}})};

/* ---------- Key Points ---------- */
views.key=arg=>{const n=+arg||store.get('ku',1);store.set('ku',n);const u=UNITS[n-1];
  $('#main').innerHTML=`${unitBar(n,'key')}<h1>Key Points Unit ${n}: ${esc(u.title)}</h1><p class="sub">${esc(u.vi)}. Bản rút gọn đọc trước giờ thi. <button class="link noprint" type="button" onclick="window.print()">In trang này</button></p>
  <div class="learn"><section class="card"><h3>Câu hỏi của Unit</h3><p class="en">${esc(u.q)}</p></section>
  <section class="card"><h3>Kỹ năng và ngữ pháp</h3><ul class="kp">${u.skills.map(r=>`<li><b>${esc(r[0])}</b></li>`).join('')}</ul></section>
  <section class="card"><h3>Từ vựng</h3><ul class="kp">${u.vocab.map(r=>`<li><span class="en">${esc(r[0])}</span> <span class="ipa">${esc(r[1])}</span> <span class="vi">${esc(r[3])}</span></li>`).join('')}</ul></section>
  <section class="card"><h3>Nội dung bài nghe</h3><ul class="kp">${u.key.map(r=>`<li><b>${esc(r[0])}</b><span class="vi">${esc(r[1])}</span></li>`).join('')}</ul></section></div>`};

document.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s){speak(s.dataset.say);return}
  const g=e.target.closest('[data-go]');if(g&&g.tagName!=='NAV'){e.preventDefault();window._pendq=g.dataset.q!=null?+g.dataset.q:null;go(g.dataset.go,g.dataset.arg===''?undefined:g.dataset.arg)}});
header();go((location.hash||'').slice(1)||store.get('view','home'));
</script>
</body></html>
