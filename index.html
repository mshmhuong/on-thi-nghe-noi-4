ss even if they work as hard. The third is education of consumers. When shoppers learn about child labor or forest damage, they choose differently, which forces companies to change. To sum up, markets, prices and awareness make a chain from the shop to the farm. That’s why I believe responsible shopping is part of global cooperation.","v":"Tôi muốn nói về việc vì sao người mua ở một nước có thể ảnh hưởng đến nông dân ở nước khác. Theo tôi có ba lý do chính. Thứ nhất, thương mại toàn cầu nối các thị trường. Cà phê, gạo và hải sản Việt Nam đi nhiều nước, nên thay đổi nhu cầu nước ngoài trực tiếp đổi thu nhập địa phương. Thứ hai là tiền tệ và giá. Nếu người ở nước giàu mua ít đi, giá giảm toàn cầu, và nông dân kiếm ít hơn dù làm chăm như cũ. Thứ ba là nhận thức của người tiêu dùng. Khi người mua biết về lao động trẻ em hay phá rừng, họ chọn khác, buộc công ty thay đổi. Tóm lại, thị trường, giá và nhận thức tạo một chuỗi từ cửa hàng đến nông trại. Vì vậy tôi tin mua sắm có trách nhiệm là một phần của hợp tác toàn cầu."},{"a":"I’d like to talk about why consumer choices in one country affect farmers elsewhere. I believe there are three main reasons. The first is dependence. Many small farmers sell to only one or two big buyers, so one decision from a distant company can change their year. The second is the middlemen. Between the farmer and the shopper, there are traders and exporters who take part of the money, so if shoppers choose cheap goods, middlemen may squeeze farmers first. The third is the environment. Cheap products often come from methods that harm the soil and water, which hurts farmers in the future. To sum up, dependence, middlemen and the environment explain the link. That’s why I believe choosing quality and fair prices helps everyone in the long run.","v":"Tôi muốn nói về việc vì sao lựa chọn của người tiêu dùng ở một nước ảnh hưởng đến nông dân nơi khác. Tôi tin có ba lý do chính. Thứ nhất là sự phụ thuộc. Nhiều nông dân nhỏ chỉ bán cho một hai người mua lớn, nên một quyết định của công ty xa có thể đổi cả năm của họ. Thứ hai là trung gian. Giữa nông dân và người mua có thương lái và nhà xuất khẩu lấy một phần tiền, nên nếu người mua chọn hàng rẻ, trung gian có thể ép nông dân trước. Thứ ba là môi trường. Sản phẩm rẻ thường đến từ phương pháp hại đất và nước, làm tổn hại nông dân sau này. Tóm lại, sự phụ thuộc, trung gian và môi trường giải thích mối liên hệ. Vì vậy tôi tin chọn chất lượng và giá công bằng giúp mọi người về lâu dài."}],"q":"Why the choices of consumers in one country can affect the lives of farmers in another.","vi":"Vì sao lựa chọn của người tiêu dùng ở một nước có thể ảnh hưởng đến cuộc sống của nông dân ở nước khác."}]},{"code":"07","p1":[{"type":"Ý kiến (opinion)","out":"Trả lời: có, phần nào. Lý do 1: từ ngữ cho thấy cảm xúc, thái độ. Lý do 2: từ lịch sự hay thô cho thấy cách tôn trọng người khác. Kết: nhưng không nên kết luận vội.","words":"personality, vocabulary, polite, attitude, reveal, tone, stereotype","vers":[{"a":"I think our words show a lot about us, but not everything. First, words show our attitude. People who say “please” and “thank you” usually respect others. People who always say negative words may be unhappy. For example, when a customer writes to me politely, I think he is patient. But we should not judge too fast. Words give us a hint, and we need time to know a person.","v":"Tôi nghĩ từ ngữ cho thấy nhiều về ta nhưng không phải tất cả. Thứ nhất, từ ngữ cho thấy thái độ. Người nói “làm ơn” và “cảm ơn” thường tôn trọng người khác. Người luôn nói từ tiêu cực có thể không vui. Ví dụ, khi khách viết cho tôi lịch sự, tôi nghĩ anh ấy kiên nhẫn. Nhưng ta không nên đánh giá quá nhanh. Từ ngữ cho ta gợi ý và ta cần thời gian để biết một người."},{"a":"I agree, because words show values. A person who often says ‘we’ is probably a team player, while someone who says ‘I’ all the time may be more individual. When I read emails from suppliers, the way they write tells me if they are reliable. Still, a word can have different meanings in different situations, so I try to listen to the whole message before I judge.","v":"Tôi đồng ý, vì từ ngữ cho thấy giá trị. Người hay nói ‘chúng ta’ có lẽ là người làm việc nhóm, còn người nói ‘tôi’ suốt có thể cá nhân hơn. Khi đọc email của nhà cung cấp, cách họ viết cho tôi biết họ có đáng tin không. Dù vậy một từ có thể mang nghĩa khác trong tình huống khác, nên tôi cố nghe cả thông điệp trước khi đánh giá."},{"a":"I think word choices show our mood and our attitude to life. Optimistic people say ‘opportunity’ and ‘challenge’, while pessimistic people say ‘problem’ and ‘impossible’. For example, one of my workers always says ‘no problem, I will try’, and he is the most positive person in the workshop. So listening to words can help us understand people better.","v":"Tôi nghĩ cách chọn từ cho thấy tâm trạng và thái độ sống. Người lạc quan nói ‘cơ hội’ và ‘thử thách’, người bi quan nói ‘vấn đề’ và ‘không thể’. Ví dụ, một công nhân của tôi luôn nói ‘không sao, em sẽ thử’, và anh là người tích cực nhất xưởng. Nên lắng nghe từ ngữ giúp ta hiểu người hơn."},{"a":"In my view, words reveal personality, but also education and culture. A person with a rich vocabulary is usually someone who reads a lot. Polite words, such as ‘would you mind’, show good manners. However, some shy people use few words but are very kind. So words are a clue, not a final answer.","v":"Theo tôi, từ ngữ tiết lộ tính cách, và cả học vấn lẫn văn hóa. Người vốn từ phong phú thường đọc nhiều. Lời lịch sự như ‘phiền bạn…’ thể hiện cách cư xử tốt. Tuy nhiên một số người nhút nhát dùng ít từ nhưng rất tử tế. Nên từ ngữ là manh mối chứ không phải đáp án cuối cùng."},{"a":"I think yes. When people are angry, they choose strong words and blame others. When they are calm, they use balanced language. In negotiations about debts, I listen carefully to the words customers use, because they show whether the person wants to solve the problem or avoid it. That helps me decide how to respond.","v":"Tôi nghĩ có. Khi giận, người ta chọn từ mạnh và đổ lỗi. Khi bình tĩnh, họ dùng ngôn ngữ cân bằng. Trong đàm phán công nợ, tôi lắng nghe kỹ từ khách dùng vì chúng cho thấy họ muốn giải quyết hay né tránh. Điều đó giúp tôi quyết định phản hồi thế nào."}],"q":"How do people's word choices reveal their personality?","vi":"Cách chọn từ của một người tiết lộ tính cách của họ như thế nào?"},{"type":"Chọn một bên (choice)","out":"Chọn một bên. Lý do 1: áp lực tạo tập trung. Lý do 2: nhưng quá nhiều áp lực gây sai sót. Ví dụ báo cáo thuế cuối kỳ. Kết: áp lực vừa phải.","words":"pressure, deadline, focus, stress, procrastinate, plenty of time, mistake","vers":[{"a":"I work better with a little pressure. When the deadline is near, I focus and do not waste time. For example, in tax season I finish my accounting work faster. If I have too much time, I wait and do it later, and I make mistakes. But too much pressure is not good because I get tired. So I like a clear deadline and enough time to check my work.","v":"Tôi làm việc tốt hơn khi có chút áp lực. Khi hạn chót gần, tôi tập trung và không lãng phí thời gian. Ví dụ, vào mùa thuế tôi làm sổ sách nhanh hơn. Nếu có quá nhiều thời gian, tôi để sau và làm sai. Nhưng quá nhiều áp lực không tốt vì tôi mệt. Nên tôi thích hạn chót rõ và đủ thời gian kiểm tra lại."},{"a":"I prefer to have plenty of time, because I like to check details. When I prepare financial statements, I need quiet and focus to avoid errors. Pressure makes me rush, and I may forget something. However, I know that a deadline is sometimes necessary, otherwise I would continue to improve the work forever. So I ask for enough time, plus a firm date.","v":"Tôi thích có nhiều thời gian vì tôi thích kiểm tra chi tiết. Khi lập báo cáo tài chính, tôi cần yên tĩnh và tập trung để tránh sai. Áp lực khiến tôi vội và có thể quên điều gì đó. Tuy nhiên tôi biết đôi khi cần hạn chót, nếu không tôi sẽ cứ cải thiện mãi. Nên tôi xin đủ thời gian cùng một ngày chốt cứng."},{"a":"It depends on the task. For creative tasks, such as planning a marketing idea, I need plenty of time to think. For routine tasks, such as entering invoices, pressure helps me finish quickly. Knowing this, I try to choose the style that suits each task. That is more effective than one rule for everything.","v":"Còn tùy công việc. Với việc sáng tạo như lên ý tưởng tiếp thị, tôi cần nhiều thời gian suy nghĩ. Với việc thường như nhập hóa đơn, áp lực giúp tôi xong nhanh. Biết vậy, tôi chọn cách hợp với từng việc. Cách đó hiệu quả hơn một quy tắc cho mọi thứ."},{"a":"Under pressure, I work faster but with more stress. When the tax deadline is close, I stay up late and drink a lot of coffee. It works, but my health suffers. With plenty of time, I stay calm and the quality is better. So now I plan earlier, to have time and a small deadline at the same time.","v":"Dưới áp lực, tôi làm nhanh hơn nhưng căng thẳng hơn. Khi hạn thuế gần, tôi thức khuya và uống nhiều cà phê. Có hiệu quả, nhưng sức khỏe bị ảnh hưởng. Với nhiều thời gian, tôi bình tĩnh và chất lượng tốt hơn. Nên giờ tôi lên kế hoạch sớm hơn để vừa có thời gian vừa có hạn chót nhỏ."},{"a":"I think I work best with moderate pressure, like a clear target for each week. A weekly target keeps me moving, and I still have time to think. Too much time makes me lazy, and too little time makes me nervous. So I divide a big task into small parts with small deadlines.","v":"Tôi nghĩ tôi làm tốt nhất với áp lực vừa phải, như mục tiêu rõ mỗi tuần. Mục tiêu tuần giữ tôi tiến lên mà vẫn có thời gian suy nghĩ. Quá nhiều thời gian khiến tôi lười, quá ít khiến tôi lo. Nên tôi chia việc lớn thành phần nhỏ với hạn chót nhỏ."}],"q":"Do you work better under pressure or with plenty of time?","vi":"Bạn làm việc tốt hơn khi chịu áp lực hay khi có nhiều thời gian?"},{"type":"Hai ý (two things)","out":"Ý 1: sở thích khi bán được, có khách đặt thì thành áp lực. Ý 2: khi phải làm đúng chuẩn, đúng hạn thì mất vui. Ví dụ nấu ăn, may vá, chụp ảnh. Kết.","words":"hobby, turn into, deadline, customer, passion, pressure, enjoyment","vers":[{"a":"I think cooking, taking photos and making handmade things can easily become hard work. When you start to sell your products, customers want things on time and with good quality. For example, my friend loved to bake cakes. When she opened a shop, she had to get up at four o’clock every day. The hobby lost its fun. So if you want to enjoy a hobby, do not make it your job.","v":"Tôi nghĩ nấu ăn, chụp ảnh và làm đồ thủ công dễ thành việc nặng. Khi bắt đầu bán sản phẩm, khách muốn đúng hạn và chất lượng tốt. Ví dụ, bạn tôi thích làm bánh. Khi mở tiệm, cô phải dậy bốn giờ mỗi ngày. Sở thích mất đi niềm vui. Nên nếu muốn tận hưởng sở thích, đừng biến nó thành công việc."},{"a":"I think sports and games can turn into hard work. For example, a person who loves running starts to prepare for a marathon, and then training becomes strict and tiring. Once there is a goal, a ranking or a coach, the fun can disappear. So I believe a hobby needs freedom to stay enjoyable.","v":"Tôi nghĩ thể thao và trò chơi có thể thành việc nặng nhọc. Ví dụ, một người thích chạy bộ bắt đầu chuẩn bị cho marathon, rồi việc tập trở nên nghiêm ngặt và mệt. Khi có mục tiêu, bảng xếp hạng hay huấn luyện viên, niềm vui có thể mất. Nên tôi tin sở thích cần sự tự do để giữ niềm vui."},{"a":"Creative hobbies like writing, painting or making videos can become heavy when you try to share them with an audience. You start to worry about views and comments. A friend of mine who loved editing videos felt stressed when he started a channel. The lesson is that expectations can change a hobby into a duty.","v":"Sở thích sáng tạo như viết, vẽ hay làm video có thể trở nên nặng khi bạn cố chia sẻ cho khán giả. Bạn bắt đầu lo về lượt xem và bình luận. Một người bạn của tôi thích dựng video thấy căng thẳng khi lập kênh. Bài học là kỳ vọng có thể biến sở thích thành nghĩa vụ."},{"a":"Collecting things can also turn into hard work. At first, collecting stamps or coins is fun, but later you must spend a lot of money and time to find rare items. It becomes a kind of competition. In my opinion, hobbies are healthy when we keep them small and relaxed.","v":"Sưu tầm cũng có thể thành việc nặng nhọc. Ban đầu sưu tầm tem hay tiền xu vui, nhưng sau phải tốn nhiều tiền và thời gian tìm món hiếm. Nó thành một kiểu cạnh tranh. Theo tôi, sở thích lành mạnh khi ta giữ chúng nhỏ và thoải mái."},{"a":"I think gardening and cooking can become hard work, especially for a family. Once you must feed everyone every day, cooking is no longer a hobby. Similarly, a garden needs regular care, even when you are tired. For me, the difference between a hobby and work is whether I can stop whenever I want.","v":"Tôi nghĩ làm vườn và nấu ăn có thể thành việc nặng, nhất là với gia đình. Khi phải nuôi cả nhà mỗi ngày, nấu ăn không còn là sở thích. Tương tự, khu vườn cần chăm đều, kể cả khi mệt. Với tôi, khác biệt giữa sở thích và việc là mình có dừng được khi muốn không."}],"q":"What kinds of hobbies can easily turn into hard work?","vi":"Những sở thích nào dễ biến thành công việc nặng nhọc?"},{"type":"Ý kiến, ví dụ (opinion)","out":"Trả lời: không hoàn toàn. Lý do 1: trí nhớ bị ảnh hưởng bởi cảm xúc, thời gian. Lý do 2: người kể khác nhau cùng một việc. Ví dụ. Kết: ghi lại bằng chứng.","words":"memory, witness, detail, unreliable, emotion, evidence, record","vers":[{"a":"I trust my memory a little, but not completely. Memory changes with time and with feelings. For example, two of my workers told me different stories about the same accident, and both believed they were right. We also forget small details like time or numbers. So I write down important things and keep photos and papers. I think memory is good for the general story, but notes are better for details.","v":"Tôi tin trí nhớ một chút nhưng không hoàn toàn. Trí nhớ đổi theo thời gian và cảm xúc. Ví dụ, hai công nhân kể cho tôi hai câu chuyện khác nhau về cùng một tai nạn và cả hai đều tin mình đúng. Ta cũng quên chi tiết nhỏ như giờ hay con số. Nên tôi ghi lại việc quan trọng và giữ ảnh, giấy tờ. Tôi nghĩ trí nhớ tốt cho câu chuyện chung, còn ghi chép tốt hơn cho chi tiết."},{"a":"I only partly trust my memory. Studies show that people can remember something that never happened. For this reason, I check important events with documents, for example, messages or photos. In the family, when we disagree about a past event, we look at old pictures. That is a gentle way to find the truth.","v":"Tôi chỉ tin trí nhớ một phần. Các nghiên cứu cho thấy người ta có thể nhớ điều chưa từng xảy ra. Vì vậy tôi kiểm tra sự việc quan trọng bằng tài liệu như tin nhắn hay ảnh. Trong gia đình, khi bất đồng về chuyện cũ, chúng tôi xem ảnh cũ. Đó là cách nhẹ nhàng để tìm sự thật."},{"a":"I trust my memory for big things, but not for small details. I remember the feeling of an event clearly, but I might forget the exact words or time. In business, a small detail can matter, for example the delivery date, so I write it down immediately. A notebook is more reliable than my brain.","v":"Tôi tin trí nhớ với việc lớn nhưng không với chi tiết nhỏ. Tôi nhớ rõ cảm giác của một sự kiện nhưng có thể quên lời hay giờ chính xác. Trong kinh doanh, chi tiết nhỏ có thể quan trọng, ví dụ ngày giao hàng, nên tôi ghi ngay. Cuốn sổ đáng tin hơn bộ não tôi."},{"a":"Honestly, my memory is not perfect when I am stressed or tired. If I witness a busy event, I notice only parts of it. Other people see different parts, so their memories differ. That is why I ask others and compare their stories before I decide who is right.","v":"Thành thật mà nói, trí nhớ tôi không hoàn hảo khi căng thẳng hay mệt. Nếu chứng kiến một sự kiện bận rộn, tôi chỉ chú ý một phần. Người khác thấy phần khác nên trí nhớ khác. Vì vậy tôi hỏi người khác và so các câu chuyện trước khi quyết ai đúng."},{"a":"I believe memory is useful but changes with time. Each time we remember a story, we may add or remove something. So I try to be humble, and I use phrases like ‘as far as I remember’. That keeps me open to correction and prevents arguments.","v":"Tôi tin trí nhớ hữu ích nhưng đổi theo thời gian. Mỗi lần nhớ lại câu chuyện, ta có thể thêm hoặc bớt điều gì. Nên tôi cố khiêm tốn và dùng cụm như ‘theo tôi nhớ’. Điều đó giữ tôi cởi mở với việc sửa và tránh cãi nhau."}],"q":"Do you trust your own memory of events you witnessed?","vi":"Bạn có tin vào trí nhớ của chính mình về những sự kiện bạn chứng kiến không?"},{"type":"Ý kiến (opinion)","out":"Chọn: có, nên làm nhiều hơn. Lý do 1: nước giàu hưởng lợi từ thương mại, có trách nhiệm. Lý do 2: giúp họ ổn định thì cả thế giới ổn định. Mặt trái: cần minh bạch, tránh lệ thuộc.","words":"developing countries, aid, responsibility, education, trade, dependence, transparent","vers":[{"a":"I think rich countries should do more, but in a smart way. First, rich countries got a lot of money from trade, so they should share. Second, if poor countries have good schools and hospitals, the world is safer. For example, training programs help people start their own business. But the help must be honest, or the money may not reach the people. I think schools and fair trade are better than only giving money.","v":"Tôi nghĩ các nước giàu nên làm nhiều hơn nhưng theo cách thông minh. Thứ nhất, nước giàu có nhiều tiền từ thương mại nên nên chia sẻ. Thứ hai, nếu nước nghèo có trường và bệnh viện tốt, thế giới an toàn hơn. Ví dụ, các chương trình đào tạo giúp người dân tự khởi nghiệp. Nhưng sự giúp đỡ phải trung thực, nếu không tiền có thể không đến người cần. Tôi nghĩ trường học và thương mại công bằng tốt hơn chỉ cho tiền."},{"a":"I think rich countries should help, especially with climate change. Poorer countries often suffer more from floods and drought, even though they produce less pollution. Rich countries can share technology like solar panels and water systems. This is fair and also protects everyone’s future.","v":"Tôi nghĩ các nước giàu nên giúp, nhất là về biến đổi khí hậu. Các nước nghèo thường chịu lũ và hạn nặng hơn dù thải ít ô nhiễm hơn. Nước giàu có thể chia sẻ công nghệ như pin mặt trời và hệ thống nước. Điều này công bằng và cũng bảo vệ tương lai của mọi người."},{"a":"I believe they should help, but the best way is to support education and health. If children can go to school, the country can grow by itself later. Giving only food is not enough. For example, scholarships and training for teachers produce long-term results. Help should create independence, not dependence.","v":"Tôi tin họ nên giúp, nhưng cách tốt nhất là hỗ trợ giáo dục và y tế. Nếu trẻ em được đi học, đất nước có thể tự phát triển sau này. Chỉ cho thức ăn là chưa đủ. Ví dụ, học bổng và đào tạo giáo viên cho kết quả lâu dài. Sự giúp đỡ nên tạo độc lập, không phải phụ thuộc."},{"a":"Rich countries could do more by opening their markets to poorer countries’ products, such as coffee, rice and clothes, with fair prices. This helps farmers and workers earn money themselves. In my opinion, fair trade is better than charity. It respects people’s dignity.","v":"Các nước giàu có thể làm nhiều hơn bằng cách mở thị trường cho sản phẩm của các nước nghèo như cà phê, gạo và quần áo với giá công bằng. Điều này giúp nông dân và công nhân tự kiếm tiền. Theo tôi, thương mại công bằng tốt hơn từ thiện. Nó tôn trọng phẩm giá con người."},{"a":"It depends. Each country must also take responsibility for its government and its policies. Rich countries can help, but if there is corruption, money may be wasted. So I think the help should be tied to clear goals and checking. They should support, not control.","v":"Còn tùy. Mỗi nước cũng phải có trách nhiệm về chính phủ và chính sách của mình. Nước giàu có thể giúp, nhưng nếu có tham nhũng, tiền có thể bị lãng phí. Nên tôi nghĩ sự giúp đỡ cần gắn với mục tiêu rõ và kiểm tra. Họ nên hỗ trợ, không kiểm soát."}],"q":"Should rich countries do more to help poorer countries develop?","vi":"Các nước giàu có nên làm nhiều hơn để giúp các nước nghèo phát triển không?"},{"type":"Hai điều (two things)","out":"Điều 1: vỉa hè thoáng, an toàn, có bóng cây. Điều 2: làn xe đạp riêng, gần chỗ làm, nơi gửi xe. Ví dụ ở thành phố của chị. Kết.","words":"pavement, bike lane, safe, shade, air pollution, traffic, convenient","vers":[{"a":"Two things would make me walk or cycle more. First, safe streets. In my city, motorbikes park on the pavement and there are few bike lanes. If the pavements were wide and clear, I would walk to the shops. Second, shade and clean air. The weather is hot, so I need trees. If the city did these things, many people would leave their motorbikes at home.","v":"Hai điều sẽ khiến tôi đi bộ hoặc đạp xe nhiều hơn. Thứ nhất, đường phố an toàn. Ở thành phố tôi, xe máy đậu trên vỉa hè và có ít làn xe đạp. Nếu vỉa hè rộng và thông thoáng, tôi sẽ đi bộ đến cửa hàng. Thứ hai, bóng mát và không khí sạch. Trời nóng nên tôi cần cây. Nếu thành phố làm những điều này, nhiều người sẽ để xe máy ở nhà."},{"a":"I would walk more if my city had more green spaces and cafes along the streets. Walking should be a pleasure, not a duty. For instance, a riverside path with trees and benches would be perfect for an evening walk with my family. I think cities that look beautiful also make people healthier.","v":"Tôi sẽ đi bộ nhiều hơn nếu thành phố có nhiều không gian xanh và quán cà phê dọc đường. Đi bộ nên là niềm vui chứ không phải nghĩa vụ. Ví dụ, một lối đi ven sông có cây và ghế dài sẽ tuyệt cho buổi đi bộ tối với gia đình. Tôi nghĩ thành phố đẹp cũng làm người dân khỏe hơn."},{"a":"Cheaper and safer bikes would make me cycle. If there were public bike-sharing stations and good locks, I could use a bike for short trips like going to the market. Also, I would feel more confident if drivers respected cyclists. A clear traffic rule and fines would help.","v":"Xe đạp rẻ hơn và an toàn hơn sẽ khiến tôi đạp xe. Nếu có các trạm xe đạp công cộng và khóa tốt, tôi có thể dùng xe đạp cho chuyến ngắn như đi chợ. Tôi cũng tự tin hơn nếu tài xế tôn trọng người đi xe đạp. Quy định giao thông rõ và phạt sẽ giúp."},{"a":"Cooler weather would motivate me, but we cannot change it. So I think shade and shelter are important, such as covered paths and trees. Also, if my office provided showers, I could cycle to work. Small facilities can change people’s habits.","v":"Thời tiết mát hơn sẽ khiến tôi muốn đi, nhưng ta không đổi được. Nên tôi nghĩ bóng mát và mái che quan trọng, như lối đi có mái và cây. Ngoài ra, nếu văn phòng có chỗ tắm, tôi có thể đạp xe đi làm. Tiện ích nhỏ có thể đổi thói quen của người dân."},{"a":"Time is the main problem for me. If shops, schools and clinics were all within fifteen minutes’ walk, I would not need a motorbike. So better city planning would help. I would also walk more if I had a friend to go with, because company makes exercise enjoyable.","v":"Thời gian là vấn đề chính với tôi. Nếu cửa hàng, trường học và phòng khám đều trong mười lăm phút đi bộ, tôi không cần xe máy. Nên quy hoạch thành phố tốt hơn sẽ giúp. Tôi cũng đi bộ nhiều hơn nếu có bạn đi cùng vì có bạn làm vận động thú vị."}],"q":"What would make you walk or cycle more in your city?","vi":"Điều gì khiến bạn đi bộ hoặc đạp xe nhiều hơn trong thành phố của mình?"},{"type":"Hai lý do (two reasons)","out":"Lý do 1: giá cao hoặc khó dùng. Lý do 2: thói quen và niềm tin của người dùng, thiếu hạ tầng.","words":"innovation, adopt, habit, affordable, infrastructure, trust, early adopters","vers":[{"a":"There are two main reasons. The first is cost and convenience. New products are often expensive or difficult to use at the beginning, so only a few early adopters, who like trying new things, buy them. The second reason is habit. People trust what they already know, and changing a habit takes time. For instance, electric cars are better for the environment, but many people still worry about charging stations and price. If prices fall and charging stations appear, more people will accept them.","v":"Có hai lý do chính. Lý do thứ nhất là chi phí và sự tiện dụng. Sản phẩm mới lúc đầu thường đắt hoặc khó dùng, nên chỉ một ít người dùng sớm, những người thích thử cái mới, mua chúng. Lý do thứ hai là thói quen. Con người tin vào những gì họ đã quen, và đổi một thói quen cần thời gian. Ví dụ, xe điện tốt hơn cho môi trường, nhưng nhiều người vẫn lo về trạm sạc và giá cả. Nếu giá giảm và trạm sạc xuất hiện nhiều hơn, sẽ có nhiều người chấp nhận hơn."},{"a":"There are two main reasons. First, many innovations need new rules and new skills. For example, online banking was invented years ago, but people had to learn how to use it and the government had to make rules to protect their money. Second, people are afraid of risk. When a product is new, nobody is sure that it is safe or that it will last, so they wait for others to try it first. Over time, good reviews and clear examples make people feel safe. Overall, trust and learning take time, and that’s why change is slow.","v":"Có hai lý do chính. Thứ nhất, nhiều phát minh cần quy định mới và kỹ năng mới. Ví dụ, ngân hàng trực tuyến được phát minh từ nhiều năm trước, nhưng người dân phải học cách dùng và chính phủ phải đặt ra quy định để bảo vệ tiền của họ. Thứ hai, con người sợ rủi ro. Khi một sản phẩm còn mới, không ai chắc nó an toàn hay bền, nên họ chờ người khác dùng thử trước. Theo thời gian, đánh giá tốt và các ví dụ rõ ràng khiến mọi người thấy yên tâm. Nhìn chung, niềm tin và việc học cần thời gian, và đó là lý do thay đổi diễn ra chậm."},{"a":"I think the biggest reasons are price and marketing. A new invention is usually expensive because few units are made, so ordinary families cannot buy it. Also, if people don’t hear about it or don’t see its benefits, they won’t try it. For instance, solar water heaters took many years to become common in Vietnam, because early models were costly and few people knew how well they worked. As the price falls and neighbours share their experience, more people join. In the long run, a useful and affordable idea always spreads.","v":"Tôi nghĩ lý do lớn nhất là giá cả và quảng bá. Một phát minh mới thường đắt vì được làm ra ít, nên các gia đình bình thường không mua nổi. Ngoài ra, nếu người ta không nghe nói đến hoặc không thấy lợi ích, họ sẽ không dùng thử. Ví dụ, máy nước nóng năng lượng mặt trời mất nhiều năm mới phổ biến ở Việt Nam, vì các mẫu đầu tiên đắt và ít người biết nó hoạt động tốt thế nào. Khi giá giảm và hàng xóm chia sẻ trải nghiệm, nhiều người tham gia hơn. Về lâu dài, một ý tưởng hữu ích và giá phải chăng luôn lan rộng."},{"a":"I think another reason is that people need to see proof. A new product may be good, but nobody wants to be the first customer. They wait for reviews or a recommendation from friends. For example, when mobile payment started, many shops hesitated until they saw others using it. Trust grows slowly, so popularity takes time.","v":"Tôi nghĩ một lý do khác là người ta cần thấy bằng chứng. Sản phẩm mới có thể tốt nhưng không ai muốn là khách đầu tiên. Họ đợi đánh giá hoặc lời giới thiệu từ bạn bè. Ví dụ, khi thanh toán di động bắt đầu, nhiều cửa hàng do dự đến khi thấy người khác dùng. Niềm tin lớn dần chậm, nên sự phổ biến cần thời gian."},{"a":"Sometimes a product is too early for its time. The technology exists, but the infrastructure or the rules are missing. For example, electric motorbikes are good, but without enough charging stations, people hesitate. Also, laws and safety standards may take years. So an innovation becomes popular only when the whole system is ready.","v":"Đôi khi sản phẩm đến quá sớm. Công nghệ có nhưng hạ tầng hoặc quy định thiếu. Ví dụ, xe máy điện tốt nhưng không đủ trạm sạc thì người ta do dự. Luật và tiêu chuẩn an toàn cũng có thể mất nhiều năm. Nên một đổi mới chỉ phổ biến khi cả hệ thống sẵn sàng."}],"q":"Why do some innovations take years to become popular?","vi":"Vì sao một số đổi mới phải mất nhiều năm mới phổ biến?"},{"type":"Ý kiến (opinion)","out":"Trả lời: khó, chưa nên chỉ dựa vào. Lý do 1: phụ thuộc thời tiết, ban đêm. Lý do 2: cần pin lưu trữ, chi phí. Giải pháp: kết hợp nguồn khác, dần dần.","words":"renewable, wind, solar, hydropower, storage, backup, transition","vers":[{"a":"I do not think a country can use only renewable energy now. Solar and wind power are not stable. When there is no sun or wind, we get less electricity. Also, big batteries are very expensive. So most countries need another source as backup. But technology is getting better, so in the future we can use more renewable energy. I think we should change step by step.","v":"Tôi không nghĩ một nước có thể chỉ dùng năng lượng tái tạo bây giờ. Điện mặt trời và gió không ổn định. Khi không có nắng hay gió, ta có ít điện hơn. Ngoài ra pin lớn rất đắt. Nên hầu hết các nước cần nguồn khác làm dự phòng. Nhưng công nghệ đang tốt hơn nên tương lai ta có thể dùng nhiều năng lượng tái tạo hơn. Tôi nghĩ ta nên thay đổi từng bước."},{"a":"I believe a country can depend on renewable energy only in some special conditions, for example Iceland, which has a lot of geothermal and hydropower. But for most countries, the weather and geography create limits. A country with few rivers or little wind will find it difficult. So the answer depends on natural resources.","v":"Tôi tin một quốc gia chỉ có thể dựa vào năng lượng tái tạo trong một số điều kiện đặc biệt, ví dụ Iceland có nhiều địa nhiệt và thủy điện. Nhưng với hầu hết các nước, thời tiết và địa lý tạo giới hạn. Nước ít sông hay ít gió sẽ gặp khó. Nên câu trả lời tùy tài nguyên thiên nhiên."},{"a":"Technically it is possible, but it requires huge investment in batteries and smart grids. If a country can afford it, it can supply energy from sun, wind and water at different times. Unfortunately, many countries still have limited budgets. So I think the goal is realistic only in the long term.","v":"Về kỹ thuật là có thể, nhưng cần đầu tư rất lớn vào pin và lưới điện thông minh. Nếu một nước đủ khả năng, nó có thể cung cấp năng lượng từ mặt trời, gió và nước vào các thời điểm khác nhau. Tiếc là nhiều nước vẫn ngân sách hạn chế. Nên tôi nghĩ mục tiêu chỉ thực tế về lâu dài."},{"a":"I think relying only on renewable energy is risky for factories. Businesses like mine need stable power. A power cut can stop the machines and damage products. Therefore, a mix of energy is safer. We can use renewable sources as the main part and keep a small backup.","v":"Tôi nghĩ chỉ dựa vào năng lượng tái tạo là rủi ro cho nhà máy. Doanh nghiệp như tôi cần điện ổn định. Cúp điện có thể làm dừng máy và hỏng sản phẩm. Vì vậy kết hợp nhiều nguồn năng lượng an toàn hơn. Ta có thể dùng tái tạo làm phần chính và giữ một phần dự phòng nhỏ."},{"a":"Yes, I think it will be possible in the future because technology is improving and costs are falling. Ten years ago, solar panels were very expensive, and now ordinary families can buy them. If this trend continues, a country could depend mostly on renewable energy within a few decades. But it needs political will and planning.","v":"Có, tôi nghĩ tương lai sẽ có thể vì công nghệ tiến bộ và chi phí giảm. Mười năm trước pin mặt trời rất đắt, giờ các gia đình bình thường mua được. Nếu xu hướng này tiếp tục, một nước có thể phụ thuộc chủ yếu vào năng lượng tái tạo trong vài thập kỷ. Nhưng cần ý chí chính trị và kế hoạch."}],"q":"Can a country depend only on renewable energy?","vi":"Một quốc gia có thể chỉ dựa vào năng lượng tái tạo không?"}],"p2":[{"type":"Một lần, một câu chuyện (a time)","out":"Mở: bối cảnh. Thân: thay đổi gì, lúc đầu lo gì, kết quả tốt ra sao. Bài học. Kết: thay đổi mở ra cơ hội.","words":"change, challenge, step out of comfort zone, opportunity, positive, adapt, turn out","vers":[{"a":"I want to talk about a time when a big change in my work was good for me. Ten years ago, I started to do accounting services for small businesses. I was worried at first. I had to learn new rules and a new program. And I had to talk to strangers about money. But there were three good results. First, I learned new skills and became more confident. Second, I earned more money, which helped my family. Third, I met many business owners, and they gave me ideas for my own company. I learned that change is scary at first, but it can open doors. Now I use the same idea when I study my master’s degree and English. So I think we should not be afraid of change.","v":"Tôi muốn kể về một lần thay đổi lớn trong công việc tốt cho tôi. Mười năm trước, tôi bắt đầu làm dịch vụ kế toán cho doanh nghiệp nhỏ. Lúc đầu tôi lo. Tôi phải học quy định mới và phần mềm mới. Và tôi phải nói với người lạ về tiền. Nhưng có ba kết quả tốt. Thứ nhất, tôi học kỹ năng mới và tự tin hơn. Thứ hai, tôi kiếm nhiều tiền hơn, giúp ích cho gia đình. Thứ ba, tôi quen nhiều chủ doanh nghiệp và họ cho tôi ý tưởng cho công ty mình. Tôi học được rằng thay đổi lúc đầu đáng sợ nhưng có thể mở cửa. Giờ tôi dùng ý này khi học cao học và tiếng Anh. Nên tôi nghĩ ta không nên sợ thay đổi."},{"a":"I’d like to talk about a time when a big change in my life turned out to be positive. Five years ago, I decided to go back to study. I was afraid because I thought I was too old. However, there were three benefits. First, I learned to organize my time, because I had to balance work, family and class. Second, my knowledge improved, and I could solve problems at work better. Third, I became a role model for my children, who now study more seriously. If I had not changed, I would have stayed in the same routine. To sum up, studying again made me stronger and happier. That’s why I believe it is never too late to change.","v":"Tôi muốn kể về một lần một thay đổi lớn trong đời tôi hóa ra là tích cực. Năm năm trước, tôi quyết định đi học lại. Tôi sợ vì nghĩ mình quá tuổi. Tuy nhiên có ba lợi ích. Thứ nhất, tôi học cách sắp xếp thời gian vì phải cân bằng công việc, gia đình và lớp học. Thứ hai, kiến thức tiến bộ và tôi giải quyết việc công ty tốt hơn. Thứ ba, tôi thành tấm gương cho các con, giờ chúng học nghiêm túc hơn. Nếu không thay đổi, tôi vẫn ở trong thói quen cũ. Tóm lại, đi học lại làm tôi mạnh hơn và hạnh phúc hơn. Vì vậy tôi tin không bao giờ là quá muộn để thay đổi."},{"a":"I’d like to talk about a time when moving to a new house turned out to be positive. At first, I did not want to leave the old neighborhood where we had many friends. But the move brought three good things. First, our new house was closer to the workshop, so I saved an hour every day. Second, the children had a better school nearby. Third, we met kind neighbors who helped us a lot. I was nervous before the move, but now I am glad. To sum up, a big change can be uncomfortable at first and wonderful later. That’s why I believe we should look at the possible benefits, not only the fear.","v":"Tôi muốn kể về lần chuyển nhà hóa ra là tích cực. Lúc đầu tôi không muốn rời khu phố cũ nơi chúng tôi có nhiều bạn. Nhưng việc chuyển mang lại ba điều tốt. Thứ nhất, nhà mới gần xưởng hơn nên tôi tiết kiệm một giờ mỗi ngày. Thứ hai, các con có trường tốt hơn gần đó. Thứ ba, chúng tôi quen những người hàng xóm tử tế giúp đỡ nhiều. Trước khi chuyển tôi lo, nhưng giờ tôi vui. Tóm lại, một thay đổi lớn lúc đầu khó chịu và sau đó tuyệt vời. Vì vậy tôi tin ta nên nhìn vào lợi ích có thể, không chỉ nỗi sợ."},{"a":"I’d like to talk about a time when a change in the way I manage my business turned out to be positive. Two years ago, I started to use accounting software instead of paper books. It was hard to learn, and my staff did not like it. However, there were three positive results. First, it saved time, because reports that took two days now take two hours. Second, there were fewer mistakes, which made me feel safe. Third, I could see the numbers in real time, so I made better decisions. To sum up, technology made my work easier. That’s why I believe new methods are worth the effort.","v":"Tôi muốn kể về một lần thay đổi cách quản lý việc kinh doanh hóa ra là tích cực. Hai năm trước, tôi bắt đầu dùng phần mềm kế toán thay cho sổ giấy. Học khó và nhân viên không thích. Tuy nhiên có ba kết quả tích cực. Thứ nhất, nó tiết kiệm thời gian, báo cáo từng mất hai ngày giờ chỉ hai giờ. Thứ hai, ít sai sót hơn, tôi thấy yên tâm. Thứ ba, tôi xem số liệu theo thời gian thực nên quyết định tốt hơn. Tóm lại, công nghệ làm công việc dễ hơn. Vì vậy tôi tin phương pháp mới đáng để cố gắng."},{"a":"I’d like to talk about a time when my health habits changed in a positive way. A few years ago, I was always tired because I slept late and skipped breakfast. After a doctor’s advice, I started to go to bed earlier and walk every morning. There were three results. First, I had more energy at work. Second, I felt less stress. Third, my family joined me, so we spent more time together. It was difficult for the first weeks, but it became natural. To sum up, a small lifestyle change brought a big improvement. That’s why I believe good habits can change a life.","v":"Tôi muốn kể về một lần thói quen sức khỏe của tôi thay đổi theo hướng tích cực. Vài năm trước, tôi luôn mệt vì ngủ muộn và bỏ bữa sáng. Sau lời khuyên của bác sĩ, tôi bắt đầu đi ngủ sớm hơn và đi bộ mỗi sáng. Có ba kết quả. Thứ nhất, tôi có nhiều năng lượng hơn ở công việc. Thứ hai, tôi bớt căng thẳng. Thứ ba, gia đình cùng tôi nên chúng tôi dành nhiều thời gian bên nhau hơn. Mấy tuần đầu khó, rồi thành tự nhiên. Tóm lại, một thay đổi nhỏ trong lối sống mang cải thiện lớn. Vì vậy tôi tin thói quen tốt có thể đổi cả cuộc sống."}],"q":"A time when a big change in your life or work turned out to be positive.","vi":"Một lần khi một thay đổi lớn trong cuộc sống hoặc công việc hóa ra là tích cực."},{"type":"Yếu tố quan trọng (what factors)","out":"Mở: có 3 yếu tố. 1) Hạ tầng: điện nước, đường, trường học. 2) An toàn và môi trường: không ngập, không ô nhiễm. 3) Giá cả hợp lý, gần nơi làm việc. Kết.","words":"housing, infrastructure, flood, affordable, public transport, environment, zoning","vers":[{"a":"I want to talk about what is important when a city chooses where to build new houses. I think there are three things. First, services. A new area needs roads, electricity, water, schools and hospitals. Without them, life is hard. Second, safety. The city should not build on land that floods. In southern Vietnam, many places flood in the rainy season. Third, price and location. Houses should be near jobs and buses, and the price should be fair for workers. If not, people spend hours on the road. So a city must plan before it builds.","v":"Tôi muốn nói về điều quan trọng khi thành phố chọn nơi xây nhà mới. Tôi nghĩ có ba điều. Thứ nhất, dịch vụ. Khu mới cần đường, điện, nước, trường học và bệnh viện. Không có thì cuộc sống khó. Thứ hai, an toàn. Thành phố không nên xây trên đất hay ngập. Ở miền Nam Việt Nam, nhiều nơi ngập vào mùa mưa. Thứ ba, giá và vị trí. Nhà nên gần việc làm và xe buýt và giá nên công bằng cho công nhân. Nếu không, người ta mất nhiều giờ trên đường. Nên thành phố phải lập kế hoạch trước khi xây."},{"a":"I’d like to talk about what factors matter when a city chooses where to build new housing. I think there are three key ones. First, jobs. People need to live near workplaces, or the city will have heavy traffic. For example, building apartments near industrial zones makes sense. Second, services like schools, clinics and markets. A home without services is not a real community. Third, land safety. A city should avoid soft land that may sink or areas near dangerous factories. To sum up, jobs, services and safety are the most important. That’s why I believe a city should plan carefully before it builds.","v":"Tôi muốn nói về những yếu tố quan trọng khi một thành phố chọn nơi xây nhà ở mới. Tôi nghĩ có ba yếu tố chính. Thứ nhất, việc làm. Người ta cần sống gần nơi làm việc, nếu không thành phố sẽ kẹt xe nặng. Ví dụ, xây chung cư gần khu công nghiệp là hợp lý. Thứ hai, các dịch vụ như trường học, phòng khám và chợ. Một ngôi nhà không có dịch vụ không phải cộng đồng thật. Thứ ba, độ an toàn của đất. Thành phố nên tránh đất yếu có thể lún hoặc khu gần nhà máy nguy hiểm. Tóm lại, việc làm, dịch vụ và an toàn là quan trọng nhất. Vì vậy tôi tin thành phố nên quy hoạch cẩn thận trước khi xây."},{"a":"I’d like to talk about the factors that decide where a city builds housing. In my view, three matter most. The first is transport. New areas must connect to the center by roads and buses, otherwise people will be stuck. The second is cost. If land is too expensive, apartments become unaffordable for ordinary families. The third is the environment. Cities should keep parks, rivers and farmland, because people need green space. For example, a city that covers all its lakes with buildings may suffer from floods. To sum up, transport, cost and the environment must be balanced. That’s why I believe good planning is a long-term investment.","v":"Tôi muốn nói về các yếu tố quyết định nơi thành phố xây nhà ở. Theo tôi, ba yếu tố quan trọng nhất. Yếu tố thứ nhất là giao thông. Khu mới phải nối với trung tâm bằng đường và xe buýt, nếu không người ta bị kẹt. Yếu tố thứ hai là chi phí. Nếu đất quá đắt, căn hộ trở nên không mua nổi với gia đình bình thường. Yếu tố thứ ba là môi trường. Thành phố nên giữ công viên, sông và đất nông nghiệp vì con người cần không gian xanh. Ví dụ, một thành phố lấp hết hồ bằng nhà có thể bị ngập. Tóm lại, giao thông, chi phí và môi trường phải cân bằng. Vì vậy tôi tin quy hoạch tốt là khoản đầu tư dài hạn."},{"a":"I’d like to talk about where a city should build new housing. I believe three factors are important. First, population growth. The city should predict where people will move in the next ten years, so that the houses are not empty or crowded. Second, existing infrastructure. It is cheaper to build where electricity, water and roads already exist. Third, the opinion of residents. Public meetings help the city understand what people need and avoid conflict. For instance, farmers who lose land should receive fair compensation. To sum up, forecasting, infrastructure and consultation lead to a good decision. That’s why I believe a city must listen as well as plan.","v":"Tôi muốn nói về nơi thành phố nên xây nhà ở mới. Tôi tin có ba yếu tố quan trọng. Thứ nhất, dân số tăng. Thành phố nên dự đoán người dân sẽ chuyển đến đâu trong mười năm tới để nhà không bị trống hay quá đông. Thứ hai, hạ tầng hiện có. Xây ở nơi đã có điện, nước, đường rẻ hơn. Thứ ba, ý kiến cư dân. Các cuộc họp công khai giúp thành phố hiểu người dân cần gì và tránh xung đột. Ví dụ, nông dân mất đất nên được bồi thường công bằng. Tóm lại, dự báo, hạ tầng và tham vấn dẫn đến quyết định tốt. Vì vậy tôi tin thành phố phải lắng nghe cũng như lập kế hoạch."},{"a":"I’d like to talk about what is most important when a city decides where to build housing. In my opinion, there are three main factors. The first is quality of life: sunlight, clean air and low noise. The second is safety, including fire safety and flood protection. The third is future growth. A city should leave space for schools and parks to be added later. For example, many crowded districts have no room for new schools. To sum up, quality of life, safety and growth shape a good neighborhood. That’s why I believe a city should build for the next generation, not just for today.","v":"Tôi muốn nói về điều quan trọng nhất khi thành phố quyết định xây nhà ở đâu. Theo tôi có ba yếu tố chính. Thứ nhất là chất lượng sống: ánh sáng, không khí sạch và ít ồn. Thứ hai là an toàn, gồm phòng cháy và chống ngập. Thứ ba là tăng trưởng tương lai. Thành phố nên để chỗ cho trường học và công viên được thêm sau này. Ví dụ, nhiều quận đông đúc không còn chỗ xây trường mới. Tóm lại, chất lượng sống, an toàn và tăng trưởng tạo nên khu dân cư tốt. Vì vậy tôi tin thành phố nên xây cho thế hệ sau chứ không chỉ cho hôm nay."}],"q":"What factors are most important when a city decides where to build new housing.","vi":"Những yếu tố nào quan trọng nhất khi một thành phố quyết định xây nhà ở mới ở đâu."},{"type":"So sánh (comparison)","out":"Mở: chọn bên (đổi thói quen). Thân: quyên góp giúp ngay nhưng một lần; đổi thói quen kéo dài, nhân lên theo số người; nhưng quyên góp cần cho người đang khẩn cấp. Kết: kết hợp, ưu tiên thói quen.","words":"donate, consumption habit, sustainability, long-term, immediate help, charity, waste","vers":[{"a":"I want to talk about donating money and changing our habits. I think changing habits is better in the long run. First, a donation helps right away. For example, money can help people after a flood. But it is usually one time. Second, a habit continues every day. If my family uses less plastic and saves electricity, the help does not stop. Third, habits are cheap. People with low income can do it too. Also, when many people change, companies must change. So I choose habits, but I think donating is good too. I teach my children to turn off lights and not to waste food.","v":"Tôi muốn nói về quyên góp tiền và thay đổi thói quen. Tôi nghĩ thay đổi thói quen tốt hơn về lâu dài. Thứ nhất, quyên góp giúp ngay. Ví dụ, tiền có thể giúp người dân sau lũ. Nhưng thường chỉ một lần. Thứ hai, thói quen tiếp tục mỗi ngày. Nếu gia đình tôi dùng ít nhựa và tiết kiệm điện, sự giúp đỡ không dừng. Thứ ba, thói quen rẻ. Người thu nhập thấp cũng làm được. Ngoài ra khi nhiều người đổi, công ty phải đổi. Nên tôi chọn thói quen nhưng tôi nghĩ quyên góp cũng tốt. Tôi dạy các con tắt đèn và không lãng phí thức ăn."},{"a":"I’d like to talk about donating money and changing your own habits. I think donating does more, for three reasons. First, money can reach many people quickly. A donation to a trusted charity can pay for tree planting or clean water for a whole village. Second, professionals use the money efficiently, with the right tools. Third, not everyone can change their lifestyle easily, for example, a person who lives far from public transport. For them, donating is a practical way to help. However, habits still matter. To sum up, donations have a wider and faster effect. That’s why I believe supporting good organizations is powerful.","v":"Tôi muốn nói về quyên góp tiền và thay đổi thói quen của mình. Tôi nghĩ quyên góp làm được nhiều hơn, vì ba lý do. Thứ nhất, tiền đến được nhiều người nhanh chóng. Một khoản quyên góp cho tổ chức từ thiện đáng tin có thể trả cho trồng cây hay nước sạch cho cả làng. Thứ hai, các chuyên gia dùng tiền hiệu quả với công cụ đúng. Thứ ba, không phải ai cũng dễ thay đổi lối sống, ví dụ người sống xa giao thông công cộng. Với họ, quyên góp là cách giúp thực tế. Tuy nhiên thói quen vẫn quan trọng. Tóm lại, quyên góp có tác động rộng và nhanh hơn. Vì vậy tôi tin ủng hộ tổ chức tốt là rất mạnh."},{"a":"I’d like to talk about which does more for sustainability: donating or changing habits. In my view, both are needed, but habits come first. The first reason is consistency. Habits happen every day, while donations happen occasionally. The second reason is influence. When neighbors see my family reduce waste, they may copy us. The third reason is the link to values. If I donate but waste water every day, my actions do not match my words. For example, bringing my own bag saves hundreds of plastic bags a year. To sum up, habits are personal, constant and influential. That’s why I believe change must begin at home.","v":"Tôi muốn nói về điều nào làm được nhiều hơn cho sự bền vững: quyên góp hay thay đổi thói quen. Theo tôi, cả hai đều cần nhưng thói quen đến trước. Lý do thứ nhất là sự đều đặn. Thói quen diễn ra mỗi ngày, quyên góp thỉnh thoảng. Lý do thứ hai là ảnh hưởng. Khi hàng xóm thấy gia đình tôi giảm rác, họ có thể bắt chước. Lý do thứ ba là sự gắn với giá trị. Nếu tôi quyên góp nhưng lãng phí nước mỗi ngày, hành động không khớp lời nói. Ví dụ, mang túi riêng tiết kiệm hàng trăm túi nhựa mỗi năm. Tóm lại, thói quen mang tính cá nhân, liên tục và có ảnh hưởng. Vì vậy tôi tin thay đổi phải bắt đầu từ nhà."},{"a":"I’d like to talk about donating and changing consumption habits, and which does more for global sustainability. I think they work best together, and I will explain three points. First, donations solve urgent problems, such as emergencies after a typhoon. Second, habits reduce the cause of problems, such as pollution. Third, a mix is realistic. If a family has a small budget, it can donate a little and save energy. For instance, a family that saves five percent on electricity could donate that money. To sum up, donations fix the damage and habits prevent it. That’s why I believe the best approach is to do both.","v":"Tôi muốn nói về quyên góp và thay đổi thói quen tiêu dùng, cách nào làm nhiều hơn cho sự bền vững toàn cầu. Tôi nghĩ chúng tốt nhất khi đi cùng, và tôi sẽ giải thích ba điểm. Thứ nhất, quyên góp giải quyết vấn đề khẩn cấp như tình huống sau bão. Thứ hai, thói quen giảm nguyên nhân vấn đề như ô nhiễm. Thứ ba, kết hợp là thực tế. Nếu gia đình ngân sách nhỏ, có thể quyên góp ít và tiết kiệm năng lượng. Ví dụ, một gia đình tiết kiệm năm phần trăm tiền điện có thể quyên góp số tiền đó. Tóm lại, quyên góp sửa thiệt hại và thói quen ngăn ngừa nó. Vì vậy tôi tin cách tốt nhất là làm cả hai."},{"a":"I’d like to talk about donating money versus changing habits. In my view, changing habits does more because it influences companies. First, when many consumers buy less plastic, producers must change packaging. Second, habits reduce demand for harmful products, which protects forests and oceans. Third, habits create a culture of responsibility, so children learn to value resources. A donation helps once, but a culture lasts. For example, a school that teaches recycling can change a whole community. To sum up, habits create a lasting change in society. That’s why I believe we should focus on what we buy and use every day.","v":"Tôi muốn nói về quyên góp tiền so với thay đổi thói quen. Theo tôi, thay đổi thói quen làm được nhiều hơn vì nó ảnh hưởng đến công ty. Thứ nhất, khi nhiều người tiêu dùng mua ít nhựa hơn, nhà sản xuất phải đổi bao bì. Thứ hai, thói quen giảm nhu cầu với sản phẩm có hại, bảo vệ rừng và đại dương. Thứ ba, thói quen tạo văn hóa trách nhiệm, nên trẻ học trân trọng tài nguyên. Quyên góp giúp một lần, nhưng văn hóa tồn tại lâu. Ví dụ, một trường dạy tái chế có thể đổi cả cộng đồng. Tóm lại, thói quen tạo thay đổi lâu dài trong xã hội. Vì vậy tôi tin ta nên tập trung vào điều mình mua và dùng mỗi ngày."}],"q":"Donating money and changing your own consumption habits: which does more for global sustainability?","vi":"Quyên góp tiền và thay đổi thói quen tiêu dùng của chính mình: cách nào làm được nhiều hơn cho sự bền vững toàn cầu?"},{"type":"Cách làm (how to)","out":"Mở: có 3 cách. 1) Kiểm tra nguồn: ai đăng, có dẫn chứng không. 2) Nhìn dấu hiệu: ánh sáng, chỉnh sửa, thiếu bối cảnh. 3) So sánh nhiều nguồn, hỏi chuyên gia. Kết.","words":"misleading, edited, source, context, fact-check, evidence, honest","vers":[{"a":"I want to talk about how people can tell a true picture from a false one in the media. I have three ways. First, check the source. Who posted it? A photo of a flood from an unknown page, with no date, may be old. Second, look at the details. Strange shadows or very smooth faces can show that the photo was edited. An ad photo of food can look big, but the real portion is small. Third, compare with other sources. If a story is true, other trusted news will show it too. I always tell my children: ask where a picture comes from before you believe it.","v":"Tôi muốn nói về cách người ta phân biệt hình thật và hình giả trên truyền thông. Tôi có ba cách. Thứ nhất, kiểm tra nguồn. Ai đăng? Ảnh lũ từ một trang không rõ, không có ngày, có thể là ảnh cũ. Thứ hai, nhìn chi tiết. Bóng lạ hay khuôn mặt quá mịn có thể cho thấy ảnh bị chỉnh. Ảnh quảng cáo đồ ăn có thể trông lớn nhưng phần thật nhỏ. Thứ ba, so với nguồn khác. Nếu câu chuyện thật, tin đáng tin khác cũng đăng. Tôi luôn nói với các con: hãy hỏi bức ảnh từ đâu ra trước khi tin."},{"a":"I’d like to talk about how people can tell honest images from misleading ones in the media. I believe there are three ways. First, ask what is missing. A photo shows only one angle, so we should ask what is outside the frame. For example, a crowded protest can look small if the camera is close. Second, look at the caption and date. Many old photos are shared again with a new story. Third, use tools such as reverse image search, which can show where the picture first appeared. To sum up, think about the frame, check the caption and use tools. That’s why I believe a few minutes of checking can prevent big mistakes.","v":"Tôi muốn nói về cách phân biệt hình ảnh trung thực với hình ảnh gây hiểu lầm trên truyền thông. Tôi tin có ba cách. Thứ nhất, hỏi điều gì còn thiếu. Một bức ảnh chỉ cho thấy một góc, nên ta nên hỏi điều gì nằm ngoài khung hình. Ví dụ, một cuộc biểu tình đông có thể trông nhỏ nếu máy ảnh ở gần. Thứ hai, xem chú thích và ngày. Nhiều ảnh cũ được chia sẻ lại với câu chuyện mới. Thứ ba, dùng công cụ như tìm kiếm ngược hình ảnh, cho thấy bức ảnh xuất hiện đầu tiên ở đâu. Tóm lại, nghĩ về khung hình, kiểm tra chú thích và dùng công cụ. Vì vậy tôi tin vài phút kiểm tra có thể ngăn sai lầm lớn."},{"a":"I’d like to talk about telling honest images from misleading ones. In my opinion, three habits help. The first is to be careful with emotions. Misleading images often make us angry or scared, so we share them quickly. If an image is very shocking, I wait before I believe it. The second is to compare the picture with the text. Sometimes the headline says one thing and the photo shows another. The third is to trust reliable media outlets that explain how they got the photo. To sum up, control emotions, compare the text and trust reliable sources. That’s why I believe a calm mind is the best defense against false information.","v":"Tôi muốn nói về việc phân biệt hình ảnh trung thực với hình ảnh gây hiểu lầm. Theo tôi, ba thói quen giúp ích. Thứ nhất là cẩn thận với cảm xúc. Hình ảnh gây hiểu lầm thường làm ta giận hay sợ nên ta chia sẻ nhanh. Nếu một hình rất gây sốc, tôi đợi trước khi tin. Thứ hai là so sánh hình với nội dung chữ. Đôi khi tiêu đề nói một đằng, hình cho thấy một nẻo. Thứ ba là tin các cơ quan báo chí đáng tin giải thích cách họ có bức ảnh. Tóm lại, kiểm soát cảm xúc, so sánh chữ và tin nguồn đáng tin. Vì vậy tôi tin một đầu óc bình tĩnh là phòng thủ tốt nhất trước thông tin sai."},{"a":"I’d like to talk about how to know whether an image is honest. I believe there are three signs. First, the quality and details. In edited images, the edges may look strange, or the light may not match. Second, the source. An honest image usually comes with the name of the photographer or the organization. Third, other witnesses. If an event is real, several people usually share different photos or videos of it. For example, after a big storm, many people post pictures from the same place. To sum up, the details, the source and other witnesses show the truth. That’s why I believe honest images can be confirmed from several directions.","v":"Tôi muốn nói về cách biết một hình ảnh có trung thực không. Tôi tin có ba dấu hiệu. Thứ nhất, chất lượng và chi tiết. Ở ảnh chỉnh sửa, các cạnh có thể trông lạ hoặc ánh sáng không khớp. Thứ hai, nguồn. Hình trung thực thường kèm tên nhiếp ảnh gia hay tổ chức. Thứ ba, các nhân chứng khác. Nếu sự kiện có thật, nhiều người thường chia sẻ các ảnh hay video khác nhau. Ví dụ, sau một cơn bão lớn, nhiều người đăng ảnh từ cùng một nơi. Tóm lại, chi tiết, nguồn và các nhân chứng khác cho thấy sự thật. Vì vậy tôi tin hình ảnh trung thực có thể được xác nhận từ nhiều hướng."},{"a":"I’d like to talk about telling the difference between honest and misleading pictures in the media. I think there are three practical methods. First, learn the common tricks, such as cropping, filters and old photos in new stories. When we know the tricks, we notice them. Second, ask what the creator wants. An advertisement wants us to buy, and a political post wants us to agree. Third, discuss with others. Friends or family may notice something we miss. For example, my children often point out edited photos faster than I do. To sum up, knowledge, motive and discussion protect us. That’s why I believe media education is as important as reading and writing.","v":"Tôi muốn nói về cách phân biệt hình ảnh trung thực và gây hiểu lầm trên truyền thông. Tôi nghĩ có ba phương pháp thực tế. Thứ nhất, học các chiêu thường gặp như cắt ảnh, bộ lọc và ảnh cũ trong câu chuyện mới. Khi biết chiêu, ta nhận ra. Thứ hai, hỏi người tạo muốn gì. Quảng cáo muốn ta mua, bài chính trị muốn ta đồng ý. Thứ ba, thảo luận với người khác. Bạn bè hay gia đình có thể thấy điều ta bỏ sót. Ví dụ, các con tôi thường chỉ ra ảnh chỉnh sửa nhanh hơn tôi. Tóm lại, kiến thức, động cơ và thảo luận bảo vệ chúng ta. Vì vậy tôi tin giáo dục truyền thông quan trọng như đọc và viết."}],"q":"How people can tell the difference between an honest image and a misleading one in the media.","vi":"Làm sao người ta phân biệt được hình ảnh trung thực với hình ảnh gây hiểu lầm trên truyền thông."},{"type":"Tại sao (why)","out":"Mở: nêu hai hoặc ba lý do. Thân: sức khỏe tinh thần và burnout, thời gian cho gia đình, công nghệ làm mờ ranh giới. Kết: cần ranh giới rõ ràng.","words":"work-life balance, boundary, burnout, leisure, remote work, productive, mental health","vers":[{"a":"I’d like to talk about why some people find it hard to separate work time from leisure time. In my view, there are three key reasons. The first reason is mental health. If people work all day and all night, they feel stressed and can reach burnout. Rest time lets the brain recover, so they are more productive and more creative later. For example, a colleague of mine, who works in sales, used to answer messages until midnight, and she became sick and tired. Now she switches off her work phone at six every day, and she feels much better. The second reason is family and personal life. Many people want to spend their evenings with their children or friends, and they don’t want work calls to interrupt them. This is very true for me, because I run a family business and also look after my children. If I don’t set a boundary, work can fill every hour of the day. The third reason is technology. Smartphones, email and working from home make the line between work and leisure very weak, so people must try harder to keep it. Because of that, some people even turn off notifications after a certain time. Small habits help too, like having dinner without any screens. To sum up, a clear boundary protects our health, our family time and our focus. That’s why I believe it also improves our work in the long run.","v":"Tôi muốn nói về lý do vì sao một số người cố gắng hết sức để tách giờ làm việc khỏi giờ nghỉ ngơi. Theo tôi, có ba lý do chính. Lý do thứ nhất là sức khỏe tinh thần. Nếu người ta làm cả ngày lẫn đêm, họ căng thẳng và có thể kiệt sức. Thời gian nghỉ giúp não hồi phục, nên sau đó họ làm việc hiệu quả và sáng tạo hơn. Ví dụ, một đồng nghiệp của tôi, người làm kinh doanh, từng trả lời tin nhắn đến nửa đêm và bị ốm, mệt mỏi. Giờ cô ấy tắt điện thoại công việc lúc sáu giờ mỗi ngày và thấy khỏe hơn nhiều. Lý do thứ hai là gia đình và đời sống riêng. Nhiều người muốn dành buổi tối cho con cái hoặc bạn bè, và không muốn cuộc gọi công việc làm gián đoạn. Điều này rất đúng với tôi, vì tôi vừa điều hành việc kinh doanh gia đình vừa chăm con. Nếu tôi không đặt ra ranh giới, công việc có thể chiếm hết mọi giờ trong ngày. Lý do thứ ba là công nghệ. Điện thoại thông minh, email và làm việc tại nhà khiến ranh giới giữa làm việc và nghỉ ngơi rất mờ, nên người ta phải cố hơn để giữ nó. Vì thế, một số người còn tắt thông báo sau một giờ nhất định. Những thói quen nhỏ cũng giúp ích, như ăn tối mà không có màn hình nào. Tóm lại, một ranh giới rõ ràng bảo vệ sức khỏe, thời gian bên gia đình và sự tập trung của chúng ta. Vì vậy tôi tin rằng về lâu dài nó cũng cải thiện công việc của chúng ta."},{"a":"There are two or three reasons why people try to protect their free time. The first is health. Long working hours cause tired eyes, back pain and poor sleep, so resting properly is a medical need. For example, some doctors say that people who answer emails at midnight have more stress. The second reason is relationships. If parents are always on the phone for work, their children feel ignored, and couples have less time to talk. The third reason is creativity. When we rest, we do hobbies like cooking, sports or reading, and new ideas often come when we are relaxed. On the other hand, in some jobs it is hard to disconnect completely. Still, in conclusion, a clear line between work and leisure is good for the body, for the family and for the quality of work.","v":"Có hai hoặc ba lý do khiến người ta cố bảo vệ thời gian rảnh. Lý do thứ nhất là sức khỏe. Làm việc nhiều giờ gây mỏi mắt, đau lưng và ngủ kém, nên nghỉ ngơi đúng cách là nhu cầu y tế. Ví dụ, một số bác sĩ nói người trả lời email lúc nửa đêm bị căng thẳng nhiều hơn. Lý do thứ hai là các mối quan hệ. Nếu cha mẹ luôn cầm điện thoại vì công việc, con cái cảm thấy bị bỏ rơi, và vợ chồng ít thời gian trò chuyện hơn. Lý do thứ ba là sự sáng tạo. Khi nghỉ ngơi, ta làm những sở thích như nấu ăn, thể thao hay đọc sách, và ý tưởng mới thường đến lúc ta thư giãn. Mặt khác, ở một số công việc rất khó ngắt hẳn. Dù vậy, tóm lại, một ranh giới rõ ràng giữa công việc và thư giãn tốt cho cơ thể, cho gia đình và cho chất lượng công việc."},{"a":"I think people fight for it because modern work never really stops. Smartphones, messaging groups and remote work mean that a manager can contact us any time. First, people want control over their own time, and saying no to late messages is a way to protect it. Second, they have learned from experience: many of us know someone who suffered burnout after years of overwork. For example, a friend of mine left a high-paying job because he could not sleep. Third, younger employees value freedom and often prefer a company with flexible hours to one with a higher salary. However, some people enjoy their work so much that they don’t mind blending the two. Overall, I’d say everyone needs their own balance, and a clear boundary helps most people find it.","v":"Tôi nghĩ người ta phải đấu tranh vì công việc hiện đại thực sự không bao giờ dừng. Điện thoại thông minh, nhóm nhắn tin và làm việc từ xa nghĩa là sếp có thể liên lạc với ta bất cứ lúc nào. Thứ nhất, mọi người muốn tự chủ thời gian của mình, và từ chối tin nhắn muộn là một cách để bảo vệ nó. Thứ hai, họ đã học được từ kinh nghiệm: nhiều người trong chúng ta biết ai đó bị kiệt sức sau nhiều năm làm việc quá sức. Ví dụ, một người bạn của tôi bỏ một công việc lương cao vì không ngủ được. Thứ ba, nhân viên trẻ coi trọng sự tự do và thường thích công ty giờ giấc linh hoạt hơn công ty lương cao hơn. Tuy nhiên, có người thích công việc đến mức không ngại trộn lẫn hai thứ. Nhìn chung, tôi cho rằng mỗi người cần một sự cân bằng riêng, và một ranh giới rõ ràng giúp đa số tìm được nó."},{"a":"I’d like to talk about why some people find it hard to separate work time from leisure time. In my view, there are three reasons. The first is that they work from home, so the office and the living room are the same place. The second is that they are afraid of missing something, such as a message from a client or a boss. The third is guilt. Some people feel they are lazy if they rest. For example, I sometimes check emails while I am with my family, and then I feel I am not present at all. To sum up, location, fear and guilt blur the line. That’s why I believe people need clear rules, like a fixed time to stop.","v":"Tôi muốn nói về việc vì sao một số người thấy khó tách giờ làm việc khỏi giờ thư giãn. Theo tôi có ba lý do. Thứ nhất, họ làm việc ở nhà nên văn phòng và phòng khách là một chỗ. Thứ hai, họ sợ bỏ lỡ điều gì, như tin nhắn từ khách hay sếp. Thứ ba là cảm giác tội lỗi. Một số người thấy mình lười nếu nghỉ ngơi. Ví dụ, đôi khi tôi xem email khi ở bên gia đình, rồi cảm thấy mình không thật sự có mặt. Tóm lại, địa điểm, nỗi sợ và cảm giác tội lỗi làm mờ ranh giới. Vì vậy tôi tin mọi người cần quy tắc rõ như giờ dừng cố định."},{"a":"I’d like to talk about why work time and leisure time are hard to separate for some people. I believe there are three reasons. First, passion. When someone loves their job, they think about it all the time, so work feels like leisure. Second, competition. In a competitive field, people believe that resting means falling behind. Third, flexible schedules. Freelancers and business owners can work any time, so they work all the time. For example, I run a business, and a customer may call me in the evening. To sum up, passion, competition and flexibility make it difficult to stop. That’s why I believe we should deliberately plan rest time like a meeting.","v":"Tôi muốn nói về việc vì sao giờ làm và giờ thư giãn khó tách với một số người. Tôi tin có ba lý do. Thứ nhất, đam mê. Khi ai đó yêu công việc, họ nghĩ về nó suốt nên làm việc giống như thư giãn. Thứ hai, cạnh tranh. Trong lĩnh vực cạnh tranh, người ta tin nghỉ ngơi nghĩa là tụt lại. Thứ ba, lịch linh hoạt. Người làm tự do và chủ doanh nghiệp có thể làm bất cứ lúc nào nên làm mọi lúc. Ví dụ, tôi điều hành việc kinh doanh và khách có thể gọi tôi buổi tối. Tóm lại, đam mê, cạnh tranh và sự linh hoạt khiến khó dừng. Vì vậy tôi tin ta nên chủ động lên kế hoạch giờ nghỉ như một cuộc họp."}],"q":"Why some people find it hard to separate work time from leisure time.","vi":"Vì sao một số người thấy khó tách giờ làm việc khỏi giờ thư giãn."}]},{"code":"08","p1":[{"type":"Hai lý do (two reasons)","out":"Lý do 1: ngoại ngữ có quy tắc, từ ít hơn nên nói khác, bớt cảm xúc. Lý do 2: văn hóa đi kèm ngôn ngữ, giọng điệu khác. Ví dụ. Kết.","words":"personality, vocabulary, confident, culture, formal, express, foreign language","vers":[{"a":"I think there are two reasons. First, we have fewer words in a foreign language, so we use simple and careful words. Because of that, we may sound more serious or shy. Second, each language has its own manners. For example, I am more polite when I speak English with my teacher than when I joke with my family in Vietnamese. Also, some people feel braver because nobody knows their usual self.","v":"Tôi nghĩ có hai lý do. Thứ nhất, ta có ít từ hơn trong ngoại ngữ nên dùng từ đơn giản và cẩn thận. Vì vậy ta có thể nghe nghiêm túc hay nhút nhát hơn. Thứ hai, mỗi ngôn ngữ có phép lịch sự riêng. Ví dụ, tôi lịch sự hơn khi nói tiếng Anh với thầy so với khi đùa với gia đình bằng tiếng Việt. Ngoài ra, một số người thấy mạnh dạn hơn vì không ai biết con người quen thuộc của họ."},{"a":"I think it is because we are free from old habits. In Vietnamese, I carry my family role, my job and how people already see me. In English, I am just a learner, so I can be more open and try new expressions. Also, I use different gestures and a different tone. It feels like wearing a different set of clothes.","v":"Tôi nghĩ vì ta thoát khỏi thói quen cũ. Khi nói tiếng Việt, tôi mang vai trò gia đình, công việc và cách người ta đã nhìn tôi. Khi nói tiếng Anh, tôi chỉ là người học nên có thể cởi mở hơn và thử cách diễn đạt mới. Tôi cũng dùng cử chỉ và giọng khác. Cảm giác như mặc bộ quần áo khác."},{"a":"For some people, it is because of limited words. If you cannot say everything, you only say the main idea, so you sound more direct or simple. For example, my English is not perfect, so I speak short sentences, and my classmates say I sound very confident. In my mother tongue, I explain more and sound more careful.","v":"Với một số người, đó là vì vốn từ hạn chế. Nếu không nói được hết, bạn chỉ nói ý chính nên nghe thẳng hoặc đơn giản hơn. Ví dụ, tiếng Anh của tôi chưa hoàn hảo nên tôi nói câu ngắn, và bạn cùng lớp nói tôi nghe rất tự tin. Bằng tiếng mẹ đẻ, tôi giải thích nhiều hơn và nghe cẩn thận hơn."},{"a":"I think emotions play a role. A foreign language feels less connected to childhood memories, so we are less emotional and more logical. Some bilingual people say they are calmer in their second language when arguing. That is why some people feel like another person.","v":"Tôi nghĩ cảm xúc đóng vai trò. Ngoại ngữ ít gắn với ký ức tuổi thơ nên ta bớt cảm xúc và logic hơn. Một số người song ngữ nói họ bình tĩnh hơn bằng ngôn ngữ thứ hai khi tranh cãi. Vì vậy một số người cảm thấy như người khác."},{"a":"I believe it is culture and role-playing. When we speak English, we often imitate the way people in movies or our teachers speak, with different expressions and a different rhythm. We may even smile more. In this way, language changes our behavior, and we feel we have a second personality.","v":"Tôi tin là văn hóa và nhập vai. Khi nói tiếng Anh, ta thường bắt chước cách người trong phim hay thầy cô nói, với cách diễn đạt và nhịp khác. Ta thậm chí cười nhiều hơn. Như vậy ngôn ngữ đổi hành vi của ta và ta thấy mình có tính cách thứ hai."}],"q":"Why do some people feel like a different person when speaking a foreign language?","vi":"Vì sao một số người cảm thấy như một con người khác khi nói ngoại ngữ?"},{"type":"Chọn một bên (choice)","out":"Chọn: chấp nhận, nhưng có giới hạn. Lý do 1: niềm vui và sức khỏe tinh thần. Lý do 2: nhưng phải đủ sống, còn gia đình. Điều kiện. Kết.","words":"salary, passion, job satisfaction, afford, balance, expenses, fulfilling","vers":[{"a":"I would accept a little less money, but not too much. First, if I enjoy my job, I am happier and I work better. Second, money is not everything. But I have a family. My salary must pay for food and school fees. If the pay is too low, I will worry all the time. So I say yes if the difference is small and I can still live well.","v":"Tôi chấp nhận ít tiền hơn một chút nhưng không quá nhiều. Thứ nhất, nếu thích công việc, tôi vui hơn và làm tốt hơn. Thứ hai, tiền không phải tất cả. Nhưng tôi có gia đình. Lương phải đủ trả tiền ăn và học phí. Nếu lương quá thấp, tôi sẽ lo suốt. Nên tôi đồng ý nếu chênh lệch nhỏ và tôi vẫn sống tốt."},{"a":"I would accept it if the job offered growth. A job I enjoy teaches me new skills and builds my future income. For example, if I could be a teacher, I would accept a lower salary now, because teaching is my dream. In the long term, experience and reputation can earn more than the difference.","v":"Tôi sẽ chấp nhận nếu công việc có cơ hội phát triển. Công việc tôi thích dạy tôi kỹ năng mới và xây thu nhập tương lai. Ví dụ, nếu được làm giáo viên, tôi sẽ chấp nhận lương thấp hơn lúc này vì dạy học là ước mơ của tôi. Về lâu dài, kinh nghiệm và uy tín có thể kiếm nhiều hơn khoản chênh lệch."},{"a":"No, I would not, because I am responsible for my family. Passion is important, but my children’s education and our health need money. I would rather keep a good salary and enjoy my hobbies after work. If the pay were equal, I would choose the job I love, but I cannot reduce my income too much.","v":"Không, tôi sẽ không, vì tôi có trách nhiệm với gia đình. Đam mê quan trọng nhưng việc học của con và sức khỏe cần tiền. Tôi thà giữ lương tốt và tận hưởng sở thích sau giờ làm. Nếu lương bằng nhau, tôi chọn việc mình yêu, nhưng tôi không thể giảm thu nhập quá nhiều."},{"a":"It depends on how much lower. Ten percent lower is fine, but thirty percent lower is risky. I would calculate my monthly budget first. As an accountant, I like to see the numbers. If the budget still works and I have some savings, I would say yes, because happiness at work is valuable.","v":"Còn tùy thấp hơn bao nhiêu. Thấp hơn mười phần trăm thì ổn, thấp hơn ba mươi phần trăm là rủi ro. Tôi sẽ tính ngân sách hằng tháng trước. Là người làm kế toán, tôi thích xem con số. Nếu ngân sách vẫn ổn và tôi có chút tiết kiệm, tôi sẽ đồng ý vì hạnh phúc ở nơi làm việc rất quý."},{"a":"I think I would, for a limited time. If the job is exciting, I would accept it for one or two years and then see. A good atmosphere and meaningful tasks give energy, and that energy can lead to promotion. However, I would ask for clear information about future salary raises.","v":"Tôi nghĩ tôi sẽ chấp nhận trong một thời gian giới hạn. Nếu công việc thú vị, tôi chấp nhận một hai năm rồi xem. Không khí tốt và công việc có ý nghĩa cho năng lượng, và năng lượng đó có thể dẫn đến thăng chức. Tuy nhiên tôi sẽ hỏi thông tin rõ về việc tăng lương sau này."}],"q":"Would you accept a lower salary for a job you really enjoy?","vi":"Bạn có chấp nhận mức lương thấp hơn cho một công việc bạn thật sự yêu thích không?"},{"type":"Hai ý (two things)","out":"Ý 1: lọc ảnh, ánh sáng, chọn góc đẹp. Ý 2: người ta chỉ đăng khoảnh khắc đẹp. Ví dụ ảnh đồ ăn, du lịch. Kết: đừng so sánh.","words":"filter, edit, angle, lighting, highlight, unrealistic, compare","vers":[{"a":"Two things make images on social media look better than real life. First, people edit their photos. They use filters, a good angle and good light. For example, a plate of food looks great in a photo, but looks normal on the table. Second, people post only happy moments. We do not see their problems. So we may feel that our life is boring. I think we should remember that a photo is only a small part of life.","v":"Hai điều khiến ảnh mạng xã hội đẹp hơn đời thật. Thứ nhất, người ta chỉnh ảnh. Họ dùng bộ lọc, góc đẹp và ánh sáng tốt. Ví dụ, đĩa thức ăn trong ảnh trông tuyệt nhưng trên bàn thì bình thường. Thứ hai, người ta chỉ đăng khoảnh khắc vui. Ta không thấy vấn đề của họ. Nên ta có thể thấy cuộc sống mình chán. Tôi nghĩ ta nên nhớ một bức ảnh chỉ là một phần nhỏ của cuộc sống."},{"a":"One reason is the camera and the filters. A phone can make skin smoother, colors brighter and even the body slimmer. Another reason is the setting: the cleanest corner, the best light, the best time. For example, a restaurant photo is taken on a quiet day, so it looks peaceful. In reality, the place may be noisy and crowded.","v":"Một lý do là máy ảnh và bộ lọc. Điện thoại có thể làm da mịn hơn, màu sáng hơn, thậm chí thân hình thon hơn. Một lý do khác là bối cảnh: góc sạch nhất, ánh sáng đẹp nhất, thời điểm tốt nhất. Ví dụ, ảnh nhà hàng chụp vào ngày vắng nên trông yên bình. Thực tế nơi đó có thể ồn và đông."},{"a":"I think it is also about editing the story. People tell only what makes them look successful: holidays, parties, new things. They do not post the stress or the debts. So, the image looks perfect. Because we compare our real life with their selected moments, we feel unhappy.","v":"Tôi nghĩ còn là việc biên tập câu chuyện. Người ta chỉ kể điều khiến họ trông thành công: kỳ nghỉ, tiệc tùng, đồ mới. Họ không đăng căng thẳng hay nợ nần. Nên hình ảnh trông hoàn hảo. Vì ta so cuộc sống thật với những khoảnh khắc được chọn của họ, ta thấy không vui."},{"a":"Social media rewards attractive pictures. Posts with bright colors and happy faces get more likes, so people try to make everything look beautiful. Businesses also use professional photographers. For example, my customers’ product photos look much better than the real goods. That is normal marketing, but we should know it.","v":"Mạng xã hội thưởng cho ảnh hấp dẫn. Bài có màu sáng và gương mặt vui nhận nhiều lượt thích hơn nên người ta cố làm mọi thứ trông đẹp. Doanh nghiệp cũng thuê nhiếp ảnh gia chuyên nghiệp. Ví dụ, ảnh sản phẩm của khách tôi đẹp hơn hàng thật nhiều. Đó là tiếp thị bình thường nhưng ta nên biết."},{"a":"Another reason is the small screen. On a phone, details are small, so mistakes are hidden. Also, we see the picture for only two seconds, so we notice only the first impression. In real life, we see the whole place with its smell, sounds and people, and it feels different.","v":"Một lý do khác là màn hình nhỏ. Trên điện thoại, chi tiết nhỏ nên lỗi bị che. Ngoài ra ta chỉ xem ảnh hai giây nên chỉ để ý ấn tượng đầu. Ngoài đời ta thấy cả nơi chốn với mùi, âm thanh và con người, và cảm giác khác."}],"q":"What makes an image on social media look more attractive than real life?","vi":"Điều gì khiến một bức ảnh trên mạng xã hội trông hấp dẫn hơn đời thật?"},{"type":"Chọn một bên (choice)","out":"Chọn: tin điều thấy hơn, nhưng không tuyệt đối. Lý do 1: thấy là có bằng chứng trực tiếp. Lý do 2: nhưng mắt cũng bị đánh lừa, lời nói có thể giải thích. Ví dụ hàng hóa. Kết: kết hợp.","words":"direct evidence, deceive, explanation, observation, rely on, double-check, believe","vers":[{"a":"I believe what I see more, but I check both. First, seeing is direct proof. When a supplier says the goods are perfect, I open the boxes and check them myself. Second, words can be wrong or too big. But eyes can be fooled too, for example by a nice photo. So I also listen and ask questions. I trust my eyes first, and then I check what people tell me.","v":"Tôi tin điều mình thấy hơn nhưng kiểm tra cả hai. Thứ nhất, nhìn là bằng chứng trực tiếp. Khi nhà cung cấp nói hàng hoàn hảo, tôi mở thùng và tự kiểm. Thứ hai, lời nói có thể sai hay nói quá. Nhưng mắt cũng có thể bị lừa, ví dụ bởi ảnh đẹp. Nên tôi cũng nghe và hỏi. Tôi tin mắt trước rồi kiểm tra điều người ta nói."},{"a":"I believe what I hear more when it comes from an expert. If an accountant tells me about a new tax rule, I trust the explanation even before I see the document. However, for daily matters, such as the quality of goods, I prefer to see. So I think it depends on who is speaking and on the topic.","v":"Tôi tin điều mình nghe hơn khi nó đến từ chuyên gia. Nếu một kế toán nói với tôi về quy định thuế mới, tôi tin lời giải thích ngay cả trước khi thấy tài liệu. Tuy nhiên, với việc hằng ngày như chất lượng hàng hóa, tôi thích tự thấy. Nên tôi nghĩ còn tùy ai nói và chủ đề."},{"a":"I trust what I see, because images are more direct. But I know that what I see may be edited. So I usually combine both: I look at the evidence and listen to explanations. When both agree, I feel confident. When they do not, I investigate further.","v":"Tôi tin điều mình thấy vì hình ảnh trực tiếp hơn. Nhưng tôi biết điều mình thấy có thể bị chỉnh sửa. Nên tôi thường kết hợp cả hai: nhìn bằng chứng và nghe giải thích. Khi cả hai khớp, tôi yên tâm. Khi không khớp, tôi tìm hiểu thêm."},{"a":"For me, hearing is sometimes more reliable, because a person’s voice shows their feelings. When a customer says ‘I will pay next week’, I can hear if they are honest from the tone. A document cannot tell me that. So, listening is useful for judging people, and seeing is useful for judging things.","v":"Với tôi, nghe đôi khi đáng tin hơn vì giọng nói của một người cho thấy cảm xúc. Khi khách nói ‘tuần sau tôi trả’, tôi nghe giọng thì biết họ có thật lòng không. Tài liệu không cho tôi biết điều đó. Nên nghe hữu ích để đánh giá con người, còn thấy hữu ích để đánh giá sự vật."},{"a":"I think I believe what I see more because memory of images is stronger. However, I have learned that eyes can be fooled by optical illusions. So I ask other people. If everyone sees the same thing, it is probably true. That is my rule: see, ask, then decide.","v":"Tôi nghĩ tôi tin điều mình thấy hơn vì trí nhớ hình ảnh mạnh hơn. Tuy nhiên tôi biết mắt có thể bị ảo giác đánh lừa. Nên tôi hỏi người khác. Nếu mọi người thấy giống nhau thì có lẽ là thật. Đó là quy tắc của tôi: thấy, hỏi, rồi quyết định."}],"q":"Do you believe what you see more than what you hear?","vi":"Bạn tin điều mình thấy hơn điều mình nghe không?"},{"type":"Ý kiến (opinion)","out":"Nêu 1 vấn đề: biến đổi khí hậu hoặc rác nhựa. Lý do lo: ảnh hưởng mọi người, con cái. Ví dụ ngập, nóng. Việc có thể làm. Kết.","words":"climate change, plastic waste, flood, future generations, pollution, worry, responsibility","vers":[{"a":"The global problem I worry about most is climate change. First, it affects everyone, including my children. Here the weather is hotter and heavy rain causes more floods. Some of my customers had to move goods out of their warehouses during a flood. Second, it is hard to f
