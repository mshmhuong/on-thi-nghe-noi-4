thought it was easy. But there were twenty guests. I had to buy food, cook, and clean the house. First, the shop did not have enough fish. Second, the rice cooker broke. Third, I did not have time to rest. I was very stressed, but the guests loved the food. Now I know that I should cook less food or ask my sister to help. A small plan can save a lot of stress.","v":"Tôi muốn kể về một lần công việc căng thẳng hơn tôi nghĩ. Hai năm trước, tôi nấu cho tiệc gia đình. Tôi thích nấu ăn nên nghĩ dễ. Nhưng có hai mươi khách. Tôi phải mua đồ, nấu và dọn nhà. Thứ nhất, cửa hàng không đủ cá. Thứ hai, nồi cơm điện hỏng. Thứ ba, tôi không có thời gian nghỉ. Tôi rất căng thẳng nhưng khách thích món ăn. Giờ tôi biết nên nấu ít món hơn hoặc nhờ chị giúp. Một kế hoạch nhỏ tiết kiệm nhiều căng thẳng."},{"a":"I want to talk about a time when I expected a task to be hard, but it was easy and fun. Last year, I had to give a short talk in my English class. I was very afraid. But I practiced with my children, and they gave me ideas. During the talk, my classmates smiled and clapped. First, I felt proud. Second, I became more confident. Third, my English got better. I learned that fear is often bigger than the real problem. So now I try new things more often.","v":"Tôi muốn kể về một lần tôi nghĩ việc sẽ khó nhưng hóa ra dễ và vui. Năm ngoái, tôi phải nói một bài ngắn ở lớp tiếng Anh. Tôi rất sợ. Nhưng tôi luyện với các con và chúng cho tôi ý tưởng. Trong lúc nói, bạn cùng lớp mỉm cười và vỗ tay. Thứ nhất, tôi thấy tự hào. Thứ hai, tôi tự tin hơn. Thứ ba, tiếng Anh của tôi tiến bộ. Tôi học được rằng nỗi sợ thường lớn hơn vấn đề thật. Nên giờ tôi thử việc mới thường xuyên hơn."},{"a":"I want to talk about a task that was more enjoyable than I expected. Last month, I had to clean and organize our storage room. I thought it would be boring. But I found old photos and tools, and I remembered many things. Also, my children helped me, so we talked and laughed. After two hours, the room looked clean, and I felt proud. I learned that a boring task can be fun if you do it with other people. Now I am not afraid of hard chores. So my opinion is: attitude can change a task.","v":"Tôi muốn kể về một việc thú vị hơn tôi nghĩ. Tháng trước, tôi phải dọn và sắp xếp phòng kho. Tôi nghĩ sẽ chán. Nhưng tôi tìm thấy ảnh cũ và dụng cụ, và nhớ lại nhiều chuyện. Các con cũng giúp nên chúng tôi nói chuyện và cười. Sau hai giờ, căn phòng sạch và tôi thấy tự hào. Tôi học được rằng việc chán có thể vui nếu làm cùng người khác. Giờ tôi không sợ việc nặng. Nên ý kiến của tôi là: thái độ có thể đổi một công việc."}],"q":"A time when a task you expected to enjoy turned out to be stressful, or the opposite.","vi":"Một lần khi một công việc bạn tưởng sẽ thích hóa ra lại căng thẳng, hoặc ngược lại."},{"type":"Điều quan trọng (what is important)","out":"Mở: có 3 yếu tố chính. Thân: an toàn và môi trường, lợi ích cho người dân, tác động lâu dài. Kết: cần cân bằng.","words":"safety, environment, benefits, local residents, long-term effect, pollution, jobs","vers":[{"a":"I’d like to talk about what is important when a community decides whether to build a new power plant nearby. In my view, there are three key points. The first point is safety and the environment. People must be sure that the plant will not pollute the air or the water, and that there is a clear plan for accidents. For example, a coal plant can cause breathing problems for children who live nearby, and polluted water can destroy farmland. If the community cannot trust the safety plan, the project should not go ahead. The second point is the benefit for local people. A new plant can create jobs, bring investment and support small businesses around it. The community should also ask whether residents get cheaper electricity or better roads in return. If only a big company takes the profit, local people will feel it is unfair. The third point is the long-term effect. We should think about what will happen in twenty or thirty years. Who will pay for cleaning the area when the plant is old? Can it switch to cleaner energy, such as solar or wind? Also, the community should have a real voice, for example through public meetings. To sum up, safety, local benefits and the long-term future are the three things a community must balance. That’s why I believe the decision should never be made in a hurry.","v":"Tôi muốn nói về điều quan trọng khi một cộng đồng quyết định có xây nhà máy điện mới gần nơi mình sống hay không. Theo tôi, có ba điểm chính. Điểm thứ nhất là an toàn và môi trường. Người dân phải chắc chắn rằng nhà máy sẽ không làm ô nhiễm không khí hay nguồn nước, và có kế hoạch rõ ràng cho sự cố. Ví dụ, một nhà máy nhiệt điện than có thể gây bệnh về hô hấp cho trẻ em sống gần đó, và nguồn nước bị ô nhiễm có thể hủy hoại đất canh tác. Nếu cộng đồng không tin vào kế hoạch an toàn, dự án không nên tiến hành. Điểm thứ hai là lợi ích cho người dân địa phương. Một nhà máy mới có thể tạo việc làm, thu hút đầu tư và hỗ trợ các cơ sở kinh doanh nhỏ xung quanh. Cộng đồng cũng nên hỏi xem người dân có được điện rẻ hơn hay đường xá tốt hơn để đổi lại không. Nếu chỉ một công ty lớn hưởng lợi nhuận, người dân địa phương sẽ thấy điều đó không công bằng. Điểm thứ ba là tác động lâu dài. Chúng ta nên nghĩ xem hai ba chục năm sau sẽ ra sao. Ai sẽ trả tiền dọn dẹp khu vực khi nhà máy đã cũ? Nhà máy có thể chuyển sang năng lượng sạch hơn như mặt trời hoặc gió không? Ngoài ra, cộng đồng cần có tiếng nói thực sự, ví dụ qua các buổi họp lấy ý kiến dân. Tóm lại, an toàn, lợi ích địa phương và tương lai lâu dài là ba điều mà một cộng đồng phải cân bằng. Vì vậy tôi tin rằng quyết định này không bao giờ nên được đưa ra vội vàng."},{"a":"Let me talk about three things a community should think about. First, the opinion of local residents. Before building anything, the authorities must listen to the people who will live next to the plant, explain the risks clearly and answer their questions. For example, a village that was informed early accepted a solar farm, while another village protested against a surprise coal plant. Second, the type of energy. A gas or coal plant produces pollution, while solar and wind are cleaner, although they need more land. Third, the cost and the benefit. The community should ask who pays, how many jobs are created and whether electricity bills will drop. In conclusion, a good decision needs honest information, a clean choice and a fair share of benefits.","v":"Tôi xin nói về ba điều mà một cộng đồng nên suy nghĩ. Thứ nhất, ý kiến của người dân địa phương. Trước khi xây bất cứ thứ gì, chính quyền phải lắng nghe những người sẽ sống cạnh nhà máy, giải thích rõ các rủi ro và trả lời câu hỏi của họ. Ví dụ, một ngôi làng được báo trước đã chấp nhận một trang trại điện mặt trời, trong khi một làng khác phản đối một nhà máy nhiệt điện than xuất hiện bất ngờ. Thứ hai, loại năng lượng. Nhà máy khí hoặc than gây ô nhiễm, còn điện mặt trời và điện gió sạch hơn, dù cần nhiều đất hơn. Thứ ba, chi phí và lợi ích. Cộng đồng nên hỏi ai trả tiền, tạo được bao nhiêu việc làm và hóa đơn điện có giảm không. Tóm lại, một quyết định tốt cần thông tin trung thực, một lựa chọn sạch và phần lợi ích chia công bằng."},{"a":"I’d like to explain this with a simple comparison: a plant is like a new neighbour, so we must check whether it is safe, helpful and responsible. The first point is responsibility. The company should promise to clean up, pay for damage and follow strict rules, for instance by installing filters. The second point is the effect on daily life: noise, traffic and the view. A plant near a school or a farm may cause serious problems. The third point is the alternative. Maybe the community can save energy, build smaller local plants, or buy power from another area. On the other hand, refusing every project may cause blackouts. To conclude, communities should compare all options carefully and choose the one that protects people and still provides power.","v":"Tôi xin giải thích bằng một so sánh đơn giản: nhà máy giống như một người hàng xóm mới, nên ta phải xem họ có an toàn, có ích và có trách nhiệm không. Điểm thứ nhất là trách nhiệm. Công ty nên cam kết dọn dẹp, bồi thường thiệt hại và tuân thủ quy định nghiêm ngặt, chẳng hạn lắp bộ lọc. Điểm thứ hai là ảnh hưởng đến đời sống hằng ngày: tiếng ồn, giao thông và cảnh quan. Một nhà máy gần trường học hay nông trại có thể gây vấn đề nghiêm trọng. Điểm thứ ba là phương án thay thế. Có thể cộng đồng tiết kiệm năng lượng, xây các nhà máy nhỏ tại chỗ, hoặc mua điện từ khu vực khác. Mặt khác, từ chối mọi dự án có thể dẫn đến cúp điện. Tóm lại, các cộng đồng nên so sánh kỹ mọi lựa chọn và chọn phương án bảo vệ con người mà vẫn có điện."},{"a":"I want to talk about what is important when a community decides about a new power plant. I think there are three things. First, health. People near the plant should not get sick from smoke or noise. Second, jobs and money. A plant can give jobs to local people, and it can lower the electricity price. Third, listening. The government should hold meetings and listen to the people. For example, a village near a plant may worry about water. If the company explains and fixes the problem, people feel safe. So a good decision needs safety, benefits and communication.","v":"Tôi muốn nói về điều quan trọng khi một cộng đồng quyết định về nhà máy điện mới. Tôi nghĩ có ba điều. Thứ nhất, sức khỏe. Người sống gần nhà máy không nên bệnh vì khói hay tiếng ồn. Thứ hai, việc làm và tiền. Nhà máy có thể cho người địa phương việc làm và giảm giá điện. Thứ ba, lắng nghe. Chính phủ nên họp và nghe người dân. Ví dụ, một ngôi làng gần nhà máy có thể lo về nước. Nếu công ty giải thích và sửa vấn đề, người dân thấy an toàn. Nên quyết định tốt cần an toàn, lợi ích và trao đổi."},{"a":"I want to talk about a new power plant near a community. In my opinion, three things matter. First, the type of energy. Solar and wind are cleaner than coal, so many people prefer them. Second, the place. The plant should be far from houses, schools and rivers. Third, the future. We should think about the next ten or twenty years. Will the plant still be useful? Will it make the air dirty? For example, if my town had a plant, I would ask these questions. In short, clean energy, a good place and long-term thinking are important.","v":"Tôi muốn nói về nhà máy điện mới gần một cộng đồng. Theo tôi, ba điều quan trọng. Thứ nhất, loại năng lượng. Mặt trời và gió sạch hơn than nên nhiều người thích hơn. Thứ hai, vị trí. Nhà máy nên xa nhà, trường học và sông. Thứ ba, tương lai. Ta nên nghĩ đến mười hai mươi năm tới. Nhà máy còn hữu ích không? Nó có làm không khí bẩn không? Ví dụ, nếu thị trấn của tôi có nhà máy, tôi sẽ hỏi những câu này. Tóm lại, năng lượng sạch, vị trí tốt và suy nghĩ lâu dài là quan trọng."}],"q":"What is important when a community decides whether to build a new power plant nearby.","vi":"Điều gì quan trọng khi một cộng đồng quyết định có xây nhà máy điện mới gần đó hay không."},{"type":"So sánh (comparison)","out":"Mở: chọn bên (bằng chứng khoa học, nhưng có mắt thấy bổ sung). Thân: mắt bị đánh lừa; khoa học kiểm chứng, số liệu; nhưng mắt giúp phát hiện vấn đề, khoa học cũng có thể sai/chậm. Kết.","words":"scientific evidence, observation, bias, illusion, data, test, reliable","vers":[{"a":"I want to talk about trusting our eyes and trusting science. I think science should guide big decisions, but our eyes still help. First, our eyes can be fooled. A product may look clean and new but have bad chemicals that only a test can find. Second, science uses data that many people can check, so it is more reliable for health, safety and money. Third, our eyes give us the first clue. When something looks wrong, I know I must check it. So I look first, but I decide with facts. That is why I think important decisions need data, not only feelings.","v":"Tôi muốn nói về tin vào mắt mình và tin vào khoa học. Tôi nghĩ khoa học nên dẫn dắt quyết định lớn nhưng mắt ta vẫn giúp. Thứ nhất, mắt có thể bị lừa. Sản phẩm có thể trông sạch và mới nhưng có hóa chất xấu mà chỉ xét nghiệm mới thấy. Thứ hai, khoa học dùng dữ liệu nhiều người kiểm tra được nên đáng tin hơn cho sức khỏe, an toàn và tiền. Thứ ba, mắt cho ta manh mối đầu tiên. Khi thấy có gì sai, tôi biết phải kiểm tra. Nên tôi nhìn trước nhưng quyết định bằng sự thật. Vì vậy tôi nghĩ quyết định quan trọng cần dữ liệu, không chỉ cảm giác."},{"a":"I want to talk about trusting our eyes and trusting science. I think science is better for big decisions. First, our eyes can be wrong. For example, a street may look safe at night, but it is not. Second, science uses tests and numbers, so many people can check them. Third, science helps us with health. We cannot see germs, but doctors can. Of course, we still use our eyes in daily life. But for important things like medicine or money, I trust science. That is my opinion.","v":"Tôi muốn nói về tin vào mắt mình và tin vào khoa học. Tôi nghĩ khoa học tốt hơn cho quyết định lớn. Thứ nhất, mắt ta có thể sai. Ví dụ, con đường có vẻ an toàn ban đêm nhưng thực ra không. Thứ hai, khoa học dùng thử nghiệm và số liệu nên nhiều người kiểm tra được. Thứ ba, khoa học giúp ta về sức khỏe. Ta không thấy vi trùng nhưng bác sĩ thấy. Tất nhiên ta vẫn dùng mắt trong đời thường. Nhưng với việc quan trọng như thuốc hay tiền, tôi tin khoa học. Đó là ý kiến của tôi."},{"a":"I want to talk about which should guide our decisions: our eyes or science. I think we need both. First, our eyes give us the first clue. When I see dirty water, I know something is wrong. Second, science tells us the reason. A test can show what is in the water. Third, together they are stronger. For example, when I buy food, I look at it and I also read the label. So I use my eyes to start and science to decide.","v":"Tôi muốn nói về việc điều nào nên dẫn dắt quyết định của ta: mắt hay khoa học. Tôi nghĩ ta cần cả hai. Thứ nhất, mắt cho ta manh mối đầu tiên. Khi thấy nước bẩn, tôi biết có gì sai. Thứ hai, khoa học cho ta lý do. Một xét nghiệm cho thấy trong nước có gì. Thứ ba, cùng nhau mạnh hơn. Ví dụ, khi mua thức ăn, tôi nhìn và cũng đọc nhãn. Nên tôi dùng mắt để bắt đầu và khoa học để quyết định."},{"a":"I want to talk about trusting our eyes and trusting science. I choose our eyes in some situations. First, we know our own life best. If I see that my child is tired, I do not need a test. Second, science is sometimes slow or changes. For example, advice about food changes over time. Third, our eyes are quick in danger, like on the road. But for health and big choices, I still ask experts. So the best way is to use both carefully.","v":"Tôi muốn nói về tin vào mắt mình và tin vào khoa học. Tôi chọn mắt trong một số tình huống. Thứ nhất, ta biết rõ cuộc sống mình nhất. Nếu thấy con mệt, tôi không cần xét nghiệm. Thứ hai, khoa học đôi khi chậm hoặc thay đổi. Ví dụ, lời khuyên về thức ăn đổi theo thời gian. Thứ ba, mắt nhanh khi nguy hiểm như trên đường. Nhưng với sức khỏe và lựa chọn lớn, tôi vẫn hỏi chuyên gia. Nên cách tốt nhất là dùng cả hai cẩn thận."},{"a":"I want to talk about our eyes and scientific evidence. I think evidence should guide important decisions. First, it is more fair. Everyone can see the same data. Second, it protects us from tricks. A product may look good but be dangerous. Third, it helps governments. For example, to build a new road, they use studies about traffic. Our eyes can help us ask questions, but the answers come from evidence. So that is why I trust science for serious decisions.","v":"Tôi muốn nói về mắt ta và bằng chứng khoa học. Tôi nghĩ bằng chứng nên dẫn dắt quyết định quan trọng. Thứ nhất, nó công bằng hơn. Mọi người thấy cùng dữ liệu. Thứ hai, nó bảo vệ ta khỏi mánh lừa. Một sản phẩm có thể trông tốt nhưng nguy hiểm. Thứ ba, nó giúp chính phủ. Ví dụ, để xây đường mới, họ dùng nghiên cứu về giao thông. Mắt ta giúp đặt câu hỏi nhưng câu trả lời đến từ bằng chứng. Vì vậy tôi tin khoa học cho các quyết định nghiêm túc."}],"q":"Trusting your own eyes and trusting scientific evidence: which should guide important decisions?","vi":"Tin vào mắt mình và tin vào bằng chứng khoa học: điều nào nên dẫn dắt các quyết định quan trọng?"},{"type":"Cách làm (how to)","out":"Mở: có 3 cách. 1) Bảo tồn mặt tiền, quy định chiều cao, trùng tu. 2) Xây nhà ở mới, tòa nhà cao ở khu khác, cải tạo bên trong. 3) Giao thông công cộng, đi bộ, hạn chế xe vào khu cổ. Kết.","words":"historic area, preserve, renovate, public transport, zoning, heritage, modern housing","vers":[{"a":"I want to talk about how a city can keep old areas and still have modern houses and transport. I have three ideas. First, protect and repair old buildings. The city can keep the outside and make the inside modern. Many old houses in the world are now cafes and small apartments. Second, build new apartments in other places. If they are near the city edge and connected by bus or metro, the old area does not have to hold everyone. Third, control cars. Old streets are small, so buses, bikes and walking are better. Some streets can be for walking only on weekends. So a city can grow and keep its history at the same time.","v":"Tôi muốn nói về cách thành phố giữ khu cổ mà vẫn có nhà ở và giao thông hiện đại. Tôi có ba ý. Thứ nhất, bảo vệ và sửa nhà cũ. Thành phố có thể giữ bên ngoài và làm bên trong hiện đại. Nhiều nhà cũ trên thế giới giờ là quán cà phê và căn hộ nhỏ. Thứ hai, xây căn hộ mới ở nơi khác. Nếu gần rìa thành phố và nối bằng xe buýt hay tàu điện, khu cổ không phải chứa mọi người. Thứ ba, kiểm soát xe. Phố cổ nhỏ nên xe buýt, xe đạp và đi bộ tốt hơn. Một số phố có thể chỉ cho đi bộ vào cuối tuần. Nên thành phố có thể phát triển và giữ lịch sử cùng lúc."},{"a":"I want to talk about how a city can keep old areas and still have new buildings. I think there are three ways. First, make rules. New buildings near the old area must be low and have a similar style. Second, use old buildings in a new way, like cafes, shops and small hotels. They bring money to keep the buildings. Third, build new apartments in other places and use buses or metro to connect them. For example, Hoi An keeps its old town and has new areas outside. In short, rules, new uses and good transport can protect history.","v":"Tôi muốn nói về cách một thành phố giữ khu cổ mà vẫn có nhà mới. Tôi nghĩ có ba cách. Thứ nhất, đặt quy định. Nhà mới gần khu cổ phải thấp và có kiểu dáng tương tự. Thứ hai, dùng nhà cũ theo cách mới như quán cà phê, cửa hàng và khách sạn nhỏ. Chúng mang tiền để giữ các tòa nhà. Thứ ba, xây chung cư mới ở nơi khác và nối bằng xe buýt hay tàu điện. Ví dụ, Hội An giữ phố cổ và có khu mới bên ngoài. Tóm lại, quy định, công dụng mới và giao thông tốt có thể bảo vệ lịch sử."},{"a":"I want to talk about keeping a historic area in a modern city. I think there are three ideas. First, limit cars. Old streets are narrow, so people can walk or use bikes. Second, make the old area a tourist place. Tourists pay for tickets and food, and the city can use this money to repair houses. Third, ask the residents. They live there, so they know the problems. For example, they may want a better water system. So the city should listen and help them.","v":"Tôi muốn nói về việc giữ khu lịch sử trong thành phố hiện đại. Tôi nghĩ có ba ý. Thứ nhất, hạn chế xe. Phố cổ hẹp nên người ta đi bộ hoặc dùng xe đạp. Thứ hai, biến khu cổ thành nơi du lịch. Du khách trả tiền vé và đồ ăn, và thành phố dùng tiền này sửa nhà. Thứ ba, hỏi cư dân. Họ sống ở đó nên biết vấn đề. Ví dụ, họ có thể muốn hệ thống nước tốt hơn. Nên thành phố nên lắng nghe và giúp họ."},{"a":"I want to talk about how a city can have old areas and modern life together. In my opinion, there are three steps. First, repair and clean the old buildings. Second, put modern things inside, like internet and air conditioning. People can live comfortably. Third, teach children about history, for example school trips to the old streets. When people are proud, they take care of the area. In short, repair, modernize inside and educate.","v":"Tôi muốn nói về cách một thành phố có khu cổ và đời sống hiện đại cùng nhau. Theo tôi có ba bước. Thứ nhất, sửa và làm sạch nhà cũ. Thứ hai, đặt đồ hiện đại bên trong như internet và máy lạnh. Người ta sống thoải mái. Thứ ba, dạy trẻ về lịch sử, ví dụ chuyến đi trường đến phố cổ. Khi người ta tự hào, họ chăm sóc khu vực. Tóm lại, sửa, hiện đại hóa bên trong và giáo dục."},{"a":"I want to talk about protecting history in a growing city. I think three things help. First, a clear map. The city should decide which areas are protected and which areas are for new buildings. Second, money. The city can give small support to owners of old houses. Third, new ideas from young people, like art events or night markets. They make the old area alive. For example, a night market can bring many visitors. So the city can enjoy both history and growth.","v":"Tôi muốn nói về bảo vệ lịch sử trong thành phố đang lớn. Tôi nghĩ ba điều giúp ích. Thứ nhất, bản đồ rõ ràng. Thành phố nên quyết định khu nào được bảo vệ và khu nào cho nhà mới. Thứ hai, tiền. Thành phố có thể hỗ trợ nhỏ cho chủ nhà cũ. Thứ ba, ý tưởng mới của người trẻ như sự kiện nghệ thuật hay chợ đêm. Chúng làm khu cổ sống động. Ví dụ, chợ đêm có thể mang nhiều khách. Nên thành phố có thể có cả lịch sử và phát triển."}],"q":"How a city can keep its historic areas while still providing modern housing and transport.","vi":"Làm sao một thành phố có thể giữ các khu lịch sử mà vẫn có nhà ở và giao thông hiện đại."},{"type":"Tại sao (why)","out":"Mở: có 3 lý do. 1) Lời nói hình thành hình ảnh bản thân (tự tin hay tự ti). 2) Giọng điệu thể hiện tôn trọng hay coi thường. 3) Tác động lâu dài lên hành vi, sức khỏe tinh thần. Kết.","words":"self-image, confidence, patronizing, respect, tone, elderly, dignity","vers":[{"a":"I want to talk about why the way we speak to old people and children changes how they see themselves. I have three reasons. First, words make self-image. If a child often hears “you are clever”, he believes it and tries more. If he hears “you are lazy” every day, he loses confidence. Second, tone shows respect. When people speak to old people slowly and loudly, as if they cannot do anything, old people may feel like a burden. My grandmother is happy when we ask her opinion. Third, these feelings stay for a long time. So we should speak with patience and respect.","v":"Tôi muốn nói về việc vì sao cách ta nói với người già và trẻ em đổi cách họ nhìn bản thân. Tôi có ba lý do. Thứ nhất, lời nói tạo hình ảnh bản thân. Nếu trẻ thường nghe “con thông minh”, em tin và cố hơn. Nếu nghe “con lười” mỗi ngày, em mất tự tin. Thứ hai, giọng điệu thể hiện sự tôn trọng. Khi người ta nói với người già chậm và to như thể họ không làm được gì, người già có thể thấy mình là gánh nặng. Bà tôi vui khi chúng tôi hỏi ý kiến bà. Thứ ba, những cảm giác này ở lại lâu. Nên ta nên nói với sự kiên nhẫn và tôn trọng."},{"a":"I want to talk about how people speak to children or old people. I think it changes how they feel. First, kind words give confidence. If a teacher says “you can do it”, a child tries more. Second, polite words show respect. Old people like to be asked for their opinion. Third, rude words can hurt for a long time. For example, if parents often say “you are lazy”, the child may believe it. So we should choose our words carefully.","v":"Tôi muốn nói về cách người ta nói với trẻ em hay người già. Tôi nghĩ nó đổi cảm giác của họ. Thứ nhất, lời tử tế cho sự tự tin. Nếu thầy nói “em làm được”, trẻ cố hơn. Thứ hai, lời lịch sự thể hiện sự tôn trọng. Người già thích được hỏi ý kiến. Thứ ba, lời thô có thể làm đau lâu. Ví dụ, nếu cha mẹ hay nói “con lười”, đứa trẻ có thể tin. Nên ta nên chọn lời cẩn thận."},{"a":"I want to talk about speaking to the elderly and to children. I think there are three effects. First, self-image. People see themselves through other people’s words. Second, mood. Gentle words make them happy and less afraid. Third, behavior. Children copy adults, and old people may become quiet if nobody talks to them. For example, my grandmother is happy when we ask about her old stories. In short, our words can make people feel valuable or useless.","v":"Tôi muốn nói về cách nói với người già và trẻ em. Tôi nghĩ có ba tác động. Thứ nhất, hình ảnh bản thân. Người ta thấy mình qua lời người khác. Thứ hai, tâm trạng. Lời nhẹ nhàng làm họ vui và bớt sợ. Thứ ba, hành vi. Trẻ bắt chước người lớn, và người già có thể trầm đi nếu không ai nói chuyện. Ví dụ, bà tôi vui khi chúng tôi hỏi về chuyện cũ. Tóm lại, lời nói có thể khiến người ta thấy mình có giá trị hay vô dụng."},{"a":"I want to talk about why the way we speak is important for children and old people. I think there are three reasons. First, children are still learning, so they believe adults. Second, old people may feel weak, so they need respect. Third, a warm voice makes them feel safe. For example, when I talk slowly and kindly to my child before a test, she feels calm. So speaking in a good way is a small thing with a big effect.","v":"Tôi muốn nói về việc vì sao cách ta nói quan trọng với trẻ em và người già. Tôi nghĩ có ba lý do. Thứ nhất, trẻ còn đang học nên tin người lớn. Thứ hai, người già có thể thấy mình yếu nên cần sự tôn trọng. Thứ ba, giọng ấm làm họ thấy an toàn. Ví dụ, khi tôi nói chậm và tử tế với con trước kỳ thi, con thấy bình tĩnh. Nên nói chuyện tốt là việc nhỏ có tác động lớn."},{"a":"I want to talk about how our way of speaking affects old people and children. In my view, there are three important things. First, tone. A soft tone is better than a loud tone. Second, listening. When we listen to them, they feel important. Third, praise. We should praise small things. For example, I always say “thank you” to my mother when she helps me, and she smiles. This simple habit makes our family closer.","v":"Tôi muốn nói về cách nói của ta ảnh hưởng đến người già và trẻ em. Theo tôi có ba điều quan trọng. Thứ nhất, giọng điệu. Giọng nhẹ tốt hơn giọng to. Thứ hai, lắng nghe. Khi ta lắng nghe họ, họ thấy mình quan trọng. Thứ ba, khen. Ta nên khen những việc nhỏ. Ví dụ, tôi luôn nói “cảm ơn” với mẹ khi mẹ giúp tôi và mẹ mỉm cười. Thói quen đơn giản này làm gia đình gần nhau hơn."}],"q":"Why the way people speak to the elderly or to children can affect how those people see themselves.","vi":"Vì sao cách người ta nói với người già hoặc trẻ em có thể ảnh hưởng đến cách những người đó nhìn về bản thân."}]},{"code":"10","p1":[{"type":"Ý kiến (opinion)","out":"Đề gốc có thể hơi khác chữ. Thân thiện: có. Chuyên nghiệp: không trong môi trường trang trọng. Kết luận: tùy hoàn cảnh.","words":"slang, informal, formal, workplace, audience, relaxed, credibility","vers":[{"a":"To be honest, it depends. Slang can make a speaker sound friendly and relaxed. For example, when I talk with friends or young customers, who often use slang too, it helps us connect quickly. However, I don’t think it sounds professional. In a meeting or a presentation, people expect clear and polite language. If I use too much slang at work, people may doubt me. So I’d say friendly, yes, but professional, not really. The best choice is to know your audience.","v":"Thật lòng mà nói, còn tùy. Tiếng lóng có thể khiến người nói nghe thân thiện và thoải mái. Ví dụ, khi tôi nói chuyện với bạn bè hoặc khách hàng trẻ, những người cũng hay dùng tiếng lóng, nó giúp chúng tôi gần nhau nhanh hơn. Tuy nhiên, tôi không nghĩ nó nghe chuyên nghiệp. Trong một cuộc họp hay buổi thuyết trình, mọi người mong đợi ngôn ngữ rõ ràng và lịch sự. Nếu tôi dùng quá nhiều tiếng lóng ở nơi làm việc, người ta có thể nghi ngờ tôi. Nên tôi sẽ nói: thân thiện thì có, còn chuyên nghiệp thì chưa hẳn. Lựa chọn tốt nhất là biết rõ người nghe của mình."},{"a":"In my opinion, slang makes people sound friendly, but it is risky at work. For example, young people use slang with friends to show they belong to the same group, and that creates warmth. However, in a job interview or a report, slang may suggest that the speaker is careless. Another problem is that older customers or foreigners may not understand it. So I think we should keep slang for casual situations. Overall, clear and polite language is safer when we want to look professional.","v":"Theo tôi, tiếng lóng làm người nói nghe thân thiện, nhưng có rủi ro ở chỗ làm. Ví dụ, người trẻ dùng tiếng lóng với bạn bè để cho thấy họ cùng một nhóm, và điều đó tạo sự ấm áp. Tuy nhiên, trong buổi phỏng vấn xin việc hoặc một bản báo cáo, tiếng lóng có thể khiến người ta nghĩ người nói cẩu thả. Một vấn đề khác là khách hàng lớn tuổi hoặc người nước ngoài có thể không hiểu. Vì vậy tôi nghĩ nên để tiếng lóng cho những lúc thoải mái. Nhìn chung, ngôn ngữ rõ ràng và lịch sự an toàn hơn khi ta muốn trông chuyên nghiệp."},{"a":"I’d say it depends on the situation and the audience. When I talk to my younger cousins, a little slang helps me sound relaxed and close to them. But when I speak to a client about money or contracts, I choose careful words, because trust is very important. Some modern companies even allow a casual style, so a few friendly expressions can be fine there. On the other hand, too much slang can cause misunderstanding. To conclude, a friendly tone can be professional, but only if the language stays clear and respectful.","v":"Tôi cho rằng còn tùy tình huống và người nghe. Khi nói chuyện với các em họ nhỏ tuổi, một chút tiếng lóng giúp tôi nghe thoải mái và gần gũi. Nhưng khi nói với khách hàng về tiền bạc hay hợp đồng, tôi chọn từ ngữ cẩn thận, vì sự tin tưởng rất quan trọng. Một số công ty hiện đại còn cho phép phong cách thoải mái, nên vài câu thân mật ở đó cũng ổn. Mặt khác, dùng quá nhiều tiếng lóng có thể gây hiểu lầm. Tóm lại, giọng điệu thân thiện vẫn có thể chuyên nghiệp, nhưng chỉ khi ngôn ngữ vẫn rõ ràng và tôn trọng."},{"a":"I think slang makes people sound friendly, but not professional. When I talk with my friends, I use slang and we laugh. But at work, with a customer, I use polite words. If I use slang, the customer may think I am not serious. So I use slang only with close people.","v":"Tôi nghĩ tiếng lóng làm người ta nghe thân thiện nhưng không chuyên nghiệp. Khi nói với bạn, tôi dùng tiếng lóng và chúng tôi cười. Nhưng ở nơi làm việc, với khách, tôi dùng từ lịch sự. Nếu dùng tiếng lóng, khách có thể nghĩ tôi không nghiêm túc. Nên tôi chỉ dùng tiếng lóng với người thân."},{"a":"It depends on the job. In a creative job, like advertising, slang can sound fresh and friendly. In a bank or an office, it sounds strange. Also, some older people do not understand slang. So I think we should know our listener first.","v":"Còn tùy nghề. Trong công việc sáng tạo như quảng cáo, tiếng lóng nghe mới và thân thiện. Ở ngân hàng hay văn phòng, nó nghe lạ. Ngoài ra một số người lớn tuổi không hiểu tiếng lóng. Nên tôi nghĩ ta nên biết người nghe trước."}],"q":"Does using slang make a speaker sound friendly or unprofessional?","vi":"Dùng tiếng lóng có khiến người nói nghe thân thiện hay thiếu chuyên nghiệp?"},{"type":"Câu chuyện ngắn (experience)","out":"Trả lời: có, cả hai. Kể một lần được khen (phát âm, rõ ràng) và một lần bị góp ý (nói nhanh). Cảm xúc, học được gì. Kết.","words":"praise, criticize, pronunciation, speak clearly, feedback, confident, improve","vers":[{"a":"Yes, I have both. A customer told me that I explain things very clearly, and I was proud. But my English teacher said that I speak too fast and I do not say the last sounds. At first I felt shy, but it was useful. Now I try to speak slowly. I think praise and criticism both help us if we listen and try to improve.","v":"Có cả hai. Một khách nói tôi giải thích rất rõ và tôi tự hào. Nhưng cô giáo tiếng Anh nói tôi nói quá nhanh và không đọc âm cuối. Lúc đầu tôi thấy ngại nhưng điều đó hữu ích. Giờ tôi cố nói chậm. Tôi nghĩ lời khen và lời chê đều giúp ta nếu ta lắng nghe và cố cải thiện."},{"a":"Yes, my teacher praised my writing. She said my ideas were clear. I felt very happy and I wrote more. But another teacher said my speaking is too fast. I was a little sad, but I tried to speak slowly. I think both comments helped me.","v":"Có, cô giáo khen bài viết của tôi. Cô nói ý của tôi rõ. Tôi rất vui và viết nhiều hơn. Nhưng một thầy khác nói tôi nói quá nhanh. Tôi hơi buồn nhưng cố nói chậm. Tôi nghĩ cả hai nhận xét đều giúp tôi."},{"a":"Yes. My customers often say I speak politely, and I like that. But my sister says I sometimes sound too serious. She says I should smile more. At first, I was surprised, but now I try to be friendlier when I talk.","v":"Có. Khách của tôi thường nói tôi nói lịch sự và tôi thích điều đó. Nhưng chị tôi nói đôi khi tôi nghe quá nghiêm. Chị nói tôi nên cười nhiều hơn. Lúc đầu tôi ngạc nhiên nhưng giờ tôi cố thân thiện hơn khi nói."},{"a":"I was criticized for my English pronunciation in class. I said “ship” instead of “sheep” one day, and everybody laughed. I felt shy, but my teacher helped me practice. Now I listen and repeat every day. It is funny now, and I do not feel afraid.","v":"Tôi bị góp ý về phát âm tiếng Anh ở lớp. Đôi khi tôi nói nhầm từ và mọi người cười. Tôi thấy ngại nhưng cô giáo giúp tôi luyện. Giờ tôi nghe và lặp lại mỗi ngày. Giờ thấy vui và tôi không sợ."},{"a":"Not often, but once my friend said, “You speak very clearly, you should be a teacher.” I was happy because I want to teach in the future. That praise gave me energy. I now practice speaking more, and I make short videos to improve.","v":"Không thường xuyên, nhưng có lần bạn tôi nói “Bạn nói rất rõ, bạn nên làm giáo viên.” Tôi vui vì tôi muốn dạy học sau này. Lời khen đó cho tôi năng lượng. Giờ tôi luyện nói nhiều hơn và làm video ngắn để tiến bộ."}],"q":"Have you ever been praised or criticized for the way you speak?","vi":"Bạn đã bao giờ được khen hoặc bị chê về cách nói chuyện của mình chưa?"},{"type":"Ý kiến (opinion)","out":"Trả lời: không hẳn. Lý do 1: giờ dài không bằng hiệu quả. Lý do 2: làm quá sức gây sai sót, kiệt sức. Ngoại lệ: mùa cao điểm. Kết: kết quả mới đo.","words":"productivity, efficient, burnout, overtime, results, quality, peak season","vers":[{"a":"No, I do not think so. First, tired people make more mistakes. When I do accounting late at night, I often check the numbers again the next morning. Second, a good employee can finish the same work in less time. In busy times, like the end of a quarter, we may need extra hours. But I judge workers by their results and attitude, not by how long they stay.","v":"Không, tôi không nghĩ vậy. Thứ nhất, người mệt dễ sai hơn. Khi tôi làm kế toán khuya, sáng hôm sau tôi thường phải kiểm lại các con số. Thứ hai, nhân viên giỏi có thể làm cùng việc trong ít thời gian hơn. Vào lúc bận như cuối quý, có thể cần thêm giờ. Nhưng tôi đánh giá công nhân qua kết quả và thái độ, không phải họ ở lại bao lâu."},{"a":"No, I do not think so. Working long hours can make people tired. A tired person makes more mistakes. A good employee finishes the job on time and with good quality. For example, in my work, I prefer a worker who is fast and careful.","v":"Không, tôi không nghĩ vậy. Làm nhiều giờ có thể làm người ta mệt. Người mệt sai nhiều hơn. Nhân viên giỏi xong việc đúng hạn và chất lượng tốt. Ví dụ, trong công việc, tôi thích một công nhân nhanh và cẩn thận."},{"a":"Sometimes yes. If someone stays late to finish an important job, it shows responsibility. At the end of a quarter, I also work late. But if someone always stays late because they are slow, it is not good. So I look at the reason.","v":"Đôi khi có. Nếu ai đó ở lại muộn để xong việc quan trọng, điều đó thể hiện trách nhiệm. Cuối quý, tôi cũng làm muộn. Nhưng nếu ai đó luôn ở lại muộn vì chậm thì không tốt. Nên tôi xem lý do."},{"a":"I think working smart is better than working long. If you plan well, you can finish early and have time for family. Also, rest helps you think better. In my family, we try to stop work at six o’clock. Then we eat dinner together.","v":"Tôi nghĩ làm việc thông minh tốt hơn làm lâu. Nếu lên kế hoạch tốt, bạn xong sớm và có thời gian cho gia đình. Nghỉ ngơi cũng giúp nghĩ tốt hơn. Trong gia đình tôi, chúng tôi cố dừng việc lúc sáu giờ. Rồi ăn tối cùng nhau."},{"a":"In some companies, bosses like people who stay late. But I do not agree. This can make workers unhappy, and they may leave. A better way is to give a good reward for good results. Then workers feel respected.","v":"Ở một số công ty, sếp thích người ở lại muộn. Nhưng tôi không đồng ý. Điều này có thể làm công nhân không vui và họ có thể bỏ đi. Cách tốt hơn là thưởng tốt cho kết quả tốt. Khi đó công nhân thấy được tôn trọng."}],"q":"Is working long hours a sign of a good employee?","vi":"Làm việc nhiều giờ có phải dấu hiệu của một nhân viên giỏi không?"},{"type":"Hai lý do (two reasons)","out":"Lý do 1: não nhận dạng khuôn mặt rất nhạy (pareidolia), tiến hóa. Lý do 2: ta tìm kiếm mô thức, trí tưởng tượng. Ví dụ ổ cắm điện trông như mặt cười. Kết.","words":"pattern, face recognition, brain, imagination, instinct, everyday objects, cloud","vers":[{"a":"I think there are two reasons. First, our brain is very good at finding faces. It was important in the past to know who is a friend or an enemy. So sometimes the brain finds a face even when there is none. Second, we like to find shapes, and we have imagination. For example, a power socket can look like a smiling face, and my children laugh about it. It is just a funny side effect of how our brain works.","v":"Tôi nghĩ có hai lý do. Thứ nhất, não ta rất giỏi tìm khuôn mặt. Ngày xưa điều này quan trọng để biết ai là bạn hay thù. Nên đôi khi não thấy khuôn mặt dù không có. Thứ hai, ta thích tìm hình dạng và có trí tưởng tượng. Ví dụ, ổ cắm điện có thể trông như mặt cười và các con tôi cười về điều đó. Đó chỉ là tác dụng phụ vui của cách não hoạt động."},{"a":"I think it is because our brain likes faces. A baby learns to look at faces first. So when we see two dots and a line, our brain says “a face!”. It is a habit from childhood. That is why we can see a face in a cloud or a wall.","v":"Tôi nghĩ vì não ta thích khuôn mặt. Em bé học nhìn khuôn mặt đầu tiên. Nên khi thấy hai chấm và một vạch, não nói “một khuôn mặt!”. Đó là thói quen từ nhỏ. Vì vậy ta thấy khuôn mặt trong mây hay tường."},{"a":"It is because we have imagination. When we look at clouds, we try to find shapes: a dog, a flower, a face. It is fun, and children love it. For example, my son always tells me, “Mom, that cloud looks like a rabbit!” I think imagination makes the world more interesting.","v":"Vì ta có trí tưởng tượng. Khi nhìn mây, ta cố tìm hình dạng: con chó, bông hoa, khuôn mặt. Điều đó vui và trẻ em rất thích. Ví dụ, con trai tôi luôn nói “Mẹ ơi, đám mây này giống con thỏ!” Tôi nghĩ trí tưởng tượng làm thế giới thú vị hơn."},{"a":"I read that it is a survival skill. In the past, people needed to see an animal or a person quickly, even in the dark. So the brain learned to find faces fast. Sometimes it makes mistakes, but it is better to make a mistake than to miss a danger.","v":"Tôi đọc rằng đó là kỹ năng sinh tồn. Ngày xưa, người ta cần thấy nhanh một con vật hay một người, cả trong bóng tối. Nên não học tìm khuôn mặt nhanh. Đôi khi nó nhầm nhưng nhầm còn hơn bỏ lỡ nguy hiểm."},{"a":"I think it is because we are social. We like to be with other people, so we look for faces everywhere. When we feel lonely, we may see faces more often. For example, the front of a car can look like a smiling face. This makes me smile when I drive.","v":"Tôi nghĩ vì ta là người xã hội. Ta thích ở bên người khác nên tìm khuôn mặt ở khắp nơi. Khi thấy cô đơn, ta có thể thấy khuôn mặt thường hơn. Ví dụ, đầu xe có thể trông như khuôn mặt cười. Điều này làm tôi mỉm cười khi lái xe."}],"q":"Why do people see faces in clouds or in everyday objects?","vi":"Vì sao người ta thấy khuôn mặt trong mây hay trong các đồ vật hằng ngày?"},{"type":"Hai việc (two things)","out":"Việc 1: quyên góp hoặc làm tình nguyện. Việc 2: chọn hàng công bằng, ủng hộ doanh nghiệp tử tế, lên tiếng.","words":"donate, volunteer, raise awareness, fair trade, make a difference, small steps, poverty","vers":[{"a":"There are two things one person can do. First, we can donate money or time. Even a small amount helps, and volunteering at a local charity shows us how poverty really feels. Second, we can make careful choices as consumers. For instance, buying fair trade coffee guarantees a better price for farmers. One person cannot solve poverty alone, but if many people take small steps, a whole community can change.","v":"Một người có thể làm hai việc. Trước hết, chúng ta có thể quyên góp tiền hoặc thời gian. Dù chỉ một khoản nhỏ cũng giúp ích, và đi tình nguyện ở một tổ chức từ thiện địa phương cho ta thấy đói nghèo thật sự là thế nào. Thứ hai, chúng ta có thể lựa chọn cẩn thận khi là người tiêu dùng. Ví dụ, mua cà phê thương mại công bằng bảo đảm nông dân có giá tốt hơn. Một người không thể tự giải quyết đói nghèo, nhưng nếu nhiều người cùng làm những bước nhỏ, cả một cộng đồng có thể thay đổi."},{"a":"One person can start with their own daily habits. For example, I can reduce waste, save water and avoid buying things I don’t need, and the money I save can go to people in need. Another way is to use my own skills. If I’m an accountant, I can help a small charity manage its books for free, which lets more money reach families. Of course, one person cannot end poverty. However, small and steady actions inspire others to join. Overall, I believe change starts with ordinary people who are willing to act.","v":"Một người có thể bắt đầu từ thói quen hằng ngày của mình. Ví dụ, tôi có thể giảm rác thải, tiết kiệm nước và không mua những thứ không cần, rồi dùng số tiền tiết kiệm giúp người khó khăn. Một cách khác là dùng chính kỹ năng của mình. Nếu tôi là kế toán, tôi có thể giúp một tổ chức từ thiện nhỏ làm sổ sách miễn phí, để nhiều tiền hơn đến tay các gia đình. Tất nhiên, một người không thể chấm dứt đói nghèo. Tuy nhiên, những việc nhỏ và đều đặn truyền cảm hứng cho người khác cùng tham gia. Nhìn chung, tôi tin thay đổi bắt đầu từ những người bình thường sẵn sàng hành động."},{"a":"I think education is the key, so one person can help by teaching or sponsoring a child’s studies. Poverty often continues because children cannot go to school. For instance, many people in my town pay school fees for a poor student, and that child can later support the whole family. We can also speak up and vote for leaders who care about fairness. On the other hand, charity alone is not enough, so we must also support fair jobs and fair prices. In the long run, educated people can solve problems by themselves.","v":"Tôi nghĩ giáo dục là chìa khóa, nên một người có thể giúp bằng cách dạy học hoặc đỡ đầu việc học của một em nhỏ. Nghèo đói thường kéo dài vì trẻ em không được đến trường. Ví dụ, nhiều người ở thị trấn tôi đóng học phí cho một học sinh nghèo, và em đó sau này có thể nuôi cả gia đình. Chúng ta cũng có thể lên tiếng và bầu cho những người lãnh đạo quan tâm đến sự công bằng. Mặt khác, chỉ làm từ thiện thì chưa đủ, nên ta cũng cần ủng hộ việc làm công bằng và giá cả công bằng. Về lâu dài, những người được học hành sẽ tự giải quyết được vấn đề."},{"a":"I think one person can teach. For example, I can help a poor child with his homework. Education is a way out of poverty. It is a small action, but it can change a life. Also, I can give old clothes and books to families who need them.","v":"Tôi nghĩ một người có thể dạy học. Ví dụ, tôi có thể giúp một đứa trẻ nghèo làm bài tập. Giáo dục là con đường thoát nghèo. Đó là hành động nhỏ nhưng có thể đổi một cuộc đời. Tôi cũng có thể cho quần áo và sách cũ cho các gia đình cần."},{"a":"One person can be honest and fair in business. For example, I pay my workers on time and give them a fair salary. If every boss does this, many families will have a better life. I can also buy products from small local sellers, so they earn more.","v":"Một người có thể trung thực và công bằng trong kinh doanh. Ví dụ, tôi trả lương công nhân đúng hạn và công bằng. Nếu mọi ông chủ làm vậy, nhiều gia đình sẽ có cuộc sống tốt hơn. Tôi cũng có thể mua hàng từ người bán nhỏ địa phương để họ kiếm nhiều hơn."}],"q":"What can one person do about global problems like poverty?","vi":"Một người có thể làm gì trước những vấn đề toàn cầu như đói nghèo?"},{"type":"Vấn đề cụ thể (problem)","out":"Nêu vấn đề: quá nhiều xe máy, kẹt giờ cao điểm, thiếu giao thông công cộng. Nguyên nhân. Ảnh hưởng (mất thời gian, ô nhiễm). Gợi ý. Kết.","words":"traffic jam, rush hour, public transport, motorbike, pollution, commute, infrastructure","vers":[{"a":"In my city, the biggest problem is traffic at rush hour. There are too many motorbikes and cars, and the roads are small. Public transport is not enough, so most people drive. This causes long waiting time, dirty air and stress. For example, when I visit clients in the afternoon, a short trip can take one hour. I think the city should improve the buses. If more people take the bus, the traffic will be lighter.","v":"Ở thành phố tôi, vấn đề lớn nhất là giao thông giờ cao điểm. Có quá nhiều xe máy và ô tô và đường nhỏ. Giao thông công cộng không đủ nên hầu hết mọi người tự lái. Điều này gây chờ lâu, không khí bẩn và căng thẳng. Ví dụ, khi tôi đến gặp khách buổi chiều, một chuyến ngắn có thể mất một giờ. Tôi nghĩ thành phố nên cải thiện xe buýt. Nếu nhiều người đi xe buýt, giao thông sẽ nhẹ hơn."},{"a":"The biggest problem is too many motorbikes. In the morning and in the evening, the roads are full. People wait a long time at the traffic lights. It also makes the air dirty. I think the city needs more buses, so people can leave their motorbikes at home.","v":"Vấn đề lớn nhất là quá nhiều xe máy. Buổi sáng và buổi tối, đường đầy xe. Người ta chờ lâu ở đèn đỏ. Nó cũng làm không khí bẩn. Tôi nghĩ thành phố cần thêm xe buýt để người ta để xe máy ở nhà."},{"a":"I think the problem is bad habits. Some people do not follow the rules. They park on the pavement or drive on the wrong side. This causes accidents and makes traffic worse. If we all follow the rules and are polite, the roads will be safer.","v":"Tôi nghĩ vấn đề là thói quen xấu. Một số người không theo luật. Họ đậu xe trên vỉa hè hoặc đi sai đường. Điều này gây tai nạn và làm giao thông tệ hơn. Nếu ai cũng theo luật và lịch sự, đường sẽ an toàn hơn."},{"a":"The roads are too small for the number of vehicles. When it rains, there is also flooding, and traffic stops. For example, I once spent two hours going home after heavy rain. I think the city should repair the drainage and widen some roads.","v":"Đường quá nhỏ so với số xe. Khi mưa còn ngập nên giao thông dừng. Ví dụ, có lần tôi mất hai giờ để về nhà sau mưa lớn. Tôi nghĩ thành phố nên sửa cống thoát nước và mở rộng một số đường."},{"a":"Parking is a big problem. There are not enough parking places, so people park on the street. This makes the street narrow and causes traffic jams. A parking building near the market and the school would help a lot.","v":"Chỗ đậu xe là vấn đề lớn. Không đủ chỗ đậu nên người ta đậu ngoài đường. Điều này làm đường hẹp và gây kẹt xe. Một tòa nhà đỗ xe gần chợ và trường sẽ giúp nhiều."}],"q":"What is the biggest problem with traffic in your city?","vi":"Vấn đề giao thông lớn nhất ở thành phố của bạn là gì?"},{"type":"Chọn một bên (choice)","out":"Chọn: thường không, đợi người khác thử trước. Lý do 1: rủi ro, tiền. Lý do 2: đọc đánh giá, kinh nghiệm người quen. Ngoại lệ: đồ rẻ, đồ công nghệ thú vị. Kết.","words":"early adopter, risk, review, reliable, experience, recommendation, cautious","vers":[{"a":"Usually I do not. I wait until someone I know has tried it. First, a new product can be expensive or have problems that nobody knows yet. Second, I trust my friends and other parents more than advertisements. I also read reviews. But if the product is cheap and can save me time, I may try it first. In general I am careful because I run a business and I cannot waste money.","v":"Thường thì không. Tôi đợi đến khi người quen thử rồi. Thứ nhất, sản phẩm mới có thể đắt hoặc có vấn đề chưa ai biết. Thứ hai, tôi tin bạn bè và phụ huynh khác hơn quảng cáo. Tôi cũng đọc đánh giá. Nhưng nếu sản phẩm rẻ và có thể tiết kiệm thời gian, tôi có thể thử trước. Nhìn chung tôi cẩn thận vì tôi kinh doanh và không thể lãng phí tiền."},{"a":"No, I usually wait. I want to see if my friends like it. If they say it is good, I will buy it. I do not want to waste money on a bad product. But if the price is very low, I may try it first.","v":"Không, tôi thường đợi. Tôi muốn xem bạn bè có thích không. Nếu họ nói tốt, tôi sẽ mua. Tôi không muốn lãng phí tiền cho sản phẩm tệ. Nhưng nếu giá rất thấp, tôi có thể thử trước."},{"a":"Yes, sometimes. I like new technology, so I often buy new gadgets. For example, I bought a smart watch before my friends. I enjoyed showing it to them. But I always read some information first, so I do not make a big mistake.","v":"Có, đôi khi. Tôi thích công nghệ mới nên thường mua đồ mới. Ví dụ, tôi mua đồng hồ thông minh trước bạn bè. Tôi thích khoe cho họ. Nhưng tôi luôn đọc thông tin trước để không mắc sai lầm lớn."},{"a":"It depends on the product. For food or health products, I never try first because it can be dangerous. For small things like a new pen or a bag, I can try. I think it is good to be careful with things that go into the body.","v":"Còn tùy sản phẩm. Với thực phẩm hay sản phẩm sức khỏe, tôi không bao giờ thử trước vì có thể nguy hiểm. Với đồ nhỏ như bút mới hay túi, tôi có thể thử. Tôi nghĩ cẩn thận với thứ đi vào cơ thể là tốt."},{"a":"I usually watch online reviews. If many people say good things, I will buy. I think reviews are like friends’ advice. Sometimes I ask in a Zalo group. People there are honest, and I get ideas quickly.","v":"Tôi thường xem đánh giá trên mạng. Nếu nhiều người nói tốt, tôi mua. Tôi nghĩ đánh giá giống lời khuyên của bạn bè. Đôi khi tôi hỏi trong nhóm Zalo. Người ở đó thật thà và tôi có ý tưởng nhanh."}],"q":"Would you buy a new product before anyone you know has tried it?","vi":"Bạn có mua một sản phẩm mới trước khi người quen nào của bạn thử nó không?"},{"type":"Hai thay đổi (two changes)","out":"Thay đổi 1: gọi video, nhóm Zalo giữ liên lạc nhưng ít gặp trực tiếp. Thay đổi 2: điện thoại tại bàn ăn. Mặt tốt: gần nhau dù xa. Kết.","words":"technology, video call, family gathering, screen time, stay in touch, tradition, distance","vers":[{"a":"Technology has changed family traditions in two ways. First, it helps families stay in touch. Many people work far from home, so at Tet, relatives who cannot travel join by video call. This is very good. Second, phones can take away family time. At meals, some people look at their phones and do not talk. In my house, we keep phones away from the table. So technology can bring us together or push us apart. It depends on how we use it.","v":"Công nghệ đã đổi truyền thống gia đình theo hai cách. Thứ nhất, nó giúp gia đình giữ liên lạc. Nhiều người làm việc xa nhà nên vào Tết, người thân không về được tham gia qua cuộc gọi video. Điều này rất tốt. Thứ hai, điện thoại có thể lấy mất thời gian gia đình. Trong bữa ăn, một số người nhìn điện thoại và không nói chuyện. Ở nhà tôi, chúng tôi để điện thoại xa bàn ăn. Nên công nghệ có thể đưa ta lại gần hay đẩy ta ra xa. Tùy cách ta dùng."},{"a":"Technology has made family life easier in some ways. For example, we can send photos of the family party on Zalo. Relatives who live far away can see them at once. But, at dinner, some people look at their phones and do not talk. I think we need rules for phones at the table.","v":"Công nghệ làm cuộc sống gia đình dễ hơn ở vài mặt. Ví dụ, ta gửi ảnh tiệc gia đình trên Zalo. Họ hàng ở xa xem được ngay. Nhưng trong bữa ăn, một số người nhìn điện thoại và không nói chuyện. Tôi nghĩ cần quy tắc về điện thoại ở bàn ăn."},{"a":"Now we make a lot of things online. For example, some families send lucky money by phone at Tet. It is quick, but it is not the same as giving a red envelope face to face. I miss the feeling of a real envelope. So I think technology changes the feeling of traditions.","v":"Giờ ta làm nhiều thứ trực tuyến. Ví dụ, một số gia đình gửi lì xì qua điện thoại vào Tết. Nhanh nhưng không giống trao bao lì xì trực tiếp. Tôi nhớ cảm giác của bao lì xì thật. Nên tôi nghĩ công nghệ đổi cảm giác của truyền thống."},{"a":"Technology helps us keep traditions. For example, my children learn traditional songs from videos. Also, we look for recipes of old dishes on the internet. If we did not have technology, we might forget some recipes. So it is both good and bad.","v":"Công nghệ giúp ta giữ truyền thống. Ví dụ, các con tôi học bài hát truyền thống từ video. Ta cũng tìm công thức món cũ trên mạng. Nếu không có công nghệ, có thể ta quên một số công thức. Nên nó vừa tốt vừa xấu."},{"a":"Family members spend more time on screens. Children play games, and parents work on laptops. We have less time to sit together. In my family, we have a rule: no phones during meals and on Sunday evening. We cook and talk. It has become a new tradition.","v":"Các thành viên gia đình dành nhiều thời gian hơn cho màn hình. Trẻ chơi game và cha mẹ làm việc trên laptop. Ta có ít thời gian ngồi cùng nhau. Trong gia đình tôi có quy tắc: không điện thoại trong bữa ăn và tối Chủ nhật. Chúng tôi nấu ăn và nói chuyện. Nó đã thành một truyền thống mới."}],"q":"How has technology changed family traditions in your country?","vi":"Công nghệ đã thay đổi các truyền thống gia đình ở nước bạn như thế nào?"}],"p2":[{"type":"Một dịp (an occasion)","out":"Mở: bối cảnh. Thân: từ bỏ điều quen thuộc (chỗ làm cũ, thói quen, nhà cũ), vì sao, khó khăn, kết quả. Bài học. Kết.","words":"give up, familiar, comfort zone, sacrifice, accept change, routine, adapt","vers":[{"a":"I want to talk about a time when I gave up something familiar for a change. A few years ago, we moved our workshop to a bigger place. The old workshop had many memories, and our customers knew where to find us. There were three difficulties. First, I lost my daily routine, because I walked to the old place every morning for years. Second, some workers lived near the old place, and two of them left. Third, we spent a lot of money and could not take new orders for a few weeks. But the result was good. The new place has more space, better electricity and a safer store, so we work better. We also found new customers. I learned that you must give up something to get something new. So I think we should be brave when change brings a better future.","v":"Tôi muốn kể về một lần tôi từ bỏ điều quen thuộc để thay đổi. Vài năm trước, chúng tôi dời xưởng sang chỗ lớn hơn. Xưởng cũ có nhiều kỷ niệm và khách biết tìm chúng tôi ở đâu. Có ba khó khăn. Thứ nhất, tôi mất thói quen hằng ngày vì nhiều năm tôi đi bộ đến chỗ cũ mỗi sáng. Thứ hai, một số công nhân ở gần chỗ cũ và hai người nghỉ. Thứ ba, chúng tôi tốn nhiều tiền và vài tuần không nhận được đơn mới. Nhưng kết quả tốt. Chỗ mới có nhiều chỗ hơn, điện tốt hơn và kho an toàn hơn nên chúng tôi làm tốt hơn. Chúng tôi cũng có khách mới. Tôi học được rằng phải bỏ điều gì để có điều mới. Nên tôi nghĩ ta nên dũng cảm khi thay đổi mang tương lai tốt hơn."},{"a":"I want to talk about a time when I gave up something familiar for a change. Last year, I stopped selling an old product in our shop. It was easy to sell, and customers knew it. But the profit was low. First, I felt afraid because we could lose customers. Second, I had to learn about a new product. Third, I had to explain to our regular customers. After three months, the new product sold well and the profit was higher. I learned that change needs courage. Now I think about new ideas more often.","v":"Tôi muốn kể về một lần tôi từ bỏ điều quen thuộc để thay đổi. Năm ngoái, tôi ngừng bán một sản phẩm cũ trong cửa hàng. Nó dễ bán và khách biết. Nhưng lợi nhuận thấp. Thứ nhất, tôi sợ vì có thể mất khách. Thứ hai, tôi phải học về sản phẩm mới. Thứ ba, tôi phải giải thích cho khách quen. Sau ba tháng, sản phẩm mới bán tốt và lợi nhuận cao hơn. Tôi học được rằng thay đổi cần dũng cảm. Giờ tôi nghĩ về ý tưởng mới thường xuyên hơn."},{"a":"I want to talk about when I gave up my free evenings to study. Two years ago, I started a master’s class. I used to watch TV and relax every night. Now I study. First, it was hard because I was tired. Second, my family missed me. Third, I had less time for friends. But I planned my time better, and my family supported me. Now I understand new things, and my children see that I work hard. I think giving up something small for a big goal is worth it.","v":"Tôi muốn kể về lần tôi bỏ các buổi tối rảnh để học. Hai năm trước, tôi bắt đầu lớp cao học. Trước đây tôi xem TV và thư giãn mỗi tối. Giờ tôi học. Thứ nhất, khó vì tôi mệt. Thứ hai, gia đình nhớ tôi. Thứ ba, tôi có ít thời gian cho bạn bè. Nhưng tôi sắp xếp thời gian tốt hơn và gia đình ủng hộ. Giờ tôi hiểu điều mới và các con thấy tôi chăm chỉ. Tôi nghĩ bỏ điều nhỏ cho mục tiêu lớn là đáng."},{"a":"I want to talk about a time I gave up my old phone. It was very old, but I liked it because I knew every button. My family told me to change, because I could not use new apps. First, I was not happy. Second, I had to learn new things. Third, I lost some old photos. But after one week, I found the new phone easy, and I could video call my relatives. So I learned that a change can be easier than I think.","v":"Tôi muốn kể về lần tôi bỏ điện thoại cũ. Nó rất cũ nhưng tôi thích vì biết từng nút. Gia đình bảo tôi đổi vì tôi không dùng được ứng dụng mới. Thứ nhất, tôi không vui. Thứ hai, tôi phải học điều mới. Thứ ba, tôi mất vài ảnh cũ. Nhưng sau một tuần, tôi thấy điện thoại mới dễ và tôi gọi video cho họ hàng được. Nên tôi học được rằng thay đổi có thể dễ hơn tôi nghĩ."},{"a":"I want to talk about a time when I gave up my hometown habits. Six years ago, I moved to a new city. I used to eat with my parents every day, and I knew everyone on my street. First, I felt lonely. Second, I missed my mother’s cooking. Third, the weather and the food were different. But I joined a class and made new friends. Later, I got a better job there. I learned that I can feel at home in many places. Now I call my parents every Sunday, and I am happy with my choice.","v":"Tôi muốn kể về lần tôi bỏ thói quen ở quê. Sáu năm trước, tôi chuyển đến một thành phố mới. Trước đây tôi ăn cơm với ba mẹ mỗi ngày và biết mọi người trong phố. Thứ nhất, tôi thấy cô đơn. Thứ hai, tôi nhớ món mẹ nấu. Thứ ba, thời tiết và đồ ăn khác. Nhưng tôi tham gia một lớp học và có bạn mới. Sau đó, tôi có công việc tốt hơn ở đó. Tôi học được rằng mình có thể thấy như ở nhà ở nhiều nơi. Giờ tôi gọi cho ba mẹ mỗi Chủ nhật và vui với lựa chọn của mình."}],"q":"An occasion when you had to give up something familiar in order to accept a change.","vi":"Một dịp bạn phải từ bỏ điều quen thuộc để chấp nhận một thay đổi."},{"type":"Yếu tố quan trọng (what factors)","out":"Mở: có 3 yếu tố. 1) Chất lượng và giá. 2) Độ tin cậy giao hàng, khoảng cách, chi phí vận chuyển. 3) Trách nhiệm đạo đức, môi trường, nhà cung cấp lâu dài. Kết.","words":"raw materials, supplier, quality, reliable delivery, transport cost, sustainable, long-term","vers":[{"a":"I want to talk about what is important when a company chooses where to buy raw materials. I think there are three things. First, quality and price. Weak materials make a bad product. In my workshop, the steel decides how long a machine lasts, so cheap steel can cost more later. Second, delivery. The supplier must deliver on time, because a late delivery can stop all the work. A near supplier also saves transport cost. Third, trust and responsibility. A good company checks that suppliers treat workers fairly and do not harm nature. A loyal supplier often gives better price and support. So choosing a supplier is like choosing a partner.","v":"Tôi muốn nói về điều quan trọng khi công ty chọn nơi mua nguyên liệu. Tôi nghĩ có ba điều. Thứ nhất, chất lượng và giá. Nguyên liệu yếu làm sản phẩm tệ. Ở xưởng tôi, thép quyết định máy bền bao lâu nên thép rẻ có thể tốn hơn về sau. Thứ hai, giao hàng. Nhà cung cấp phải giao đúng hạn vì giao trễ có thể dừng mọi việc. Nhà cung cấp gần cũng tiết kiệm chi phí vận chuyển. Thứ ba, tin cậy và trách nhiệm. Công ty tốt kiểm tra nhà cung cấp có đối xử công bằng với công nhân và không hại thiên nhiên. Nhà cung cấp trung thành thường cho giá và hỗ trợ tốt hơn. Nên chọn nhà cung cấp giống chọn đối tác."},{"a":"I want to talk about what is important when a company buys raw materials. I think there are three things. First, quality. Good materials make good products. Second, price. A company needs to save money, but it should not buy something too cheap. Third, delivery. The supplier must deliver on time. For example, in my workshop, if the steel comes late, my workers cannot work. So a good supplier is very important.","v":"Tôi muốn nói về điều quan trọng khi công ty mua nguyên liệu. Tôi nghĩ có ba điều. Thứ nhất, chất lượng. Nguyên liệu tốt làm sản phẩm tốt. Thứ hai, giá. Công ty cần tiết kiệm nhưng không nên mua thứ quá rẻ. Thứ ba, giao hàng. Nhà cung cấp phải giao đúng hạn. Ví dụ, ở xưởng tôi, nếu thép đến trễ, công nhân không làm được. Nên một nhà cung cấp tốt rất quan trọng."},{"a":"I want to talk about where a company should buy raw materials. In my opinion, three things are important. First, distance. A near supplier saves transport costs and time. Second, trust. A company should work with people it knows. Third, the environment. Some materials harm nature, so the company should choose cleaner ones. For example, many shops now use paper bags instead of plastic bags. So a company should think about money and nature.","v":"Tôi muốn nói về nơi công ty nên mua nguyên liệu. Theo tôi, ba điều quan trọng. Thứ nhất, khoảng cách. Nhà cung cấp gần tiết kiệm chi phí vận chuyển và thời gian. Thứ hai, sự tin cậy. Công ty nên làm việc với người mình biết. Thứ ba, môi trường. Một số nguyên liệu hại thiên nhiên nên công ty nên chọn loại sạch hơn. Ví dụ, nhiều cửa hàng giờ dùng túi giấy thay túi nhựa. Nên công ty nên nghĩ đến tiền và thiên nhiên."},{"a":"I want to talk about important factors for buying raw materials. I think there are three. First, a good contract. It should say the price, the date and the quality. Second, a backup supplier. If one supplier has a problem, the company can call another one. Third, checking the goods. When the materials arrive, we must check them before paying. For example, I always count and check the goods. So planning helps to avoid problems.","v":"Tôi muốn nói về các yếu tố quan trọng khi mua nguyên liệu. Tôi nghĩ có ba. Thứ nhất, hợp đồng tốt. Nó nên ghi giá, ngày và chất lượng. Thứ hai, nhà cung cấp dự phòng. Nếu một nhà cung cấp có vấn đề, công ty gọi người khác. Thứ ba, kiểm tra hàng. Khi nguyên liệu đến, ta phải kiểm tra trước khi trả tiền. Ví dụ, tôi luôn đếm và kiểm hàng. Nên lập kế hoạch giúp tránh vấn đề."},{"a":"I want to talk about what a company thinks about when it buys raw materials. In my view, there are three important things. First, the market price. Prices go up and down, so the company should watch them. Second, the amount. Buying a lot can be cheaper, but the company needs a place to keep it. Third, the payment time. It is better to pay in 30 days than to pay now. These points help the company manage money well.","v":"Tôi muốn nói về điều công ty nghĩ khi mua nguyên liệu. Theo tôi có ba điều quan trọng. Thứ nhất, giá thị trường. Giá lên xuống nên công ty nên theo dõi. Thứ hai, số lượng. Mua nhiều có thể rẻ hơn nhưng công ty cần chỗ cất. Thứ ba, thời gian thanh toán. Trả sau 30 ngày tốt hơn trả ngay. Những điểm này giúp công ty quản lý tiền tốt."}],"q":"What factors are most important when a company decides where to buy its raw materials.","vi":"Những yếu tố nào quan trọng nhất khi một công ty quyết định mua nguyên liệu thô ở đâu."},{"type":"So sánh (comparison)","out":"Mở: nêu quan điểm. Thân: ưu điểm startup (linh hoạt, dám mạo hiểm), ưu điểm công ty lớn (vốn, nhân lực), rồi chọn bên mạnh hơn. Kết: kết luận.","words":"startup, flexible, resources, risk, bureaucracy, funding, innovative","vers":[{"a":"I’d like to talk about which are better at producing new ideas: big companies or small start-ups. In my view, there are three key points, and my answer is that start-ups are usually better, although big companies have their own strengths. First, start-ups are flexible. They have few levels of management, so a good idea can become a product quickly, without long meetings or many signatures. They also dare to take risks, because if the idea fails, they lose very little. Second, big companies have resources. They have money, equipment and experts, which are very important for developing and testing new ideas. For instance, a large technology company can spend millions on research, and a start-up often cannot. Third, big companies are often slow and afraid of failure. Many great ideas are rejected because they look too risky or too different from the current business. Compared with big companies, start-ups are more creative, but they often need support to grow. In my own small business, I notice the same thing: when I have a new idea for a product, I can try it the next day, while a large factory needs months of approval. Some big companies now create small teams that work like start-ups, which shows that they also want to be flexible. To sum up, start-ups create the ideas and big companies help them grow. That’s why I believe the best results come when the two work together.","v":"Tôi muốn nói về việc bên nào giỏi tạo ra ý tưởng mới hơn: công ty lớn hay các công ty khởi nghiệp nhỏ. Theo tôi, có ba điểm chính, và câu trả lời của tôi là công ty khởi nghiệp thường giỏi hơn, dù công ty lớn cũng có thế mạnh riêng. Thứ nhất, công ty khởi nghiệp linh hoạt. Họ có ít tầng quản lý, nên một ý hay có thể thành sản phẩm nhanh chóng, không cần họp dài hay nhiều chữ ký. Họ cũng dám mạo hiểm, vì nếu ý tưởng thất bại, họ mất rất ít. Thứ hai, công ty lớn có nguồn lực. Họ có tiền, thiết bị và chuyên gia, những thứ rất quan trọng để phát triển và thử nghiệm ý tưởng mới. Ví dụ, một công ty công nghệ lớn có thể chi hàng triệu cho nghiên cứu, còn một công ty khởi nghiệp thường không thể. Thứ ba, công ty lớn thường chậm và sợ thất bại. Nhiều ý tưởng hay bị gạt bỏ vì trông quá rủi ro hoặc quá khác với hoạt động hiện tại. So với công ty lớn, công ty khởi nghiệp sáng tạo hơn, nhưng họ thường cần được hỗ trợ để lớn lên. Trong việc kinh doanh nhỏ của tôi, tôi cũng thấy như vậy: khi có ý tưởng sản phẩm mới, tôi có thể thử ngay hôm sau, còn một nhà máy lớn cần nhiều tháng để duyệt. Một số công ty lớn hiện nay lập các nhóm nhỏ làm việc như công ty khởi nghiệp, điều cho thấy họ cũng muốn linh hoạt. Tóm lại, công ty khởi nghiệp tạo ra ý tưởng và công ty lớn giúp ý tưởng lớn mạnh. Vì vậy tôi tin rằng kết quả tốt nhất đến khi hai bên làm việc cùng nhau."},{"a":"In my opinion, it depends on the kind of idea. For small, quick ideas, startups are better. They can test a product in a few weeks, listen to customers directly, and change plan if it fails. For example, many popular mobile apps were created by teams of only five or six people. On the other hand, big companies are better at ideas that need a lot of money and a long time, such as new medicines or electric cars. They have laboratories, experienced engineers and the budget to survive failures. Another difference is risk: a startup can lose everything, while a big company can try many projects at the same time. Compared with startups, large companies are slower but stronger. To conclude, startups bring fresh ideas, and big companies make big ideas real.","v":"Theo tôi, còn tùy loại ý tưởng. Với những ý tưởng nhỏ và nhanh, startup tốt hơn. Họ có thể thử sản phẩm trong vài tuần, lắng nghe khách hàng trực tiếp và đổi kế hoạch nếu thất bại. Ví dụ, nhiều ứng dụng di động nổi tiếng được tạo ra bởi những nhóm chỉ năm sáu người. Mặt khác, công ty lớn giỏi hơn với những ý tưởng cần nhiều tiền và thời gian dài, như thuốc mới hay xe điện. Họ có phòng thí nghiệm, kỹ sư giàu kinh nghiệm và ngân sách để chịu được thất bại. Một khác biệt nữa là rủi ro: startup có thể mất tất cả, còn công ty lớn có thể thử nhiều dự án cùng lúc. So với startup, công ty lớn chậm hơn nhưng mạnh hơn. Tóm lại, startup mang đến ý tưởng mới mẻ, còn công ty lớn biến những ý tưởng lớn thành hiện thực."},{"a":"I’d choose startups, mainly for three reasons. First, the people in startups are usually passionate. They own a part of the company, so they work harder and think more creatively. Second, they listen to customers closely. A small shop owner who talks with every client quickly learns what people want. Third, they have nothing to protect. A big company may refuse a new idea because it could damage an existing product, while a startup has no old product to worry about. Admittedly, startups often lack money and experience, and many of them fail. For instance, a small food-delivery company I know closed after one year because it ran out of funds. However, the successful ones can change an industry. In conclusion, startups create more new ideas, and partnerships with big firms can help them last.","v":"Tôi chọn startup, chủ yếu vì ba lý do. Thứ nhất, người làm ở startup thường đam mê. Họ sở hữu một phần công ty, nên làm việc chăm hơn và nghĩ sáng tạo hơn. Thứ hai, họ lắng nghe khách hàng sát sao. Một chủ tiệm nhỏ trò chuyện với từng khách sẽ nhanh biết mọi người muốn gì. Thứ ba, họ không có gì phải bảo vệ. Một công ty lớn có thể từ chối ý tưởng mới vì nó có thể làm hại sản phẩm hiện có, còn startup không có sản phẩm cũ nào để lo. Phải thừa nhận startup thường thiếu tiền và kinh nghiệm, và nhiều công ty thất bại. Ví dụ, một công ty giao đồ ăn nhỏ mà tôi biết đóng cửa sau một năm vì hết vốn. Tuy nhiên, những công ty thành công có thể thay đổi cả một ngành. Tóm lại, startup tạo ra nhiều ý tưởng mới hơn, và hợp tác với công ty lớn có thể giúp họ trụ vững."},{"a":"I want to talk about big companies and small start-ups. I think start-ups are better at new ideas. First, they are fast. They can decide in one day. Second, they take risks, because they have nothing to lose. Third, the team is small, so everyone talks and shares ideas. But big companies have money to help ideas grow. So the best idea is for both to work together.","v":"Tôi muốn nói về công ty lớn và start-up nhỏ. Tôi nghĩ start-up giỏi ý tưởng mới hơn. Thứ nhất, họ nhanh. Họ quyết trong một ngày. Thứ hai, họ chấp nhận rủi ro vì không có gì để mất. Thứ ba, nhóm nhỏ nên mọi người nói và chia sẻ ý tưởng. Nhưng công ty lớn có tiền giúp ý tưởng lớn lên. Nên ý hay nhất là cả hai cùng làm việc."},{"a":"I want to talk about which is better at making new ideas. I choose big companies. First, they have money for research. Second, they have many experts. Third, they have many customers, so they can test new ideas quickly. For example, big phone companies make new models every year. Small start-ups may have good ideas, but it is hard to make and sell them. So big companies are stronger in the long term.","v":"Tôi muốn nói về bên nào giỏi tạo ý tưởng mới hơn. Tôi chọn công ty lớn. Thứ nhất, họ có tiền nghiên cứu. Thứ hai, họ có nhiều chuyên gia. Thứ ba, họ có nhiều khách nên thử ý tưởng mới nhanh. Ví dụ, các hãng điện thoại lớn ra mẫu mới mỗi năm. Start-up nhỏ có thể có ý hay nhưng khó làm và bán. Nên công ty lớn mạnh hơn về lâu dài."}],"q":"Big companies and small start-ups: which are better at producing new ideas?","vi":"Công ty lớn và start-up nhỏ: bên nào giỏi tạo ra ý tưởng mới hơn?"},{"type":"Cách làm (how to)","out":"Mở: có 3 cách. 1) Dạy kiểm tra nguồn, tác giả, ngày. 2) Dạy nhận ra tin giả, ảnh chỉnh, quảng cáo. 3) Thảo luận trong lớp, bài tập thực hành. Kết.","words":"critical thinking, fake news, source, media literacy, fact-check, discussion, online","vers":[{"a":"I want to talk about how schools can teach young people to question what they see online. I have three ways. First, teach them to check. Ask: who wrote this, when, and do other sources agree? A teacher can give a real post and ask students to find its source. Second, show common tricks like fake news, edited photos and ads that look like normal posts. Examples help children remember. Third, discuss in class. Students can work in groups, compare websites and say which one is more reliable. Teachers should also like questions. As a parent, I do the same at home. These habits help young people think before they believe.","v":"Tôi muốn nói về cách nhà trường dạy người trẻ đặt câu hỏi về những gì thấy trên mạng. Tôi có ba cách. Thứ nhất, dạy các em kiểm tra. Hỏi: ai viết, khi nào và nguồn khác có đồng ý không? Giáo viên có thể đưa một bài thật và yêu cầu học sinh tìm nguồn. Thứ hai, chỉ ra các chiêu thường gặp như tin giả, ảnh chỉnh và quảng cáo trông như bài thường. Ví dụ giúp trẻ nhớ. Thứ ba, thảo luận trong lớp. Học sinh có thể làm nhóm, so sánh các trang web và nói trang nào đáng tin hơn. Giáo viên cũng nên thích câu hỏi. Là phụ huynh, tôi làm tương tự ở nhà. Những thói quen này giúp người trẻ suy nghĩ trước khi tin."},{"a":"I want to talk about how schools can teach students to question what they see online. I think there are three ways. First, teach them to check the source. Ask: who wrote this? Second, give them real examples of fake news and let them find the mistakes. Third, talk about it in class. Students can share what they saw online and discuss it. For example, a teacher can show a fake photo and ask, “Is it real?” These activities make students think.","v":"Tôi muốn nói về cách nhà trường dạy học sinh đặt câu hỏi về những gì thấy trên mạng. Tôi nghĩ có ba cách. Thứ nhất, dạy các em kiểm tra nguồn. Hỏi: ai viết cái này? Thứ hai, cho các em ví dụ thật về tin giả và để các em tìm lỗi. Thứ ba, thảo luận trong lớp. Học sinh có thể chia sẻ điều thấy trên mạng và bàn. Ví dụ, giáo viên có thể cho xem ảnh giả và hỏi “Có thật không?” Những hoạt động này khiến học sinh suy nghĩ."},{"a":"I want to talk about helping young people be careful online. I think schools should do three things. First, make a special lesson about the internet, with safety rules. Second, invite experts, like police or journalists, to talk to students. Third, work with parents. Parents and teachers should say the same thing. As a parent, I also talk with my children about what they watch. If everyone helps, children will learn to be careful.","v":"Tôi muốn nói về việc giúp người trẻ cẩn thận trên mạng. Tôi nghĩ nhà trường nên làm ba việc. Thứ nhất, làm một bài học đặc biệt về internet với quy tắc an toàn. Thứ hai, mời chuyên gia như công an hay nhà báo nói với học sinh. Thứ ba, phối hợp với phụ huynh. Phụ huynh và giáo viên nên nói giống nhau. Là phụ huynh, tôi cũng nói chuyện với con về những gì chúng xem. Nếu mọi người cùng giúp, trẻ sẽ học cách cẩn thận."},{"a":"I want to talk about teaching students to question online content. In my opinion, there are three useful ideas. First, let students make their own videos or posts. When they make content, they understand how easy it is to change a photo. Second, play games. For example, “find the fake news” is a fun game. Third, praise students who ask good questions. This makes them more confident. In short, practice and fun make learning stronger.","v":"Tôi muốn nói về việc dạy học sinh đặt câu hỏi với nội dung trực tuyến. Theo tôi có ba ý hữu ích. Thứ nhất, để học sinh tự làm video hay bài đăng. Khi tự làm, các em hiểu dễ đổi ảnh thế nào. Thứ hai, chơi trò chơi. Ví dụ, “tìm tin giả” là trò vui. Thứ ba, khen học sinh đặt câu hỏi hay. Điều này làm các em tự tin hơn. Tóm lại, thực hành và niềm vui làm việc học vững hơn."},{"a":"I want to talk about how schools can help students not to believe everything online. I think there are three ways. First, teach basic thinking skills. For example, ask “Why?” and “How do you know?” Second, teach about advertising. Many posts online are advertisements, and students should know that. Third, give time to talk about feelings. Some posts make us angry or sad, and we should stop and think. These simple habits can protect young people.","v":"Tôi muốn nói về cách nhà trường giúp học sinh không tin mọi thứ trên mạng. Tôi nghĩ có ba cách. Thứ nhất, dạy kỹ năng tư duy cơ bản. Ví dụ, hỏi “Tại sao?” và “Sao bạn biết?” Thứ hai, dạy về quảng cáo. Nhiều bài trên mạng là quảng cáo và học sinh nên biết. Thứ ba, dành thời gian nói về cảm xúc. Một số bài làm ta giận hay buồn và ta nên dừng lại suy nghĩ. Những thói quen đơn giản này bảo vệ người trẻ."}],"q":"How schools can teach young people to question what they see online.","vi":"Nhà trường có thể dạy giới trẻ đặt câu hỏi về những gì họ thấy trên mạng bằng cách nào."},{"type":"Tại sao (why)","out":"Mở: có 3 lý do. 1) Sở thích: tự chọn, không bị ép, thấy niềm vui. 2) Công việc có áp lực, nhiều quy định. 3) Sở thích cho cảm giác thành tựu, sáng tạo. Kết: tìm niềm vui trong việc.","words":"hobby, intrinsic motivation, passion, pressure, sense of achievement, voluntary, creative","vers":[{"a":"I want to talk about why people often work harder for their hobbies than for their jobs. I have three reasons. First, choice. People choose their hobbies, so they do them because they like them. A man can spend every weekend fixing old motorbikes without money, but he feels bored with repeated work for a boss. Second, pressure. A job has deadlines and criticism, but a hobby has no stress. Third, pride. When you finish a hobby project, like a garden, you see the result and feel proud. In many jobs, you only do a small part. So freedom, low pressure and pride make people work harder for hobbies. I think bosses should give workers more choice and thanks.","v":"Tôi muốn nói về việc vì sao người ta thường làm việc cho sở thích chăm hơn cho công việc. Tôi có ba lý do. Thứ nhất, lựa chọn. Người ta chọn sở thích nên làm vì thích. Một người có thể dành mỗi cuối tuần sửa xe máy cũ không lấy tiền nhưng chán với việc lặp lại cho sếp. Thứ hai, áp lực. Công việc có hạn chót và phê bình, còn sở thích không căng thẳng. Thứ ba, tự hào. Khi hoàn thành một dự án sở thích như khu vườn, bạn thấy kết quả và tự hào. Trong nhiều công việc, bạn chỉ làm một phần nhỏ. Nên tự do, ít áp lực và niềm tự hào làm người ta chăm hơn cho sở thích. Tôi nghĩ sếp nên cho công nhân nhiều lựa chọn và lời cảm ơn hơn."},{"a":"I want to talk about why people work harder for their hobbies. I think there are three reasons. First, they choose it. Nobody forces them. Second, they enjoy it, so they do not feel tired. Third, they see the result and feel proud. For example, my brother likes fixing motorbikes. He works all weekend and does not ask for money. But at his job, he feels bored. So I think freedom and joy make people work hard.","v":"Tôi muốn nói về việc vì sao người ta làm việc chăm hơn cho sở thích. Tôi nghĩ có ba lý do. Thứ nhất, họ tự chọn. Không ai ép. Thứ hai, họ thích nên không thấy mệt. Thứ ba, họ thấy kết quả và tự hào. Ví dụ, anh tôi thích sửa xe máy. Anh làm cả cuối tuần và không đòi tiền. Nhưng ở công ty, anh thấy chán. Nên tôi nghĩ tự do và niềm vui làm người ta làm việc chăm."},{"a":"I want to talk about hobbies and jobs. I think people work harder for hobbies because there is no pressure. First, no boss shouts at you. Second, no deadline. Third, you can stop when you want. So you feel relaxed, and you try more. For example, when I cook for my family, I try new recipes and spend a long time. But at work, I want to finish quickly. So pressure changes how we feel.","v":"Tôi muốn nói về sở thích và công việc. Tôi nghĩ người ta làm chăm hơn cho sở thích vì không có áp lực. Thứ nhất, không sếp quát. Thứ hai, không hạn chót. Thứ ba, bạn dừng khi muốn. Nên bạn thấy thoải mái và cố nhiều hơn. Ví dụ, khi nấu cho gia đình, tôi thử công thức mới và dành nhiều thời gian. Nhưng ở công
