 skills:[
  ["Ghi chú theo mốc thời gian (note-taking)","Bài nói theo thứ tự thời gian thì vẽ một đường thời gian: một bên ghi từ chỉ thời gian, bên kia ghi sự kiện chính. Từ hay gặp: in the beginning, later, before, during that time, soon, after that, in a specific year, at last, on (a day)."],
  ["Kỹ năng nghe: suy luận (making inferences)","Người nói thường không nói thẳng. Mình rút ra kết luận hợp lý từ điều họ nói, nhưng không suy luận quá đà. Muốn chắc thì hỏi lại: Do you mean that...? Are you saying that...?"],
  ["Ngữ pháp: câu bị động (passive voice)","Dạng: be + quá khứ phân từ (was damaged, has been studied, will be given, may be reviewed). Dùng khi muốn nhấn vào đối tượng, hoặc không biết/không cần nói ai làm. Động từ không có tân ngữ như happen thì không dùng bị động. Nói chuyện hằng ngày đừng lạm dụng bị động, nghe sẽ cứng."],
  ["Kỹ năng nói: so sánh ví von (simile) và ẩn dụ (metaphor)","Simile dùng like hoặc as: as busy as a bee, swim like a fish, sleep like a log, as light as a feather, run like the wind, cry like a baby, cut me like a knife, as quiet as a mouse. Metaphor nói một thứ là thứ khác, không dùng like hay as: His words were knives. My computer is a dinosaur. Her sunny face lit up the room."],
  ["Bài nói cuối Unit (assignment)","Kể một trải nghiệm cá nhân về khó khăn hoặc thành công với ngôn ngữ. Dùng đường thời gian để sắp xếp sự kiện và cảm xúc, có lời tả sinh động. Mẫu trong sách: Maxine Hong Kingston kể nỗi sợ khi phải đọc bài bằng tiếng Anh trước lớp."]
 ],
 key:[
  ["Listening 1: Jill Bolte Taylor, My Stroke of Insight","Bà là nhà giải phẫu thần kinh, bị đột quỵ năm 1996. Não phải nhìn bức tranh lớn, làm mờ ranh giới giữa các thứ, cho cảm nhận tổng thể, sống ở hiện tại. Não trái nhặt chi tiết, gắn nhãn bằng ngôn ngữ, so với điều đã học trong quá khứ và hình dung về tương lai."],
  ["Listening 2: Helen Keller, The Story of My Life","Mất thị giác và thính giác lúc 19 tháng tuổi. Tháng đầu sau bệnh: dùng dấu hiệu (pull là đến, push là đi). Trước khi cô giáo đến: biết mình khác mọi người, bực bội, giận dữ, như con tàu trong sương dày. 3/3/1887 cô giáo đến. Sáng hôm sau học chữ doll nhưng chưa hiểu nghĩa. Mùa hè 1887: hiểu mọi vật đều có tên (water)."],
  ["Phát triển ngôn ngữ ở trẻ nhỏ (bài ghi chú theo thời gian)","Năm đầu: trẻ học từ bằng cách nghe cha mẹ lặp lại. 15 đến 24 tháng: học ngôn ngữ nhanh nhất. 18 tháng: biết khoảng 50 từ. 24 tháng: dùng 250 đến 300 từ. Sáu tháng sau: số từ gần gấp đôi."]
 ],

{n:2,title:"Behavioral science: work and fun",vi:"Khoa học hành vi: công việc và vui chơi",q:"What is the tipping point between work and fun?",
 skills:[
  ["Ghi chú bằng biểu đồ Venn (note-taking)","Tìm mối quan hệ giữa các mục là kỹ năng tư duy phản biện quan trọng khi ghi chú. Biểu đồ Venn có hai vòng tròn chồng lên nhau: phần chung ở giữa là điểm giống, hai phần ngoài là điểm khác. Hợp khi bài giảng cần so sánh hai thứ (ví dụ nấu ăn làm sở thích và nấu ăn làm nghề)."],
  ["Kỹ năng nghe: nghe ví dụ (listening for examples)","Cụm báo hiệu ví dụ: for example, for instance, take… as an example, let me give you an example, including, such as. Khi người nói liệt kê ví dụ, họ lên giọng ở từng mục trừ mục cuối: lên giọng nghĩa là chưa nói xong. Cách ghi: ý chính bên trái, ví dụ bên phải."],
  ["Phát âm: ngữ điệu khi nêu lựa chọn","Câu nêu lựa chọn: lên giọng ở âm nhấn của mỗi lựa chọn, hạ giọng ở or, câu kết thúc xuống giọng. Câu hỏi lựa chọn: lên giọng ở mỗi lựa chọn, hạ giọng ở or, rồi lên giọng ở mục cuối, hoặc lên rồi xuống nếu mục cuối kết thúc bằng âm nhấn."],
  ["Ngữ pháp: so sánh (comparisons)","Danh từ: more perks than, fewer perks than, less time than, many more/many fewer perks than, much less time than, as many perks as, as much time as. Động từ: gains more than, gains less than, gains much more than, gains as much as. Tính từ: clearer than, much clearer than, less aware than, as productive as. So sánh phải cùng loại: the office in China had more employees than the office in India (không so với đất nước India)."],
  ["Kỹ năng nói: sở thích và lựa chọn (preferences)","Sở thích trong quá khứ: prefer + danh từ, choose + to-V, first/second choice was + to-V, had hoped + to-V. Sở thích hiện tại: my preference is to + V, I’d rather (not) + V, If it were up to me, I like A more than B, I’d like to + V."],
  ["Bài nói cuối Unit (assignment)","Làm việc nhóm, thảo luận một hoạt động hoặc công việc vừa có phần vui vừa có phần vất vả (ví dụ kỳ nghỉ kết hợp làm tình nguyện), rồi trình bày."]
 ],
 key:[
  ["Listening 1: Google và Bloomberg","Hai video: ở Google, bộ phận people operations dùng dữ liệu (data mining) để cải thiện nơi làm việc. Ở Bloomberg, một quản lý sản phẩm hỏi đồng nghiệp về môi trường làm việc. Câu hỏi chung: đâu là điểm chuyển giữa làm việc và vui chơi."],
  ["Du học và thực tập (cố vấn đại học)","Chương trình du học vẫn đóng học phí ở trường mình. Thực tập thì không đóng học phí, thường còn có lương nhỏ. Cả hai đều vui, có trải nghiệm mới, nhưng cũng vất vả: du học phải học và giao tiếp bằng ngoại ngữ, thực tập có sếp và việc có thể khó hơn."],
  ["Ví dụ trong bài nghe","Thực tập có lợi: biết công ty, môi trường văn phòng, phúc lợi (perks) như đồ ăn miễn phí hay chỗ làm riêng. Kỳ nghỉ làm tình nguyện: giúp người khác, đi nhiều nơi, học kỹ năng mới như xây trường."]
 ],

{n:3,title:"Ecology: visual deception",vi:"Sinh thái: đánh lừa thị giác",q:"How can the eyes deceive the mind?",
 skills:[
  ["Ghi chú: dùng kiến thức nền để chuẩn bị (note-taking)","Trước khi nghe, nghĩ về điều mình đã biết để dự đoán người nói sẽ nói gì. Khi nghe, so sánh: khớp thì củng cố, khác thì đặt câu hỏi và học thêm. Cách chuẩn bị: đọc tài liệu cô giao, xem lại ghi chú các buổi trước, trao đổi với bạn, nghĩ về tiêu đề, ghi vài từ khóa vào sơ đồ, viết vài câu hỏi và chừa chỗ ghi câu trả lời. Bước đầu tiên trong bài: đọc tài liệu được giao trước buổi giảng."],
  ["Kỹ năng nghe: nhận ra đồng vị ngữ (appositives)","Đồng vị ngữ là cụm giải thích thêm cho danh từ đứng trước nó. Bỏ đi câu vẫn đủ nghĩa. Khi viết, đồng vị ngữ được đánh dấu bằng dấu phẩy (đề trong video chọn đáp án: dấu gạch ngang, hãy hỏi lại cô cho chắc). Khi nói, nó nằm giữa hai quãng nghỉ ngắn. Ví dụ: The chameleon, a type of lizard, changes its skin color."],
  ["Ngữ pháp: mệnh đề quan hệ (relative clauses)","Mệnh đề quan hệ làm câu phong phú, nối hai câu ngắn thành một. Bắt đầu bằng who, whom, that, which, when, where. Là mệnh đề phụ thuộc, không đứng một mình. Có thể làm chủ ngữ hoặc tân ngữ. Ví dụ: The conductor who was wearing a blue cap walked onto the platform."],
  ["Phát âm: trọng âm khi thêm hậu tố","Nhấn vào chính hậu tố: -ee, -eer, -ese, -ier, -ique (employee, Chinese, cashier). Giữ trọng âm của từ gốc: -al, -ment, -ness, -ous, -or, -y, -ism, -ly (profession, professional, equipment). Nhấn âm tiết ngay trước hậu tố: -ial, -ian, -ion, -ics, -ical, -ient, -ious, -ify, -itive, -ity, -graphy, -logy, -ual. Không chắc thì tra từ điển."],
  ["Kỹ năng nói: nhắc lại và hỏi làm rõ","Nhắc lại ý người nói để xác nhận mình hiểu đúng. Hỏi làm rõ: Do you mean that…? Could you clarify that last concept? Could you give an example?"]
 ],
 key:[
  ["Listening 1: Sherlock Holmes và đánh lừa thị giác","Thám tử Holmes dùng các thủ thuật: cải trang (disguise), giấu quần áo, đánh lạc hướng (misdirection), bằng chứng giả, theo dõi (surveillance), mồi nhử (decoy). Bài ghi chú gồm ba cột: cải trang gì, làm thế nào, kết quả."],
  ["Listening 2: phóng sự National Geographic về động vật sống sót","Động vật thích nghi và ngụy trang để sống sót. Chim ptarmigan có lông nâu khó thấy, mùa đông mọc lông trắng ở chân như giày tuyết, vừa ngụy trang vừa giữ ấm. Cuộc chiến sinh tồn làm cán cân giữa thú săn mồi và con mồi luôn thay đổi. Cũng có sâu bướm, bọ ngựa, rắn, cá bơn."]
 ],

{n:4,title:"International relations: global citizens",vi:"Quan hệ quốc tế: công dân toàn cầu",q:"What does it mean to be a global citizen?",
 skills:[
  ["Ghi chú bằng biểu đồ chữ T (note-taking)","Dùng khi bài nói về vấn đề và giải pháp: cột trái là vấn đề, cột phải là giải pháp. Nếu nghe lệch thứ tự thì ghi đúng cột rồi sắp lại sau. Nghe sót chi tiết thì gạch một dòng nhắc để hỏi bạn sau. Chuẩn bị trước sơ đồ cũng là cách tốt. Cụm báo vấn đề: One problem is, The trouble is that, Another obstacle we face is. Cụm báo giải pháp: People should/must, One suggestion is to, We can solve this by, They need to."],
  ["Kỹ năng nghe: số liệu và sự kiện","Bài dựa trên số liệu thì ghi ý tổng thể, xu hướng quan trọng và số liệu cụ thể người nói nhấn mạnh, kèm từ khóa. Không chắc thì thêm dấu hỏi để tìm lại sau. Cụm hay gặp: in the early 1990s, in recent years, an increase in, a decrease in, it is estimated that, roughly, more than, fewer than, research shows that, the percent of."],
  ["Ngữ pháp: câu tường thuật (reported speech)","Nói về điều đã nói trong quá khứ thì lùi một thì: hiện tại đơn thành quá khứ đơn, hiện tại tiếp diễn thành quá khứ tiếp diễn, quá khứ đơn và hiện tại hoàn thành thành quá khứ hoàn thành, will thành would, can thành could, may thành might. Sự thật hiện hành thì giữ nguyên thì (he said climate change is a reality). Câu hỏi khi tường thuật dùng trật tự câu trần thuật (asked what the agenda was). Động từ tường thuật: say, tell, ask, add, state, remark, respond, warn. Có thể phải đổi đại từ. Câu hỏi Yes/No dùng if hoặc whether."],
  ["Phát âm: nối âm cuối","Đừng bỏ phụ âm cuối. Nối phụ âm cuối với nguyên âm đầu của từ sau (salt items, miles away). Khi phụ âm cuối giống phụ âm đầu từ sau thì giữ lâu hơn, không chèn nguyên âm vào giữa (one tap, take control). Chèn nguyên âm sẽ thêm âm tiết và làm người nghe khó hiểu."],
  ["Kỹ năng nói: trích dẫn nguồn (citing sources)","Khi thuyết trình học thuật cần nói thông tin lấy từ đâu. Ba cách: giới thiệu người viết hoặc nói, nói nơi và thời điểm công bố, dùng câu tường thuật. Cụm hay dùng: According to X, As X explains, As X reports, Data from X support that, In a survey published in X, X results show that, At a conference on [date], X explained how."]
 ],
 key:[
  ["Listening 1: The campaign to humanize the coffee trade","Phóng sự của đài American RadioWorks về cà phê thương mại công bằng (fair trade). Nông dân Guatemala vất vả, nhà cửa nghèo, giá cà phê thế giới lên xuống. Các nhà hoạt động khuyên người tiêu dùng tìm nhãn fair trade để thay đổi đời sống nông dân."],
  ["Bài nghe số liệu về cà phê","90% cà phê được trồng ở các nước đang phát triển. Người ta uống khoảng hơn 400 tỷ tách mỗi năm. 20 triệu gia đình làm nghề trồng cà phê. Gần một phần ba cà phê thế giới trồng ở Brazil, hơn 3 tỷ cây."],
  ["Ví dụ biểu đồ chữ T về nạn đói","Vấn đề: đất xấu, thiếu nước, thiếu giáo dục. Giải pháp: cung cấp phân bón, giúp làm hệ thống tưới, cấp dụng cụ, dạy nông dân."]
 ],
 vocab:[
  ["activist","/ˈæktɪvɪst/","n","nhà hoạt động xã hội","Activists want fair prices for farmers."],
  ["afford","/əˈfɔːrd/","v","đủ khả năng chi trả","Many farmers cannot afford a horse."],

  ["devise","/dɪˈvaɪz/","v","nghĩ ra, vạch ra","They devised a new plan to help farmers."],

const CODES=[{"code":"06","p1":[{"type":"Ý kiến (opinion)","out":"Trả lời: có, ảnh hưởng. Lý do 1: người ta đoán trình độ và xuất thân qua giọng. Lý do 2: giọng dễ gây thiện cảm hoặc định kiến. Kết: nên đánh giá qua nội dung.","words":"accent, stereotype, first impression, judge, background, prejudice, communicate","vers":[{"a":"I think accents do change how people see us. When someone has a different accent, people may think they are less educated. This is not fair. For example, some customers trust me more when I speak in a clear and familiar way. But when they know me better, they stop caring about my accent. So I think the accent matters at first, but good ideas matter more.","v":"Tôi nghĩ giọng nói có làm đổi cách người ta nhìn mình. Khi ai đó có giọng khác, người ta có thể nghĩ họ ít học. Điều này không công bằng. Ví dụ, một số khách tin tôi hơn khi tôi nói rõ và quen tai. Nhưng khi biết tôi hơn, họ không quan tâm giọng nữa. Nên tôi nghĩ giọng quan trọng lúc đầu, nhưng ý hay quan trọng hơn."},{"a":"Yes, I believe accents change how people are judged. In Vietnam, some regional accents are considered more ‘standard’ than others, and people may unfairly connect them with education. For example, a job candidate with a strong regional accent might feel nervous in an interview. In English too, native listeners may judge learners by their accent. I think this is unfair, because understanding matters more than sounding perfect. So we should listen to the message, not just the sound.","v":"Có, tôi tin giọng nói làm thay đổi cách người ta bị đánh giá. Ở Việt Nam, một số giọng vùng miền được coi là ‘chuẩn’ hơn và người ta có thể gắn chúng với học vấn một cách thiếu công bằng. Ví dụ, ứng viên giọng địa phương nặng có thể lo lắng khi phỏng vấn. Với tiếng Anh cũng vậy, người bản xứ có thể đánh giá người học qua giọng. Tôi thấy điều này không công bằng vì hiểu nhau quan trọng hơn nói chuẩn. Nên ta hãy nghe thông điệp, đừng chỉ nghe âm thanh."},{"a":"In my opinion, accents affect judgment less than before. Because of the internet, we hear many accents every day, so people are more open-minded. Still, in some situations, such as a job interview or a formal presentation, a very strong accent can make listeners work harder to understand. For instance, when I talk to a new client on the phone, I speak slowly and clearly to avoid confusion. So accents matter a little, but clear speech and good manners matter more.","v":"Theo tôi, giọng nói ảnh hưởng đến đánh giá ít hơn trước. Nhờ internet, ngày nào ta cũng nghe nhiều giọng nên mọi người cởi mở hơn. Dù vậy, trong một số tình huống như phỏng vấn hay thuyết trình trang trọng, giọng quá nặng có thể khiến người nghe phải cố hơn để hiểu. Ví dụ, khi nói chuyện điện thoại với khách mới, tôi nói chậm và rõ để tránh nhầm lẫn. Vậy giọng có quan trọng một chút, nhưng nói rõ và lịch sự quan trọng hơn."},{"a":"I think so, and I experienced it myself. When I started studying English, I felt embarrassed about my Vietnamese accent, and I thought people would look down on me. Later my teacher told me that being understood is the real goal. Accents can make a first impression, but confidence and vocabulary change it. In my view, judging people by accent is a bad habit that we should avoid, especially in the workplace.","v":"Tôi nghĩ có, và bản thân tôi đã trải qua. Khi bắt đầu học tiếng Anh, tôi ngại giọng Việt của mình và nghĩ người ta sẽ coi thường. Sau đó cô giáo nói với tôi rằng được hiểu mới là mục tiêu thật. Giọng có thể tạo ấn tượng ban đầu, nhưng sự tự tin và vốn từ thay đổi nó. Theo tôi, đánh giá người qua giọng là thói quen xấu nên tránh, nhất là ở nơi làm việc."},{"a":"Yes, because the brain makes quick decisions. When we hear an accent we recognize as similar to ours, we feel close to the speaker, and when it is different, we may feel distant. This is natural, but it can cause bias, for example in hiring. A good company trains managers to focus on skills and results. As a customer, I also try to judge a person by how honest and helpful they are. That is a fairer way to decide.","v":"Có, vì não ra quyết định rất nhanh. Khi nghe một giọng giống mình, ta thấy gần gũi, còn khi khác, ta có thể thấy xa cách. Điều này tự nhiên, nhưng có thể gây thiên vị, ví dụ khi tuyển dụng. Một công ty tốt đào tạo quản lý tập trung vào kỹ năng và kết quả. Là khách hàng, tôi cũng cố đánh giá người qua sự trung thực và tận tình. Đó là cách quyết định công bằng hơn."}],"q":"Do you think people's accents affect how others judge them?","vi":"Giọng (accent) của một người có ảnh hưởng đến cách người khác đánh giá họ không?"},{"type":"Câu chuyện ngắn (experience)","out":"Trả lời: có. Kể một lần: nói với khách, với công nhân, với bạn cùng lớp khác nhau. Lý do: để hòa nhập, để dễ hiểu. Kết: nên giữ nét riêng.","words":"adjust, fit in, tone, formal, casual, audience, comfortable","vers":[{"a":"Yes, I have. I talk to my workers in a simple and friendly way. When I meet a new client or a tax officer, I speak more politely and slowly. In my master’s class, I use more formal words. I do this because I want people to understand me and feel comfortable. But I try to stay myself. I think it is normal to change the way you speak.","v":"Có. Tôi nói với công nhân bằng cách đơn giản và thân thiện. Khi gặp khách mới hay cán bộ thuế, tôi nói lịch sự và chậm hơn. Ở lớp cao học, tôi dùng từ trang trọng hơn. Tôi làm vậy vì muốn mọi người hiểu mình và thấy thoải mái. Nhưng tôi cố vẫn là chính mình. Tôi nghĩ đổi cách nói là bình thường."},{"a":"Yes, I have, especially when I moved among different groups. At the parents’ meeting at school, I speak politely and use gentle words, because I want to be a good example. With the warehouse workers, I use short, direct sentences. It is not about being fake. It is about showing respect and making communication easy. I believe that changing your way of speaking is normal, as long as you remain honest.","v":"Có, nhất là khi tôi đi giữa các nhóm khác nhau. Ở buổi họp phụ huynh, tôi nói lịch sự và dùng lời nhẹ nhàng vì muốn làm gương tốt. Với công nhân kho, tôi dùng câu ngắn, trực tiếp. Đó không phải giả tạo mà là thể hiện sự tôn trọng và làm giao tiếp dễ dàng. Tôi tin đổi cách nói là bình thường, miễn là mình trung thực."},{"a":"Yes, when I joined my master’s class, I was surprised by the vocabulary. Everyone used terms like ‘liquidity’ and ‘assets’ naturally, so I started to use them as well. At first it felt strange, but it helped me feel part of the group. In contrast, if I speak to my neighbors this way, they will not understand. So I choose my words according to the people around me.","v":"Có, khi vào lớp cao học, tôi ngạc nhiên về từ vựng. Mọi người dùng các thuật ngữ như ‘thanh khoản’ và ‘tài sản’ rất tự nhiên, nên tôi cũng bắt đầu dùng. Lúc đầu thấy lạ, nhưng nó giúp tôi thấy mình thuộc về nhóm. Ngược lại, nếu nói thế với hàng xóm, họ sẽ không hiểu. Nên tôi chọn từ theo những người quanh mình."},{"a":"To be honest, I do it without noticing. When I talk to children, I use simple, cheerful words. When I talk to clients about debts, I stay calm, polite and careful. Sometimes I also imitate the way other people speak to avoid conflict. I think it is a form of emotional intelligence. The risk is losing your own voice, so I always remind myself to be natural.","v":"Thật lòng mà nói, tôi làm điều đó mà không nhận ra. Khi nói với trẻ em, tôi dùng từ đơn giản, vui vẻ. Khi nói với khách về công nợ, tôi giữ bình tĩnh, lịch sự và cẩn thận. Đôi khi tôi cũng bắt chước cách người khác nói để tránh xung đột. Tôi nghĩ đó là một dạng trí tuệ cảm xúc. Rủi ro là đánh mất giọng riêng, nên tôi luôn nhắc mình nói tự nhiên."},{"a":"Yes, and I think most people do. For example, when I visit my relatives in the countryside, I speak with a slightly different accent and use local expressions, so they feel comfortable. Language is a tool for connection. However, I would never change my opinions just to fit in. I only change the style, not the content. That is the balance I try to keep.","v":"Có, và tôi nghĩ hầu hết mọi người đều vậy. Ví dụ, khi về thăm họ hàng ở quê, tôi nói giọng hơi khác và dùng cách nói địa phương để họ thấy thoải mái. Ngôn ngữ là công cụ kết nối. Tuy nhiên, tôi không bao giờ đổi quan điểm chỉ để hòa nhập. Tôi chỉ đổi phong cách, không đổi nội dung. Đó là sự cân bằng tôi cố giữ."}],"q":"Have you ever changed the way you speak to fit in with a group?","vi":"Bạn đã bao giờ đổi cách nói chuyện để hòa nhập với một nhóm chưa?"},{"type":"Hai ý (two things)","out":"Ý 1: có mục tiêu và kế hoạch rõ. Ý 2: có nghỉ ngơi, có việc đa dạng. Ví dụ công việc của chị. Kết: thói quen nhỏ giữ đều.","words":"routine, productive, schedule, priority, break, to-do list, habit","vers":[{"a":"I think two things make a routine productive. First, you need a plan. Every morning I write a short list and do the important job first. Then my day is easier. Second, you need a rest. If I work all day without a break, I feel bored and tired. So I take a short walk or drink tea between jobs. A plan and a rest make my day good.","v":"Tôi nghĩ hai điều làm thói quen hiệu quả. Thứ nhất, cần có kế hoạch. Mỗi sáng tôi viết danh sách ngắn và làm việc quan trọng trước. Rồi ngày của tôi dễ hơn. Thứ hai, cần nghỉ ngơi. Nếu làm cả ngày không nghỉ, tôi thấy chán và mệt. Nên tôi đi bộ ngắn hoặc uống trà giữa các việc. Kế hoạch và nghỉ ngơi làm ngày của tôi tốt."},{"a":"For me, a routine is productive when it starts early and has a clear order. I wake up before the family, check my messages and plan the day in ten minutes. That small habit saves me hours, because I do not jump from one task to another. A routine becomes boring when it has no purpose. So I always connect each task to a goal, such as finishing a report or delivering an order.","v":"Với tôi, thói quen hiệu quả khi bắt đầu sớm và có thứ tự rõ ràng. Tôi dậy trước cả nhà, xem tin nhắn và lên kế hoạch ngày trong mười phút. Thói quen nhỏ đó tiết kiệm cho tôi hàng giờ vì tôi không nhảy từ việc này sang việc khác. Thói quen trở nên nhàm khi không có mục đích. Nên tôi luôn gắn mỗi việc với một mục tiêu như hoàn thành báo cáo hay giao đơn hàng."},{"a":"I think energy management matters most. If I do the hardest tasks, like checking tax documents, in the morning when my mind is fresh, I work better. Then I leave simple jobs, such as answering messages, for the afternoon. Also, eating well and sleeping enough keeps me productive. A routine that ignores your body will soon become boring or tiring.","v":"Tôi nghĩ quản lý năng lượng quan trọng nhất. Nếu tôi làm việc khó nhất như kiểm tra chứng từ thuế vào buổi sáng khi đầu óc tỉnh táo, tôi làm tốt hơn. Rồi để việc đơn giản như trả lời tin nhắn cho buổi chiều. Ăn uống tốt và ngủ đủ cũng giữ tôi hiệu quả. Một thói quen bỏ qua cơ thể sẽ sớm thành nhàm chán hoặc mệt mỏi."},{"a":"A productive routine includes small rewards. After finishing a difficult task, I give myself a short break with a cup of coffee or a quick chat with my children. These small pleasures make the day feel less boring. Also, I try to change something every few weeks, such as the order of tasks, so the routine stays fresh. In short, structure plus variety makes a good routine.","v":"Một thói quen hiệu quả có những phần thưởng nhỏ. Sau khi xong một việc khó, tôi tự thưởng một giờ nghỉ ngắn với tách cà phê hoặc trò chuyện với các con. Những niềm vui nhỏ làm ngày bớt nhàm. Tôi cũng cố đổi điều gì đó vài tuần một lần, như thứ tự công việc, để thói quen luôn mới. Tóm lại, cấu trúc cộng với sự đa dạng làm nên thói quen tốt."},{"a":"I believe the key is to remove distractions. When I turn off notifications for an hour, I finish my accounting entries much faster. A routine is boring when you do it without thinking, but productive when you focus fully. Also, working with a deadline helps. For example, I promise myself to finish the monthly report by Friday, so I protect that time.","v":"Tôi tin chìa khóa là loại bỏ sự xao nhãng. Khi tôi tắt thông báo một giờ, tôi hoàn thành các bút toán nhanh hơn nhiều. Thói quen nhàm chán khi làm mà không suy nghĩ, nhưng hiệu quả khi tập trung hoàn toàn. Việc có hạn chót cũng giúp. Ví dụ, tôi hứa với mình xong báo cáo tháng trước thứ Sáu, nên tôi bảo vệ khoảng thời gian đó."}],"q":"What makes a daily routine productive rather than boring?","vi":"Điều gì khiến một thói quen hằng ngày hiệu quả thay vì nhàm chán?"},{"type":"Ý kiến, ví dụ (opinion)","out":"Trả lời có. Hai ví dụ: hình ảnh quảng cáo đẹp hơn thực tế, chữ nhỏ hoặc nói một nửa sự thật. Gắn với bài học đánh lừa thị giác (visual tricks).","words":"deceive, misleading, exaggerate, small print, visual tricks, half-truth, customers","vers":[{"a":"Yes, I think they can. One way is visual tricks. A food photo can look delicious because of special lighting, but the real meal is much smaller. Nobody lied, but the customer, who expects the same meal, feels deceived. Another way is a half-truth. For example, an advertisement says a drink has no added sugar, but does not say it already contains a lot of natural sugar. The words are true, but the message is misleading. If customers read the small print, they can avoid many traps.","v":"Vâng, tôi nghĩ họ có thể. Một cách là mẹo hình ảnh. Một tấm ảnh món ăn có thể trông rất ngon nhờ ánh sáng đặc biệt, nhưng bữa ăn thật nhỏ hơn nhiều. Không ai nói dối, nhưng khách hàng, người mong đợi đúng bữa ăn đó, vẫn cảm thấy bị đánh lừa. Một cách khác là sự thật một nửa. Ví dụ, quảng cáo nói một loại đồ uống không thêm đường, nhưng không nói rằng nó đã chứa nhiều đường tự nhiên. Từng chữ đều đúng, nhưng thông điệp thì gây hiểu lầm. Nếu khách hàng đọc phần chữ nhỏ, họ có thể tránh được nhiều cái bẫy."},{"a":"Yes, definitely. One common trick is to use special words. A label that says “natural” or “made with real fruit” sounds healthy, but the product may contain only a tiny amount of fruit. Nothing is false, yet customers imagine something different. Another trick is comparison. An advertisement says “up to 50 percent off” but only one item has that discount. For example, I once bought a “big sale” item and found that the normal price was already raised. So customers should check details and compare prices. Overall, careful shoppers are the best protection.","v":"Có, chắc chắn rồi. Một mẹo phổ biến là dùng những từ ngữ đặc biệt. Nhãn ghi “tự nhiên” hoặc “làm từ trái cây thật” nghe có vẻ lành mạnh, nhưng sản phẩm có thể chỉ chứa một lượng trái cây rất nhỏ. Không có gì sai, vậy mà khách hàng lại hình dung một điều khác. Một mẹo khác là so sánh. Quảng cáo ghi “giảm đến 50 phần trăm” nhưng chỉ một món có mức giảm đó. Ví dụ, tôi từng mua một món “đại hạ giá” rồi phát hiện giá thường đã bị tăng lên trước đó. Vì vậy khách hàng nên kiểm tra chi tiết và so sánh giá. Nhìn chung, người mua thận trọng là sự bảo vệ tốt nhất."},{"a":"I believe they can, mostly by choosing what to show. For example, an advertisement for a phone shows only the best photos taken in perfect light and says nothing about the weak battery. Every sentence is true, but the picture is incomplete. Another way is to use famous people. When a celebrity says they love a cream, customers trust it, even if the celebrity is paid. On the other hand, some countries have rules that punish misleading ads. In the long run, I’d say honest brands win more loyal customers.","v":"Tôi tin là họ làm được, chủ yếu bằng cách chọn cái để cho xem. Ví dụ, quảng cáo điện thoại chỉ cho thấy những bức ảnh đẹp nhất chụp trong ánh sáng hoàn hảo và không nói gì về pin yếu. Câu nào cũng đúng, nhưng bức tranh không đầy đủ. Một cách khác là dùng người nổi tiếng. Khi một người nổi tiếng nói họ thích một loại kem, khách hàng tin, dù người đó được trả tiền. Mặt khác, một số nước có quy định phạt quảng cáo gây hiểu lầm. Về lâu dài, tôi cho rằng các thương hiệu trung thực sẽ có được nhiều khách hàng trung thành hơn."},{"a":"Yes, they can. One common trick is using words like ‘up to 70% off’. It is technically true, but only a few items have that discount. Another trick is choosing a famous person to make a product look good, even if the star does not use it. The advertisement does not lie, but customers imagine more than the truth. To protect myself, I always compare prices and read reviews.","v":"Có, chúng có thể. Một chiêu hay gặp là dùng cụm như ‘giảm đến 70%’. Về kỹ thuật là đúng, nhưng chỉ vài món giảm như vậy. Chiêu khác là chọn người nổi tiếng để sản phẩm trông tốt, dù ngôi sao không dùng. Quảng cáo không nói dối nhưng khách tưởng tượng nhiều hơn sự thật. Để bảo vệ mình, tôi luôn so giá và đọc đánh giá."},{"a":"In my opinion, yes. Advertisers often show only the positive side. A cream may be ‘dermatologist tested’, but this does not prove that it works. As a consumer, I think this is deceptive because it creates a false expectation. However, customers also have a responsibility to think critically. If we ask ‘what is not being said?’, we can avoid most traps.","v":"Theo tôi, có. Nhà quảng cáo thường chỉ cho thấy mặt tốt. Một loại kem có thể ‘được bác sĩ da liễu kiểm tra’ nhưng điều này không chứng minh nó hiệu quả. Là người tiêu dùng, tôi thấy đó là sự lừa dối vì tạo kỳ vọng sai. Tuy nhiên khách hàng cũng có trách nhiệm suy nghĩ phản biện. Nếu ta hỏi ‘điều gì không được nói?’ ta tránh được hầu hết cạm bẫy."}],"q":"Can advertisements deceive customers without actually lying?","vi":"Quảng cáo có thể lừa khách hàng mà không thực sự nói dối không?"},{"type":"Ý kiến (opinion)","out":"Chọn có hoặc tùy. Lý do 1: nông dân được giá công bằng. Lý do 2: chất lượng và trách nhiệm. Mặt trái: giá cao với người thu nhập thấp.","words":"fair trade, farmers, guarantee, minimum price, afford, global citizen, ethical","vers":[{"a":"I think it is worth it, as long as people can afford it. One reason is that fair trade guarantees farmers a minimum price, so they can send their children to school. Another reason is that it makes us global citizens. If we pay a little more, we share responsibility for people who live far away. On the other hand, for families with a low income, the higher price can be a burden. So it depends on each person’s budget. Overall, I’d choose one fair trade product a week.","v":"Tôi nghĩ là đáng, miễn là mọi người đủ khả năng chi trả. Một lý do là thương mại công bằng bảo đảm nông dân có mức giá tối thiểu, nên họ có thể cho con đi học. Một lý do khác là nó khiến ta trở thành công dân toàn cầu. Nếu trả thêm một chút, chúng ta cùng chia sẻ trách nhiệm với những người sống ở nơi xa. Mặt khác, với những gia đình thu nhập thấp, giá cao hơn có thể là gánh nặng. Vì vậy còn tùy ngân sách của từng người. Nhìn chung, tôi sẽ chọn mỗi tuần một sản phẩm thương mại công bằng."},{"a":"In my opinion, it’s worth paying more for fair trade, if the product is good. One reason is that the extra money often goes to farmers’ communities, for example for clean water or a school. Another reason is that fair trade products usually have better quality, because farmers can afford to take better care of their crops. However, I understand that some families have a tight budget. In that case, they can choose just one or two products, such as coffee or chocolate. Overall, a small extra cost is a way to support fairness.","v":"Theo tôi, trả thêm tiền cho hàng thương mại công bằng là đáng, nếu sản phẩm tốt. Một lý do là số tiền thêm thường đến với cộng đồng nông dân, chẳng hạn để có nước sạch hoặc xây trường. Một lý do khác là sản phẩm thương mại công bằng thường chất lượng hơn, vì nông dân có điều kiện chăm sóc cây trồng tốt hơn. Tuy nhiên, tôi hiểu một số gia đình có ngân sách eo hẹp. Khi đó, họ có thể chỉ chọn một hai sản phẩm, như cà phê hay sô cô la. Nhìn chung, một khoản chi thêm nhỏ là cách để ủng hộ sự công bằng."},{"a":"It depends on who is buying. For a family with a stable income, paying a bit more for fair trade coffee is a reasonable choice, because they help farmers live with dignity. For example, a farmer who earns a fair price can invest in better tools and stop depending on middlemen. On the other hand, for a student or a worker with a low salary, every dollar counts, so the higher price might be too heavy. Still, I believe the label should be clearer so buyers can trust it. Overall, fair trade is worth it when people can afford it.","v":"Còn tùy người mua là ai. Với một gia đình có thu nhập ổn định, trả thêm một chút cho cà phê thương mại công bằng là lựa chọn hợp lý, vì họ giúp nông dân sống có phẩm giá. Ví dụ, một nông dân nhận được giá công bằng có thể đầu tư công cụ tốt hơn và không còn phụ thuộc vào người trung gian. Mặt khác, với một sinh viên hay người lương thấp, đồng nào cũng quan trọng, nên mức giá cao hơn có thể quá nặng. Dù vậy, tôi tin nhãn mác nên rõ ràng hơn để người mua có thể tin tưởng. Nhìn chung, thương mại công bằng đáng giá khi người ta đủ khả năng chi trả."},{"a":"I think fair trade is worth it for products like coffee and chocolate, because the extra money usually goes to farmers and local schools. For ordinary consumers, the difference may be only a few thousand dong. Still, if a family has a tight budget, they cannot always afford it. So I would suggest buying fair trade for some items, rather than everything. Even a small choice supports a better system.","v":"Tôi nghĩ thương mại công bằng đáng giá với các sản phẩm như cà phê và sô cô la, vì phần tiền thêm thường đến tay nông dân và trường học địa phương. Với người tiêu dùng bình thường, chênh lệch chỉ vài nghìn đồng. Dù vậy, nếu gia đình ngân sách chặt, họ không phải lúc nào cũng mua được. Nên tôi gợi ý mua hàng công bằng cho một số món, không phải tất cả. Dù một lựa chọn nhỏ cũng ủng hộ hệ thống tốt hơn."},{"a":"Honestly, it depends on how trustworthy the label is. If the product is really fair trade, the higher price is fair, because farmers receive stable income and better working conditions. But some companies use the label only for marketing. As a consumer who values numbers, I like to check the certificate and compare. If it is real, I am happy to pay more, because quality is often better too.","v":"Thành thật mà nói, còn tùy nhãn có đáng tin không. Nếu sản phẩm thật sự là thương mại công bằng, giá cao hơn là hợp lý vì nông dân có thu nhập ổn định và điều kiện làm việc tốt hơn. Nhưng một số công ty chỉ dùng nhãn để quảng bá. Là người coi trọng con số, tôi thích kiểm tra chứng nhận và so sánh. Nếu là thật, tôi sẵn lòng trả thêm vì chất lượng thường cũng tốt hơn."}],"q":"Is fair trade worth the higher price for ordinary consumers?","vi":"Thương mại công bằng có đáng với mức giá cao hơn đối với người tiêu dùng bình thường không?"},{"type":"Chọn một bên (choice)","out":"Chọn một bên rõ ràng. Lý do 1: tiện lợi hay yên tĩnh. Lý do 2: chi phí và gia đình. Nêu mặt trái bên kia rồi kết.","words":"dense, suburb, convenient, commute, noise, spacious, cost of living","vers":[{"a":"I prefer a quiet suburb. First, it is cheaper and bigger. I can have a bigger house, and my children can play safely. Second, the air is cleaner and I sleep better. The city center is more convenient, but it is noisy and crowded. I need space for my work too. So I choose the suburb because I want a peaceful life.","v":"Tôi thích ngoại ô yên tĩnh hơn. Thứ nhất, nó rẻ hơn và rộng hơn. Tôi có thể có nhà lớn hơn và các con chơi an toàn. Thứ hai, không khí sạch hơn và tôi ngủ ngon hơn. Trung tâm tiện hơn nhưng ồn và đông. Tôi cũng cần chỗ cho công việc. Nên tôi chọn ngoại ô vì muốn cuộc sống yên bình."},{"a":"I would choose the city center, for convenience. In the center, hospitals, good schools, and shops are close, so I save time every day. Time is very valuable for a busy person like me. Also, there are more opportunities to meet clients and to learn. The negative side is noise and pollution, but I think they are acceptable. For me, the city is more suitable at this stage of life.","v":"Tôi sẽ chọn trung tâm thành phố vì sự tiện lợi. Ở trung tâm, bệnh viện, trường tốt và cửa hàng ở gần, nên tôi tiết kiệm thời gian mỗi ngày. Thời gian rất quý với người bận như tôi. Ngoài ra còn nhiều cơ hội gặp khách và học hỏi. Mặt trái là ồn và ô nhiễm, nhưng tôi nghĩ chấp nhận được. Với tôi, thành phố hợp hơn ở giai đoạn này của cuộc đời."},{"a":"It depends on the stage of life. When I was young, I loved the busy city because it was exciting. Now that I have children, I want fresh air and a calm neighborhood. A suburb has a lower cost and a stronger community, where neighbors know each other. So today I prefer the suburb, but a young single person might choose differently.","v":"Còn tùy giai đoạn cuộc đời. Khi còn trẻ, tôi yêu thành phố nhộn nhịp vì nó thú vị. Giờ có con, tôi muốn không khí trong lành và khu phố yên. Ngoại ô chi phí thấp hơn và cộng đồng gắn bó hơn, hàng xóm biết nhau. Nên hôm nay tôi thích ngoại ô, nhưng một người trẻ độc thân có thể chọn khác."},{"a":"I prefer a quiet suburb because of health. In dense cities, the air is dirty and the streets are crowded, so people get stressed. In the suburb, I can walk in the evening and sleep well. Moreover, a bigger house is useful for my work, because I can store files and equipment. Of course, I need to drive more, but I think the peace is worth it.","v":"Tôi thích ngoại ô yên tĩnh vì sức khỏe. Ở thành phố đông đúc, không khí bẩn và đường phố chật, nên người ta căng thẳng. Ở ngoại ô, tôi có thể đi bộ buổi tối và ngủ ngon. Hơn nữa nhà rộng hơn có ích cho công việc vì tôi có chỗ để hồ sơ và thiết bị. Tất nhiên tôi phải đi xe nhiều hơn, nhưng tôi nghĩ sự bình yên đáng giá."},{"a":"I would like a mix: living in a quiet suburb that is close to the city by public transport. That way I could enjoy peaceful evenings but still reach the center in thirty minutes. In Vietnam, this is not always easy, because public transport is limited. But if I could choose, I would choose a suburb with a good road and a small shop nearby.","v":"Tôi muốn kết hợp: sống ở ngoại ô yên tĩnh gần thành phố bằng giao thông công cộng. Như vậy tôi tận hưởng buổi tối bình yên nhưng vẫn vào trung tâm trong ba mươi phút. Ở Việt Nam điều này không dễ vì giao thông công cộng còn hạn chế. Nhưng nếu được chọn, tôi chọn ngoại ô có đường tốt và cửa hàng nhỏ gần đó."}],"q":"Would you rather live in a dense city center or a quiet suburb?","vi":"Bạn thích sống ở trung tâm thành phố đông đúc hay vùng ngoại ô yên tĩnh hơn?"},{"type":"Hai nguồn (sources)","out":"Nguồn 1: lúc làm việc thật, gặp vấn đề. Nguồn 2: nói chuyện với người khác, đọc, học. Ví dụ. Kết: ý tưởng đến khi đầu óc thoải mái.","words":"inspiration, brainstorm, problem-solving, conversation, relax, experience, creative","vers":[{"a":"My best ideas come from two places. First, from my work. When I have a problem, like a late delivery, I have to find a new way. Second, from other people. When I talk with customers, classmates or other parents, they give me new ideas. Sometimes I also get ideas when I cook or walk. I think ideas come when we work, talk and relax.","v":"Ý tưởng hay nhất của tôi đến từ hai nơi. Thứ nhất, từ công việc. Khi có vấn đề như giao hàng trễ, tôi phải tìm cách mới. Thứ hai, từ người khác. Khi nói chuyện với khách, bạn học hay phụ huynh khác, họ cho tôi ý mới. Đôi khi tôi cũng có ý khi nấu ăn hay đi bộ. Tôi nghĩ ý tưởng đến khi ta làm việc, trò chuyện và thư giãn."},{"a":"My best ideas often come when I am doing something simple, like cooking or taking a shower. When the mind is relaxed, it connects things in new ways. For example, I once found a better way to schedule deliveries while washing dishes. Because of this, I always keep a small notebook near me. Rest is not wasted time. It is part of thinking.","v":"Những ý tưởng hay nhất của tôi thường đến khi tôi làm việc đơn giản như nấu ăn hay tắm. Khi đầu óc thư giãn, nó nối các thứ theo cách mới. Ví dụ, tôi từng nghĩ ra cách xếp lịch giao hàng tốt hơn khi đang rửa chén. Vì vậy tôi luôn để cuốn sổ nhỏ bên mình. Nghỉ ngơi không phải thời gian lãng phí. Nó là một phần của suy nghĩ."},{"a":"They come from learning. When I read a new regulation or attend my master’s class, I often think, ‘I can use this in my business.’ For instance, a lesson about inventory control gave me an idea to organize my storage by sales speed. New knowledge is like a seed, and my work is the soil. So the more I learn, the more ideas I get.","v":"Chúng đến từ việc học. Khi đọc một quy định mới hay đi học cao học, tôi thường nghĩ ‘mình dùng được cái này trong việc kinh doanh’. Ví dụ, một bài về kiểm soát tồn kho cho tôi ý tưởng sắp xếp kho theo tốc độ bán. Kiến thức mới như hạt giống, còn công việc của tôi như đất. Học càng nhiều tôi càng có nhiều ý tưởng."},{"a":"Many ideas come from my family. My children ask simple questions such as ‘why do we do it this way?’ and these questions make me look at old habits again. Their curiosity pushes me to improve things. Sometimes the best idea is a small change that makes life easier for everyone.","v":"Nhiều ý tưởng đến từ gia đình tôi. Các con hỏi những câu đơn giản như ‘sao mình làm thế này?’ và những câu hỏi đó khiến tôi xem lại thói quen cũ. Sự tò mò của chúng thúc tôi cải thiện. Đôi khi ý tưởng tốt nhất là một thay đổi nhỏ giúp mọi người thấy dễ hơn."},{"a":"They usually come from problems. When something is difficult or costly, my mind starts to search for a solution. For example, high electricity bills led me to track the power use in the warehouse and share the costs fairly. Without that problem, I would never have thought of it. So I would say problems are the best teachers of ideas.","v":"Chúng thường đến từ các vấn đề. Khi điều gì đó khó hoặc tốn kém, đầu óc tôi bắt đầu tìm giải pháp. Ví dụ, hóa đơn điện cao khiến tôi theo dõi điện dùng trong kho và chia chi phí công bằng. Không có vấn đề đó, tôi sẽ không nghĩ ra. Nên tôi nói vấn đề là người thầy tốt nhất của ý tưởng."}],"q":"Where do your best ideas usually come from?","vi":"Những ý tưởng hay nhất của bạn thường đến từ đâu?"},{"type":"So sánh (compare)","out":"Người lớn tuổi: cẩn thận, thích cái quen. Người trẻ: nhanh thích nghi, dám thử. Ví dụ công nghệ trong gia đình. Kết: cần hiểu nhau.","words":"generation, adapt, cautious, tradition, technology, open-minded, gap","vers":[{"a":"Older people usually like safe things. They want things to stay the same. Younger people like to try new things. For example, my children use a phone for everything, but my parents like cash. Both ways are fine. I think we should listen to each other. Older people have experience, and younger people have new ideas.","v":"Người lớn tuổi thường thích điều an toàn. Họ muốn mọi thứ giữ nguyên. Người trẻ thích thử cái mới. Ví dụ, các con tôi dùng điện thoại cho mọi thứ, còn ba mẹ tôi thích tiền mặt. Cả hai cách đều ổn. Tôi nghĩ ta nên lắng nghe nhau. Người lớn có kinh nghiệm, người trẻ có ý mới."},{"a":"I think the main difference is how each generation sees risk. Older people have more responsibilities and savings to protect, so they want stability. Younger people have less to lose, so they accept risk more easily. For example, when mobile payment appeared, my children used it immediately, while my parents worried about security. Both reactions make sense. A good family listens to both.","v":"Tôi nghĩ khác biệt chính là cách mỗi thế hệ nhìn rủi ro. Người lớn tuổi có nhiều trách nhiệm và tiền tiết kiệm cần bảo vệ nên muốn ổn định. Người trẻ ít thứ để mất nên dễ chấp nhận rủi ro. Ví dụ, khi thanh toán di động xuất hiện, các con tôi dùng ngay, còn ba mẹ tôi lo về an ninh. Cả hai phản ứng đều có lý. Một gia đình tốt lắng nghe cả hai."},{"a":"Older generations often react to change with experience, and younger ones react with energy. Elders may say, ‘We tried this before and it failed.’ Young people say, ‘This time it will be different.’ In business, I need both opinions. The older view protects me from mistakes, and the younger view brings new chances. If they work together, change becomes easier.","v":"Thế hệ lớn thường phản ứng với thay đổi bằng kinh nghiệm, thế hệ trẻ bằng năng lượng. Người lớn có thể nói ‘ngày xưa thử rồi thất bại’. Người trẻ nói ‘lần này sẽ khác’. Trong kinh doanh, tôi cần cả hai ý kiến. Góc nhìn lớn tuổi bảo vệ tôi khỏi sai lầm, góc nhìn trẻ mang cơ hội mới. Nếu họ hợp tác, thay đổi dễ hơn."},{"a":"I believe it depends on how the change is explained. Older people often resist because they feel excluded or confused, not because they hate new things. When my mother learned to video call, she was very happy once my daughter showed her step by step. So patience is the key. Younger people should explain, and older people should try.","v":"Tôi tin còn tùy thay đổi được giải thích thế nào. Người lớn tuổi thường kháng cự vì thấy bị loại trừ hoặc bối rối, không phải vì ghét cái mới. Khi mẹ tôi học gọi video, bà rất vui khi con gái tôi chỉ từng bước. Nên kiên nhẫn là chìa khóa. Người trẻ nên giải thích, người lớn nên thử."},{"a":"Younger people usually welcome change because they grew up in a fast world. Older people see change as a threat to their habits. For instance, in my family, the older relatives prefer traditional Tet customs, while the young want a simpler celebration. We solve it by keeping the main customs and adding some new ideas. Compromise is possible if we respect each other.","v":"Người trẻ thường đón nhận thay đổi vì lớn lên trong thế giới nhanh. Người lớn tuổi thấy thay đổi là mối đe dọa với thói quen. Ví dụ trong gia đình tôi, người lớn thích phong tục Tết truyền thống, còn người trẻ muốn đón Tết đơn giản hơn. Chúng tôi giải quyết bằng cách giữ các phong tục chính và thêm ý tưởng mới. Thỏa hiệp là có thể nếu ta tôn trọng nhau."}],"q":"How do older and younger generations react differently to change?","vi":"Thế hệ lớn tuổi và thế hệ trẻ phản ứng với sự thay đổi khác nhau như thế nào?"}],"p2":[{"type":"Một dịp, một câu chuyện (an occasion)","out":"Mở: bối cảnh. Thân: lúc đầu thấy gì, thực tế thế nào, mình học được gì. Kết: đừng đánh giá qua vẻ ngoài.","words":"appearance, first impression, turned out, misleading, judge, realize, lesson","vers":[{"a":"I’d like to talk about a time when a first impression was completely wrong. It happened about four years ago, when I was looking for a place to have dinner with my family after a long week. First, let me describe the situation. We walked past a new restaurant with bright lights, a modern sign and a very beautiful entrance. I was sure the food would be excellent, so we decided to go in. However, as soon as we sat down, things changed. The service was slow, the food was cold, and the prices were much higher than I expected. My children were hungry and tired, and I felt disappointed and a little embarrassed because it was my choice. Later that month, my friend, who knows the area well, took me to a small, old shop near my house. It looked simple, and honestly a bit dirty from the outside. But the owner was friendly, the food was fresh, and the price was reasonable. We went back many times. If I had checked the reviews first, I would have saved a lot of money. That experience taught me an important lesson. Appearances can be misleading, so I should not judge a place, or a person, only by the outside. I use the same idea in my work. When I choose a new supplier, I don’t only look at a beautiful brochure; I check samples and ask other customers. To sum up, the best way is to look deeper before deciding. That’s why I always say: don’t judge a book by its cover.","v":"Tôi muốn kể về một lần ấn tượng ban đầu hoàn toàn sai. Chuyện xảy ra khoảng bốn năm trước, khi tôi đang tìm một chỗ ăn tối cùng gia đình sau một tuần dài. Trước hết, để tôi tả lại tình huống. Chúng tôi đi ngang một nhà hàng mới với đèn sáng rực, biển hiệu hiện đại và lối vào rất đẹp. Tôi chắc chắn đồ ăn sẽ rất ngon, nên chúng tôi quyết định vào. Tuy nhiên, vừa ngồi xuống thì mọi chuyện đổi khác. Phục vụ chậm, đồ ăn nguội, và giá cao hơn nhiều so với tôi nghĩ. Các con tôi vừa đói vừa mệt, còn tôi thấy thất vọng và hơi ngượng vì đó là lựa chọn của mình. Cuối tháng đó, một người bạn, người rành khu vực này, dẫn tôi đến một quán nhỏ cũ gần nhà. Nhìn từ ngoài thì đơn sơ, nói thật là hơi bẩn. Nhưng chủ quán thân thiện, đồ ăn tươi, và giá hợp lý. Chúng tôi quay lại nhiều lần. Nếu tôi xem đánh giá trước, tôi đã tiết kiệm được rất nhiều tiền. Trải nghiệm đó cho tôi một bài học quan trọng. Vẻ bề ngoài có thể gây hiểu lầm, nên tôi không nên đánh giá một nơi, hay một con người, chỉ qua bên ngoài. Tôi áp dụng đúng ý này trong công việc. Khi chọn nhà cung cấp mới, tôi không chỉ nhìn vào tờ giới thiệu đẹp mà còn kiểm tra hàng mẫu và hỏi những khách hàng khác. Tóm lại, cách tốt nhất là nhìn sâu hơn trước khi quyết định. Vì vậy tôi luôn nói: đừng đánh giá quyển sách qua bìa của nó."},{"a":"I’d like to tell you about a job offer that looked perfect but wasn’t. Two years ago, I saw an advertisement for a position with a very high salary and a beautiful office. I was excited and went to the interview immediately. At first, everyone was friendly and the manager promised many benefits. However, when I asked about the contract, he avoided my questions. Later I discovered, from former employees, that people there worked overtime without pay and many left after a few months. In the end, I refused the offer, and a week later I accepted a smaller company with a lower salary but a respectful boss. I learned that a good first impression is not enough, so I should always ask questions and check the facts. Since then, I read reviews before every decision.","v":"Tôi muốn kể về một lời mời làm việc trông hoàn hảo nhưng thực ra không phải. Hai năm trước, tôi thấy quảng cáo tuyển một vị trí lương rất cao và văn phòng đẹp. Tôi hào hứng và đi phỏng vấn ngay. Lúc đầu mọi người đều thân thiện và quản lý hứa nhiều quyền lợi. Tuy nhiên, khi tôi hỏi về hợp đồng, ông ấy né tránh câu hỏi. Sau đó tôi biết từ các nhân viên cũ rằng ở đó người ta làm thêm giờ không được trả tiền và nhiều người nghỉ sau vài tháng. Cuối cùng tôi từ chối, và một tuần sau tôi nhận lời một công ty nhỏ hơn, lương thấp hơn nhưng sếp tôn trọng nhân viên. Tôi học được rằng ấn tượng đầu tốt chưa đủ, nên luôn phải đặt câu hỏi và kiểm tra thông tin. Từ đó, tôi đọc đánh giá trước mỗi quyết định."},{"a":"Let me share a story about a person. When I first met my neighbour, he looked serious and unfriendly. He never smiled and he walked quickly past us, so I thought he was proud and cold. One rainy night, however, my motorbike broke down in front of his house. He came out without a word, lent me tools, and stayed for an hour to help me. Afterward he invited me for tea, and I learned that he is just shy and had worked abroad for many years. I realized how wrong my first impression was. What I learned is to be patient and to give people a chance before I judge them. Now he is one of my closest friends, and we help each other often.","v":"Tôi xin kể một câu chuyện về một con người. Lần đầu gặp người hàng xóm, ông ấy trông nghiêm nghị và khó gần. Ông không bao giờ cười và đi nhanh qua chúng tôi, nên tôi nghĩ ông kiêu và lạnh lùng. Nhưng một đêm mưa, xe máy của tôi hỏng ngay trước nhà ông. Ông bước ra không nói một lời, cho tôi mượn đồ nghề và ở lại giúp tôi cả tiếng đồng hồ. Sau đó ông mời tôi uống trà, và tôi biết ông chỉ là người hay ngại và từng làm việc ở nước ngoài nhiều năm. Tôi nhận ra ấn tượng ban đầu của mình sai đến mức nào. Điều tôi học được là phải kiên nhẫn và cho người ta cơ hội trước khi phán xét. Giờ ông là một trong những người bạn thân nhất của tôi, và chúng tôi thường giúp nhau."},{"a":"I’d like to talk about an occasion when a person turned out to be very different from what I saw. Last year, a new client came to our workshop in an old shirt and with a small motorbike. I thought he would order only a little. However, he ordered a large amount of equipment and paid on time. There are three lessons. First, appearance does not show wealth. Second, kindness to every customer is important, because you never know. Third, I should ask questions instead of guessing. After that day, I treat every client with the same respect. To sum up, what we see is only a small part of the truth. That’s why I try not to judge too fast.","v":"Tôi muốn kể về một dịp một người hóa ra rất khác với điều tôi thấy. Năm ngoái, một khách mới đến xưởng với chiếc áo cũ và chiếc xe máy nhỏ. Tôi nghĩ anh chỉ đặt ít. Nhưng anh đặt một lượng thiết bị lớn và trả đúng hạn. Có ba bài học. Thứ nhất, vẻ ngoài không cho thấy sự giàu có. Thứ hai, tử tế với mọi khách là quan trọng vì mình không biết trước. Thứ ba, tôi nên hỏi thay vì đoán. Sau hôm đó, tôi đối xử với mọi khách bằng sự tôn trọng như nhau. Tóm lại, điều ta thấy chỉ là một phần nhỏ của sự thật. Vì vậy tôi cố không đánh giá quá nhanh."},{"a":"I’d like to talk about the time I bought a fruit basket that looked beautiful. The top layer had big, shiny fruit, so I was happy to buy it as a gift. However, when we opened it at home, the lower fruit was small and some pieces were bad. I felt disappointed for three reasons. First, I wasted money. Second, I was embarrassed because it was a gift for my parents. Third, I realized how a good display can hide poor quality. Since then, I always check the bottom layer and ask the seller to show me. To sum up, a nice surface can be misleading. That’s why I believe it is wise to look deeper before buying.","v":"Tôi muốn kể về lần tôi mua giỏ trái cây trông rất đẹp. Lớp trên có trái to, bóng nên tôi vui vẻ mua làm quà. Nhưng khi mở ở nhà, trái phía dưới nhỏ và có vài quả hỏng. Tôi thất vọng vì ba lý do. Thứ nhất, tôi lãng phí tiền. Thứ hai, tôi xấu hổ vì đó là quà cho ba mẹ. Thứ ba, tôi nhận ra cách bày đẹp có thể che chất lượng kém. Từ đó, tôi luôn kiểm tra lớp dưới và nhờ người bán cho xem. Tóm lại, bề mặt đẹp có thể gây hiểu lầm. Vì vậy tôi tin nên nhìn kỹ hơn trước khi mua."}],"q":"An occasion when something you saw turned out to be very different from what it really was.","vi":"Một dịp khi điều bạn nhìn thấy hóa ra rất khác với thực tế."},{"type":"Điều quan trọng (what is important)","out":"Mở: có 3 điều. 1) Vấn đề thật và thị trường. 2) Con số: chi phí, lợi nhuận, rủi ro. 3) Con người: tin tưởng, trình bày rõ. Kết.","words":"investor, pitch, market, profit, risk, credibility, financial plan","vers":[{"a":"I want to talk about what is important when we show a new idea to investors. I think there are three things. First, the idea must solve a real problem. Investors ask: who will buy it? For example, if I make a new machine part, I must show that many factories need it. Second, the numbers must be clear. I should say the cost, the profit and the risk. I work with accounts, so I know that honest numbers build trust. Third, the person must be reliable. Investors also look at you. You should speak clearly and answer questions calmly. In short, a real need, honest numbers and a good speaker can convince people. So I always prepare well before I present.","v":"Tôi muốn nói về điều quan trọng khi trình bày ý tưởng mới cho nhà đầu tư. Tôi nghĩ có ba điều. Thứ nhất, ý tưởng phải giải quyết một vấn đề thật. Nhà đầu tư hỏi: ai sẽ mua? Ví dụ, nếu làm bộ phận máy mới, tôi phải cho thấy nhiều nhà máy cần nó. Thứ hai, con số phải rõ. Tôi nên nói chi phí, lợi nhuận và rủi ro. Tôi làm sổ sách nên biết con số trung thực tạo niềm tin. Thứ ba, người trình bày phải đáng tin. Nhà đầu tư cũng nhìn vào bạn. Bạn nên nói rõ và trả lời bình tĩnh. Tóm lại, nhu cầu thật, con số trung thực và người nói tốt có thể thuyết phục. Nên tôi luôn chuẩn bị kỹ trước khi trình bày."},{"a":"I’d like to talk about what is important when presenting a new idea to investors. In my view, there are three key points. The first is a simple story. Investors listen to many presentations, so you should explain your idea in one minute: what problem you solve and for whom. The second is evidence. If you have a small test, even sales from ten customers, show it, because real results are stronger than promises. The third is honesty about risk. Every business has risks, and an investor trusts a person who talks about them openly. For example, I would say what could go wrong and how I would manage it. To sum up, a simple story, evidence and honesty make a strong presentation. That’s why I believe trust is more valuable than excitement.","v":"Tôi muốn nói về điều quan trọng khi trình bày một ý tưởng mới cho nhà đầu tư. Theo tôi có ba điểm chính. Điểm thứ nhất là một câu chuyện đơn giản. Nhà đầu tư nghe nhiều bài trình bày, nên bạn cần giải thích ý tưởng trong một phút: giải quyết vấn đề gì và cho ai. Điểm thứ hai là bằng chứng. Nếu có một thử nghiệm nhỏ, dù chỉ doanh số từ mười khách, hãy cho xem, vì kết quả thật mạnh hơn lời hứa. Điểm thứ ba là trung thực về rủi ro. Mọi việc kinh doanh đều có rủi ro, và nhà đầu tư tin người nói cởi mở về chúng. Ví dụ, tôi sẽ nói điều gì có thể sai và cách tôi quản lý. Tóm lại, câu chuyện đơn giản, bằng chứng và sự trung thực làm nên bài trình bày mạnh. Vì vậy tôi tin sự tin cậy quý hơn sự hào hứng."},{"a":"I’d like to talk about presenting a new idea to people who might invest in it. I think three things are important. First, know your audience. A bank investor cares about repayment, while a private investor may care about growth. So I would prepare different points for each. Second, show the team. Investors invest in people, so you should explain who will do the work and what experience they have. Third, give a clear request. Say how much money you need, what you will use it for, and when they can expect returns. For example, a vague request like ‘we need some money’ sounds careless. To sum up, understanding the audience, presenting the team and making a clear request are the keys. That’s why I believe a good presentation is mostly good preparation.","v":"Tôi muốn nói về việc trình bày một ý tưởng mới cho những người có thể đầu tư. Tôi nghĩ ba điều quan trọng. Thứ nhất, hiểu người nghe. Nhà đầu tư ngân hàng quan tâm hoàn vốn, còn nhà đầu tư cá nhân có thể quan tâm tăng trưởng. Nên tôi sẽ chuẩn bị ý khác nhau cho mỗi bên. Thứ hai, giới thiệu đội ngũ. Nhà đầu tư đầu tư vào con người, nên bạn cần nói ai làm việc và có kinh nghiệm gì. Thứ ba, đưa ra đề nghị rõ ràng. Nói cần bao nhiêu tiền, dùng vào đâu và khi nào họ có thể nhận lợi nhuận. Ví dụ, một đề nghị mơ hồ như ‘chúng tôi cần ít tiền’ nghe cẩu thả. Tóm lại, hiểu người nghe, giới thiệu đội ngũ và đề nghị rõ ràng là chìa khóa. Vì vậy tôi tin một bài trình bày tốt phần lớn là sự chuẩn bị tốt."},{"a":"I’d like to talk about what is important when presenting a new idea to potential investors. In my view, there are three main points. The first is the size of the opportunity. Investors want to see that many people will buy the product, so you need simple numbers about the market. The second is competition. You should explain what makes your idea different from others, for example lower cost or better quality. The third is a realistic plan for growth, with steps for the first year. As someone who works with accounts, I know that a plan with clear numbers shows discipline. To sum up, market size, difference and a realistic plan convince investors. That’s why I believe a good idea needs good evidence.","v":"Tôi muốn nói về điều quan trọng khi trình bày ý tưởng mới cho nhà đầu tư tiềm năng. Theo tôi có ba điểm chính. Điểm thứ nhất là quy mô cơ hội. Nhà đầu tư muốn thấy nhiều người sẽ mua sản phẩm, nên bạn cần số liệu đơn giản về thị trường. Điểm thứ hai là cạnh tranh. Bạn nên giải thích điều gì làm ý tưởng khác biệt, ví dụ chi phí thấp hơn hay chất lượng tốt hơn. Điểm thứ ba là kế hoạch tăng trưởng thực tế với các bước cho năm đầu. Là người làm sổ sách, tôi biết kế hoạch có con số rõ cho thấy kỷ luật. Tóm lại, quy mô thị trường, sự khác biệt và kế hoạch thực tế thuyết phục nhà đầu tư. Vì vậy tôi tin ý tưởng tốt cần bằng chứng tốt."},{"a":"I’d like to talk about presenting a new idea to potential investors. I believe three points matter. First, confidence without arrogance. You should speak clearly and stay calm when asked difficult questions. Second, a short and visual explanation. A one-page summary with a simple chart is easier to remember than a long document. Third, a plan B. Investors like to see that you have thought about what to do if sales are slow. For example, you might reduce costs or change the product. To sum up, calm confidence, clear presentation and a backup plan make investors comfortable. That’s why I believe a presenter should prepare for hard questions, not only for good news.","v":"Tôi muốn nói về việc trình bày ý tưởng mới cho nhà đầu tư tiềm năng. Tôi tin ba điểm quan trọng. Thứ nhất, tự tin mà không kiêu ngạo. Bạn nên nói rõ và bình tĩnh khi bị hỏi khó. Thứ hai, giải thích ngắn gọn và trực quan. Một bản tóm tắt một trang với biểu đồ đơn giản dễ nhớ hơn tài liệu dài. Thứ ba, một phương án B. Nhà đầu tư thích thấy bạn đã nghĩ sẽ làm gì nếu bán chậm. Ví dụ, bạn có thể giảm chi phí hoặc đổi sản phẩm. Tóm lại, tự tin bình tĩnh, trình bày rõ và phương án dự phòng làm nhà đầu tư yên tâm. Vì vậy tôi tin người trình bày nên chuẩn bị cho câu hỏi khó chứ không chỉ tin tốt."}],"q":"What is important when presenting a new idea to people who might invest in it.","vi":"Điều gì quan trọng khi trình bày một ý tưởng mới cho những người có thể đầu tư vào nó."},{"type":"So sánh (comparison)","out":"Mở: chọn bên. Thân: nói thẳng nhanh, rõ, nhưng dễ mất lòng; nói gián tiếp giữ hòa khí nhưng dễ hiểu nhầm. Chọn kết hợp theo tình huống. Kết.","words":"direct, indirect, polite, misunderstanding, tact, feedback, relationship","vers":[{"a":"I want to talk about speaking directly and speaking politely but not directly. I think the best way is to be clear and polite together. First, direct words save time. If a worker makes a mistake, I tell him exactly what is wrong. Then he can fix it fast. Second, indirect words keep a good relationship. In Vietnam, people often do not say “no” because they do not want to hurt others. Third, we should think about the situation. With close people, I speak directly. With older customers, I use softer words. So my answer is: say what you mean, but say it kindly. That way people understand you and still feel respected.","v":"Tôi muốn nói về nói thẳng và nói lịch sự nhưng không thẳng. Tôi nghĩ cách tốt nhất là vừa rõ vừa lịch sự. Thứ nhất, nói thẳng tiết kiệm thời gian. Nếu công nhân làm sai, tôi nói đúng chỗ sai. Rồi anh sửa nhanh. Thứ hai, nói gián tiếp giữ quan hệ tốt. Ở Việt Nam người ta thường không nói “không” vì không muốn làm người khác buồn. Thứ ba, ta nên nghĩ đến tình huống. Với người thân, tôi nói thẳng. Với khách lớn tuổi, tôi dùng lời mềm hơn. Nên câu trả lời của tôi là: nói điều mình muốn nói nhưng nói tử tế. Như vậy mọi người hiểu mình và vẫn thấy được tôn trọng."},{"a":"I’d like to talk about speaking directly versus speaking politely but indirectly at work. I think indirect and polite speech works better in Vietnam, for three reasons. First, relationships are valuable. If I criticize a worker in front of others, he may feel ashamed and stop trusting me. Second, polite words get cooperation. ‘Could we check this again?’ works better than ‘You are wrong.’ Third, indirect speech gives people time to save face and correct themselves. However, in an emergency or a safety issue, I must be direct. To sum up, indirect politeness is better for everyday work, and directness is for urgent cases. That’s why I believe managers need both skills.","v":"Tôi muốn nói về nói thẳng so với nói lịch sự gián tiếp ở nơi làm việc. Tôi nghĩ nói lịch sự gián tiếp hiệu quả hơn ở Việt Nam vì ba lý do. Thứ nhất, các mối quan hệ rất quý. Nếu tôi phê bình một công nhân trước mặt người khác, anh có thể xấu hổ và thôi tin tôi. Thứ hai, lời lịch sự dễ nhận được sự hợp tác. ‘Mình kiểm tra lại cái này nhé?’ hiệu quả hơn ‘Anh sai rồi.’ Thứ ba, nói gián tiếp cho người ta thời gian giữ thể diện và tự sửa. Tuy nhiên, trong tình huống khẩn cấp hay an toàn, tôi phải nói thẳng. Tóm lại, lịch sự gián tiếp tốt cho công việc thường ngày, còn nói thẳng cho việc khẩn. Vì vậy tôi tin quản lý cần cả hai kỹ năng."},{"a":"I’d like to talk about which is more effective at work: speaking directly or speaking politely and indirectly. In my view, direct communication is more effective, if it is respectful. The first reason is speed. Clear instructions prevent mistakes, especially when many people work together, for example when I explain a delivery schedule. The second reason is trust. When people know that I say exactly what I think, they do not need to guess. The third reason is fairness. Direct feedback helps workers improve quickly. However, I choose the time and place, and I focus on the problem, not the person. To sum up, direct but kind communication saves time and builds trust. That’s why I believe honesty is the best policy at work.","v":"Tôi muốn nói về việc nói thẳng hay nói lịch sự gián tiếp hiệu quả hơn ở nơi làm việc. Theo tôi, giao tiếp thẳng hiệu quả hơn, nếu tôn trọng. Lý do thứ nhất là tốc độ. Chỉ dẫn rõ ngăn sai sót, nhất là khi nhiều người làm chung, ví dụ khi tôi giải thích lịch giao hàng. Lý do thứ hai là tin cậy. Khi mọi người biết tôi nói đúng điều mình nghĩ, họ không phải đoán. Lý do thứ ba là công bằng. Phản hồi thẳng giúp công nhân tiến bộ nhanh. Tuy nhiên tôi chọn thời điểm và nơi chốn, và tập trung vào vấn đề, không vào con người. Tóm lại, giao tiếp thẳng mà tử tế tiết kiệm thời gian và xây dựng niềm tin. Vì vậy tôi tin trung thực là chính sách tốt nhất ở công việc."},{"a":"I’d like to talk about speaking directly and speaking politely but indirectly, and which works better at work. I think it depends on three factors. The first is the person. A new employee may feel afraid of direct criticism, while an experienced one may prefer it. The second is the topic. For money or contracts, I am direct, because misunderstanding is expensive. For personal feedback, I am gentler. The third is the culture of the company. In a small family business like mine, people are close, so soft words are normal. To sum up, the best style changes with the person, the topic and the culture. That’s why I believe flexibility is the most effective skill.","v":"Tôi muốn nói về nói thẳng và nói lịch sự gián tiếp, cách nào hiệu quả hơn ở nơi làm việc. Tôi nghĩ còn tùy ba yếu tố. Yếu tố thứ nhất là con người. Nhân viên mới có thể sợ bị phê bình thẳng, còn người có kinh nghiệm có thể thích vậy. Yếu tố thứ hai là chủ đề. Với tiền hay hợp đồng, tôi nói thẳng vì hiểu nhầm tốn kém. Với phản hồi cá nhân, tôi nhẹ nhàng hơn. Yếu tố thứ ba là văn hóa công ty. Trong doanh nghiệp gia đình nhỏ như tôi, mọi người thân nhau nên lời nhẹ nhàng là bình thường. Tóm lại, phong cách tốt nhất thay đổi theo người, chủ đề và văn hóa. Vì vậy tôi tin sự linh hoạt là kỹ năng hiệu quả nhất."},{"a":"I’d like to talk about speaking directly versus indirectly at work. In my experience, the best method is ‘direct about the problem, polite about the person’. First, say what the facts are, for example, ‘This order is two days late.’ Second, show respect, by saying, ‘I know you are busy, and I need your help.’ Third, suggest a solution together. This approach avoids the harm of harsh words and the confusion of vague words. Compared with the extremes, the middle way is easier to accept. To sum up, clear facts with kind words work best. That’s why I believe good communication is both clear and caring.","v":"Tôi muốn nói về nói thẳng và nói gián tiếp ở nơi làm việc. Theo kinh nghiệm của tôi, cách tốt nhất là ‘thẳng về vấn đề, lịch sự với con người’. Thứ nhất, nói sự thật, ví dụ ‘Đơn này trễ hai ngày.’ Thứ hai, thể hiện sự tôn trọng, bằng cách nói ‘Tôi biết anh bận, tôi cần anh giúp.’ Thứ ba, cùng đề xuất giải pháp. Cách này tránh tác hại của lời gay gắt và sự mơ hồ của lời nói vòng. So với hai thái cực, con đường giữa dễ chấp nhận hơn. Tóm lại, sự thật rõ ràng cùng lời nói tử tế hiệu quả nhất. Vì vậy tôi tin giao tiếp tốt vừa rõ ràng vừa quan tâm."}],"q":"Speaking directly and speaking politely but indirectly: which is more effective at work?","vi":"Nói thẳng và nói lịch sự nhưng gián tiếp: cách nào hiệu quả hơn trong công việc?"},{"type":"Cách làm (how to)","out":"Mở: có 3 cách. 1) Thói quen nhỏ: tắt đèn, rút phích. 2) Thiết bị tiết kiệm điện, tận dụng ánh sáng, gió. 3) Theo dõi hóa đơn, cả nhà cùng làm. Kết.","words":"energy-saving, appliance, standby, bill, natural light, habit, quality of life","vers":[{"a":"I want to talk about how a family can use less energy and still live well. I have three ideas. First, make small habits. Turn off lights and fans when you leave a room. Unplug things you do not use. In my family, the last person who leaves the room turns off the light. Second, use better equipment. LED lights and an inverter air conditioner use less electricity. Open the windows in the evening, too. Third, check the electricity bill every month. If it goes up, we find the reason. When the whole family sees the numbers, everyone helps. So saving energy is not difficult. It just needs smart habits.","v":"Tôi muốn nói về cách một gia đình dùng ít năng lượng hơn mà vẫn sống tốt. Tôi có ba ý. Thứ nhất, tạo thói quen nhỏ. Tắt đèn và quạt khi rời phòng. Rút phích thứ không dùng. Trong nhà tôi, người ra khỏi phòng cuối cùng tắt đèn. Thứ hai, dùng thiết bị tốt hơn. Đèn LED và máy lạnh inverter dùng ít điện hơn. Buổi tối cũng mở cửa sổ. Thứ ba, xem hóa đơn điện mỗi tháng. Nếu tăng, ta tìm lý do. Khi cả nhà thấy con số, mọi người cùng giúp. Nên tiết kiệm năng lượng không khó. Chỉ cần thói quen thông minh."},{"a":"I’d like to talk about how households can cut energy use without a lower quality of life. In my view, there are three ways. First, use natural conditions. Open windows in the evening, and use curtains in the afternoon to keep the house cool, so the air conditioner works less. Second, choose the right time for big appliances. For example, run the washing machine with a full load, and avoid using several heavy machines together. Third, maintain equipment. Clean the air conditioner filter every month and check the refrigerator door, because dirty or damaged equipment wastes electricity. To sum up, smart use, smart timing and regular care save energy and keep comfort. That’s why I believe saving energy is a skill, not a sacrifice.","v":"Tôi muốn nói về cách các hộ gia đình giảm dùng năng lượng mà không giảm chất lượng sống. Theo tôi có ba cách. Thứ nhất, tận dụng điều kiện tự nhiên. Mở cửa buổi tối và dùng rèm buổi chiều để nhà mát, nên máy lạnh làm việc ít hơn. Thứ hai, chọn đúng thời điểm cho thiết bị lớn. Ví dụ, giặt máy đầy tải và tránh dùng nhiều máy nặng cùng lúc. Thứ ba, bảo dưỡng thiết bị. Vệ sinh lưới lọc máy lạnh mỗi tháng và kiểm tra cửa tủ lạnh, vì thiết bị bẩn hoặc hỏng tốn điện. Tóm lại, dùng khéo, chọn giờ khéo và bảo dưỡng đều tiết kiệm năng lượng mà vẫn thoải mái. Vì vậy tôi tin tiết kiệm năng lượng là kỹ năng, không phải hy sinh."},{"a":"I’d like to talk about how a household can reduce energy consumption without lowering its quality of life. I think there are three key methods. The first is to upgrade slowly. When an old appliance breaks, replace it with an efficient model with a good energy label. The extra money returns through lower bills. The second is solar energy. A small rooftop system can provide hot water or part of the electricity, which is useful in a sunny country like Vietnam. The third is to involve children. If they learn to turn off lights and fans, the habit stays for life. To sum up, efficient equipment, solar power and family education reduce energy use. That’s why I believe a household can spend less and still live well.","v":"Tôi muốn nói về cách một hộ gia đình giảm tiêu thụ năng lượng mà không giảm chất lượng sống. Tôi nghĩ có ba phương pháp chính. Thứ nhất là nâng cấp dần. Khi thiết bị cũ hỏng, thay bằng loại tiết kiệm điện có nhãn năng lượng tốt. Số tiền thêm sẽ quay lại qua hóa đơn thấp hơn. Thứ hai là năng lượng mặt trời. Một hệ thống nhỏ trên mái có thể cung cấp nước nóng hay một phần điện, hữu ích ở nước nắng như Việt Nam. Thứ ba là cho trẻ tham gia. Nếu các em học cách tắt đèn, quạt, thói quen ở lại suốt đời. Tóm lại, thiết bị hiệu quả, điện mặt trời và giáo dục gia đình giảm dùng năng lượng. Vì vậy tôi tin một hộ gia đình có thể chi ít hơn mà vẫn sống tốt."},{"a":"I’d like to talk about reducing household energy use without lowering comfort. In my view, there are three important steps. The first is to measure. If you do not know where the electricity goes, you cannot save it. A cheap power meter can show which device uses the most. In my experience with warehouse electricity, a few old machines used more than half the power. The second step is to remove waste. Turn off equipment that is not in use, and use timers. The third step is to make the home efficient with good insulation, such as light-colored roofs. To sum up, measuring, removing waste and improving the home reduce the bill. That’s why I believe numbers are the best tool for saving energy.","v":"Tôi muốn nói về giảm dùng điện trong gia đình mà không giảm sự thoải mái. Theo tôi có ba bước quan trọng. Bước thứ nhất là đo lường. Nếu không biết điện đi đâu, bạn không tiết kiệm được. Một công tơ rẻ có thể cho thấy thiết bị nào dùng nhiều nhất. Theo kinh nghiệm của tôi với điện kho, vài chiếc máy cũ dùng hơn một nửa lượng điện. Bước thứ hai là loại bỏ lãng phí. Tắt thiết bị không dùng và dùng hẹn giờ. Bước thứ ba là làm ngôi nhà hiệu quả với cách nhiệt tốt, như mái màu sáng. Tóm lại, đo lường, loại bỏ lãng phí và cải thiện ngôi nhà giảm hóa đơn. Vì vậy tôi tin con số là công cụ tốt nhất để tiết kiệm năng lượng."},{"a":"I’d like to talk about how households can use less energy and still enjoy life. I believe there are three key ideas. The first is to share. Families can cook together, watch TV in one room and use one fan for several people instead of many devices. That also brings the family closer. The second is to cook smartly. Using a lid, a pressure cooker or a rice cooker saves gas and electricity, and the food is just as tasty. The third is to choose clothing and daily habits that suit the weather, such as wearing light clothes at home so you do not need to lower the air conditioner so much. To sum up, sharing, smart cooking and simple habits save energy without hurting comfort. That’s why I believe a happy home can also be a low-energy home.","v":"Tôi muốn nói về cách các hộ gia đình dùng ít năng lượng hơn mà vẫn tận hưởng cuộc sống. Tôi tin có ba ý chính. Ý thứ nhất là chia sẻ. Gia đình có thể nấu chung, xem TV một phòng và dùng một quạt cho nhiều người thay vì nhiều thiết bị. Điều đó cũng gắn kết gia đình. Ý thứ hai là nấu ăn khéo. Dùng nắp, nồi áp suất hay nồi cơm điện tiết kiệm gas và điện, món ăn vẫn ngon. Ý thứ ba là chọn quần áo và thói quen phù hợp thời tiết, như mặc đồ mỏng ở nhà để không cần hạ máy lạnh quá thấp. Tóm lại, chia sẻ, nấu ăn khéo và thói quen đơn giản tiết kiệm năng lượng mà không hại sự thoải mái. Vì vậy tôi tin một ngôi nhà hạnh phúc cũng có thể là ngôi nhà ít tốn năng lượng."}],"q":"How households can reduce their energy consumption without lowering their quality of life.","vi":"Các hộ gia đình có thể giảm mức tiêu thụ năng lượng mà không giảm chất lượng sống bằng cách nào."},{"type":"Tại sao (why)","out":"Mở: có 3 lý do. 1) Nhu cầu của người mua quyết định giá và đơn hàng. 2) Chuỗi cung ứng nối hai nước. 3) Lựa chọn có trách nhiệm tạo áp lực lên tiêu chuẩn. Ví dụ cà phê. Kết.","words":"consumer demand, supply chain, farmer, income, price, standard, global market","vers":[{"a":"I want to talk about why shoppers in one country can change the lives of farmers in another country. I have three reasons. First, demand. When people in a rich country buy more coffee or rice, farmers in other countries sell more and earn more. If people stop buying, the farmers lose money. Second, price. Many people look for the cheapest product, so the farmers get a very low price. Third, rules. Some customers ask for fair or clean products. Then companies must change, and farmers can have a better life. So even a small choice in a shop can help someone far away. I think we should buy with care.","v":"Tôi muốn nói về việc vì sao người mua ở một nước có thể đổi cuộc sống nông dân ở nước khác. Tôi có ba lý do. Thứ nhất, nhu cầu. Khi người ở nước giàu mua nhiều cà phê hay gạo hơn, nông dân ở nước khác bán nhiều và kiếm nhiều hơn. Nếu người ta ngừng mua, nông dân mất tiền. Thứ hai, giá. Nhiều người tìm sản phẩm rẻ nhất nên nông dân nhận giá rất thấp. Thứ ba, quy định. Một số khách đòi sản phẩm công bằng hay sạch. Khi đó công ty phải đổi và nông dân có thể sống tốt hơn. Nên ngay cả một lựa chọn nhỏ ở cửa hàng cũng có thể giúp người ở xa. Tôi nghĩ ta nên mua hàng cẩn thận."},{"a":"I’d like to talk about why consumers’ choices in one country can affect farmers in another. In my view, there are three main reasons. The first is trends. When a country starts to love a product, like avocado or dragon fruit, farmers abroad plant more of it. If the trend ends, they may be left with a big harvest and no buyers. The second is standards. If a market asks for a certificate, small farmers must pay to meet it, which can be a burden. The third is prices. Cheap products from large companies may push small farmers’ income down. To sum up, trends, standards and prices connect us to farmers. That’s why I believe consumers should think about the long-term effect of what they buy.","v":"Tôi muốn nói về việc vì sao lựa chọn của người tiêu dùng ở một nước có thể ảnh hưởng đến nông dân ở nước khác. Theo tôi có ba lý do chính. Thứ nhất là xu hướng. Khi một nước yêu thích một sản phẩm như bơ hay thanh long, nông dân nước ngoài trồng nhiều hơn. Nếu xu hướng hết, họ có thể còn mùa màng lớn mà không có người mua. Thứ hai là tiêu chuẩn. Nếu thị trường đòi chứng nhận, nông dân nhỏ phải trả tiền để đạt, có thể là gánh nặng. Thứ ba là giá. Sản phẩm rẻ của công ty lớn có thể đẩy thu nhập của nông dân nhỏ xuống. Tóm lại, xu hướng, tiêu chuẩn và giá nối chúng ta với nông dân. Vì vậy tôi tin người tiêu dùng nên nghĩ đến tác động lâu dài của điều mình mua."},{"a":"I’d like to talk about why the choices of consumers in one country can change the lives of farmers in another country. I think there are three reasons. First, jobs. If a country buys a lot of cotton or coffee, farms can hire more workers, and whole villages can improve their lives. Second, farming methods. When consumers demand organic or sustainable products, farmers learn new methods and protect their land. Third, risk. If consumers suddenly boycott a product because of a scandal, innocent farmers can lose their income at once. For example, a food safety scare in one country can stop the imports from small farms. To sum up, consumer choices create jobs, change methods and bring risks. That’s why I believe shoppers have more power than they think.","v":"Tôi muốn nói về việc vì sao lựa chọn của người tiêu dùng ở một nước có thể thay đổi cuộc sống nông dân ở nước khác. Tôi nghĩ có ba lý do. Thứ nhất, việc làm. Nếu một nước mua nhiều bông hay cà phê, nông trại thuê thêm công nhân và cả làng cải thiện cuộc sống. Thứ hai, phương pháp canh tác. Khi người tiêu dùng đòi sản phẩm hữu cơ hay bền vững, nông dân học phương pháp mới và bảo vệ đất. Thứ ba, rủi ro. Nếu người tiêu dùng đột ngột tẩy chay một sản phẩm vì bê bối, nông dân vô tội có thể mất thu nhập ngay. Ví dụ, một nỗi lo an toàn thực phẩm ở một nước có thể dừng nhập khẩu từ các trang trại nhỏ. Tóm lại, lựa chọn của người tiêu dùng tạo việc làm, đổi phương pháp và mang rủi ro. Vì vậy tôi tin người mua có nhiều quyền lực hơn họ nghĩ."},{"a":"I’d like to talk about why shoppers in one country can affect farmers in another. In my opinion, there are three key reasons. The first is that global trade links markets. Vietnamese coffee, rice and seafood go to many countries, so changes in foreign demand directly change local income. The second is currency and price. If people in a rich country buy less, prices fall worldwide, and farmers earn le
