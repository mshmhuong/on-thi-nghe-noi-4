việc, tôi muốn xong nhanh. Nên áp lực đổi cảm giác của ta."},{"a":"I want to talk about why we put more energy into hobbies. In my opinion, there are three reasons. First, hobbies are about our dreams. Second, we learn new things and become better. Third, we meet friends who like the same thing. For example, my friend joined a photography club, and she goes out every Sunday. She says she feels happy. If a job gives us dreams, friends and learning, we will also work hard.","v":"Tôi muốn nói về việc vì sao ta dồn nhiều năng lượng cho sở thích. Theo tôi có ba lý do. Thứ nhất, sở thích gắn với ước mơ của ta. Thứ hai, ta học điều mới và giỏi hơn. Thứ ba, ta gặp bạn cùng sở thích. Ví dụ, bạn tôi tham gia câu lạc bộ chụp ảnh và đi mỗi Chủ nhật. Cô nói cô thấy vui. Nếu công việc cho ta ước mơ, bạn bè và học hỏi, ta cũng sẽ làm chăm."},{"a":"I want to talk about hobbies and jobs. I think a job is often for money, but a hobby is for the heart. First, with a job, we think about salary. Second, with a hobby, we think about happiness. Third, we do not compare ourselves with others in a hobby. For example, I write short stories for fun and I never worry about the result. This makes me creative. So I believe a job can be more fun if we find a meaning in it.","v":"Tôi muốn nói về sở thích và công việc. Tôi nghĩ công việc thường vì tiền còn sở thích vì trái tim. Thứ nhất, với công việc, ta nghĩ đến lương. Thứ hai, với sở thích, ta nghĩ đến hạnh phúc. Thứ ba, trong sở thích ta không so sánh với người khác. Ví dụ, tôi viết truyện ngắn cho vui và không bao giờ lo kết quả. Điều này làm tôi sáng tạo. Nên tôi tin công việc có thể vui hơn nếu ta tìm thấy ý nghĩa."}],"q":"Why people often work harder on their hobbies than on their jobs.","vi":"Vì sao người ta thường làm việc cho sở thích chăm chỉ hơn cho công việc."}]}];

const PVI={"A1-1":["Tôi muốn tạo ấn tượng tốt và cũng thể hiện sự tôn trọng với ông ấy.","Tôi chào ông ấy bằng cái bắt tay và gọi ông ấy bằng họ.","Khi tôi đưa tay ra, tôi nhận ra ông ấy định tiến tới ôm tôi, nên cả hai làm một động tác lúng túng nửa bắt tay nửa ôm.","Ngoài ra, khi tôi chào bằng họ của ông, ông đáp lại lịch sự nhưng lại gọi tôi bằng tên riêng.","Tất cả hơi khó xử một chút.","Trước đây tôi chưa bao giờ làm việc với một nhóm làm từ xa trong một dự án quốc tế.","Làm việc với những người đến từ các nước khác nhau khá thú vị, nhưng cũng nhiều thử thách.","Ví dụ, có múi giờ khác nhau, hệ thống công nghệ thông tin khác nhau, và thậm chí quy định địa phương cũng khác nhau.","Để mọi người cùng hiểu một cách, chúng tôi đặt ra quy tắc giao tiếp và những quy định cả nhóm phải theo, cùng với ngày họp và hạn chót.","Chúng tôi ghi tất cả vào một văn bản gọi là điều lệ nhóm (team charter).","Năm ngoái tôi đã trải qua một giai đoạn khá khó khăn ở chỗ làm.","Tôi vốn đã nhận quá nhiều việc, rồi chúng tôi mất một thành viên do tái cơ cấu, và tôi nhanh chóng bị quá tải.","Sếp giới thiệu cho tôi phương pháp SMART để đặt mục tiêu.","Nó giúp tôi ưu tiên một số việc, để một số việc làm sau, và bỏ hẳn một số việc.","Bây giờ tôi thấy kiểm soát được thời gian và khối lượng công việc tốt hơn nhiều.","Ngay khi họ thông báo chuyến bay bị hủy, tôi biết mình phải nghĩ nhanh.","Tôi vội chạy ngược qua sân bay và là một trong những người đầu tiên tới được quầy.","Hóa ra đó là ý hay, vì chỉ còn chín ghế trên chuyến bay sáng hôm sau."],"A1-3":["Tôi sống nhờ vào thiên nhiên trong một túp lều tồi tàn suốt một năm rưỡi, và tin tôi đi, có vô số lần lẽ ra tôi đã bỏ về nhà.","Nhưng tôi muốn ở lại, và điều đó buộc đầu óc tôi tìm ra niềm vui trong những điều rất nhỏ, như một tảng đá êm để tựa lưng, hay một chỗ khô dưới gốc cây giữa trận mưa giông.","Bây giờ tôi sống ở cộng đồng ven biển Echo Bay.","Dân số tám người, và đang giảm.","Tôi thật may mắn được sống trong một căn nhà gỗ đẹp trên một hòn đảo giữa vùng hoang dã.","Một dãy tấm pin mặt trời xếp dọc hiên trước.","Một ống nước màu đen dẫn nước từ con suối xa.","Tôi lớn lên là một cô gái thành phố sành điệu, được nuông chiều, sống cuộc sống giấc mơ Mỹ.","Mười hai năm trước, tôi dấn thân vào vùng hoang dã để sống nhờ thiên nhiên với dụng cụ và công nghệ thô sơ.","Tôi đã sống sót và phát triển tốt suốt mười tám tháng.","Toàn bộ con người tôi đã thay đổi nhờ trải nghiệm đó.","Tôi quay lại thành phố một thời gian, nhưng rồi tôi theo một giấc mơ mới là dựng một căn nhà gỗ.","Kế hoạch dự kiến sáu tháng của tôi đã mất ba năm rưỡi."],"A2-1":["Mặt kinh doanh của nhà hát, thứ phải tạo ra một sản phẩm mà người ta muốn và sẵn sàng trả tiền, hoàn toàn giống bất kỳ ngành kinh doanh nào khác.","Nó phải được lên kế hoạch, phải có ngân sách, phải được tiếp thị, và phải thành công thì mới tồn tại được.","Tuy nhiên, nhà hát cũng là một loại hình nghệ thuật, và bạn không thể áp dụng thẳng tiêu chuẩn kinh doanh cho nghệ thuật.","Nhà hát phải có quyền thất bại và quyền không được yêu thích.","Phần lớn quản lý nhà hát dành phần lớn thời gian để cố đoán trước khán giả sẽ thích gì.","Và thường thì những vở thành công vang dội, cả về nghệ thuật lẫn thương mại, là điều bạn không thể đoán trước dù có cả triệu năm.","Nếu bạn dàn dựng một vở mới hoàn toàn với dàn diễn viên tốt nhưng chưa chắc đảm bảo doanh thu, bạn sẽ hạn chế số buổi diễn.","Có vẻ khôn ngoan khi chỉ diễn khoảng hai mươi hoặc hai mươi bốn buổi cho một vở mới thay vì cố diễn mãi, và phải rất cẩn thận về quy mô dàn diễn viên, vì một phần rất lớn ngân sách đổ vào tiền lương diễn viên."],"A2-2":["Sản phẩm dùng các hạt bạc rất nhỏ, có tính kháng khuẩn khi được ion hóa, và về cơ bản chúng tiêu diệt vi khuẩn gây mùi.","Giá thành mỗi đơn vị từ ba mươi lăm đến bốn mươi lăm euro, và chúng tôi muốn các bạn bán lẻ ở mức từ một trăm đến một trăm hai mươi euro.","Chúng tôi đang xem xét một thỏa thuận thuê ngoài sản xuất, có thể giúp tiết kiệm đáng kể.","Chúng tôi ước tính khoảng mười nghìn sản phẩm trong năm đầu, tiếp theo là ba mươi nghìn trong năm thứ hai.","Hiện đã có một loạt sản phẩm có thể giải quyết vấn đề này.","Sản phẩm này hiệu quả hơn nhiều so với các loại xịt đang có trên thị trường.","Thị trường đầu tiên của chúng tôi thật ra không phải hộ gia đình, mà là câu lạc bộ sức khỏe và phòng tập.","Chúng tôi đã đăng ký bằng sáng chế một vài quy trình sản xuất mà chúng tôi nghĩ sẽ giúp có lợi thế hơn mọi đối thủ."]};

const PASSAGES=[
 {id:"A1-1",title:"Đánh giá 1, phần 1: bốn người nói về thử thách trong công việc (câu 1 đến 5)",
  text:"I wanted to make a good impression and also show him respect. I greeted him with a handshake and addressed him by his surname. When I put my hand out, I realized he had been moving in to give me a hug, so we did an awkward mixture of the two. Also, when I greeted him by his surname, he responded politely, though he used my first name. It was all a little uncomfortable. I had never worked with a virtual team on an international project before. It was quite exciting, though also challenging, to work with people from different countries. For example, there were different time zones, different IT systems, and even different local regulations. To help us all get on the same page, we defined the communication norms and the rules the team would follow, as well as the meeting dates and deadlines. We laid this all out in a document called a team charter. I went through a bit of a rough patch last year at work. I was already committed to too much, and then we lost a team member through restructuring, and I quickly became overloaded. My boss introduced me to the SMART approach to goal setting. It helped me to prioritize some tasks, do some later, and drop some completely. I now feel much more in control of my time and workload. As soon as they made the announcement about the cancellation, I knew I had to think quickly. I hurried back through the airport and was one of the first to make it to the desk. That turned out to be a good idea, as there were only nine seats available on the flight the next morning."},
 {id:"A1-3",title:"Đánh giá 1, phần 3: Nikki van Schyndel, Becoming Wild (câu 6 đến 15)",
  text:"I lived off the land in a rundown shack for a year and a half, and believe me, there were countless times I should have run myself home. But I wanted to stay, and it forced my mind to look and find joy in such little things, like a comfy rock to lean against, or a dry spot under a tree in the middle of a rainstorm. Now I live in the coastal community of Echo Bay. Population eight, and falling. I am blessed to live in a beautiful log cabin on an island in the wilderness. A row of solar panels lines the front porch. A black hose carries water from a distant creek. I grew up as a fashionable, privileged city girl, living the American dream life. I ventured out into the wilderness twelve years ago to survive off the land with primitive tools and technology. I survived and thrived for eighteen months. My whole being was transformed by the experience. I returned to the city for a while, but then I followed a new dream to build a log cabin. My estimated six-month plan took three and a half years."},
 {id:"A2-1",title:"Đánh giá 2: phỏng vấn về kinh doanh sân khấu (theatre business)",
  text:"The business side of the theatre, something which has to produce a product that people want and which people are prepared to pay for, is exactly the same as any other business. It must be planned, it must be budgeted, it must be marketed, and it must be successful in order to survive. However, the theatre is also an art form, and you cannot apply straight business standards to art. The theatre has to have the right to fail and the right to be unpopular. Most theatre managers spend most of their time trying to second guess what an audience will like. And more often than not, the things that are huge runaway successes, both artistically and commercially, you couldn’t have predicted in a million years. If you were performing a brand new play with a good but not necessarily bankable cast, you would limit the number of performances. It would seem wise to do maybe twenty or twenty-four performances of a new play and not try to run it forever, and be very careful about the size of the cast, because an awful lot of the budget goes on actors’ wages."},
 {id:"A2-2",title:"Đánh giá 2: buổi giới thiệu sản phẩm khử mùi giày (họp kinh doanh)",
  text:"It uses tiny particles of silver, which have antibacterial properties once ionized, and they essentially kill the microbes that cause the odors. Unit costs are between thirty-five and forty-five euros, and we would be looking for you to retail at between one hundred and one hundred and twenty euros. We are looking at a deal to outsource production, which could bring significant savings. We have estimated something in the region of ten thousand units in the first year, followed by thirty thousand in year two. There is already a range of products that can solve this problem. This is far more effective than the sprays currently on the market. Our initial market is not actually homes, but health clubs and gyms. We have patented a couple of the manufacturing processes that we think will give us an edge over any competitors."}

  fetch('https://api.dictionaryapi.dev/v2/entries/en/'+encodeURIComponent(k)).then(r=>r.ok?r.json():null).then(j=>{if(j&&j[0]){const m=j[0].meanings&&j[0].meanings[0],d=m&&m.definitions&&m.definitions[0];out.pos=m&&m.partOfSpeech;out.en=d&&d.definition;out.ex=d&&d.example;out.ph=j[0].phonetic}}).catch(()=>{}).then(fin)};
const wordForms=k=>[...new Set([k,k.replace(/'s$/,''),k.replace(/ies$/,'y'),k.replace(/es$/,''),k.replace(/s$/,''),k.replace(/ed$/,''),k.replace(/ed$/,'e'),k.replace(/ing$/,''),k.replace(/ing$/,'e'),k.replace(/ly$/,'')])].filter(x=>/^[a-z][a-z'-]*$/.test(x)&&(x.length>1||x==='a'||x==='i'));

function toks(s){s=String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/%/g,' percent ').replace(/(\d),(\d)/g,'$1$2').replace(/-/g,' ');
  const out=[];for(let w of (s.match(/[a-z0-9']+/g)||[])){w=w.replace(/^'+|'+$/g,'');if(!w)continue;if(CONTR[w]){out.push(...CONTR[w].split(' '));continue}w=w.replace(/'s$/,'');
    if(/^\d+$/.test(w)){out.push(...numWords(+w).split(' '));continue}out.push(w)}return out}

/* Chấm khi nói tự do: ước lượng 4 tiêu chí của cô, mỗi tiêu chí 25% */

  pauses.slice(0,5).forEach(p=>out.fix.push({t:`Ngập ngừng ${p.len.toFixed(1)} giây ở giây thứ ${Math.round(p.at)}`,seek:p.at,tip:'Nghe lại đoạn này. Khi bí ý, dùng câu đệm: Well, let me think… / What I mean is… / Let’s say…'}));
  if(!n)return out.empty=true,out;

  let cw=0,cs=0;const unsure=[];(o.segs||[]).forEach(sg=>{const w=sg.text.trim().split(/\s+/).filter(Boolean).length;if(sg.conf>0){cw+=w;cs+=w*sg.conf}(sg.unsure||[]).forEach(u=>unsure.push(u))});

  let pr=null,pn='';if(conf!=null){pr=1+9*clamp((conf-.5)/.42,0,1);pr-=Math.min(2,uset.length/n*8);pn=`máy hiểu đúng khoảng ${Math.round(conf*100)}% lời chị nói`+(uset.length?`; ${uset.length} từ máy nghe chưa chắc`:'')}else pn='máy không cho điểm tin cậy';

  const hit=kws.filter(k=>k.split(/[\s-]+/).every(p=>tset.includes(stemOf(p)))),miss=kws.filter(k=>!hit.includes(k));
  const low=' '+heard.toLowerCase().replace(/[’‘]/g,"'")+' ';const used=Object.keys(LINK).filter(k=>LINK[k].test(low)),lack=Object.keys(LINK).filter(k=>!used.includes(k));

  if(miss.length)out.fix.push({t:`Chưa dùng từ khóa gợi ý: ${miss.join(', ')}`,tip:'Thêm 1 đến 2 từ này vào ý chính hoặc ví dụ để nội dung chắc hơn.'});
  const nm={opinion:'nêu ý kiến (I think…)',reason:'nêu lý do (One reason is…)',example:'cho ví dụ (For example…)',contrast:'nói hai mặt (On the other hand…)',conclusion:'kết luận (Overall…)'};
  if(!used.includes('reason')||!used.includes('example'))out.fix.push({t:`Thiếu: ${lack.filter(k=>k==='reason'||k==='example').map(k=>nm[k]).join(', ')}`,tip:'Cô yêu cầu mỗi ý có lý do và ví dụ.'});

  if(advR<.12)out.fix.push({t:`Từ vựng còn đơn giản (${Math.round(advR*100)}% từ khá khó)`,tip:'Thêm từ nâng cao trong ô Từ vựng gợi ý của câu này.'});
  return out}

/* Chấm khi đọc theo bài mẫu: so từng từ máy nghe được với bài mẫu */
function scoreRead(o){const ref=o.ref,refDisp=ref.split(/\s+/).filter(Boolean),U=[];refDisp.forEach((d,di)=>toks(d).forEach(w=>U.push({w,d:di})));
  const H=toks(o.heard),ops=align(U.map(u=>u.w),H),st=U.map(()=>({k:'d'}));let ok=0,cl=0,bad=0,miss=0,extra=0;
  ops.forEach(p=>{if(p.k==='i'){extra++;return}if(p.k==='d'){miss++;st[p.r]={k:'d'};return}if(p.k===0){ok++;st[p.r]={k:'m'}}else if(p.k===1){cl++;st[p.r]={k:'c',h:H[p.h]}}else{bad++;st[p.r]={k:'s',h:H[p.h]}}});
  let tail=0;for(let i=U.length-1;i>=0&&st[i].k==='d';i--)tail++;
  const N=U.length,acc=N?(ok+.5*cl)/N:0,seen=N-tail,accSeen=seen?(ok+.5*cl)/seen:0;

/* ---------- Câu hỏi ôn ---------- */
const opt4=(ans,pool)=>{const o=shuffle([ans,...pick([...new Set(pool.filter(p=>p!==ans))],3)]);return{o,a:o.indexOf(ans)}};
const onQs=n=>ON.filter(g=>!n||g.unit===n).flatMap(g=>g.q.filter(q=>q.a!=null).map(q=>({t:'mc',q:`Unit ${g.unit}: ${q.q}`,o:q.o,a:q.a,why:q.confirm?('Lưu ý: '+q.confirm):'Đáp án lấy từ bài ôn trên trang trường.'})));
const qVocab=(x,pool)=>{const{o,a}=opt4(x.vi,pool.map(p=>p.vi));return{t:'mc',q:`Nghĩa của "${x.w}" ${x.ipa} là gì?`,o,a,why:`${x.w} = ${x.vi}`}};
const qWord=(x,pool)=>{const{o,a}=opt4(x.w,pool.map(p=>p.w));return{t:'mc',q:`Từ nào có nghĩa: "${x.vi}"?`,o,a,why:`${x.vi} = ${x.w}`}};
const qCloze=(x,pool)=>{if(x.w.includes(' '))return null;const re=new RegExp('\\b'+x.w.slice(0,Math.max(3,x.w.length-3)).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\w*','i');if(!re.test(x.ex))return null;const{o,a}=opt4(x.w,pool.map(p=>p.w));return{t:'mc',q:'Điền từ: '+x.ex.replace(re,'_____'),o,a,why:`Đáp án: ${x.w}. ${x.ex}`}};
const KINDS=[['on','Câu hỏi ôn của trường','toàn bộ câu đã có đáp án'],['vocab','Từ vựng (nghĩa)','20 câu'],['cloze','Điền từ vào câu','12 câu'],['listen','Hiểu bài nghe (đánh giá 1)','7 câu'],['mix','Thi thử tổng hợp','30 câu, 20 phút']];
function build(kind,n){const W=ALLW.filter(x=>!n||x.u===n),nz=a=>a.filter(Boolean);
  if(kind==='on')return shuffle(onQs(n));
  if(kind==='vocab')return pick(W,Math.min(20,W.length)).map((x,i)=>i%2?qWord(x,ALLW):qVocab(x,ALLW));
  if(kind==='cloze')return pick(nz(W.map(x=>qCloze(x,ALLW))),12);
  if(kind==='listen')return LQ.map(x=>({t:'mc',q:x.q,o:x.o,a:x.a,why:'Đối chiếu với lời bài nghe ở mục Luyện nghe.'}));
  return shuffle([...pick(onQs(n),Math.min(12,onQs(n).length)),...pick(W,8).map((x,i)=>i%2?qWord(x,ALLW):qVocab(x,ALLW)),...pick(nz(W.map(x=>qCloze(x,ALLW))),6),...(n?[]:LQ.slice(0,4).map(x=>({t:'mc',q:x.q,o:x.o,a:x.a,why:'Đối chiếu lời bài nghe.'})))]).slice(0,30)}
views.quiz=arg=>{const n=arg==null?store.get('eu',0):+arg;store.set('eu',n);const sc=store.get('scores',{});
  $('#main').innerHTML=`${unitBar(n,'quiz',true)}<h1>Câu hỏi ôn ${n?VX_LABEL[n]:'tất cả Unit'}</h1><p class="sub">Câu hỏi ôn lấy từ bài ôn trên trang trường (chị đã làm), có đáp án. Câu chị làm sai mà chưa rõ đáp án thì em chưa đưa vào. Các dạng còn lại em tự tạo từ bài học.</p>
  <div class="mocks">${KINDS.map(([k,t,d])=>{const b=sc[k+n];return `<button class="mockb" type="button" data-kind="${k}"><b>${t}</b><small>${d}${b!=null?` · tốt nhất ${b}%`:''}</small></button>`}).join('')}</div>`;

function runTest(kind,n){const qs=build(kind,n),m=$('#main'),timed=kind==='mix';let left=20*60;
  if(!qs.length){m.innerHTML='<p class="note">Chưa đủ dữ liệu để tạo đề này.</p><button class="btn" data-go="quiz">Quay lại</button>';return}

  m.innerHTML=`<button class="link" type="button" data-go="quiz" data-arg="${n}">← Các đề</button>${timed?'<div class="timer" id="tm"><span>Còn</span><b>20:00</b></div>':''}<h1>${title} ${n?'('+VX_LABEL[n]+')':''}</h1>

  <p class="row"><button class="btn" id="sub" type="button">Nộp bài</button></p><div id="rs"></div>`;
  $('#qs').onclick=e=>{const o=e.target.closest('.opt');if(o&&!$('#rs').innerHTML)$$('.opt',o.parentNode).forEach(b=>b.setAttribute('aria-pressed',b===o))};
  const submit=()=>{clearInterval(window._timer);if($('#rs').innerHTML)return;let ok=0;
    qs.forEach((q,i)=>{const box=$(`[data-i="${i}"]`),sel=$('.opt[aria-pressed="true"]',box),good=!!sel&&+sel.dataset.j===q.a;$$('.opt',box).forEach((b,j)=>{if(j===q.a)b.classList.add('ok');else if(b===sel)b.classList.add('no')});$('.why',box).textContent=q.why;$('.why',box).classList.remove('hide');if(good)ok++;box.classList.add(good?'isok':'isno')});
    const pct=Math.round(100*ok/qs.length),sc=store.get('scores',{}),key=kind+n;if(sc[key]==null||pct>sc[key])sc[key]=pct;store.set('scores',sc);
    $('#rs').innerHTML=`<section class="tstat"><p class="score ${pct>=70?'good':'bad'}">Đúng ${ok}/${qs.length} (${pct}%)</p><p class="note">Câu sai đã đánh dấu đỏ kèm đáp án. Làm lại để ra bộ câu mới.</p><p class="row"><button class="btn" data-go="quiz" data-arg="${n}">Các đề khác</button><button class="btn ghost" id="again" type="button">Làm lại</button></p></section>`;
    $('#again').onclick=()=>runTest(kind,n);$('#rs').scrollIntoView({behavior:'smooth'})};
  $('#sub').onclick=submit;
  if(timed)window._timer=setInterval(()=>{left--;const t=$('#tm');if(t){t.querySelector('b').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');t.classList.toggle('low',left<=120)}if(left<=0)submit()},1000)}

const stem=w=>w.replace(/[^A-Za-z']/g,'');
function clozeTokens(en,max){const toks=en.split(/(\s+)/),idx=[];toks.forEach((t,j)=>{const w=stem(t);if(w.length>=7&&!idx.some(a=>stem(toks[a]).toLowerCase()===w.toLowerCase()))idx.push(j)});
  const nb=Math.min(max,idx.length),step=idx.length/nb;return{toks,chosen:new Set(Array.from({length:nb},(_,j)=>idx[Math.floor(j*step)]))}}
const lisCloze=text=>{const c=clozeTokens(text,10);
  return `<p class="note">Nghe lại và điền từ còn thiếu (không cần viết hoa):</p><p class="en">${c.toks.map((t,j)=>c.chosen.has(j)?`<input class="blank" data-a="${esc(stem(t))}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Từ cần điền">${esc(t.replace(stem(t),''))}`:esc(t)).join('')}</p><p class="row"><button class="btn" type="button" data-chk>Kiểm tra</button></p><p class="note res"></p>`};
const lisCheck=box=>{let ok=0;const bl=$$('.blank',box);const bad=[];$$('.lfix',box).forEach(e=>e.remove());
  bl.forEach(b=>{const v=b.value.trim(),g=v.toLowerCase()===b.dataset.a.toLowerCase();b.classList.remove('ok','no');b.classList.add(g?'ok':'no');if(g)ok++;
    else{bad.push([v,b.dataset.a]);b.insertAdjacentHTML('afterend',`<span class="lfix">✗ đúng là <b>${esc(b.dataset.a)}</b></span>`)}});
  $('.res',box).innerHTML=`<b>Đúng ${ok}/${bl.length}.</b> ${bad.length?`Chỗ sai đã ghi đáp án ngay cạnh ô (chữ đỏ). So với chữ chị nghe được:<br>${bad.map(([v,a])=>`• chị điền <b>${v?esc(v):'(để trống)'}</b>, đáp án là <b style="color:var(--green)">${esc(a)}</b>`).join('<br>')}<br>Nghe lại, sửa ô đỏ rồi bấm Kiểm tra lần nữa.`:'Chị nghe đúng hết. Tốt lắm!'}`};

/* ---------- Key Points ---------- */
views.key=arg=>{const n=+arg||store.get('ku',1);store.set('ku',n);const u=UNITS[n-1];
  $('#main').innerHTML=`${unitBar(n,'key')}<h1>Key Points Unit ${n}: ${esc(u.title)}</h1><p class="sub">${esc(u.vi)}. Bản rút gọn đọc trước giờ thi. <button class="link noprint" type="button" onclick="window.print()">In trang này</button></p>
  <div class="learn"><section class="card"><h3>Câu hỏi của Unit</h3><p class="en">${esc(u.q)}</p></section>
  <section class="card"><h3>Kỹ năng và ngữ pháp</h3><ul class="kp">${u.skills.map(r=>`<li><b>${esc(r[0])}</b></li>`).join('')}</ul></section>
  <section class="card"><h3>Từ vựng</h3><ul class="kp">${u.vocab.map(r=>`<li><span class="en">${esc(r[0])}</span> <span class="ipa">${esc(r[1])}</span> <span class="vi">${esc(r[3])}</span></li>`).join('')}</ul></section>
  <section class="card"><h3>Nội dung bài nghe</h3><ul class="kp">${u.key.map(r=>`<li><b>${esc(r[0])}</b><span class="vi">${esc(r[1])}</span></li>`).join('')}</ul></section></div>`};

document.addEventListener('click',e=>{const cc=e.target.closest('[data-code]');if(cc){store.set('code',+cc.dataset.code);window._mockStop&&window._mockStop();go(store.get('view','final'));return}const vt=e.target.closest('[data-ver]');if(vt){const d=vt.closest('details');$$('[data-ver]',d).forEach(b=>b.setAttribute('aria-pressed',b===vt));$$('[data-vb]',d).forEach(b=>b.classList.toggle('hide',b.dataset.vb!==vt.dataset.ver));return}
  const s=e.target.closest('[data-say]');if(s){speak(s.dataset.say);return}
  const g=e.target.closest('[data-go]');if(g&&g.tagName!=='NAV'){e.preventDefault();window._pendq=g.dataset.q!=null?+g.dataset.q:null;if(g.dataset.mver!=null)store.set('mver',+g.dataset.mver);go(g.dataset.go,g.dataset.arg===''?undefined:g.dataset.arg)}});
applyOpts();header();go((location.hash||'').slice(1)||store.get('view','home'));
</script>
